<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ritos processuais — o fluxo</title>
<style>
:root{
  --bg:#faf7f5;--surface:#ffffff;--surface2:#f5f0ec;--border:#e4dcd6;
  --ink:#1b1b1f;--text2:#4b4a52;--text3:#7d7a86;
  --accent:#b5174e;--accentD:#8e0f3c;--onAccent:#ffffff;
  --lei:#9a6b00;--juris:#b93a2b;--peca:#5b47b8;--desvio:#1f6f8b;--assunto:#1f5aa6;--ok:#12795a;
  --display:Georgia,serif;--body:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--mono:ui-monospace,Menlo,monospace;
  --sh:0 1px 2px rgba(20,15,10,.05),0 4px 14px rgba(20,15,10,.05);
  --shUp:0 2px 4px rgba(20,15,10,.06),0 10px 26px rgba(20,15,10,.09);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
::-webkit-scrollbar{width:10px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;border:2px solid var(--bg)}

/* ---------------- cabeçalho ---------------- */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border)}
.l1{display:flex;align-items:center;gap:14px;padding:12px 18px;max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.brand .ic{width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--onAccent);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.brand b{font:800 18px/1 var(--display);letter-spacing:-.02em;display:block}
.brand small{display:block;font-size:11.5px;color:var(--text3);margin-top:4px}
.vis{margin-left:auto;display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;flex:none}
.vis button{border:0;background:transparent;color:var(--text3);border-radius:8px;padding:8px 16px;
  font:700 12.5px inherit;cursor:pointer;display:flex;align-items:center;gap:7px}
.vis button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.vis button i{font-style:normal}
.l2{display:flex;align-items:center;gap:9px;padding:0 18px 11px;max-width:1320px;margin:0 auto}
#mats{display:flex;gap:6px;overflow-x:auto;flex:1;padding:2px 1px 4px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent)}
#mats::-webkit-scrollbar{display:none}
.pill{flex:none;white-space:nowrap;border:1px solid var(--border);background:var(--bg);color:var(--text2);
  border-radius:99px;padding:7px 14px;font:600 12.5px inherit;cursor:pointer;display:flex;align-items:center;gap:7px}
.pill i{font-style:normal;width:8px;height:8px;border-radius:99px;background:var(--rc,var(--border));flex:none}
.pill:hover{border-color:var(--text3);color:var(--ink)}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.pill.on i{background:#fff}
.ferr{flex:none;display:flex;gap:5px;align-items:center;border-left:1px solid var(--border);padding-left:9px}
.ferr button{width:32px;height:32px;border:1px solid var(--border);background:var(--bg);color:var(--text2);
  border-radius:9px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.ferr button:hover{border-color:var(--text3);color:var(--ink)}
.zoomlbl{font-family:var(--mono);font-size:11px;color:var(--text3);min-width:42px;text-align:center}

/* ---------------- linha do tempo ---------------- */
#linha{display:none;padding:20px 18px 70px;max-width:1120px;margin:0 auto}
#linha.on{display:block}
.cab{margin:2px 0 16px}
.cab h2{margin:0;font:800 28px/1.15 var(--display);letter-spacing:-.025em;display:flex;align-items:center;gap:12px}
.cab h2 i{font-style:normal;width:11px;height:27px;border-radius:4px;background:var(--rc);flex:none}
.cab small{display:block;color:var(--text3);font-size:12.5px;margin-top:7px;padding-left:23px}
/* atalhos: 12 atos numa faixa clicável — dá para saltar sem rolar a página inteira */
.atalhos{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 20px;padding-left:23px}
.atalhos button{border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:8px;
  padding:5px 10px;font:600 11.5px inherit;cursor:pointer;display:flex;align-items:center;gap:6px}
.atalhos button:hover{border-color:var(--rc);color:var(--rc)}
.atalhos button em{font-style:normal;font:700 10px var(--mono);color:var(--text3)}

.lt{position:relative;padding-left:52px}
.lt::before{content:"";position:absolute;left:19px;top:14px;bottom:14px;width:2px;background:var(--border)}
.ato{position:relative;margin-bottom:14px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:15px 18px 14px;box-shadow:var(--sh);scroll-margin-top:120px}
.ato:target,.ato.pisca{border-color:var(--rc);box-shadow:0 0 0 3px color-mix(in srgb,var(--rc) 15%,transparent)}
.ato .num{position:absolute;left:-52px;top:14px;width:38px;height:38px;border-radius:12px;
  background:var(--surface);border:2px solid var(--rc);color:var(--rc);
  display:flex;align-items:center;justify-content:center;font:800 13px var(--mono)}
.ato h3{margin:0;font:800 17px/1.25 var(--display)}
.ato .quando{margin:3px 0 0;font-size:11.5px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.ato .grupos{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;margin-top:13px}
.ato .g{border:1px solid var(--border);background:var(--surface2);padding:10px 12px;border-radius:11px}
.ato .g b{display:block;font:700 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;color:var(--text3)}
.ato .g.lei b{color:var(--lei)}.ato .g.juris b{color:var(--juris)}.ato .g.peca b{color:var(--peca)}.ato .g.desvio b{color:var(--desvio)}
.ato .g button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text2);
  padding:4px 0;font:600 12.8px var(--body);cursor:pointer;line-height:1.4}
.ato .g button:hover{color:var(--accent);text-decoration:underline}
.ato .g.peca button{color:var(--peca);font-weight:700}
.ato .g.peca button.falta{color:var(--text3);font-weight:600}
.ato .g.peca button.falta:hover{color:var(--text3);text-decoration:none;cursor:default}
.ato .g .soon{font-style:normal;font:700 9px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--text3);border:1px solid var(--border);border-radius:99px;padding:1px 6px;margin-left:5px}
.ato .g.desvio button{cursor:default;color:var(--text3);font-weight:500}
.ato .g.desvio button:hover{color:var(--text3);text-decoration:none}
.lt-vazio{color:var(--text3);font-size:13px;padding:24px}

/* ---------------- mapa ---------------- */
#palco{display:none;position:relative;width:100%;height:calc(100vh - 148px);min-height:420px;
  overflow:hidden;touch-action:none;cursor:grab;background:var(--bg)}
#palco.on{display:block}
#palco.arrastando{cursor:grabbing}
#mundo{position:absolute;left:0;top:0;transform-origin:0 0}
svg#fios{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.no{position:absolute;transform:translate(-50%,-50%);border-radius:11px;padding:8px 12px;font-size:13px;
  font-weight:600;border:1px solid var(--border);background:var(--surface);cursor:pointer;white-space:nowrap;
  user-select:none;box-shadow:var(--sh)}
.no small{display:block;font-weight:400;font-size:10px;color:var(--text3)}
.no .cnt{display:inline-block;margin-left:7px;font-family:var(--mono);font-size:10px;color:var(--text3);
  border:1px solid var(--border);border-radius:99px;padding:0 5px}
.no.materia{background:var(--rc);border-color:var(--rc);color:#fff;font-family:var(--display);font-size:15px;padding:12px 16px}
.no.fase{background:var(--surface);border-color:var(--border)}
.no.lei{border-color:color-mix(in srgb,var(--lei) 40%,var(--border));color:var(--lei);background:color-mix(in srgb,var(--lei) 8%,var(--surface));font-size:12px}
.no.juris{border-color:color-mix(in srgb,var(--juris) 40%,var(--border));color:var(--juris);background:color-mix(in srgb,var(--juris) 8%,var(--surface));font-size:12px}
.no.peca{border-color:color-mix(in srgb,var(--peca) 40%,var(--border));color:var(--peca);background:color-mix(in srgb,var(--peca) 8%,var(--surface));font-size:12px}
.no.desvio{border-color:var(--desvio);color:var(--desvio);background:color-mix(in srgb,var(--desvio) 7%,var(--surface));
  font-size:11.5px;border-style:dashed;box-shadow:none}
.fechado{opacity:.94}
.legenda{display:none;position:sticky;bottom:0;z-index:10;padding:9px 18px;
  background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);
  border-top:1px solid var(--border);gap:16px;flex-wrap:wrap;font-size:11px;color:var(--text3)}
.legenda.on{display:flex}
.legenda span{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}

@media (max-width:640px){
  .l1{padding:11px 12px;flex-wrap:wrap} .l2{padding:0 12px 10px} .brand small{display:none}
  #linha{padding:16px 12px 60px}
  .lt{padding-left:0} .lt::before{display:none}
  .ato .num{position:static;margin-bottom:8px}
  .atalhos{padding-left:0} .cab small{padding-left:0}
}
@media print{ .top,.legenda,#palco{display:none !important} .ato{break-inside:avoid;box-shadow:none} }
</style>
<script>(function(){var V=['--bg','--surface','--surface2','--border','--ink','--text2','--text3','--accent','--accentD','--accentSoft','--accentRing','--onAccent','--radius','--display','--body','--mono','--heroGrad'];function apply(t){var r=document.documentElement;V.forEach(function(v){if(t[v]&&t[v].trim())r.style.setProperty(v,t[v].trim());});}try{var pw=window.parent;if(pw&&pw!==window){var host=pw.document.querySelector('[style*="--accent"]');if(host){var cs=pw.getComputedStyle(host);var t={};V.forEach(function(v){t[v]=cs.getPropertyValue(v);});apply(t);}}}catch(e){}window.addEventListener('message',function(e){if(e.data&&e.data.type==='ctTheme'&&e.data.tokens)apply(e.data.tokens);});})();</script>
</head><body>

<header class="top">
  <div class="l1">
    <div class="brand"><span class="ic">🧭</span><div><b>Ritos processuais</b>
      <small>o caminho do processo, ato a ato, com os desvios</small></div></div>
    <nav class="vis" id="vis">
      <button data-v="linha" class="on"><i>📋</i>Sequência</button>
      <button data-v="mapa"><i>🕸</i>Mapa</button>
    </nav>
  </div>
  <div class="l2">
    <span id="mats"></span>
    <span class="ferr" id="ferr">
      <button id="menos" title="Diminuir">−</button><span class="zoomlbl" id="zl">100%</span>
      <button id="mais" title="Ampliar">+</button>
      <button id="ajusta" title="Enquadrar">⤢</button>
      <button id="tudo" title="Abrir tudo">⊕</button>
    </span>
  </div>
</header>

<div id="linha" class="on"></div>
<div id="palco"><div id="mundo"><svg id="fios"></svg></div></div>
<div class="legenda" id="legenda">
  <span><i class="dot" style="background:var(--lei)"></i> dispositivo → CátedraLEGIS</span>
  <span><i class="dot" style="background:var(--juris)"></i> jurisprudência → CátedraJURIS</span>
  <span><i class="dot" style="background:var(--peca)"></i> peça → roteiro</span>
  <span><i class="dot" style="background:var(--desvio)"></i> desvio do fluxo</span>
  <span style="margin-left:auto">toque num nó para abrir/fechar · pinça ou roda para ampliar</span>
</div>

<script src="ritos.js"></script>
<script src="pecas.js"></script>
<script src="peca-roteiro.js"></script>
<script>
/* ==========================================================================
   Ritos processuais — duas leituras do MESMO dado (ritos.js):
   "Sequência" é o rito como se estuda, de cima para baixo; "Mapa" é o rito como
   se enxerga inteiro. O ✍️ de qualquer uma abre o roteiro da peça (peca-roteiro.js).
   ========================================================================== */
const R=window.CTRoteiro, $=id=>document.getElementById(id), esc=R.esc, limpa=R.limpa;

function montarMapa(){
  const RT=window.CT_RITOS||{}, out={};
  Object.keys(RT).forEach(nome=>{
    out[nome]={t:nome, k:'materia', f: RT[nome].map(([ato,quando,ramos])=>({
      t:ato, k:'fase', s:quando||'',
      f:(ramos||[]).map(([rot,tipo])=>({t:rot, k:tipo}))
    }))};
  });
  return out;
}
const MAPA=montarMapa();
let materia=Object.keys(MAPA)[0], visao='linha';

/* ==========================================================================
   Sequência
   ========================================================================== */
function pintaLinha(){
  const host=$('linha'), rito=(window.CT_RITOS||{})[materia]||[], r=R.ramoDe(materia);
  host.style.setProperty('--rc', r.c);
  const tem=window.CT_PECAS||{};
  const grupo=(itens,tipo,titulo)=>{
    const l=itens.filter(f=>f[1]===tipo); if(!l.length) return '';
    return '<div class="g '+tipo+'"><b>'+titulo+'</b>'+l.map(f=>{
      const t=limpa(f[0]);
      const falta=(tipo==='peca' && !tem[t]) ? ' falta' : '';
      const dica=(tipo==='peca' && !tem[t]) ? ' title="Roteiro ainda não escrito"' : '';
      return '<button class="'+falta.trim()+'" data-k="'+tipo+'" data-t="'+esc(t)+'"'+dica+'>'
        +esc(t)+(falta?' <em class="soon">em breve</em>':'')+'</button>';
    }).join('')+'</div>';
  };
  const pecas=new Set(rito.flatMap(a=>(a[2]||[]).filter(f=>f[1]==='peca').map(f=>limpa(f[0]))));
  const desvios=rito.reduce((a,x)=>a+(x[2]||[]).filter(f=>f[1]==='desvio').length,0);

  host.innerHTML=
     '<div class="cab"><h2><i></i>'+esc(materia)+'</h2>'
    +'<small>'+rito.length+' atos na ordem · '+pecas.size+' peças cabíveis · '+desvios+' desvios possíveis'
    +' · clique num item para abrir no acervo</small></div>'
    +(rito.length
      ? '<div class="atalhos">'+rito.map((a,i)=>'<button data-ir="'+i+'"><em>'
          +String(i+1).padStart(2,'0')+'</em>'+esc(a[0])+'</button>').join('')+'</div>'
        +'<div class="lt">'+rito.map((ato,i)=>{
          const [nome,quando,ramos]=ato, it=ramos||[];
          return '<div class="ato" id="ato'+i+'"><div class="num">'+String(i+1).padStart(2,'0')+'</div>'
            +'<h3>'+esc(nome)+'</h3>'
            +(quando?'<p class="quando">'+esc(quando)+'</p>':'')
            +'<div class="grupos">'+grupo(it,'lei','⚖️ O que manda')
            +grupo(it,'juris','🏛️ O que o tribunal decidiu')
            +grupo(it,'peca','✍️ Peça cabível')
            +grupo(it,'desvio','↘ Desvios possíveis')+'</div></div>';
        }).join('')+'</div>'
      : '<div class="lt-vazio">Este rito ainda não tem atos cadastrados.</div>');

  host.querySelectorAll('.g button').forEach(b=>b.onclick=()=>acionar(b.dataset.k, b.dataset.t));
  host.querySelectorAll('.atalhos button').forEach(b=>b.onclick=()=>{
    const alvo=$('ato'+b.dataset.ir); if(!alvo) return;
    alvo.scrollIntoView({behavior:'smooth', block:'start'});
    alvo.classList.add('pisca'); setTimeout(()=>alvo.classList.remove('pisca'),1400);
  });
}

/* ⚖️ e 🏛️ pedem o acervo ao app; ✍️ abre o roteiro aqui mesmo. */
function acionar(k, t){
  if(k==='peca'){ R.abrir(t); return; }
  if(k==='lei'||k==='juris') R.abrirAcervo(k==='lei'?'legis':'juris', t);
}

/* ==========================================================================
   Mapa — tidy tree horizontal
   ========================================================================== */
const LARG={materia:230, fase:210, lei:180, juris:180, peca:180, desvio:180};
const GAPX=78, GAPY=66;
let nos=[], arestas=[], fechados=new Set(), seq=0;

function medir(no,prof){
  no._prof=prof;
  const aberto=(no.f||[]).length>0 && !fechados.has(no._id);
  if(!aberto){ no._alt=GAPY; return no._alt; }
  let soma=0; no.f.forEach(f=>{ soma+=medir(f,prof+1); });
  no._alt=Math.max(GAPY,soma); return no._alt;
}
function posicionar(no,x,y){
  no._x=x; no._y=y+no._alt/2; nos.push(no);
  if(!((no.f||[]).length>0 && !fechados.has(no._id))) return;
  let cy=y;
  no.f.forEach(f=>{ arestas.push([no,f]); posicionar(f, x+LARG[no.k||'fase']+GAPX, cy); cy+=f._alt; });
}
function idear(no){ no._id='n'+(seq++); (no.f||[]).forEach(idear); }

const mundo=$('mundo'), fios=$('fios'), palco=$('palco');
const COR={materia:'#4a8fd4', fase:'#9c968f', lei:'#c9a227', juris:'#e0685c', peca:'#9b86e8', desvio:'#5aa9c9'};

function desenhar(){
  nos=[]; arestas=[];
  const raiz=MAPA[materia];
  palco.style.setProperty('--rc', R.ramoDe(materia).c);
  medir(raiz,0); posicionar(raiz,120,40);
  mundo.querySelectorAll('.no').forEach(e=>e.remove());
  let maxX=0,maxY=0;
  nos.forEach(n=>{
    const d=document.createElement('div');
    const temF=(n.f||[]).length>0, fech=fechados.has(n._id);
    d.className='no '+(n.k||'fase')+(fech?' fechado':'');
    d.style.left=n._x+'px'; d.style.top=n._y+'px';
    d.innerHTML=esc(n.t)+(n.s?'<small>'+esc(n.s)+'</small>':'')
      +(temF&&fech?'<span class="cnt">+'+n.f.length+'</span>':'');
    d.onclick=ev=>{ ev.stopPropagation();
      if(n.k==='peca'||n.k==='lei'||n.k==='juris'){ acionar(n.k, limpa(n.t)); return; }
      if(!temF) return;
      if(fech) fechados.delete(n._id); else fechados.add(n._id);
      desenhar(); };
    mundo.appendChild(d);
    maxX=Math.max(maxX,n._x+240); maxY=Math.max(maxY,n._y+60);
  });
  fios.setAttribute('width',maxX); fios.setAttribute('height',maxY); fios.innerHTML='';
  arestas.forEach(([a,b])=>{
    const x1=a._x+LARG[a.k||'fase']/2-40, x2=b._x-LARG[b.k||'fase']/2+40;
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d','M '+x1+' '+a._y+' C '+((x1+x2)/2)+' '+a._y+', '+((x1+x2)/2)+' '+b._y+', '+x2+' '+b._y);
    p.setAttribute('fill','none'); p.setAttribute('stroke',COR[b.k||'fase']);
    p.setAttribute('stroke-width', b.k==='fase'?2.2:1.4);
    p.setAttribute('opacity', b.k==='fase'?.8:.42);
    fios.appendChild(p);
  });
}

/* zoom e arraste */
let escala=1, tx=0, ty=0, zoomManual=false;
const zl=$('zl');
function aplicar(){ mundo.style.transform='translate('+tx+'px,'+ty+'px) scale('+escala+')';
  zl.textContent=Math.round(escala*100)+'%'; }
function zoomEm(f,cx,cy){ zoomManual=true;
  const novo=Math.min(2.4,Math.max(0.25,escala*f));
  tx=cx-(cx-tx)*(novo/escala); ty=cy-(cy-ty)*(novo/escala); escala=novo; aplicar(); }
palco.addEventListener('wheel',e=>{ e.preventDefault(); zoomEm(e.deltaY<0?1.12:1/1.12, e.clientX, e.clientY); },{passive:false});
const pts=new Map(); let distIni=0, escIni=1, arrast=null;
palco.addEventListener('pointerdown',e=>{ palco.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){ arrast={x:e.clientX-tx,y:e.clientY-ty}; palco.classList.add('arrastando'); }
  if(pts.size===2){ const [a,b]=[...pts.values()]; distIni=Math.hypot(a.x-b.x,a.y-b.y); escIni=escala; arrast=null; } });
palco.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){ const [a,b]=[...pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y);
    if(distIni>0) zoomEm((escIni*(d/distIni))/escala,(a.x+b.x)/2,(a.y+b.y)/2);
    return; }
  if(arrast){ tx=e.clientX-arrast.x; ty=e.clientY-arrast.y; aplicar(); } });
['pointerup','pointercancel'].forEach(ev=>palco.addEventListener(ev,e=>{
  pts.delete(e.pointerId); if(pts.size<2) distIni=0;
  if(pts.size===0){ arrast=null; palco.classList.remove('arrastando'); } }));

/* Enquadra pela largura E pela altura, com piso de 55% para não virar letra ilegível.
   Se o palco ainda não tem tamanho (iframe escondido), espera o ResizeObserver —
   senão a escala trava no piso e o mapa fica minúsculo para sempre. */
function enquadrar(){
  const dispW=palco.clientWidth-40, dispH=palco.clientHeight-40;
  if(dispW<100||dispH<100) return;
  let maxX=0,maxY=0; nos.forEach(n=>{ maxX=Math.max(maxX,n._x+240); maxY=Math.max(maxY,n._y+60); });
  escala=Math.min(1.1,Math.max(0.55,Math.min(dispW/maxX, dispH/maxY)));
  tx=20; ty=Math.max(24,(palco.clientHeight-maxY*escala)/2); zoomManual=false; aplicar();
}
new ResizeObserver(()=>{ if(!zoomManual && visao==='mapa') enquadrar(); }).observe(palco);
$('mais').onclick=()=>zoomEm(1.2, innerWidth/2, innerHeight/2);
$('menos').onclick=()=>zoomEm(1/1.2, innerWidth/2, innerHeight/2);
$('ajusta').onclick=enquadrar;
$('tudo').onclick=()=>{ fechados.clear(); desenhar(); enquadrar(); };

function montarArvore(){
  seq=0; idear(MAPA[materia]); fechados.clear();
  desenhar();
  nos.filter(n=>n.k==='fase').forEach(n=>fechados.add(n._id));   // abre legível
  desenhar(); enquadrar();
}

/* ==========================================================================
   Visões e pílulas de rito
   ========================================================================== */
function trocaVisao(v){
  visao=v;
  document.querySelectorAll('#vis button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  $('linha').classList.toggle('on', v==='linha');
  palco.classList.toggle('on', v==='mapa');
  $('legenda').classList.toggle('on', v==='mapa');
  $('ferr').style.display = v==='mapa' ? '' : 'none';
  if(v==='linha') pintaLinha(); else { montarArvore(); }
  try{ const u=new URL(location.href); u.searchParams.set('v',v); history.replaceState(null,'',u); }catch(e){}
}
document.querySelectorAll('#vis button').forEach(b=>b.onclick=()=>trocaVisao(b.dataset.v));

const mats=$('mats');
Object.keys(MAPA).forEach((k,i)=>{
  const b=document.createElement('button'), r=R.ramoDe(k);
  b.className='pill'+(i===0?' on':''); b.style.setProperty('--rc', r.c);
  b.innerHTML='<i></i>'+esc(k);
  b.onclick=()=>{
    mats.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); materia=k;
    if(visao==='linha'){ pintaLinha(); window.scrollTo({top:0,behavior:'smooth'}); }
    else montarArvore();
    b.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
  };
  mats.appendChild(b);
});

/* ---- partida: ?rito=Nome&v=linha|mapa ---- */
(function(){
  let v='linha';
  try{ const s=new URLSearchParams(location.search);
    const r=s.get('rito'); if(r && MAPA[r]){ materia=r;
      [...mats.children].forEach(b=>b.classList.toggle('on', b.textContent.trim()===r)); }
    const _v=s.get('v'); if(_v==='mapa'||_v==='linha') v=_v;
  }catch(e){}
  trocaVisao(v);
})();
</script>
</body></html>
