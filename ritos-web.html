<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ritos processuais — fluxograma</title>
<link rel="stylesheet" href="catedra-ui.css"><link rel="stylesheet" href="satellite-base.css"><style>
/* Cor do módulo (ritos). Dentro do app segue o tema escolhido nos Ajustes; aberta
   avulsa, a página mantém a cor com que nasceu. Ver satellite-base.css. */
:root{--module-accent:var(--accent,#b5174e)}

:root{
  --bg:#faf7f5;--surface:#ffffff;--surface2:#f5f0ec;--border:#e4dcd6;
  --ink:#1b1b1f;--text2:#4b4a52;--text3:#7d7a86;
  --accent:#b5174e;--accentD:#8e0f3c;--onAccent:#ffffff;
  --lei:#9a6b00;--juris:#b93a2b;--peca:#5b47b8;--desvio:#1f6f8b;--ok:#12795a;
  /* D10 — o amarelo-lei dá 4,1:1 nos chips de 10px (abaixo de 4.5); escurecido com a
     própria tinta do texto ele passa a 6:1 sem virar uma cor nova na paleta */
  --leiTxt:color-mix(in srgb,var(--lei) 72%,var(--ink));
  --display:Georgia,serif;--body:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--mono:ui-monospace,Menlo,monospace;
  --sh:0 1px 2px rgba(20,15,10,.05),0 4px 14px rgba(20,15,10,.05);
  --linha:#c9bfb6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
::-webkit-scrollbar{width:10px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;border:2px solid var(--bg)}

/* D10 — quem navega por teclado não via onde estava: nenhum controle desta página
   marcava o foco. O outline usa a cor de destaque do host (herdada pelo tema). */
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}

/* D7 — dois níveis de microlabel. Antes "NOTA", "FLUXO" e a fonte legal usavam o
   mesmo mono-caps-espaçado: quando tudo destaca, nada destaca.
   · ml-forte  → o que estrutura a leitura (NOTA, a lei que rege o rito): mono, caixa
                 alta, espaçamento e a cor do ramo;
   · ml-fraca  → metadado (o selo "fluxo" das pílulas): menor, sem mono, sem
                 espaçamento extra e em --text2, que a 10px ainda passa em contraste. */
.ml-forte{font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;
  color:color-mix(in srgb,var(--rc,var(--accent)) 76%,var(--ink))}
.ml-fraca{font:600 10px var(--body);letter-spacing:0;text-transform:uppercase;color:var(--text2)}

/* ───────────────────────── cabeçalho ───────────────────────── */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border)}
.l1{display:flex;align-items:center;gap:14px;padding:12px 18px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.brand .ic{width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--onAccent);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.brand b{font:800 18px/1 var(--display);letter-spacing:-.02em;display:block}
.brand small{display:block;font-size:11.5px;color:var(--text2);margin-top:4px}
.acs{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none;position:relative}
.acs .menu{display:flex;gap:6px;align-items:center}
.acs button{border:1px solid var(--border);background:var(--bg);color:var(--text2);border-radius:9px;
  padding:8px 13px;font:600 12px inherit;cursor:pointer;display:flex;align-items:center;gap:6px}
.acs button:hover{border-color:var(--text3);color:var(--ink)}
.acs button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.acs .mais{display:none;justify-content:center;font-size:16px;line-height:1;padding:0;
  min-width:44px;min-height:44px}
.l2{display:flex;align-items:center;gap:9px;padding:0 18px 11px;max-width:1240px;margin:0 auto}
#mats{display:flex;gap:6px;overflow-x:auto;flex:1;padding:2px 1px 4px;scrollbar-width:none;
  scroll-snap-type:x proximity;scroll-padding-inline:12px;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent)}
#mats::-webkit-scrollbar{display:none}
.pill{flex:none;white-space:nowrap;border:1px solid var(--border);background:var(--bg);color:var(--text2);
  border-radius:99px;padding:7px 14px;font:600 12.5px inherit;cursor:pointer;display:flex;align-items:center;gap:7px;
  scroll-snap-align:center}
.pill i{font-style:normal;width:8px;height:8px;border-radius:99px;background:var(--rc,var(--border));flex:none}
.pill em{font-style:normal;border:1px solid var(--border);border-radius:99px;padding:1px 6px}
.pill:hover{border-color:var(--text3);color:var(--ink)}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.pill.on i{background:var(--onAccent,#fff)} .pill.on em{color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.36)}

/* ───────────────────────── moldura do rito ───────────────────────── */
.wrap{max-width:1240px;margin:0 auto;padding:22px 18px 80px}
.cab{margin:0 0 6px}
.cab h2{margin:0;font:800 28px/1.15 var(--display);letter-spacing:-.025em;display:flex;align-items:center;gap:12px}
.cab h2 i{font-style:normal;width:11px;height:27px;border-radius:4px;background:var(--rc);flex:none}
.cab .fonte{display:inline-block;margin:9px 0 0 23px;
  background:color-mix(in srgb,var(--rc) 10%,transparent);border-radius:99px;padding:4px 11px}
.cab p{margin:10px 0 0 23px;font-size:13px;line-height:1.65;color:var(--text2);max-width:74ch}
.cab .aviso{margin:12px 0 0 23px;font-size:12px;color:var(--text2);background:var(--surface2);
  border-left:3px solid var(--border);border-radius:0 9px 9px 0;padding:9px 13px;max-width:74ch;line-height:1.6}

/* ───────────────────────── o fluxograma ───────────────────────── */
.fluxo{margin-top:26px}
.passo{display:grid;grid-template-columns:1fr minmax(0,430px) 1fr;gap:14px;align-items:center;position:relative}
.passo .centro{grid-column:2;display:flex;flex-direction:column;align-items:center}
.passo .esq{grid-column:1;justify-self:end;display:flex;align-items:center;gap:0}
.passo .dir{grid-column:3;justify-self:start;display:flex;align-items:center;gap:0}

/* seta vertical entre passos */
.liga{grid-column:2;justify-self:center;width:2px;height:30px;background:var(--linha);position:relative}
.liga::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--linha)}

/* caixas */
.cx{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;
  padding:13px 16px;box-shadow:var(--sh);text-align:center;position:relative}
.cx .tt{font:700 14.5px/1.35 var(--body);color:var(--ink)}
.cx .sb{font-size:12px;color:var(--text2);margin-top:5px;line-height:1.5}
.cx .art{display:inline-block;margin-top:9px;font:700 10.5px var(--mono);letter-spacing:.02em;
  color:var(--leiTxt);background:color-mix(in srgb,var(--lei) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--lei) 26%,transparent);border-radius:99px;padding:3px 10px;cursor:pointer}
.cx .art:hover{background:color-mix(in srgb,var(--lei) 18%,transparent)}
.cx .chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:9px}
.cx .chips button{border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:4px 9px;
  font:600 11px inherit;cursor:pointer;color:var(--text2);line-height:1.35}
.cx .chips button.lei{color:var(--leiTxt);border-color:color-mix(in srgb,var(--lei) 28%,var(--border))}
.cx .chips button.juris{color:var(--juris);border-color:color-mix(in srgb,var(--juris) 28%,var(--border))}
.cx .peca{display:inline-flex;align-items:center;gap:6px;margin-top:10px;border:1.5px solid var(--peca);
  background:color-mix(in srgb,var(--peca) 8%,transparent);color:var(--peca);border-radius:9px;
  padding:6px 13px;font:700 11.5px inherit;cursor:pointer}
.cx .peca:hover{background:var(--peca);color:#fff}

.cx.inicio{background:var(--rc);border-color:var(--rc);color:#fff;box-shadow:0 6px 20px color-mix(in srgb,var(--rc) 28%,transparent)}
.cx.inicio .tt{color:#fff;font:800 17px var(--display);letter-spacing:.02em;text-transform:uppercase}
.cx.inicio .sb{color:rgba(255,255,255,.93)}
.cx.inicio .art{color:#fff;background:rgba(0,0,0,.18);border-color:rgba(255,255,255,.42)}
.cx.prazo{border-color:color-mix(in srgb,var(--desvio) 45%,var(--border));
  background:color-mix(in srgb,var(--desvio) 6%,var(--surface))}
.cx.prazo .tt::before{content:"⏱ ";opacity:.6}
.cx.recurso{border-color:color-mix(in srgb,var(--juris) 42%,var(--border));
  background:color-mix(in srgb,var(--juris) 6%,var(--surface))}
.cx.recurso .tt::before{content:"↥ ";opacity:.7}
.cx.terminal{border-width:2px;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 7%,var(--surface))}
.cx.terminal .tt{color:var(--ok)}
.cx.terminal .art{color:color-mix(in srgb,var(--ok) 76%,var(--ink));background:color-mix(in srgb,var(--ok) 10%,transparent);
  border-color:color-mix(in srgb,var(--ok) 30%,transparent)}

/* losango de decisão — D6(a).
   O losango tinha altura FIXA (34px de folga em cima e embaixo) e o conteúdo ocupava
   quase toda a largura: como a área útil de um losango encolhe conforme se afasta do
   meio, o título e a lei escapavam pelas laterais inclinadas ("Legitimidade" +
   "Lei 8.429/92, art. 17, caput" sobravam para fora da forma em TODOS os fluxos).
   A forma agora cresce com o texto: o conteúdo é limitado a ~metade da largura
   (--decLarg) e a folga vertical (--decPad) sai da altura do texto medida em JS —
   ver medirLosangos() lá embaixo, que tem a conta. Os 34px continuam valendo como
   valor de partida, para o caso de o JS não rodar. */
.dec{width:100%;max-width:430px;position:relative;--decLarg:48%;--decPad:34px}
.dec .losango{position:absolute;inset:0;background:var(--surface);border:1.5px solid var(--rc);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);box-shadow:var(--sh)}
.dec .losango::before{content:"";position:absolute;inset:3px;
  background:color-mix(in srgb,var(--rc) 7%,transparent);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.dec .conteudo{position:relative;padding:var(--decPad) 0}
.dec .interno{max-width:var(--decLarg);margin:0 auto;text-align:center}
.dec .tt{font:800 14.5px/1.3 var(--body);color:var(--rc)}
.dec .art{display:inline-block;margin-top:7px;font:700 10px var(--mono);color:var(--leiTxt);cursor:pointer;
  background:color-mix(in srgb,var(--lei) 10%,transparent);border:0;border-radius:99px;padding:2px 9px}
/* Texto que não cabe em losango nenhum (título longo em coluna estreita) vira caixa
   arredondada — o mesmo recurso que o mobile já usava — em vez de virar uma agulha. */
.dec.reto .losango{clip-path:none;border-radius:12px}
.dec.reto .losango::before{clip-path:none;border-radius:9px}
.dec.reto .conteudo{padding:14px 0}
.dec.reto .interno{max-width:none;padding:0 18px}

/* saída lateral */
.saida{display:flex;align-items:center;width:100%}
.saida.esq{flex-direction:row-reverse}
.saida .fio{flex:1;min-width:34px;height:2px;background:var(--linha);position:relative}
.saida .fio{min-width:104px}
/* D6(b) — o rótulo da seta é o que diferencia os caminhos ("ente lesado" ×
   "Ministério Público"); estava em --text3 a 10px sobre o fundo da página, abaixo de
   4.5:1. Subiu para --text2 e ganhou pílula com borda, para descolar da linha. */
.saida .fio .rot{position:absolute;left:50%;top:-8px;transform:translate(-50%,-100%);
  max-width:140px;white-space:normal;text-align:center;line-height:1.3;
  font:700 10.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--text2);
  background:var(--surface);border:1px solid var(--border);padding:2px 8px;border-radius:99px;z-index:2}
.saida.dir .fio::after{content:"";position:absolute;right:-1px;top:50%;transform:translateY(-50%);
  border:5px solid transparent;border-left-color:var(--linha)}
.saida.esq .fio::after{content:"";position:absolute;left:-1px;top:50%;transform:translateY(-50%);
  border:5px solid transparent;border-right-color:var(--linha)}
.saida .cx{width:230px;padding:11px 13px}
.saida .cx .tt{font-size:13px}
.saida .cx .sb{font-size:11.5px}

/* nota lateral, no estilo "chave" do fluxograma de papel */
.nota{grid-column:1/-1;justify-self:center;max-width:820px;margin:10px 0 0;display:flex;gap:10px;
  font-size:12.3px;line-height:1.6;color:var(--text2);background:var(--surface2);
  border:1px solid var(--border);border-left:4px solid var(--rc);border-radius:0 11px 11px 0;padding:10px 14px}
.nota b{font-style:normal;flex:none;padding-top:2px}
body.semnotas .nota{display:none}

@media (max-width:900px){
  .passo{grid-template-columns:1fr;gap:10px}
  .passo .centro,.passo .esq,.passo .dir{grid-column:1;justify-self:stretch}
  .passo .esq,.passo .dir{flex-direction:column;align-items:stretch}
  .saida,.saida.esq{flex-direction:column;align-items:stretch}
  /* o min-width:104px da versão em linha continuava valendo aqui e transformava o fio
     de 2px numa barra cinza de 104px atravessada no meio do fluxo */
  .saida .fio{width:2px;min-width:0;height:22px;align-self:center;flex:none}
  /* a pílula do rótulo mora dentro do fio de 2px: margem automática a centraliza
     em vez de espremê-la */
  .saida .fio .rot{position:static;transform:none;display:block;text-align:center;
    width:max-content;max-width:min(70vw,220px);margin:24px auto 0}
  .saida.dir .fio::after,.saida.esq .fio::after{left:50%;right:auto;top:auto;bottom:-1px;
    transform:translateX(-50%);border-color:transparent;border-top-color:var(--linha)}
  .saida .cx{width:auto}
  .dec .conteudo{padding:14px 0}
  .dec .interno{max-width:none;padding:0 22px}
  .dec .losango{clip-path:none;border-radius:12px}
  .dec .losango::before{clip-path:none;border-radius:9px}
  .wrap{padding:16px 12px 60px}
  .l1{padding:11px 12px} .l2{padding:0 12px 10px} .brand small{display:none}
}

/* ───────── D8 — celular: dedo, não cursor ─────────
   As pílulas apareciam cortadas no meio ("Ambienta…") porque a máscara de fade comia
   a última visível e nada as alinhava; os botões do topo tinham ~32px de altura, longe
   dos 44px que a mão acerta; e "Imprimir" ocupava lugar nobre numa tela onde ninguém
   imprime. Agora: alvos de 44px, scroll-snap com a pílula ativa centralizada (também
   no LOAD, ver mostrarPilula) e as duas ações recolhidas num "⋯". */
@media (max-width:640px){
  #mats{scroll-snap-type:x mandatory;
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 16px),transparent);
    mask-image:linear-gradient(90deg,#000 calc(100% - 16px),transparent)}
  .pill{min-height:44px;padding:7px 16px}
  .acs .mais{display:flex}
  .acs .menu{display:none;position:absolute;right:0;top:calc(100% + 8px);flex-direction:column;
    gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:6px;box-shadow:var(--sh);z-index:50;min-width:186px}
  .acs.aberto .menu{display:flex}
  .acs .menu button{min-height:44px;width:100%;justify-content:flex-start;border-color:transparent;
    background:transparent}
  .acs .menu button.on{background:var(--ink);border-color:var(--ink)}
  .cx .chips button,.cx .art,.cx .peca{min-height:44px;display:inline-flex;align-items:center}
  .dec .art{min-height:44px;display:inline-flex;align-items:center}
}
@media print{
  .top{display:none} .wrap{padding:0;max-width:none}
  .cx,.dec .losango{box-shadow:none}
  .passo{break-inside:avoid}
}
</style>
<script>(function(){var V=['--bg','--surface','--surface2','--border','--ink','--text2','--text3','--accent','--accentD','--accentSoft','--accentRing','--onAccent','--radius','--display','--body','--mono','--heroGrad'];function apply(t){var r=document.documentElement;V.forEach(function(v){if(t[v]&&t[v].trim())r.style.setProperty(v,t[v].trim());});}try{var pw=window.parent;if(pw&&pw!==window){var host=pw.document.querySelector('[style*="--accent"]');if(host){var cs=pw.getComputedStyle(host);var t={};V.forEach(function(v){t[v]=cs.getPropertyValue(v);});apply(t);}}}catch(e){}window.addEventListener('message',function(e){if(e.data&&e.data.type==='ctTheme'&&e.data.tokens)apply(e.data.tokens);});})();</script>
<script src="./tema-satelite.js"></script>
</head><body>

<header class="top">
  <div class="l1">
    <div class="brand"><span class="ic">🧭</span><div><b>Ritos processuais</b>
      <small>o caminho do processo e o que acontece em cada bifurcação</small></div></div>
    <span class="acs" id="acs">
      <button id="bMais" class="mais" type="button" aria-label="Mais ações" aria-haspopup="true"
        aria-expanded="false" aria-controls="acoes" title="Mais ações">⋯</button>
      <span class="menu" id="acoes">
        <button id="bNotas" class="on" type="button" aria-pressed="true"
          title="Mostrar ou esconder as observações laterais">☰ Notas</button>
        <button id="bPrint" type="button" title="Imprimir / salvar em PDF">⎙ Imprimir</button>
      </span>
    </span>
  </div>
  <div class="l2"><span id="mats"></span></div>
</header>

<main class="wrap"><div id="cab"></div><div class="fluxo" id="fluxo"></div></main>

<script src="ritos.js"></script>
<script src="pecas.js"></script>
<script src="fluxos.js"></script>
<script src="peca-roteiro.js"></script>
<script>
/* ==========================================================================
   Ritos como FLUXOGRAMA: espinha vertical, losango onde o processo se bifurca,
   saída lateral com o rótulo da seta e o recurso cabível, e nota de rodapé no
   estilo "chave" do fluxograma de papel.

   Dois tipos de rito convivem:
   · escrito à mão em fluxos.js — tem decisão, saída e nota;
   · derivado de ritos.js — a espinha dos atos, com os desvios virando saídas e
     os dispositivos e julgados virando chips clicáveis. Nada se perde, mas não
     tem os losangos, e a página avisa isso.
   ========================================================================== */
const R=window.CTRoteiro, $=id=>document.getElementById(id), esc=R.esc, limpa=R.limpa;
const FLUXOS=window.CT_FLUXOS||{}, RITOS=window.CT_RITOS||{}, PECAS=window.CT_PECAS||{};

/* união das duas fontes, sem duplicar */
const ORDEM=[...new Set([...Object.keys(FLUXOS), ...Object.keys(RITOS)])]
  .sort((a,b)=>a.localeCompare(b,'pt'));
let atual = ORDEM[0];

/* ---- derivação: rito sem fluxo escrito vira espinha a partir de ritos.js ---- */
function derivar(nome){
  const atos=RITOS[nome]||[];
  let alterna=0;
  return {
    ramo: R.ramoDe(nome).n, derivado: true,
    resumo: 'Sequência dos atos deste rito. O fluxograma comentado — com os pontos de bifurcação e o recurso de cada saída — ainda não foi escrito para ele.',
    passos: [{k:'inicio', t:nome}].concat(atos.map(([ato,quando,ramos])=>{
      const it=ramos||[];
      const desvios=it.filter(f=>f[1]==='desvio');
      const peca=(it.find(f=>f[1]==='peca')||[])[0];
      return {
        k:'ato', t:ato, sub:quando||'',
        leis: it.filter(f=>f[1]==='lei').map(f=>limpa(f[0])),
        jurisps: it.filter(f=>f[1]==='juris').map(f=>limpa(f[0])),
        peca: peca?limpa(peca):null,
        saidas: desvios.map(d=>({ lado:(alterna++%2)?'dir':'esq', rot:'desvio',
                                  k:'recurso', t:limpa(d[0]) }))
      };
    }))
  };
}
const fluxoDe = nome => FLUXOS[nome] || derivar(nome);

/* ---- desenho de uma caixa ---- */
function caixa(p, cls){
  /* D10: o chip do dispositivo abre o LEGIS — era um <span> com onclick, invisível
     para o teclado e para o leitor de tela. Virou <button> de verdade. */
  const art = p.art ? '<button type="button" class="art" data-legis="'+esc(p.art)+'">⚖️ '+esc(p.art)+'</button>' : '';
  const chips = []
    .concat((p.leis||[]).map(t=>'<button class="lei" data-legis="'+esc(t)+'">⚖️ '+esc(t)+'</button>'))
    .concat((p.jurisps||[]).map(t=>'<button class="juris" data-juris="'+esc(t)+'">🏛️ '+esc(t)+'</button>'))
    .join('');
  const peca = p.peca
    ? '<button class="peca" data-peca="'+esc(p.peca)+'">✍️ '+esc(p.peca)
        +(PECAS[p.peca]?'':' · em breve')+'</button>'
    : '';
  return '<div class="cx '+(cls||p.k||'ato')+'">'
    +'<div class="tt">'+esc(p.t)+'</div>'
    +(p.sub?'<div class="sb">'+esc(p.sub)+'</div>':'')
    +art
    +(chips?'<div class="chips ct-chips">'+chips+'</div>':'')
    +peca+'</div>';
}
function losango(p){
  return '<div class="dec"><div class="losango"></div><div class="conteudo"><div class="interno">'
    +'<div class="tt">'+esc(p.t)+'</div>'
    +(p.art?'<button type="button" class="art" data-legis="'+esc(p.art)+'">'+esc(p.art)+'</button>':'')
    +'</div></div></div>';
}

/* D6(a) — a forma cresce com o texto.
   Num losango a largura útil vai a zero nas pontas: com folga vertical FIXA (34px),
   qualquer título de duas linhas — ou o chip da lei, que fica na parte estreita de
   baixo — escapava pela lateral inclinada. Medido antes da correção: numa coluna de
   ~905px (a largura do iframe dentro do app) 23 dos 26 losangos vazavam.
   Geometria: um retângulo l × a centrado cabe num losango L × A quando l/L + a/A ≤ 1.
   Fixando o texto em 48% da largura e resolvendo para A com 7% de folga, a altura sai
   do próprio texto — e a forma cresce junto com ele. Onde nem assim cabe (coluna
   estreita, título comprido, fonte ampliada nos Ajustes), a caixa arredondada entra no
   lugar de um losango-agulha ilegível. */
const MARGEM = 0.93, FOLGA_MIN = 26;
/* caixa que o texto realmente PINTA (linhas de texto + chip da lei), não a do bloco:
   um título curto não precisa empurrar o losango para cima. */
function caixaDoTexto(dec){
  let e=Infinity,d=-Infinity,t=Infinity,b=-Infinity;
  const soma=r=>{ if(!r.width||!r.height) return;
    e=Math.min(e,r.left); d=Math.max(d,r.right); t=Math.min(t,r.top); b=Math.max(b,r.bottom); };
  const w=document.createTreeWalker(dec, NodeFilter.SHOW_TEXT);
  for(let n=w.nextNode(); n; n=w.nextNode()){
    if(!String(n.nodeValue).trim()) continue;
    const rg=document.createRange(); rg.selectNodeContents(n);
    [...rg.getClientRects()].forEach(soma);
  }
  dec.querySelectorAll('.art').forEach(x=>soma(x.getBoundingClientRect()));
  return (d>e && b>t) ? {l:d-e, a:b-t} : null;
}
function medirLosangos(){
  document.querySelectorAll('.dec').forEach(dec=>{
    const dentro = dec.querySelector('.interno'); if(!dentro) return;
    dec.classList.remove('reto'); dec.style.removeProperty('--decPad');
    const L = dec.getBoundingClientRect().width;
    const cx = caixaDoTexto(dec); if(!L || !cx || !cx.a) return;
    const razao = cx.l / L;                       // quanto da largura o texto ocupa
    const folga = razao < MARGEM
      ? Math.max((cx.a * (1/(MARGEM - razao) - 1)) / 2, FOLGA_MIN)
      : Infinity;
    const alto = dentro.getBoundingClientRect().height + 2*folga;
    if(!isFinite(folga) || alto > L*0.8){ dec.classList.add('reto'); return; }
    dec.style.setProperty('--decPad', Math.round(folga)+'px');
  });
}
/* O texto muda de altura sozinho quando o host troca a fonte/escala (D1) ou a janela
   muda: o observador remede sem precisar repintar o fluxo. */
const olho = window.ResizeObserver ? new ResizeObserver(()=>medirLosangos()) : null;
window.addEventListener('resize', ()=>medirLosangos());
window.addEventListener('beforeprint', medirLosangos);   // o papel tem outra largura
function saida(s){
  return '<div class="saida '+s.lado+'">'
    +'<span class="fio"><span class="rot">'+esc(s.rot||'')+'</span></span>'
    +caixa(s, s.k||'ato')+'</div>';
}

function pinta(){
  const F=fluxoDe(atual), r=R.ramoDe(F.ramo||atual);
  document.body.style.setProperty('--rc', r.c);

  $('cab').innerHTML='<div class="cab"><h2><i></i>'+esc(atual)+'</h2>'
    +(F.fonte?'<span class="fonte ml-forte">'+esc(F.fonte)+'</span>':'')
    +(F.resumo?'<p>'+esc(F.resumo)+'</p>':'')
    +(F.derivado
      ? '<div class="aviso"><b>Espinha derivada da lista de atos.</b> Os fluxogramas comentados escritos até aqui são: '
        +Object.keys(FLUXOS).map(esc).join(' · ')+'.</div>'
      : '')
    +'</div>';

  $('fluxo').innerHTML=F.passos.map((p,i)=>{
    const esq=(p.saidas||[]).filter(s=>s.lado==='esq').map(saida).join('');
    const dir=(p.saidas||[]).filter(s=>s.lado!=='esq').map(saida).join('');
    return (i?'<div class="passo"><span class="liga"></span></div>':'')
      +'<div class="passo">'
      +'<div class="esq">'+esq+'</div>'
      +'<div class="centro">'+(p.k==='decisao'?losango(p):caixa(p))+'</div>'
      +'<div class="dir">'+dir+'</div>'
      +(p.nota?'<div class="nota"><b class="ml-forte">nota</b><span>'+esc(p.nota)+'</span></div>':'')
      +'</div>';
  }).join('');

  medirLosangos();
  if(olho){ olho.disconnect(); $('fluxo').querySelectorAll('.dec .interno').forEach(x=>olho.observe(x)); }

  $('fluxo').querySelectorAll('[data-legis]').forEach(b=>b.onclick=()=>R.abrirAcervo('legis', b.dataset.legis));
  $('fluxo').querySelectorAll('[data-juris]').forEach(b=>b.onclick=()=>R.abrirAcervo('juris', b.dataset.juris));
  $('fluxo').querySelectorAll('[data-peca]').forEach(b=>b.onclick=()=>R.abrir(b.dataset.peca));

  try{ const u=new URL(location.href); u.searchParams.set('rito',atual); history.replaceState(null,'',u); }catch(e){}
}

/* ---- pílulas: o selo indica quem já tem fluxograma comentado ---- */
const mats=$('mats');

/* D8: rolar a fileira SEM mexer no scroll da página. `scrollIntoView` num iframe
   arrasta o documento inteiro junto; aqui só a fileira anda, e a pílula ativa fica
   centralizada — inclusive na primeira carga, onde antes ela podia nascer fora da tela
   (era o "Ambienta…" cortado: a pílula escolhida ficava escondida atrás do fade). */
function mostrarPilula(b, suave){
  if(!b) return;
  const alvo = b.offsetLeft - (mats.clientWidth - b.offsetWidth)/2;
  const x = Math.max(0, Math.min(alvo, mats.scrollWidth - mats.clientWidth));
  try{ mats.scrollTo({left:x, behavior: suave?'smooth':'auto'}); }
  catch(e){ mats.scrollLeft = x; }
}

ORDEM.forEach(k=>{
  const b=document.createElement('button'), r=R.ramoDe(FLUXOS[k]?FLUXOS[k].ramo:k);
  b.className='pill'; b.type='button'; b.style.setProperty('--rc', r.c); b.dataset.k=k;
  b.innerHTML='<i></i>'+esc(k)+(FLUXOS[k]?'<em class="ml-fraca">fluxo</em>':'');
  b.onclick=()=>{ atual=k; mats.querySelectorAll('.pill').forEach(x=>x.classList.toggle('on',x===b));
    pinta(); window.scrollTo({top:0,behavior:'smooth'});
    mostrarPilula(b, true); };
  mats.appendChild(b);
});

/* D8: no celular as duas ações moram atrás do "⋯" — "Imprimir" não vale a barra
   inteira numa tela onde ninguém imprime. No desktop o menu é a própria fileira. */
const acs=$('acs'), bMais=$('bMais');
function fecharMenu(){ acs.classList.remove('aberto'); bMais.setAttribute('aria-expanded','false'); }
bMais.onclick=e=>{ e.stopPropagation();
  const abre=!acs.classList.contains('aberto');
  acs.classList.toggle('aberto',abre); bMais.setAttribute('aria-expanded',String(abre)); };
document.addEventListener('click',e=>{ if(!acs.contains(e.target)) fecharMenu(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') fecharMenu(); });

$('bNotas').onclick=function(){ document.body.classList.toggle('semnotas');
  const mostra=!document.body.classList.contains('semnotas');
  this.classList.toggle('on', mostra); this.setAttribute('aria-pressed', String(mostra));
  medirLosangos(); fecharMenu(); };
$('bPrint').onclick=()=>{ fecharMenu(); window.print(); };

/* U1: uma função só para "abrir neste ponto", chamada pela URL (1ª carga, deep-link,
   testes) E pela mensagem do host (iframe vivo, sem recarregar). Dois caminhos separados
   divergiriam na primeira correção. */
window.ctAbrirPonto = function (rito, peca, bloco) {
  try {
    if (rito && ORDEM.includes(rito)) {
      atual = rito;
      [...mats.children].forEach(b => b.classList.toggle('on', b.dataset.k === atual));
      pinta();
      mostrarPilula(mats.querySelector('.pill.on'), true);
    }
    if (peca && PECAS[peca]) setTimeout(() => R.abrir(peca, (bloco == null ? undefined : bloco)), 60);
  } catch (e) {}
};

/* ---- partida e volta do acervo: ?rito=Nome, ?peca=Nome (+ &bloco=N) ---- */
try{ const u=new URLSearchParams(location.search);
  const q=u.get('rito');
  if(q && ORDEM.includes(q)) atual=q; }catch(e){}
[...mats.children].forEach(b=>b.classList.toggle('on', b.dataset.k===atual));
pinta();
mostrarPilula(mats.querySelector('.pill.on'));
try{ const u=new URLSearchParams(location.search), pc=u.get('peca');
  if(pc && PECAS[pc]) setTimeout(()=>R.abrir(pc, u.get('bloco')), 60); }catch(e){}

window.addEventListener('message', function (e) {
  if (e && e.data && e.data.type === 'ctAbrirBloco') {
    window.ctAbrirPonto(e.data.rito, e.data.peca, e.data.bloco);
  }
});
</script>
