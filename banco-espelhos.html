cado contra a suposta amante, nos termos do Art. 20, par. 3o, do CP (erro sobre a pessoa); descabe a agravante do Art. 61, II, 'e', do CP, assim como o reconhecimento da escusa absolutória do Art. 181, I, do CP.","pont":"0,00 / 0,20 / 0,30 / 0,40","disp":["CP art. 20, par. 3o","CP art. 61, II, e","CP art. 181, I"]},{"trib":"TJ-TO","ano":2025,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelhotribunal-de-justica-do-estado-do-tocantins.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjto-disc.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/gabarito-definitivo-tj-to.pdf","conc":"https://conhecimento.fgv.br/concursos/tjto25","nota":"","cargo":"Juiz Substituto","disc":"Administrativo","tema":"Declaração de bens de agentes públicos","rot":"Q02 itens 1-3","exig":"Responder 'Sim' (0,00 a 0,40); justificar que tal obrigação busca assegurar mecanismos de fiscalização do patrimônio de agentes públicos, de modo a resguardar a moralidade e o erário (0,00 a 0,30); e que normas dessa natureza já foram placitadas pelo STF, inexistindo ofensa ao postulado da proporcionalidade - STF, Plenario, ADI 4.295/DF, j. 22/8/2023 (Info 1105) (0,00 a 0,30).","pont":"0,00 a 0,40 / 0,00 a 0,30 / 0,00 a 0,30","disp":["ADI 4.295/DF"]},{"trib":"TJ-TO","ano":2025,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelhotribunal-de-justica-do-estado-do-tocantins.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjto-disc.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/gabarito-definitivo-tj-to.pdf","conc":"https://conhecimento.fgv.br/concursos/tjto25","nota":"","cargo":"Juiz Substituto","disc":"Administrativo","tema":"Improbidade e Lei Anticorrupção - non bis in idem","rot":"Q02 itens 4-6","exig":"Responder 'Sim' (0,00 a 0,40); justificar que  Dia'; prova de sentenca criminal em https://conhecimento.fgv.br/sites/default/files/concursos/juiz-substituto-sentenca-criminalj-subs-tipo-1.pdf","cargo":"Juiz Substituto","disc":"Processo Penal","tema":"Substituição, sursis, art. 387, IV, do CPP e cautelares","rot":"Criminal - Arts. 44 e 77 do CP, indenização mínima e prisão preventiva","exig":"Citar que os benefícios dos arts. 44 e 77 do CP não são cabiveis em razao da pena aplicada; deixar de arbitrar valor indenizatório mínimo (art. 387, IV, do CPP), pois não há pedido das vítimas e do MP; indeferir o pedido de decretacao da prisão preventiva, até porque denúncias anonimas não podem ensejar a aplicabilidade de medidas cautelares (HC 106.152, STF).","pont":"0,40","disp":["CP art. 44","CP art. 77","CPP art. 387, IV"]},{"trib":"TJ-PE","ano":2023,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível e sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelhos-das-sentencas-para-publicacao-1.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/juiz-substituto-sentenca-civelj-subs2-tipo-1.pdf","prova2":"https://conhecimento.fgv.br/sites/default/files/concursos/juiz-substituto-sentenca-criminalj-subs-tipo-1.pdf","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe2022_gabarito_definitivo_alterado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpe22","nota":"Cadernos listados como '2o Dia' (civel) e '3o Dia'; prova de sentenca criminal em https://conhecimento.fgv.br/sites/default/files/concursos/juiz-substituto-sentenca-criminalj-subs-tipo-1.pdf","cargo":"Juiz Substituto","disc":"Processo Penal","tema":"Efeitos e providências finais","rot":"Criminal - Disposicoes finais","exig":"Condenar ao pagamento das custas processuais (Art. 804 do CPP); aplicar, em relação a arma de fogo, o Art. 25 da Lei 10.826/2003; determinar o perdimento da faca em favor da União (Art. 91, II, 'a', do CP).","pont":"0,70","disp":["CPP art. 804","Lei 10.826/2003 art. 25","CP art. 91, II, a"]},{"trib":"TJ-PE","ano":2024,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-2025-espelho-de-correcao-provas-discursivas-publicacao.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-prova-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/gabarito_definitivo_tjpe.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpe24","nota":"","cargo":"Juiz Substituto","disc":"Civil","tema":"Escada ponteana - plano da eficácia","rot":"Q01 item 1","exig":"Identificação, a luz da escada ponteana, de que o rompimento da disposicao de ultima vontade opera no plano da eficácia, conforme doutrina majoritaria. Diferenciação entre vícios congenitos e fatos supervenientes que levam a retirada de efeitos.","pont":"0,50","disp":[]},{"trib":"TJ-PE","ano":2024,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-2025-espelho-de-correcao-provas-discursivas-publicacao.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-prova-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/gabarito_definitivo_tjpe.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpe24","nota":"","cargo":"Juiz Substituto","disc":"Civil","tema":"Saisine e frutos","rot":"Q01 item 2","exig":"Por forca da saisine, a herdeira adquiriu o bem tao logo faleceu o autor da herança. Citacao do Art. 1.784 do Código Civil. Quanto aos frutos, aplica-se o art. 1.923, par. 2o, do mesmo código.","pont":"0,50","disp":["CC art. 1.784","CC art. 1.923, par. 2o"]},{"trib":"TJ-PE","ano":2024,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-2025-espelho-de-correcao-provas-discursivas-publicacao.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-prova-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/gabarito_definitivo_tjpe.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpe24","nota":"","cargo":"Juiz Substituto","disc":"Civil","tema":"Posse de boa-fé e frutos percebidos","rot":"Q01 item 3","exig":"Reconhecimento de que sua posse era de boa-fé, porque não contaminada por vício algum, de modo que faz jus aos frutos percebidos enquanto durou. Citacao do Art. 1.214, caput, do Código Civil.","pont":"0,50","disp":["CC art. 1.214"]},{"trib":"TJ-PE","ano":2024,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-2025-espelho-de-correcao-provas-discursivas-publicacao.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-prova-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/gabarito_definitivo_tjpe.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpe24","nota":"","cargo":"Juiz Substituto","disc":"Civil","tema":"Pagamento a credor putativo e locação","rot":"Q01 item 4","exig":"Admissão da forca liberatória dos pagamentos feitos pela pessoa jurídica a credor putativo, seja porque realmente fazia jus aos frutos, seja porque só depois cessou sua condição de herdeira (Art. 309 do CC); a luz do art. 10 da Lei 8.245/91, a locação se transmitiu, sendo indiferente a qualidade de proprietária ou legitima possuidora, desde que assegurada a permanencia do inquilino no imóvel.","pont":"0,50","disp":["CC art. 309","Lei 8.245/1991 art. 10"]},{"trib":"TJ-PE","ano":2024,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-2025-espelho-de-correcao-provas-discursivas-publicacao.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-prova-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/gabarito_definitivo_tjpe.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpe24","nota":"","cargo":"Juiz Substituto","disc":"Penal","tema":"Princípio da legalidade no sistema disciplinar da LEP","rot":"Q02 a","exig":"Analise qualificada do Art. 45, caput, da Lei de Execução Penal (anterioridade e taxatividade na definicao das hipóteses de faltas e sanções). Há reserva legal somente para faltas graves (Art. 49, LEP).","pont":"0,75","disp":["LEP art. 45","LEP art. 49"]},{"trib":"TJ-PE","ano":2024,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-2025-espelho-de-correcao-provas-discursivas-publicacao.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-prova-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/gabarito_definitivo_tjpe.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpe24","nota":"","cargo":"Juiz Substituto","disc":"Penal","tema":"Princípio da humanidade no sistema disciplinar","rot":"Q02 b1","exig":"Analise qualificada do Art. 45, par. 1o e 2o, da LEP, com vedacao a sanções que coloquem em perigo a integridade fisica e moral do condenado e ao emprego de celas escuras, e do princípio constitucional de vedacao as penas cruéis e a tratamento desumano ou degradante (Art. 5o, III e XLVII, e, CF).","pont":"0,50","disp":["LEP art. 45, par. 1o e 2o","CF art. 5o, III e XLVII, e"]},{"trib":"TJ-PE","ano":2024,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-2025-espelho-de-correcao-provas-discursivas-publicacao.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-prova-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/gabarito_definitivo_tjpe.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpe24","nota":"","cargo":"Juiz Substituto","disc":"Penal","tema":"Limites do isolamento disciplinar","rot":"Q02 b2","exig":"Restricoes legais a sanção de isolamento disciplinar: máximo de dez dias se isolamento preventivo, garantida a detração (Art. 60, LEP), ou de trinta dias, salvo na hipótese de Regime Disciplinar Diferenciado, e obrigação de comunicação ao juiz da execução (Art. 58, LEP).","pont":"0,25","disp":["LEP art. 58","LEP art. 60"]},{"trib":"TJ-PE","ano":2024,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-2025-espelho-de-correcao-provas-discursivas-publicacao.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-prova-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/gabarito_definitivo_tjpe.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpe24","nota":"","cargo":"Juiz Substituto","disc":"Penal","tema":"Banho de sol em isolamento disciplinar","rot":"Q02 c","exig":"Sim, também pessoas presas em sanção de isolamento disciplinar tem direito a ao menos 2 horas diarias de pátio e 'banho de sol', conforme Art. 40 e Art. 41, V, da LEP e decisão do STF em interpretação do Art. 52, IV, da LEP (STF, HC 172.136/SP, 2a T., j. 10.10.2020).","pont":"0,50","disp":["LEP art. 40","LEP art. 41, V","LEP art. 52, IV"]},{"trib":"TJ-PE","ano":2024,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-2025-espelho-de-correcao-provas-discursivas-publicacao.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-prova-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/gabarito_definitivo_tjpe.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpe24","nota":"","cargo":"Juiz Substituto","disc":"Administrativo","tema":"Responsabilidade civil do Estado por atos lícitos","rot":"Q03 a1","exig":"O Art. 37, par. 6o, da CF dispoe sobre a responsabilidade civil objetiva do Estado, acompanhado pelo Art. 43 do CC; o dever de indenizar emerge do nexo causal entre fato administrativo e dano, não sendo o ato ilícito elemento indispensável; a responsabilizacao pode advir de atos lícitos e legitimos quando ato estribado na lei e em prol da coletividade causa danos a parcela específica da sociedade (distribuição igualitaria dos ônus e encargos, p. ex. obra pública com dano anormal e especial); conforme doutrina e jurisprudência do STF, diante da teoria do risco administrativo, o alcance da responsabilidade estatal supera as regras comuns de responsabilidade civil do particular.","pont":"1,00","disp":["CF art. 37, par. 6o","CC art. 43"]},{"trib":"TJ-PE","ano":2024,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-2025-espelho-de-correcao-provas-discursivas-publicacao.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-prova-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/gabarito_definitivo_tjpe.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpe24","nota":"","cargo":"Juiz Substituto","disc":"Consumidor","tema":"CDC e concessionária de rodovia - animais na pista","rot":"Q03 b1","exig":"Sim, aplicam-se as regras do CDC aos casos de reparação de danos oriundos de acidentes causados pelo ingresso de animais domésticos nas faixas de rolamento das rodovias objeto de contrato de concessão.","pont":"0,25","disp":[]},{"trib":"TJ-PE","ano":2024,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-2025-espelho-de-correcao-provas-discursivas-publicacao.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjpe-prova-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/gabarito_definitivo_tjpe.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpe24","nota":"","cargo":"Juiz Substituto","disc":"Consumidor","t a nas demandas coletivas.","pont":"0,4","disp":[]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelhos_prova_discursiva_-_completo.pdf","prova":"","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"A pagina publica o Espelho de Correcao da Prova Escrita Discursiva (P2), mas nao disponibiliza o caderno da prova discursiva em si.","cargo":"Juiz Substituto","disc":"Penal","tema":"Crime de perseguição (stalking) - art. 147-A do CP","rot":"Q. Dissertativa 02","exig":"Questão dissertativa de Direito Penal sobre o crime de perseguição (stalking), inserido no Código Penal (art. 147-A) pela Lei 14.132/2021, com referência doutrinária a Rogerio Greco (Código Penal comentado, 15. ed., 2022): caracterizacao como espécie de terrorismo psicológico e as diversas formas de prática das condutas.","pont":"valor total 2,00","disp":["CP art. 147-A","Lei 14.132/2021"]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelhos_prova_discursiva_-_completo.pdf","prova":"","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"A pagina publica o Espelho de Correcao da Prova Escrita Discursiva (P2), mas nao disponibiliza o caderno da prova discursiva em si.","cargo":"Juiz Substituto","disc":"Civil","tema":"Cláusula penal compensatoria e moratória","rot":"Q. Civil - cláusula penal","exig":"Definicao: obrigação acessória que comina valor a ser pago ao credor pelo devedor que incorrer em inadimplemento definitivo/absoluto do contrato, podendo o candidato referir também a cláusula penal por descumprimento de cláusula especial, sem obrigatoriedade (peso 0,25); Funções: a função primordial e a preliquidação de perdas e danos, aceitando-se adicionalmente a teoria da dupla função punitiva é de preliquidação (peso 0,25); Distinção: a cláusula penal moratória incide na hipótese de incumprimento do tempo ou modo pactuados (mora), sem caracterizar inadimplemento definitivo (peso 0,25); Indenização suplementar: incorrendo o devedor em inadimplemento, não faz jus o credor a indenização suplementar, salvo se pactuada, conforme o paragrafo unico do art. 416 do CC (peso 0,25).","pont":"1,0 (4 x 0,25)","disp":["CC art. 416, p.u."]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelhos_prova_discursiva_-_completo.pdf","prova":"","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"A pagina publica o Espelho de Correcao da Prova Escrita Discursiva (P2), mas nao disponibiliza o caderno da prova discursiva em si.","cargo":"Juiz Substituto","disc":"Constitucional","tema":"Controle de constitucionalidade de ato normativo secundario","rot":"Q. Discursiva 02 - Constitucional","exig":"O ato normativo secundario, como o decreto regulamentar (ex. art. 84, IV, CF), não se submete ao controle abstrato de constitucionalidade, pois, destinado apenas a execução da lei que regulamenta, dela extraindo seu fundamento de validade e sem inovar a ordem jurídica, eventual violacao aos limites nela estabelecidos produz ofensa meramente reflexa e obliqua ao texto constitucional, incorrendo em crise de legalidade.","pont":"não discriminada","disp":["CF art. 84, IV"]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelhos_prova_discursiva_-_completo.pdf","prova":"","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"A pagina publica o Espelho de Correcao da Prova Escrita Discursiva (P2), mas nao disponibiliza o caderno da prova discursiva em si.","cargo":"Juiz Substituto","disc":"Filosofia do Direito","tema":"Conceito de justiça em John Rawls","rot":"Q. Filosofia - Rawls (item 1)","exig":"Para o autor, justiça deve ser vista como conceito político e não apenas com base moral ou encampacao pelo Estado; deve servir para a interpretação dos princípios constitucionais escolhidos por uma sociedade padrao e ambientada historicamente; deve ser valor político que vem a tona da vontade social, visando igualdade e liberdade entre as pessoas; e também distribuição de bens primarios oriundos de critérios jurídicos e políticos.","pont":"0,25","disp":[]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelhos_prova_discursiva_-_completo.pdf","prova":"","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"A pagina publica o Espelho de Correcao da Prova Escrita Discursiva (P2), mas nao disponibiliza o caderno da prova discursiva em si.","cargo":"Juiz Substituto","disc":"Filosofia do Direito","tema":"Posição original e veu da ignorância","rot":"Q. Filosofia - Rawls (item 2)","exig":"Para se chegar ao acordo, e preciso que as pessoas sejam oriundas da posição original ('veu da ignorância') mediante liberdade e igualdade, e que o discurso racional seja a base da construcao normativa; essa posição original não deve se ater a intuicao ou sentimentos próprios, mas a deliberacoes coletivas para a construcao inicial do contrato social.","pont":"0,25","disp":[]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelhos_prova_discursiva_-_completo.pdf","prova":"","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"A pagina publica o Espelho de Correcao da Prova Escrita Discursiva (P2), mas nao disponibiliza o caderno da prova discursiva em si.","cargo":"Juiz Substituto","disc":"Filosofia do Direito","tema":"Os dois princípios de justiça","rot":"Q. Filosofia - Rawls (item 3)","exig":"Dois princípios são essenciais para a formacao do acordo: (c1) princípio da liberdade igual ou básica (buscando igualdade substancial pela maior extensão de direitos alcancaveis pelo cidadao) e (c2) princípio da diferenca (exigencia de igualdade material, com benefício e acesso a todos). Equidade e procedimento são essenciais para o alcance da justiça.","pont":"0,50 (0,25 para cada um dos princípios)","disp":[]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_civel.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_civel.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Processo Civil","tema":"Preliminar de ilegitimidade passiva - teoria da asserção","rot":"Aspecto 1","exig":"Rejeitar a preliminar de ilegitimidade passiva, pois, pela Teoria da Asserção e a versao fatica da inicial, o autor foi atingido por composicao férrea da re, concessionária de transporte ferroviário; emerge sua legitimidade, levando em conta o vinculo com o Poder Público e o disposto na CF (arts. 21, XII, 'd', 37, par. 6o e 175), na Lei 8.987/1995 (art. 25) e no Código Civil (art. 43), sendo questão de mérito a alegada responsabilidade municipal de manutencao da via férrea.","pont":"0,00 a 0,50","disp":["CF art. 21, XII, d","CF art. 37, par. 6o","CF art. 175","Lei 8.987/1995 art. 25","CC art. 43"]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_civel.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_civel.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Civil","tema":"Prescrição quinquenal e impedimento do art. 198, I, do CC","rot":"Aspecto 2","exig":"2.1 Não acolher a prejudicial de prescrição trienal, pois o prazo aplicável e o quinquenal do art. 1o-C da Lei 9.494/1997, que por especialidade se sobrepoe ao art. 206, par. 3o, V, do CC; 2.2 como o evento ocorreu quando o autor tinha 15 anos, o prazo só passou a fluir quando completou 16 anos (art. 198, I, do CC), de modo que a pretensão não esta prescrita, tendo a ação sido proposta antes do decurso de 5 anos.","pont":"0,00 a 1,00","disp":["Lei 9.494/1997 art. 1o-C","CC art. 206, par. 3o, V","CC art. 198, I"]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_civel.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_civel.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Civil","tema":"Responsabilidade subjetiva da concessionária por atropelamento em via férrea","rot":"Aspecto 3","exig":"3.1 Estabelecer o regime jurídico aplicável, mencionando que, apesar da falta de uniformidade doutrinária sobre a responsabilidade por atos omissivos, o STJ consolidou em recursos repetitivos de 2012 a responsabilizacao subjetiva da concessionária (0,00 a 0,40); 3.2 a culpa configura-se quando há omissão ou negligência no dever de vedacao fisica das faixas de domínio com muros e cercas, sinalizacao e fiscalização, sendo elidível por culpa exclusiva da vítima (Tema 517, REsp 1.210.064/SP) ou mitigada por concorrencia de culpas (Tema 518, REsp 1.172.421/SP) (0,00 a 0,30); 3.3 concluir pela comprovacao do fato administrativo, do dano, do nexo causal e da culpa da re, afastando culpa exclusiva ou concorrente do autor, em razao das circunstâncias (area urbana, ausência de barreira fisica e sinalizacao, falta de manutencao, vegetacao, ausência de sinal sonoro), com fundamento no art. 927 e no art. 944 do CC (0,00 a 1,30).","pont":"0,00 a 2,00 (0,40 + 0,30 + 1,30)","disp":["CC art. 927","CC art. 944","CC art. 945","REsp 1.210.064/SP - Tema 517","REsp 1.172.421/SP - Tema 518"]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_civel.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_civel.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Civil","tema":"Danos materiais emergentes - prótese","rot":"Aspecto 4","exig":"Condenar ao ressarcimento de R$ 6.888,00 pelo custo da prótese, comprovado por recibo não impugnado especificamente, com correção monetária a contar do desembolso e juros de mora de 1% ao mes a partir da mesma data (arts. 395 e 398 do CC e Súmula 43 do STJ), e não do acidente nem da citacao/sentença (arts. 405 e 407 do CC), por se tratar de verba líquida e responsabilidade extracontratual.","pont":"0,00 a 0,40","disp":["CC art. 395","CC art. 398","CC art. 405","CC art. 407","Sumula 43 do STJ"]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_civel.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_civel.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Civil","tema":"Danos estéticos e morais - cumulacao, arbitramento e encargos","rot":"Aspecto 5","exig":"5.1 Reconhecer a cumulabilidade dos danos estético e moral, na forma da Súmula 387 do STJ (0,00 a 0,20); 5.2 demonstrar, pelas provas, a cirurgia, os 20 dias de hospitalizacao, a ausência de assistencia da re e a convivencia definitiva com a deformidade fisica (0,00 a 0,30); 5.3 arbitrar com moderacao e razoabilidade, pelo metodo bifasico do STJ, considerando gravidade e repercussão, posição social do ofendido, situação econômica do ofensor e natureza punitivo-pedagogica, sem enriquecimento sem causa (0,00 a 0,30); 5.4 afastar a alegacao de excessiva delonga na propositura da demanda, cerca de 2 anos após a maioridade (0,00 a 0,10); 5.5 fixar as indenizações sem exceder os valores postulados (até R$ 50.000,00 cada), com correção a contar do arbitramento (Súmula 362 do STJ) e juros de 1% ao mes a partir do acidente (Súmula 54 do STJ), e não da citacao (art. 405 do CC), por se tratar de ilícito puro (0,00 a 0,30).","pont":"0,00 a 1,20 (0,20 + 0,30 + 0,30 + 0,10 + 0,30)","disp":["Sumula 387 do STJ","Sumula 362 do STJ","Sumula 54 do STJ","CC art. 405"]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_civel.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_civel.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Civil","tema":"Pensão mensal vitalícia e capital garantidor","rot":"Aspecto 6","exig":"6.1 Deferir pensão mensal com base no art. 950 do CC, ante a redução parcial e permanente da capacidade laborativa, sendo vitalícia por decorrer de diminuição da capacidade e cumulável com benefício do INSS por naturezas distintas (0,00 a 0,50); 6.2 fixar o termo inicial na maioridade civil, como requerido (art. 492 do CPC), sem 13o salário e gratificacao de ferias, pois o autor não trabalhava a epoca (0,00 a 0,10); 6.3 quanto as prestações vencidas, deferir pagamento de uma só vez, com juros a partir do vencimento de cada prestação e correção pelo salário mínimo vigente em cada vencimento (art. 397 do CC) (0,00 a 0,20); 6.4 rejeitar a pensão de um salário mínimo integral, devendo o percentual de perda funcional ser apurado em liquidação por arbitramento (arts. 509 e 491 do CPC) (0,00 a 0,20); 6.5 rejeitar a dispensa de capital garantidor (Súmula 313 do STJ), mas acolher o pedido subsidiario de inclusão do autor em folha de pagamento da re (art. 533, par. 2o, do CPC) (0,00 a 0,20).","pont":"0,00 a 1,20 (0,50 + 0,10 + 0,20 + 0,20 + 0,20)","disp":["CC art. 950","CC art. 397","CPC art. 492","CPC art. 491","CPC art. 509","CPC art. 533, par. 2o","Sumula 313 do STJ"]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_civel.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_civel.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Civil","tema":"Lucros cessantes","rot":"Aspecto 7","exig":"Julgar indevidos os lucros cessantes, pois a compensação pela redução da capacidade laborativa decorre do pensionamento vitalício, o autor não trabalhava a epoca do acidente e os lucros cessantes não se confundem com ganho imaginario e hipotetico, tratando-se de juízo de probabilidade objetiva e não de mera possibilidade.","pont":"0,00 a 0,40","disp":[]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_civel.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_civel.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Sentença (estrutura)","tema":"Dispositivo, sucumbência e honorários","rot":"Aspecto 8","exig":"8.1 Dispositivo com rejeicao da preliminar e da prejudicial e parcial procedencia (art. 487, I, do CPC), condenando ao pagamento de danos emergentes, estéticos e morais e pensão mensal vitalícia com os respectivos encargos e forma de pagamento (0,00 a 1,50); 8.2 distribuição proporcional dos ônus de sucumbência (art. 86, caput, do CPC), pois o decaimento do autor não foi mínimo, ressalvada a Súmula 326 do STJ (0,00 a 0,30); 8.3 condenação das partes - o autor entre 10% e 30% e a re no percentual restante - com honorários sobre a condenação (art. 85, par. 2o, do CPC) (0,00 a 0,70); 8.4 inclusão, na base de calculo, quanto a pensão, da soma das prestações vencidas acrescida de 12 prestações vincendas (art. 85, par. 9o, do CPC) (0,00 a 0,50); 8.5 suspensão da exigibilidade das verbas de sucumbência do autor beneficiário da gratuidade (art. 98, par. 2o e 3o, do CPC) (0,00 a 0,15).","pont":"0,00 a 3,15 (1,50 + 0,30 + 0,70 + 0,50 + 0,15)","disp":["CPC art. 487, I","CPC art. 86","CPC art. 85, par. 2o e par. 9o","CPC art. 98, par. 2o e 3o","Sumula 326 do STJ"]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_civel.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_civel.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Sentença (estrutura)","tema":"Estrutura e ordem de enfrentamento","rot":"Aspecto 9","exig":"Avaliacao de coerência/coesão na analise das questões, iniciando com a preliminar de ilegitimidade passiva, seguida da prejudicial de prescrição, para posterior enfrentamento do mérito.","pont":"0,00 a 0,15","disp":[]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_civel.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_civel.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Sentença (estrutura)","tema":"Língua portuguesa e capacidade de exposição","rot":"Aspecto 10","exig":"Conforme o edital: conteudo e desenvolvimento pertinentes ao tema, capacidade de exposição e utilização correta da Língua Portuguesa, podendo ser descontado até no máximo 10% do valor total da nota no topico de Língua Portuguesa.","pont":"desconto de até 10% do valor total da nota","disp":[]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_penal.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_criminal.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Processo Penal","tema":"Extincao da punibilidade pela morte","rot":"I - Fundamentação / Falecimento de corréus","exig":"Em decorrencia do noticiado e comprovado falecimento dos corréus nas alegacoes finais, declarar no dispositivo extinta a sua punibilidade, com fundamento no art. 107, I, do CP c/c art. 397, IV, do CPP. Admissível, se devidamente motivado, o desmembramento do feito e conversao do julgamento para os fins do art. 62 do CPP.","pont":"não discriminada (integra o bloco I - Fundamentação: 4,5)","disp":["CP art. 107, I","CPP art. 397, IV","CPP art. 62"]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_penal.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_criminal.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Processo Penal","tema":"Preclusão e matéria de ordem pública","rot":"I - Inépcia da denúncia I","exig":"A denúncia já foi recebida anteriormente. Respostas admissíveis: (I) preclusão temporal - art. 396-A do CPP - cabia a defesa suscitar a tese na primeira oportunidade; (II) ou invocar a natureza de ordem pública da questão e aprecia-la para refuta-la, demonstrando o atendimento dos requisitos do art. 41 do CPP.","pont":"não discriminada (integra o bloco I - Fundamentação: 4,5)","disp":["CPP art. 396-A","CPP art. 41"]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_penal.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_criminal.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Processo Penal","tema":"Verbo-nucleo do tipo","rot":"I - Inépcia da denúncia II","exig":"Refutar a tese, apontando o verbo-nucleo do tipo imputado no Fato 1 ('dispensaram a realização da licitação, possibilitando e dando causa a contratação direta...').","pont":"não discriminada (integra o bloco I - Fundamentação: 4,5)","disp":[]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_penal.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_criminal.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Penal","tema":"Art. 89 da Lei 8.666/93 - materialidade, autoria e tipicidade","rot":"I - Dispensa ilegal de licitação","exig":"Reconhecer a dispensa de licitação fora das hipóteses legais (art. 24 da Lei 8.666/93) possibilitando a contratação direta, com dano ao erário de R$ 2.000.000,00; materialidade comprovada pelos anexos do Contrato de Gestao e pelas propostas de cobertura de fachada; autoria comprovada pela confissão dos corréus corroborada por prova documental; tipicidade com os elementos do art. 89 da Lei 8.666/93 - sucedido pelo art. 337-E do CP - além do dolo e do prejuízo ao erário.","pont":"não discriminada (integra o bloco I - Fundamentação: 4,5)","disp":["Lei 8.666/1993 art. 89","Lei 8.666/1993 art. 24","CP art. 337-E"]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_penal.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_criminal.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Penal","tema":"Continuidade normativo-tipica e irretroatividade","rot":"I - Sucessão de leis penais / lex tertia","exig":"Apreciar o pedido do MP de condenação pelo preceito primario do art. 337-E do CP com o preceito secundario do art. 89 da Lei 8.666/93 sob as premissas: (a) cotejo dos preceitos primario e secundario; (b) não houve abolitio criminis, pois o novo tipo e mais extenso; (c) há continuidade normativo-tipica; (d) subsiste a tipicidade; (e) e inviavel a cominacao da pena da lei nova, mais severa qualitativa e quantitativamente, sob pena de violacao do art. 5o, XL, da CF; (f) o STF veda a combinacao de leis no tempo (lex tertia); (g) portanto, condenação pelo art. 89 da Lei 8.666/93 (preceito primario e secundario).","pont":"não discriminada (integra o bloco I - Fundamentação: 4,5)","disp":["CF art. 5o, XL","Lei 8.666/1993 art. 89","CP art. 337-E"]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_penal.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_criminal.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Penal","tema":"Art. 1o da Lei 9.613/98 e causa de aumento do par. 4o","rot":"I - Lavagem de bens e valores","exig":"Apontar o modo como o réu dissimulou/ocultou a origem do numerario obtido no crime anterior, simulando contrato de prestação de servicos entre empresas com pagamento mensal creditado na conta de 'laranja'; materialidade evidenciada pelo contrato e extratos bancarios e corroborada pela confissão; autoria demonstrada pela confissão e pelo benefício do sobrepreco do crime antecedente; caracterizada a causa de aumento do par. 4o do art. 1o da Lei 9.613/98 pela reiteração entre julho de 2013 e julho de 2019.","pont":"não discriminada (integra o bloco I - Fundamentação: 4,5)","disp":["Lei 9.613/1998 art. 1o, caput e par. 4o"]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_penal.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_criminal.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Penal","tema":"Concurso material","rot":"I - Concurso de crimes","exig":"Os crimes narrados no Fato 1 e no Fato 2 foram cometidos em concurso material (art. 69 do CP).","pont":"não discriminada (integra o bloco I - Fundamentação: 4,5)","disp":["CP art. 69"]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_penal.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_criminal.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Sentença (estrutura)","tema":"Dispositivo da sentença penal","rot":"II - Dispositivo","exig":"Julgar: 1) extinta a punibilidade dos réus falecidos (art. 107, I, do CP c/c art. 397, IV, do CPP); 2) procedente a pretensão punitiva para condenar o réu Spider, em concurso material (art. 69 do CP), como incurso no art. 89 da Lei 8.666/93 e no art. 1o da Lei 9.613/98, e os réus Estelio e Onato como incursos no art. 89 da Lei 8.666/93.","pont":"1,0 (bloco II)","disp":["CP art. 107, I","CP art. 69","Lei 8.666/1993 art. 89","Lei 9.613/1998 art. 1o"]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_penal.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_criminal.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Penal","tema":"Sistema trifásico, multa, regime, substituição e sursis","rot":"III - Dosimetria","exig":"Empregar o sistema trifásico (art. 68 do CP) somente em relação a um dos acusados para ambos os fatos, sem esquecer de fixar a multa (quantidade e valor unitário justificado) e o regime inicial após a unificacao das penas pelo concurso material. Na 1a fase (art. 59 do CP), ponderar a culpabilidade pelo grau de reprovabilidade (esquema complexo para burlar o certame e motivo de proveito econômico indevido); inviavel a ponderacao desfavorável dos antecedentes, pois a condenação anterior não depurada deve ser ponderada como reincidência na 2a fase; desfavoráveis as consequências pelo prejuízo ao erário; personalidade e conduta social sem informações; comportamento da vítima neutro.","pont":"3,3 (bloco III)","disp":["CP art. 68","CP art. 59","CP art. 61, I"]},{"trib":"TJ-PR","ano":2021,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho_sentenca_penal.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/prova_juiz_substituto_revisada_prova_pratica_sentenca_criminal.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/28_-_edital_no_028_2021_-_gabarito_oficial_1-assinado.pdf","conc":"https://conhecimento.fgv.br/concursos/tjpr2021","nota":"","cargo":"Juiz Substituto","disc":"Processo Penal","tema":"Efeitos da condenação e providências finais","rot":"IV - Reparação de danos, perdimento e providências finais","exig":"Fundamentar a presença/ausência dos requisitos para fixar (ou indeferir) o valor da reparação dos danos materiais (R$ 2.000.000,00 cobrada a maior do Município) e dos danos morais coletivos; decretar o perdimento de bens e valores (art. 91, II, 'b', do CP e art. 7o, I, da Lei 9.613/98), aduzindo a (in)ocorrencia do previo contraditorio e indicando o valor da perda da diferenca apurada (art. 91, par. 4o, do CP), sem incidir em bis in idem na cumulacao pelos fatos 1 e 2; providências finais após o transito em julgado: (a) custas processuais; (b) inclusão no rol dos culpados; (c) expedicao de guia de execução; (d) comunicações ao TRE e ao Instituto de Identificação; (e) registro de antecedentes criminais; além de publicação (art. 389 do CPP), registro e intimacoes (arts. 390 e 391 do CPP) e autenticacao (art. 381, IV, do CPP) com data e mencao a assinatura do Juiz.","pont":"1,2 (bloco IV)","disp":["CP art. 91, II, b","CP art. 91, par. 4o","Lei 9.613/1998 art. 7o, I","CPP art. 389","CPP art. 390","CPP art. 391","CPP art. 381, IV"]},{"trib":"TJ-SE","ano":2024,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-espelho-prova-discursiva.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-prova-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/tj-se-gabaritos-definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/tjse24","nota":"","cargo":"Juiz Substituto","disc":"Penal","tema":"Injúria","rot":"Q01 item 1","exig":"Imputar a Alberto o crime de injúria (Código Penal, Art. 140), por ter chamado Caio de 'ladrao'.","pont":"itens da questão somam 6,0; nota final 2","disp":["CP art. 140"]},{"trib":"TJ-SE","ano":2024,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-espelho-prova-discursiva.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-prova-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/tj-se-gabaritos-definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/tjse24","nota":"","cargo":"Juiz Substituto","disc":"Penal","tema":"Divulgacao de segredo","rot":"Q01 item 2","exig":"Esclarecer que Bernardo não cometeu crime de divulgacao de segredo (Código Penal, Art. 153).","pont":"itens da questão somam 6,0; nota final 2","disp":["CP art. 153"]},{"t r. 5o do Art. 46 da Lei [14.133/2021]; IV - por ocorrencia de evento superveniente alocado na matriz de riscos como de responsabilidade da [Administração]; e concluir que, de acordo com o STJ, em se tratando de intervencao, o direito de defesa do concessionário lhe e [assegurado posteriormente]. Bibliografia de referência: STF, ADPF 282/RO, Rel. Min. Gilmar Mendes, j. 15/05/2023.","pont":"0,20 (item destacado); itens da questão somam 6,0; nota final 2","disp":["Lei 14.133/2021 art. 46, par. 5o","Lei 14.133/2021 art. 124","ADPF 282/RO"]},{"trib":"TJ-SE","ano":2024,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-espelho-prova-discursiva.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-prova-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/tj-se-gabaritos-definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/tjse24","nota":"","cargo":"Juiz Substituto","disc":"Constitucional","tema":"Direito fundamental de segunda dimensão","rot":"Q03 item 1","exig":"O direito fundamental consagrado no Art. X da Constituição da República, por ser de segunda dimensão, se [caracteriza como direito prestacional dependente de integração].","pont":"escala com 0,00 como piso; nota final 2","disp":[]},{"trib":"TJ-SE","ano":2024,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-espelho-prova-discursiva.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-prova-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/tj-se-gabaritos-definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/tjse24","nota":"","cargo":"Juiz Substituto","disc":"Constitucional","tema":"Ausência de integração infraconstitucional","rot":"Q03 item 2","exig":"Em razao da ausência de integração pela legislação infraconstitucion ","exig":"Língua portuguesa: desconto de até 10% do valor total da prova.","pont":"-1,00","disp":[]},{"trib":"TJ-SE","ano":2024,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível e sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-tjse-juiz-sentencas.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-prova-de-sentenca-civel.pdf","prova2":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-sentenca-criminal.pdf","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/tj-se-gabaritos-definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/tjse24","nota":"Espelho cobre as duas sentencas; prova de sentenca criminal em https://conhecimento.fgv.br/sites/default/files/concursos/tjse-sentenca-criminal.pdf","cargo":"Juiz Substituto","disc":"Processo Penal","tema":"Decadência do direito de representação no CTB","rot":"Criminal 1","exig":"Rejeitar a preliminar de mérito de decadência do direito de representação quanto aos crimes de lesão corporal culposa na direcao de veículo automotor, pois, nos termos do Art. 291, par. 1o, I, do CTB, não se aplica o Art. 88 da Lei 9.099/95 se o agente estiver sob a influencia de álcool; explicar que, ainda que assim não fosse, a representação não exige formalidade, bastando que a conduta da vítima indique seu interesse na persecução penal, o que ocorreu, pois as vítimas compareceram em sede policial e prestaram declarações no auto de prisão em flagrante.","pont":"1,50","disp":["CTB art. 291, par. 1o, I","Lei 9.099/1995 art. 88"]},{"trib":"TJ-SE","ano":2024,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível e sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-tjse-juiz-sentencas.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-prova-de-sentenca-civel.pdf","prova2":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-sentenca-criminal.pdf","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/tj-se-gabaritos-definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/tjse24","nota":"Espelho cobre as duas sentencas; prova de sentenca criminal em https://conhecimento.fgv.br/sites/default/files/concursos/tjse-sentenca-criminal.pdf","cargo":"Juiz Substituto","disc":"Penal","tema":"Art. 306 do CTB - materialidade e meios de prova","rot":"Criminal 2","exig":"Destacar que a materialidade do crime do Art. 306 do CTB restou demonstrada pelo exame pericial de alcoolemia, interrogatorio e prova testemunhal; rejeitar a alegacao defensiva de ausência de prova da alteracao da capacidade psicomotora por não ter sido positivada concentracao igual ou superior a 0,3 mg/l por etilometro, pois o par. 2o do citado artigo admite teste de alcoolemia ou toxicologico, exame clinico, perícia, video, prova testemunhal ou outros meios de prova, observado o direito a contraprova; explicar que a autoria e inequivoca.","pont":"1,50","disp":["CTB art. 306, par. 2o"]},{"trib":"TJ-SE","ano":2024,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível e sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-tjse-juiz-sentencas.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-prova-de-sentenca-civel.pdf","prova2":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-sentenca-criminal.pdf","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/tj-se-gabaritos-definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/tjse24","nota":"Espelho cobre as duas sentencas; prova de sentenca criminal em https://conhecimento.fgv.br/sites/default/files/concursos/tjse-sentenca-criminal.pdf","cargo":"Juiz Substituto","disc":"Penal","tema":"Concurso entre os arts. 306 e 303 do CTB","rot":"Criminal 3","exig":"Rejeitar a alegacao defensiva de absolvição pelo crime do Art. 306 do CTB ao argumento de absorcao pelos delitos de lesão corporal culposa, já que são crimes distintos, com sujeitos passivos e objetividade jurídica diferentes: o Art. 306 tem natureza vaga, ofendendo potencialmente a coletividade e tutelando a segurança viaria, ao passo que o Art. 303 tem como vítima a pessoa lesionada; ademais, aquele delito se consumou em momento anterior.","pont":"0,50","disp":["CTB art. 303","CTB art. 306"]},{"trib":"TJ-SE","ano":2024,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível e sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-tjse-juiz-sentencas.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-prova-de-sentenca-civel.pdf","prova2":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-sentenca-criminal.pdf","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/tj-se-gabaritos-definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/tjse24","nota":"Espelho cobre as duas sentencas; prova de sentenca criminal em https://conhecimento.fgv.br/sites/default/files/concursos/tjse-sentenca-criminal.pdf","cargo":"Juiz Substituto","disc":"Penal","tema":"Lesão corporal culposa na direcao - culpa e imprudência","rot":"Criminal 4","exig":"Explicar que a materialidade dos crimes do Art. 303 do CTB exsurge dos autos de exame de corpo de delito e que a autoria e incontroversa; rejeitar a alegacao de culpa exclusiva do condutor da motocicleta, pois as vítimas contaram que o semáforo estava amarelo, na iminencia de mudar para vermelho, o que levou o piloto a reduzir a velocidade; o réu admite que o sinal já estava amarelo, sendo previsivel a redução do veículo a frente, e estava com a capacidade psicomotora alterada, o que retarda os reflexos, restando caracterizada a imprudência; deve o acusado ser condenado por dois crimes de lesão corporal culposa na direcao de veículo automotor.","pont":"1,50","disp":["CTB art. 303"]},{"trib":"TJ-SE","ano":2024,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível e sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-tjse-juiz-sentencas.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-prova-de-sentenca-civel.pdf","prova2":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-sentenca-criminal.pdf","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/tj-se-gabaritos-definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/tjse24","nota":"Espelho cobre as duas sentencas; prova de sentenca criminal em https://conhecimento.fgv.br/sites/default/files/concursos/tjse-sentenca-criminal.pdf","cargo":"Juiz Substituto","disc":"Penal","tema":"Concurso formal e concurso material","rot":"Criminal 5","exig":"Explicar que os crimes de lesão corporal culposa foram cometidos mediante uma só conduta, de modo que, ao contrário do assinalado na denúncia, restou caracterizado entre eles o concurso formal, com aplicação da pena de somente um deles e majoração mínima (um sexto), proporcional a quantidade de delitos (dois); acrescentar que esses crimes e o do Art. 306 do CTB foram cometidos mediante condutas diferentes, com momentos consumativos diversos, razao pela qual é necessário reconhecer o concurso material, com a soma das penas.","pont":"1,00","disp":["CP art. 69","CP art. 70"]},{"trib":"TJ-SE","ano":2024,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível e sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-tjse-juiz-sentencas.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-prova-de-sentenca-civel.pdf","prova2":"https://conhecimento.fgv.br/sites/default/files/concursos/tjse-sentenca-criminal.pdf","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/tj-se-gabaritos-definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/tjse24","nota":"Espelho cobre as duas sentencas; prova de sentenca criminal em https://conhecimento.fgv.br/sites/default/files/concursos/tjse-sentenca-criminal.pdf","cargo":"Juiz Substituto","disc":"Penal","tema":"Dosimetria trifasica","rot":"Criminal 6","exig":"Efetuar a dosimetria seguindo o sistema trifásico. Quanto ao Art. 303 do CTB, primeira fase: fixar as penas-base em sete meses de detenção e dois meses e dez dias de suspensão da habilitação [seguindo-se as demais fases].","pont":"não discriminada no extrato analisado","disp":["CP art. 68","CTB art. 303"]},{"trib":"TRF1","ano":2023,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-de-correcao-prova-discursiva_165145f.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-escrita-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/trf12023_gabarito_definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/trf1","nota":"","cargo":"Juiz Federal Substituto","disc":"Outros","tema":"Ação regressiva acidentária do INSS","rot":"Q01 item 1","exig":"Sim; o art. 120 da Lei 8.213/91 estabelece que a Previdência Social ajuizara ação regressiva contra os responsáveis no caso de negligência quanto as normas padrao de segurança e higiene do trabalho indicadas para a proteção individual e coletiva. Não se aplica o art. 104 da referida Lei, pois esse preceito incide apenas nas ações referentes a prestação por acidente do trabalho.","pont":"não discriminada","disp":["Lei 8.213/1991 art. 120","Lei 8.213/1991 art. 104"]},{"trib":"TRF1","ano":2023,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-de-correcao-prova-discursiva_165145f.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-escrita-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/trf12023_gabarito_definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/trf1","nota":"","cargo":"Juiz Federal Substituto","disc":"Administrativo","tema":"Prescrição quinquenal da ação regressiva","rot":"Q01 item 2","exig":"Sim; e quinquenal o prazo prescricional da ação regressiva do INSS, conforme o Decreto no 20.910/32. O STJ, no REsp 1.251.993/PR (Tema 553), assentou que o prazo nas ações indenizatórias contra a Fazenda Pública e quinquenal (art. 1o do Decreto-Lei 20.910/1932), e não trienal (art. 206, par. 3o, V, do CC/2002), aplicando-se por isonomia ao INSS. O prazo se inicia na data do deferimento do benefício previdenciário.","pont":"não discriminada","disp":["Decreto-Lei 20.910/1932 art. 1o","CC art. 206, par. 3o, V","REsp 1.251.993/PR - Tema 553"]},{"trib":"TRF1","ano":2023,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-de-correcao-prova-discursiva_165145f.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-escrita-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/trf12023_gabarito_definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/trf1","nota":"","cargo":"Juiz Federal Substituto","disc":"Empresarial","tema":"Consorcio sem personalidade jurídica e solidariedade","rot":"Q01 item 3","exig":"Não; o consorcio, além de extinto com o termino da obra, não tem personalidade jurídica própria, de modo que as empresas 2 e 3 respondem solidariamente. As empresas que compoem o grupo econômico podem responder solidariamente por obrigações decorrentes das Normas Regulamentadoras do MTE e por decorrencia lógica da abrangencia do art. 120 da Lei 8.213/1991, que envolve todos que concorreram para o acidente.","pont":"não discriminada","disp":["Lei 8.213/1991 art. 120"]},{"trib":"TRF1","ano":2023,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-de-correcao-prova-discursiva_165145f.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-escrita-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/trf12023_gabarito_definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/trf1","nota":"","cargo":"Juiz Federal Substituto","disc":"Processo Civil","tema":"Denunciação da lide facultativa","rot":"Q01 item 4","exig":"Não; atualmente a denunciação da lide não é mais uma obrigatoriedade, como constava no CPC/1973. A redação do novo código menciona expressamente o instituto como uma possibilidade (art. 125 do CPC/2015).","pont":"não discriminada","disp":["CPC art. 125"]},{"trib":"TRF1","ano":2023,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-de-correcao-prova-discursiva_165145f.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-escrita-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/trf12023_gabarito_definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/trf1","nota":"","cargo":"Juiz Federal Substituto","disc":"Direitos Humanos","tema":"Status da Convenção sobre os Direitos das Pessoas com Deficiência","rot":"Q02 item 1","exig":"A Convenção Internacional sobre os Direitos das Pessoas com Deficiência e seu Protocolo Facultativo, assinados em Nova York em 30 de marco de 2007, foram aprovados pelo Congresso Nacional em consonancia com as formalidades do processo legislativo de emenda constitucional (em cada Casa, em dois turnos, por três quintos dos votos), revestindo-se de natureza jurídica equivalente as emendas constitucionais.","pont":"não discriminada","disp":["CF art. 5o, par. 3o"]},{"trib":"TRF1","ano":2023,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-de-correcao-prova-discursiva_165145f.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-escrita-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/trf12023_gabarito_definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/trf1","nota":"","cargo":"Juiz Federal Substituto","disc":"Direitos Humanos","tema":"Controle de convencionalidade e supralegalidade","rot":"Q02 item 2","exig":"O controle de convencionalidade consiste em atividade judicial de fiscalização das leis e atos do Estado tendo como parâmetro de confronto convenção ou tratado internacional de direitos humanos aprovado mediante Decreto Legislativo (CF, art. 49, I) e promulgado por decreto presidencial (CF, art. 84, VIII). E possível no Brasil especialmente após o RE 466.343 (Rel. Min. Cezar Peluso, j. 03/12/2008), no qual o STF reconheceu status de norma supralegal aos tratados de direitos humanos não aprovados pelo rito do par. 3o do art. 5o da CF.","pont":"não discriminada","disp":["CF art. 49, I","CF art. 84, VIII","CF art. 5o, LXVII e par. 1o a 3o","RE 466.343"]},{"trib":"TRF1","ano":2023,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-de-correcao-prova-discursiva_165145f.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-escrita-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/trf12023_gabarito_definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/trf1","nota":"","cargo":"Juiz Federal Substituto","disc":"Direitos Humanos","tema":"Competência para o controle de convencionalidade","rot":"Q02 item 3","exig":"Sim; juizes e tribunais brasileiros tem competência para exercer o controle de convencionalidade e declarar a inconvencionalidade de lei ou ato que ofender tratados com status supralegal no julgamento de casos concretos. Entretanto, as ações objetivas (ADI, ADO, ADC e ADPF) só podem ser propostas quando o parâmetro for a Constituição ou os tratados aprovados na forma do par. 3o do art. 5o, hipótese em que integram o 'bloco de constitucionalidade'; fora dai não há controle normativo abstrato de convencionalidade no direito brasileiro.","pont":"não discriminada","disp":["CF art. 5o, par. 3o"]},{"trib":"TRF1","ano":2023,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-de-correcao-prova-discursiva_165145f.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-escrita-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/trf12023_gabarito_definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/trf1","nota":"","cargo":"Juiz Federal Substituto","disc":"Direitos Humanos","tema":"Duplo controle - ADI de lei estadual","rot":"Q02 item 4","exig":"Sim; por ter sido a Convenção aprovada com o rito de emenda constitucional, ela e equivalente as emendas e compoe o 'bloco de constitucionalidade', sendo possível o controle abstrato ou principal no STF pela via da ADI, pois a situação envolve duplo controle: (i) de constitucionalidade e (ii) de convencionalidade da lei estadual.","pont":"não discriminada","disp":["CF art. 5o, par. 3o"]},{"trib":"TRF1","ano":2023,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-de-correcao-prova-discursiva_165145f.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-escrita-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/trf12023_gabarito_definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/trf1","nota":"","cargo":"Juiz Federal Substituto","disc":"Penal","tema":"Teoria do domínio do fato, autoria, coautoria e participação","rot":"Q03","exig":"A teoria do domínio do fato, desenvolvida sobretudo por Welzel e Roxin, e eclética e considera autor a figura central do fato típico: autoria direta ou de mao própria (domínio da ação) e autoria indireta ou mediata (domínio da vontade), sendo punível somente o autor mediato quando o executor incide em erro ou coação; haverá coautoria (domínio funcional) se ambos agirem dolosamente, mediante divisao de tarefas durante a execução. A participação (instigação, induzimento ou cumplicidade) e acessória, sem domínio do fato, podendo o partícipe ser apenado mais duramente conforme as circunstâncias. Em geral a teoria não se aplica aos crimes culposos e omissivos, mas somente aos comuns, comissivos e dolosos (infracao de dever). O Código Penal adotou a teoria monista/unitária (art. 29), com conceito extensivo de autor, mas a teoria do domínio do fato e compativel e já foi admitida pelo STF e pelo STJ. A autoria mediata por domínio de aparato organizado de poder e conceito criado por Roxin, em que autor mediato e imediato são igualmente culpáveis e puníveis, sendo os executores fungíveis.","pont":"não discriminada","disp":["CP art. 29"]},{"trib":"TRF1","ano":2023,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-de-correcao-prova-discursiva_165145f.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-escrita-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/trf12023_gabarito_definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/trf1","nota":"","cargo":"Juiz Federal Substituto","disc":"Constitucional","tema":"Competência da União sobre energia eletrica - Tema 774","rot":"Q04 item 1","exig":"Não; Tese de Repercussão Geral Tema 774 (RE 827.538/MG): 'A norma estadual que impoe a concessionária de geracao de energia eletrica a promocao de investimentos, com recursos identificados como parcela da receita que aufere, voltados a proteção e a preservação de mananciais hidricos e inconstitucional por configurar intervencao indevida do Estado no contrato de concessão da exploracao do aproveitamento energetico dos cursos de agua, atividade de competência da União, conforme art. 21, XII, b, da Constituição Federal'. O entorno do reservatorio já conta com a proteção do Código Florestal (Lei 12.651/12).","pont":"não discriminada","disp":["CF art. 21, XII, b","RE 827.538/MG - Tema 774","Lei 12.651/2012"]},{"trib":"TRF1","ano":2023,"banca":"FGV","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-de-correcao-prova-discursiva_165145f.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-escrita-discursiva.pdf","prova2":"","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/trf12023_gabarito_definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/trf1","nota":"","cargo":"Juiz Federal Substituto","disc":"Ambiental","tema":"Competência concorrente e normas ambientais mais protetivas; precaução e prevenção","rot":"Q04 item 2","exig":"Sim; o STF fixou que Estados e Municípios podem legislar sobre normas de proteção ambiental com disposicoes divergentes e mais protetivas em relação a legislação federal, desde que calcadas em peculiaridade local que demande a maior proteção (RE 586.224). A competência comum do art. 23 da CF exige cooperação, cabendo a lei complementar fixa-la. Distinguir o princípio da precaução (juízo de probabilidade, duvida fundada, gestao de riscos, questionamento da imprescindibilidade da medida com potencial de dano irreparavel) do princípio da prevenção (dado certo ou próximo da certeza científica, impactos já conhecidos com nexos de causalidade identificaveis).","pont":"não discriminada","disp":["CF art. 23","RE 586.224"]},{"trib":"TRF1","ano":2023,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível e sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-de-correcao-provas-praticas-de-sentenca_v.f.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-pratica-sentenca-civel.pdf","prova2":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-pratica-sentenca-criminal.pdf","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/trf12023_gabarito_definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/trf1","nota":"Espelho cobre as duas sentencas; prova de sentenca criminal em https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-pratica-sentenca-criminal.pdf","cargo":"Juiz Federal Substituto","disc":"Processo Civil","tema":"Ordem lógica de enfrentamento das questões","rot":"Cível - Primeiro Quesito","exig":"Demonstrar que percebe haver questões cuja resolução se antepoe logicamente a resolução de outra ou de outras. São admitidas como corretas três sequências: 1) 1-2-3-4-5-6-7-8; 2) 1-2-3-4-5-7-6-8; 3) 1-2-3-6-4-5-7-8, sendo 1 o pleito de remessa dos autos para o Juízo Federal da 12a Vara, 2 a incompetência absoluta para invalidar CDAs, 3 a inépcia da inicial por pedido genérico, 4 a incompetência do juízo singular para reconhecer inconstitucionalidade por sentença, 5 a impossibilidade de apreciacao incidental, 6 o direito de não pagar IRPJ e CSLL sobre a Selic, 7 a deducao da CSLL na base do IRPJ e 8 a distribuição dos ônus da sucumbência.","pont":"1,00","disp":[]},{"trib":"TRF1","ano":2023,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível e sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-de-correcao-provas-praticas-de-sentenca_v.f.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-pratica-sentenca-civel.pdf","prova2":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-pratica-sentenca-criminal.pdf","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/trf12023_gabarito_definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/trf1","nota":"Espelho cobre as duas sentencas; prova de sentenca criminal em https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-pratica-sentenca-criminal.pdf","cargo":"Juiz Federal Substituto","disc":"Processo Civil","tema":"Preclusão quanto a tutela provisória","rot":"Cível - Segundo Quesito","exig":"Perceber que o pleito de tutela provisória já foi objeto de decisão; como não há referência a agravo de instrumento contra o indeferimento nem postulacao de concessão na sentença, operou-se a preclusão e a decisão se estabilizou, de modo que, como não existe previsão legal que autorize a concessão de ofício, o candidato não pode se referir, na fundamentação e no dispositivo, ao pleito de tutela provisória.","pont":"0,50","disp":[]},{"trib":"TRF1","ano":2023,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível e sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-de-correcao-provas-praticas-de-sentenca_v.f.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-pratica-sentenca-civel.pdf","prova2":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-pratica-sentenca-criminal.pdf","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/trf12023_gabarito_definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/trf1","nota":"Espelho cobre as duas sentencas; prova de sentenca criminal em https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-pratica-sentenca-criminal.pdf","cargo":"Juiz Federal Substituto","disc":"Processo Civil","tema":"Conexão e competência absoluta da vara de execução fiscal","rot":"Cível - Terceiro Quesito","exig":"Afastar o pleito e rejeitar a reuniao por conexão, devendo a ação anulatória permanecer na 5a Vara: (i) só há conexão e seus efeitos em competência relativa, sendo absoluta a da vara especializada em execução fiscal; (ii) a ação anulatória foi proposta antes da executiva, não sendo sucedaneo de embargos; (iii) precedentes do STJ e do TRF-1. Demonstrar que reconhece a existencia de conexão (art. 55, par. 2o, I, do CPC), mas que dela não se extrai o efeito de reuniao dos processos.","pont":"1,00","disp":["CPC art. 55, par. 2o, I"]},{"trib":"TRF1","ano":2023,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível e sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-de-correcao-provas-praticas-de-sentenca_v.f.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-pratica-sentenca-civel.pdf","prova2":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-pratica-sentenca-criminal.pdf","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/trf12023_gabarito_definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/trf1","nota":"Espelho cobre as duas sentencas; prova de sentenca criminal em https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-pratica-sentenca-criminal.pdf","cargo":"Juiz Federal Substituto","disc":"Processo Civil","tema":"Questão prejudicial externa e competência funcional","rot":"Cível - Quarto Quesito","exig":"Rejeitar a alegacao, demonstrando que o reconhecimento de situações jurídicas com aptidao para produzir efeitos sobre a inscricao em Dívida Ativa não se confunde com 'anular' CDAs; que as questões são prejudiciais externas, devendo o conteudo da decisão ser informado ao juízo da execução fiscal; e que a resolução de questão prejudicial externa não implica invasao da competência funcional. Resposta exauriente: pontuar também que, pela organização judiciária local, a 12a Vara processa execuções fiscais (tributárias ou não) e a 5a Vara não tem competência para executivos fiscais, mas tem para demandas cognitivas sobre atos relativos a obrigações consubstanciadas em CDAs.","pont":"1,00","disp":[]},{"trib":"TRF1","ano":2023,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível e sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-de-correcao-provas-praticas-de-sentenca_v.f.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-pratica-sentenca-civel.pdf","prova2":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-pratica-sentenca-criminal.pdf","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/trf12023_gabarito_definitivo.pdf","conc":"https://conhecimento.fgv.br/concursos/trf1","nota":"Espelho cobre as duas sentencas; prova de sentenca criminal em https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-pratica-sentenca-criminal.pdf","cargo":"Juiz Federal Substituto","disc":"Processo Civil","tema":"Inépcia da inicial - pedido genérico","rot":"Cível - Quinto Quesito","exig":"Rejeitar a alegacao de inépcia, pois os pedidos não são genéricos: os dois pleitos declaratórios versam sobre o modo de ser de uma relação jurídica, com previsão expressa no art. 19, I, do CPC; e a postulacao de abstencao de cobranca posterior materializa pleito condenatório de obrigação de não fazer, formulado de forma específica.","pont":"0,50","disp":["CPC art. 19, I"]},{"trib":"TRF1","ano":2023,"banca":"FGV","tipo":"Sentença","tipoRaw":"sentença cível e sentença penal","url":"https://conhecimento.fgv.br/sites/default/files/concursos/espelho-de-correcao-provas-praticas-de-sentenca_v.f.pdf","prova":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-pratica-sentenca-civel.pdf","prova2":"https://conhecimento.fgv.br/sites/default/files/concursos/trf1-2023-juiz-substituto-prova-pratica-sentenca-criminal.pdf","gab":"https://conhecimento.fgv.br/sites/default/files/concursos/trf12023_gabarito_def
