 de sentenca civel do L Concurso, aplicada em 05/07/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Processo Civil","tema":"Teoria da assercao","rot":"Preliminar 2 - Falta de interesse de agir","exig":"Aplica-se a teoria processual da assercao. 'Nada mais a explicar a um concursando.' Improcedente.","pont":"nao discriminada","disp":[]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_prova_de_sentenca_civel","prova":"https://www.tjrj.jus.br/documents/d/guest/prova-sentenca-civel","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova de sentenca civel do L Concurso, aplicada em 05/07/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Processo Civil","tema":"Intervencao do MP","rot":"Preliminar 3 - Atuacao do Ministerio Publico","exig":"A vitima era menor de idade, mas os autores sao maiores e capazes; o Ministerio Publico nao atua no feito.","pont":"nao discriminada","disp":["CPC, art. 178"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_prova_de_sentenca_civel","prova":"https://www.tjrj.jus.br/documents/d/guest/prova-sentenca-civel","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova de sentenca civel do L Concurso, aplicada em 05/07/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Processo Civil","tema":"Curador especial de reu preso","rot":"Preliminar 4 - Atuacao da Curadoria Especial","exig":"Ticio esta preso, mas e autor da acao, com advogado particular; a Curadoria nao atua.","pont":"nao discriminada","disp":["CPC, art. 72 II"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_prova_de_sentenca_civel","prova":"https://www.tjrj.jus.br/documents/d/guest/prova-sentenca-civel","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova de sentenca civel do L Concurso, aplicada em 05/07/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Civil","tema":"Atropelamento em passagem clandestina; culpa exclusiva da vitima embriagada","rot":"Merito - Responsabilidade da concessionaria ferroviaria e nexo causal","exig":"Aplica-se ao caso o Tema Repetitivo 517 do STJ: a despeito de situacoes faticas variadas no descumprimento do dever de seguranca e vigilancia continua das vias ferreas, a responsabilizacao da concessionaria e uma constante, passivel de ser elidida tao somente quando cabalmente comprovada a culpa exclusiva da vitima. A legislacao aplicavel e o art. 25 da Lei 8.987/95, lastreado no par. 6o do art. 36 (sic) da CF. O principio da especialidade afasta o CDC, mas quem mencionar o CDC e a lei especifica nao perdera pontos. O importante e reconhecer a responsabilidade objetiva. O problema e resolvido pela analise do nexo de causalidade - o CC agasalhou a teoria da causalidade adequada (definicao de Sergio Cavalieri Filho: a causalidade nao e apenas liame fatico, mas juizo de valor que considera a previsibilidade do dano e a adequacao entre conduta e resultado). No caso, a vitima estava embriagada e atravessou a passagem clandestina as tres horas da manha; retirando-se a embriaguez da linha fatica, o acidente nao teria acontecido; a passagem ilegal e desinfluente. Reconhecida a culpa exclusiva da vitima. Quem reconhecer culpa concorrente nao tera a resposta considerada errada em sua totalidade; quem reconhecer a culpa da concessionaria tera sua argumentacao avaliada.","pont":"nao discriminada","disp":["Tema Repetitivo 517/STJ","Lei 8.987/95, art. 25","CC, art. 403"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_prova_de_sentenca_civel","prova":"https://www.tjrj.jus.br/documents/d/guest/prova-sentenca-civel","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova de sentenca civel do L Concurso, aplicada em 05/07/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Civil","tema":"Dano moral in re ipsa dos pais e prova em contrario","rot":"Danos morais - Mevia (mae)","exig":"Mevia, mae da vitima fatal, nao o criou - Johnwayne foi criado pela tia, Sarah Conoor. A dor moral indenizavel dos pais caracteriza-se por ser in re ipsa, presumida, mas admite prova e conclusao em contrario; a sentir do examinador, quem merece reparacao pela dor moral e Sarah Conoor. Todavia, reconhecendo o ditado de que 'mae e mae', nao se considerara errado o deferimento do dano moral a Mevia.","pont":"nao discriminada","disp":[]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_prova_de_sentenca_civel","prova":"https://www.tjrj.jus.br/documents/d/guest/prova-sentenca-civel","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova de sentenca civel do L Concurso, aplicada em 05/07/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Civil","tema":"Afastamento da presuncao de dor moral","rot":"Danos morais - Ticio (pai preso)","exig":"O pai de Johnwayne esta preso por triplo latrocinio e nunca viu o filho; nesse caso a presuncao de dor moral nao pode ser aplicada. A indenizacao por danos morais nao se coaduna com hipersensibilidade emotiva. Indeferida a indenizacao.","pont":"nao discriminada","disp":[]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_prova_de_sentenca_civel","prova":"https://www.tjrj.jus.br/documents/d/guest/prova-sentenca-civel","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova de sentenca civel do L Concurso, aplicada em 05/07/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Civil","tema":"Vinculo afetivo entre irmaos","rot":"Danos morais - irmas","exig":"No caso de irmaos, a demonstracao de vinculo afetivo e indispensavel; presume-se a dor moral em caso de proximidade comprovada ou convivio familiar. No conflito em analise, as irmas vivem em outra regiao do pais e nao veem o irmao ha dez anos: nao ha dor moral passivel de indenizacao.","pont":"nao discriminada","disp":[]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_prova_de_sentenca_civel","prova":"https://www.tjrj.jus.br/documents/d/guest/prova-sentenca-civel","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova de sentenca civel do L Concurso, aplicada em 05/07/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Civil","tema":"Dano hipotetico e presuncao de auxilio ao nucleo familiar","rot":"Pensao por morte de filho menor","exig":"Construiu-se jurisprudencia segundo a qual, no caso de morte de menor de familia humilde, presume-se que ele trabalharia no futuro em favor do nucleo familiar, fixando-se indenizacao em salarios minimos mensais. O espelho qualifica isso como dano hipotetico, entendimento afastado do direito positivo, pois o Judiciario nao pode impor a um reu o peso de indenizar algo que nao se sabe se ocorreria. Alem disso, a mae e doente (alcoolismo e doenca) e nao morava com ele desde a infancia; o pai esta preso e sequer o conheceu; as irmas moram no Nordeste - nao ha nucleo familiar a auxiliar, sendo possivel apenas que viesse a ajudar Sarah Conoor. Por essas razoes, o pleito de pensionamento deve ser julgado improcedente.","pont":"nao discriminada","disp":[]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_prova_de_sentenca_civel","prova":"https://www.tjrj.jus.br/documents/d/guest/prova-sentenca-civel","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova de sentenca civel do L Concurso, aplicada em 05/07/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Empresarial","tema":"Vedacao de constricao em face de empresa em falencia/recuperacao","rot":"Arresto","exig":"O arresto pretendido nao e possivel em decorrencia do que estabelece o inciso III do art. 6o da Lei 11.101/2005.","pont":"nao discriminada","disp":["Lei 11.101/2005, art. 6o III"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_prova_de_sentenca_civel","prova":"https://www.tjrj.jus.br/documents/d/guest/prova-sentenca-civel","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova de sentenca civel do L Concurso, aplicada em 05/07/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Processo Civil","tema":"Sucumbencia","rot":"Verbas sucumbenciais","exig":"No mais, as verbas sucumbenciais serao analisadas dependendo da resposta do candidato.","pont":"nao discriminada","disp":["CPC, art. 85"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca penal","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_de_sentenca_penal","prova":"https://www.tjrj.jus.br/documents/d/guest/prova-sentenca-penal","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova de sentenca penal do L Concurso, aplicada em 06/07/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Penal","tema":"Crimes contra a dignidade sexual: materialidade e autoria","rot":"Direito Penal - suficiencia probatoria e palavra da vitima","exig":"Superadas as prejudiciais, caberia ao candidato, por primeiro, enfrentar as questoes faticas, concluindo pela suficiencia probatoria tanto da materialidade dos supostos delitos como da autoria (nao ha que se falar em qualquer forma de participacao), com destaque para a relevancia da palavra da vitima, no ponto.","pont":"nao discriminada","disp":[]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca penal","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_de_sentenca_penal","prova":"https://www.tjrj.jus.br/documents/d/guest/prova-sentenca-penal","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova de sentenca penal do L Concurso, aplicada em 06/07/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Penal","tema":"Estupro de vulneravel (art. 217-A) e criterio biologico","rot":"Direito Penal - adequacao tipica e imputabilidade","exig":"Os demais questionamentos defensivos estao vinculados a adequacao tipica, pois o afastamento da imputabilidade penal - com adocao legislativa do criterio exclusivamente biologico como opcao de politica criminal - esta umbilicalmente ligado a existencia da(s) infracao(oes), da mesma forma que a pretensa continuidade delitiva ou tese de crime unico. A banca entende que a hipotese mereceria procedencia parcial: os fatos praticados as 2h da madrugada e reiterados as 4h se tipificam, ambos, no art. 217-A do CP, sendo caso de considerar a suposta importunacao sexual como integrante do crime mais grave, mesmo que em progressao criminosa, eis que de carater subsidiario - expressamente assim dispondo a norma - e diante do aparente conflito de normas, resolvido pela especialidade. Ha propositais lacunas que a denuncia nao esclareceu, a exemplo de coabitar o autor na mesma casa com a vitima e/ou se sobre ela mantinha alguma autoridade. Afastada, por muito, a adequacao de qualquer dos atos ao crime do art. 218 do CP.","pont":"nao discriminada","disp":["CP, arts. 217-A e 218","Lei 13.718/2018 (importunacao sexual)"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca penal","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_de_sentenca_penal","prova":"https://www.tjrj.jus.br/documents/d/guest/prova-sentenca-penal","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova de sentenca penal do L Concurso, aplicada em 06/07/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Penal","tema":"Crime continuado em crimes sexuais","rot":"Direito Penal - continuidade delitiva","exig":"Em evidencia se extraem dois crimes de estupro de vulneravel e presente, na hipotese, por tudo (especie criminosa; tempo; lugar; maneira de execucao), a continuidade delitiva na forma do art. 71 do CP. O REsp 1.957.637/MG, julgado em 08/06/22 pela Colenda Terceira Secao do STJ, sob relatoria do Ministro Ribeiro Dantas, e lastro sedimentado para a devida compreensao.","pont":"nao discriminada","disp":["CP, art. 71","STJ REsp 1.957.637/MG"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca penal","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_de_sentenca_penal","prova":"https://www.tjrj.jus.br/documents/d/guest/prova-sentenca-penal","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova de sentenca penal do L Concurso, aplicada em 06/07/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Penal","tema":"Menoridade relativa, art. 226 do CP e substituicao da pena","rot":"Direito Penal - dosimetria e consequencias","exig":"A banca flexibilizou o rigor nos fundamentos para o exame das circunstancias judiciais na fixacao da pena-base e nas possiveis agravantes, mas nao admitiu o afastamento da menoridade relativa em sede penal, nem considerar in malam partem a causa especial de aumento do art. 226 do CP. Diante da sancao minima a ser imposta, naturalmente afastada estaria a substituicao da privacao de liberdade por restricoes de direitos, sendo desnecessario atrair a orientacao dos Tribunais Superiores quanto a ser o estupro de vulneravel crime cometido com violencia.","pont":"nao discriminada","disp":["CP, arts. 44, 65 I e 226"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca penal","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_de_sentenca_penal","prova":"https://www.tjrj.jus.br/documents/d/guest/prova-sentenca-penal","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova de sentenca penal do L Concurso, aplicada em 06/07/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Processo Penal","tema":"Depoimento especial de crianca/adolescente e indeferimento de perguntas da defesa","rot":"Processo Penal - Preliminar A","exig":"Fundamentos indicados pela banca: arts. 227 e par. 4o da CF; Lei 13.431/17; Lei 13.344/22, art. 12; arts. 212, 403, 571 e 572 do CPP. Precedente transcrito: STJ, AgRg no HC 951.243/GO, Rel. Min. Og Fernandes, Sexta Turma, j. 06/05/2025 - o depoimento especial consiste em procedimento com regras especificas da Lei 13.431/2017 para oitiva de criancas e adolescentes vitimas de violencia, visando efetivar a protecao integral e evitar a revitimizacao, permitindo o contraditorio ainda que mitigado; a Resolucao 299/2019 do CNJ orienta que as perguntas sejam concentradas em um bloco; o indeferimento de questionamentos impertinentes nao afronta o contraditorio (CPP, art. 400, par. 1o).","pont":"nao discriminada","disp":["CF, art. 227 e par. 4o","Lei 13.431/17","Lei 13.344/22, art. 12","CPP, arts. 212, 400 par. 1o, 403, 571 e 572","Resolucao CNJ 299/2019","STJ AgRg no HC 951.243/GO"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca penal","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_de_sentenca_penal","prova":"https://www.tjrj.jus.br/documents/d/guest/prova-sentenca-penal","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova de sentenca penal do L Concurso, aplicada em 06/07/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Processo Penal","tema":"Fundamentacao das decisoes e valoracao de elementos informativos","rot":"Processo Penal - Preliminar B","exig":"Fundamentos indicados pela banca: art. 93, IX, da CF; arts. 155 e paragrafo unico, 167, 402, 403, 571 e 572 do CPP.","pont":"nao discriminada","disp":["CF, art. 93 IX","CPP, arts. 155, 167, 402, 403, 571 e 572"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca penal","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_de_sentenca_penal","prova":"https://www.tjrj.jus.br/documents/d/guest/prova-sentenca-penal","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova de sentenca penal do L Concurso, aplicada em 06/07/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Processo Penal","tema":"Cadeia de custodia da prova","rot":"Processo Penal - Preliminar C","exig":"Fundamentos indicados pela banca: arts. 158-A a 158-F, 403, 571 e 572 do CPP. Precedentes transcritos: STJ, AgRg no HC 966.080/SP, Rel. Min. Ribeiro Dantas, Quinta Turma, j. 14/05/2025 - nao ha quebra da cadeia de custodia quando nao evidenciado risco concreto de adulteracao da prova, e a questao nao se trata de nulidade processual, mas de eficacia da prova, a ser sopesada pelo julgador; STJ, EDcl no AgRg no RHC 185.119/SC, Rel. Min. Reynaldo Soares da Fonseca, Quinta Turma, j. 17/06/2025 - eventuais irregularidades formais na cadeia de custodia devem ser apreciadas em conjunto com os demais elementos de prova, nao implicando nulidade automatica quando preservada sua integridade e ausente demonstracao de prejuizo.","pont":"nao discriminada","disp":["CPP, arts. 158-A a 158-F, 403, 571 e 572","STJ AgRg no HC 966.080/SP","STJ EDcl no  a 7 (nota da questao: 1,0)","exig":"Itens pontuados individualmente: (1) uma norma legal existira caso emane de um orgao estatal, seja editada e revelada ao mundo exterior conforme um procedimento contemplado no sistema e tenha um objeto (ate 0,15); (2) sera valida, em perspectiva juridica, caso se harmonize com a Constituicao da Republica (ate 0,10); (3) sera eficaz caso esteja apta a produzir efeitos (ate 0,15); (4) a Constituicao, no Art. 24, par. 4o, admite que norma legal de cunho estadual tenha sua eficacia suspensa em razao da superveniencia de lei federal sobre normas gerais (ate 0,15); (5) nesse caso, a norma estadual existira, mas nao produzira efeitos (ate 0,10); (6) na acao direta de inconstitucionalidade, o STF analisa a compatibilidade da norma legal com a ordem constitucional, tal qual preceitua o Art. 102, I, 'a', da Constituicao, sendo discutida a sua validade (ate 0,15); (7) portanto, mesmo uma norma ineficaz pode ser objeto de acao direta de inconstitucionalidade (ate 0,15); alem do item de idioma oficial (ate 0,05).","pont":"1,00 no total (itens de 0,05 a 0,15)","disp":["CF, arts. 24 par. 4o e 102 I 'a'"]},{"trib":"TJ-GO","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso58/Espelho_TJGO.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso58/TJGO_2023_Juiz_Substituto_ProvaEscritaDiscursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova escrita discursiva do 58o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Tributário","tema":"ITCMD, imunidade da entidade beneficiaria, fato gerador no registro, ITR x IPTU e responsabilidade por sucessao","rot":"Questao 05 - itens a.1, a.2, b e c (nota da questao: 1,0)","exig":"a.1) Nao. A entidade beneficiaria (donataria) e entidade imune, razao pela qual a transmissao de imovel que compora seu patrimonio fica imunizada da incidencia do ITCMD, cf. Art. 150, VI, 'c' e par. 4o, CF/88 (ate 0,15). a.2) O fato gerador do ITCMD nao ocorre no ato da lavratura da escritura, mas sim no efetivo registro da propriedade imobiliaria junto ao Registro de Imoveis, uma vez que no direito brasileiro a transmissao imobiliaria se da pelo registro, cf. Art. 1.245 do Codigo Civil E/OU jurisprudencia pacifica do STJ e STF (STJ REsp 1.841.771 e REsp 1.841.798 - repetitivos; STF ARE 1.294.969 - repercussao geral) (ate 0,20). b) O imposto que incidia sobre a propriedade quando de titularidade de Jose era o ITR, devendo-se levar em consideracao o criterio da destinacao do imovel: caso destinado a exploracao agricola, pecuaria, extrativa vegetal ou agroindustrial, ainda que localizado em area urbana, sobre ele incidira o ITR, nos termos do Art. 15 do Decreto-Lei n. 57/1966 E/OU STJ REsp 1.112.646 (repetitivo) (ate 0,30). c) Sim, as dividas pretéritas referentes ao tempo em que Jose era proprietario poderiam ser cobradas pelo Fisco da fundacao partidaria apos esta se tornar proprietaria, pois, como o ITR era devido quando o imovel era de propriedade de Jose (pessoa fisica nao imune), a fundacao partidaria, embora imune, e responsavel tributaria por sucessao quanto aos impostos passados devidos sobre o imovel e nao pagos, cf. Art. 130 do CTN E/OU STF RE 599.176 (repercussao geral), Rel. Min. Joaquim Barbosa, Pleno, julg. 05/06/2014 (ate 0,30). Idioma oficial (ate 0,05).","pont":"1,00 no total","disp":["CF, art. 150 VI 'c' e par. 4o","CC, art. 1.245","CTN, art. 130","Decreto-Lei 57/1966, art. 15","STJ REsp 1.841.771, REsp 1.841.798 e REsp 1.112.646","STF ARE 1.294.969 e RE 599.176"]},{"trib":"TJ-GO","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso58/Espelho_TJGO.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso58/TJGO_2023_Juiz_Substituto_ProvaEscritaDiscursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova escrita discursiva do 58o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Empresarial","tema":"DIP Finance e credor parceiro na recuperacao judicial","rot":"Questao 06 - itens 1 a 3 (nota da questao: 1,0)","exig":"(1) DIP Finance (ate 0,45): conceituacao - modalidade de financiamento em que a recuperanda mantem a posse e o controle dos bens ou direitos dados em garantia, para que a empresa possa se manter operante; modalidade garantida pela oneracao ou pela alienacao fiduciaria de bens e direitos, proprios (pertencentes ao ativo nao circulante do devedor) ou de terceiros, desde que o 'dinheiro novo' (fresh money) seja utilizado para financiar as atividades e as despesas de reestruturacao ou de preservacao do valor de ativos da recuperanda; fundamento legal - Arts. 69-A e ss. da Lei n. 11.101/2005; requisitos - autorizacao do juiz, ouvido o comite de credores, e vinculacao do dinheiro novo; modalidades - loan-oriented e loan-to-own; vantagem para a recuperanda - injecao de capital sem a retirada de seus ativos. (2) Credor parceiro (ate 0,40): conceituacao - aquele que recebe vantagens e privilegios caso continue a fornecer insumos, mercadorias, creditos ou que adquira papeis e debentures da recuperanda; fundamento legal - Art. 67 da Lei n. 11.101/2005; requisitos - previsao no plano de recuperacao judicial, imprescindibilidade dos bens e servicos que continuarem a ser prestados, razoabilidade dos privilegios outorgados; vantagem - continuidade de servicos essenciais pelo emparceiramento com seus credores. (3) Diferenciacao entre os institutos (ate 0,10). Idioma oficial (ate 0,05).","pont":"1,00 no total","disp":["Lei 11.101/2005, arts. 67 e 69-A e ss."]},{"trib":"TJ-GO","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso58/Espelho_TJGO.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso58/TJGO_2023_Juiz_Substituto_ProvaEscritaDiscursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova escrita discursiva do 58o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Processo Civil","tema":"Omissoes e inercias do juizo e respectivos meios de impugnacao","rot":"Questao 07 (nota da questao: 1,0)","exig":"Indicar as hipoteses e os meios de impugnacao: inobservancia dos marcos temporais estabelecidos pelo legislador (Art. 226 do CPC), meio de impugnacao (inercia): representacao (Art. 235 do CPC); ausencia de fixacao dos honorarios sucumbenciais ou nao indicacao do valor (omissao): acao autonoma para cobranca (Art. 85, par. 18, do CPC); decisoes judiciais sem fundamentacao adequada ou sem distincao (Arts. 489, par. 1o c/c 1.022, paragrafo unico, I e II, do CPC) transitadas em julgado (omissao): acao rescisoria por violacao a norma juridica (Art. 966 do CPC); inercia em cumprir determinacao do orgao julgador superior, ou quando o orgao inferior demorar excessivamente para remeter o recurso interposto (inercia): reclamacao (Art. 988 do CPC); decisao de saneamento que nao tenha apreciado alguma questao especifica (omissao): pedido de esclarecimentos ou ajustes (Art. 357, par. 1o, do CPC).","pont":"dois blocos de ate 0,48 e 0,47 (escala 0,00/0,24/0,48 e 0,00/0,24/0,47), mais idioma oficial (ate 0,05); nota da questao 1,0","disp":["CPC, arts. 85 par. 18, 226, 235, 357 par. 1o, 489 par. 1o, 966, 988 e 1.022 paragrafo unico"]},{"trib":"TJ-GO","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso58/Espelho_TJGO.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso58/TJGO_2023_Juiz_Substituto_ProvaEscritaDiscursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova escrita discursiva do 58o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Processo Penal","tema":"Prisao temporaria e acordo de colaboracao premiada","rot":"Questao 08 - itens 1 a 4 (nota da questao: 1,0)","exig":"(1) ate 0,20: relativamente a prisao temporaria de Fernando, nao poderia ser esta decretada sem a previa oitiva do Ministerio Publico, pois, no caso de representacao da autoridade policial, deve o juiz ouvir previamente o Parquet, na qualidade de titular do direito de acao penal, consoante o Art. 2o, par. 1o, da Lei n. 7.960/1989. (2) ate 0,25: ha ilegalidade no fato de o juiz participar das negociacoes relativas ao acordo de colaboracao premiada, ferindo de morte a sua imparcialidade, segundo o par. 6o do Art. 4o da Lei n. 12.850/2013, e o fato de o possivel beneficio acordado envolver o perdao judicial nao afasta a incidencia do referido dispositivo. (3) ate 0,25: quanto ao outro beneficio homologado pelo juiz, referente ao colaborador nao ser denunciado, tambem nao seria possivel a sua concessao, pois Fernando era o lider da organizacao criminosa, o que encontra vedacao no Art. 4o, par. 4o, I, da Lei n. 12.850/2013. (4) ate 0,25: como o acordo de colaboracao foi entabulado pelo delegado de policia, deve contar necessariamente com a manifestacao do Ministerio Publico, ainda que se considere que tal manifestacao nao seja vinculante, segundo o par. 6o do Art. 4o da Lei n. 12.850/2013, e o possivel beneficio de o colaborador nao ser denunciado nao afasta a incidencia desse dispositivo. Idioma oficial (ate 0,05).","pont":"1,00 no total","disp":["Lei 7.960/1989, art. 2o par. 1o","Lei 12.850/2013, art. 4o par. 4o I e par. 6o"]},{"trib":"TJ-GO","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjgo.jus.br/files/concursos/juizsubstituto/concurso59/EspelhoProvaDiscursiva.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/56-Prova-Discursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova discursiva do 59o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva. As provas de sentenca do 59o Concurso estao publicadas (https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/57-Sentenca-Civel.pdf e https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/58-Sentenca-Criminal.pdf), mas nao ha espelho correspondente na base.","cargo":"Juiz Substituto","disc":"Tributário","tema":"Competencia legislativa concorrente e competencia plena do Estado em materia de IPVA","rot":"Questao 01 - itens 1, 1.1 e 1.2 (nota da questao: 2,5)","exig":"1) O IPVA e imposto de competencia estadual, nos termos do Art. 155, III, da CRFB/1988, indicativo de que o Estado Delta tem competencia legislativa concorrente com a Uniao para legislar sobre a materia (Art. 24, I, da CRFB/1988) - ate 0,25. 1.1) Caso nao haja norma geral editada pela Uniao sobre a tematica, a competencia de Delta sera plena (Art. 24, par. 3o, CRFB/1988) - ate 0,20. 1.2) Na situacao concreta, a Uniao nao editou lei complementar sobre a tematica objeto do Art. X da Lei Estadual n. Y, tal qual dispoe o Art. 146, III, 'a', da CRFB/1988, indicativo de que o Estado Delta exerceu a competencia legislativa plena - ate 0,25.","pont":"0,25 + 0,20 + 0,25","disp":["CF, arts. 24 I e par. 3o, 146 III 'a' e 155 III"]},{"trib":"TJ-GO","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjgo.jus.br/files/concursos/juizsubstituto/concurso59/EspelhoProvaDiscursiva.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/56-Prova-Discursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova discursiva do 59o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva. As provas de sentenca do 59o Concurso estao publicadas (https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/57-Sentenca-Civel.pdf e https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/58-Sentenca-Criminal.pdf), mas nao ha espelho correspondente na base.","cargo":"Juiz Substituto","disc":"Constitucional","tema":"Iniciativa parlamentar e simetria","rot":"Questao 01 - item 2","exig":"Ainda na perspectiva formal, nao ha que se falar em inconstitucionalidade pelo fato de a proposicao ter sido apresentada por deputado estadual, pois nao se trata de materia de iniciativa legislativa do chefe do Poder Executivo (Art. 61, par. 1o, CRFB/1988), aplicavel aos estados por forca da simetria (Art. 25, caput, CRFB/1988).","pont":"ate 0,25","disp":["CF, arts. 25 caput e 61 par. 1o"]},{"trib":"TJ-GO","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjgo.jus.br/files/concursos/juizsubstituto/concurso59/EspelhoProvaDiscursiva.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/56-Prova-Discursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova discursiva do 59o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva. As provas de sentenca do 59o Concurso estao publicadas (https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/57-Sentenca-Civel.pdf e https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/58-Sentenca-Criminal.pdf), mas nao ha espelho correspondente na base.","cargo":"Juiz Substituto","disc":"Tributário","tema":"Sujeicao passiva do IPVA na alienacao fiduciaria - propriedade resoluvel x posse direta","rot":"Questao 01 - itens 3 a 3.5","exig":"3) Na perspectiva material, o Art. X dispos que o credor fiduciario e o contribuinte, enquanto o devedor fiduciante e responsavel solidario (ate 0,20). 3.1) Por se tratar de propriedade resoluvel, titularizada pelo credor fiduciario, nao apresenta todos os atributos afetos a propriedade plena, sendo certo que o devedor fiduciante possui a posse direta (ate 0,25). 3.2) No plano constitucional, consoante o entendimento do Supremo Tribunal Federal, somente a posse direta tem densidade material suficiente para a incidencia do IPVA, nao a propriedade resoluvel, desprovida dos atributos essenciais da propriedade plena (ate 0,30). 3.3) E a posse direta do devedor fiduciante, visando a aquisicao dominial, que estabelece a presuncao de riqueza para fins tributarios (ate 0,25). 3.4) Caso se entendesse que o credor fiduciario pode figurar como sujeito passivo da obrigacao tributaria, ainda ocorreria a concentracao da arrecadacao tributaria no domicilio das instituicoes financeiras, o que comprometeria a propria distribuicao dessa arrecadacao (ate 0,25). 3.5) Portanto, e inconstitucional, por afronta ao Art. 155, III, da CRFB/1988, a indicacao do credor fiduciario como contribuinte do IPVA, ressalvada a ulterior consolidacao da propriedade plena (ate 0,30).","pont":"0,20 + 0,25 + 0,30 + 0,25 + 0,25 + 0,30","disp":["CF, art. 155 III","Jurisprudencia do STF"]},{"trib":"TJ-GO","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjgo.jus.br/files/concursos/juizsubstituto/concurso59/EspelhoProvaDiscursiva.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/56-Prova-Discursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova discursiva do 59o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva. As provas de sentenca do 59o Concurso estao publicadas (https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/57-Sentenca-Civel.pdf e https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/58-Sentenca-Criminal.pdf), mas nao ha espelho correspondente na base.","cargo":"Juiz Substituto","disc":"Administrativo","tema":"Sujeito passivo de ato de improbidade: sindicatos, conselhos profissionais e partidos politicos","rot":"Questao 02 - letra a (nota da questao: 2,5)","exig":"O candidato devera demonstrar conhecimento sobre em que consiste ser sujeito passivo de ato de improbidade administrativa. Com relacao aos sindicatos, devera esclarecer que, em regra, nao podem mais ser sujeitos passivos desde a reforma trabalhista de 2017, pois a Lei n. 13.467/2017 extinguiu a obrigatoriedade da contribuicao sindical, regra considerada constitucional pelo STF no julgamento da ADI 5.794, em 29/06/2018. Os conselhos de fiscalizacao do exercicio profissional podem ser sujeitos passivos, uma vez que os integrantes da categoria sao obrigados a recolher contribuicoes que se enquadram na categoria das parafiscais, como decidido pelo STF no MS 21.797-9, em 09/03/2000. Os partidos politicos, pessoas juridicas de direito privado, estao legitimados a receber recursos do Fundo Especial de Assistencia Financeira aos Partidos Politicos (Fundo Partidario), composto em sua maior parte por receitas de origem publica, na forma do Art. 38 da Lei n. 9.096/1995, motivo pelo qual se aplica a regra do Art. 1o, par. 7o, da Lei n. 8.429/1992, podendo ser sujeito passivo de atos de improbidade.","pont":"ate 0,60 (escala 0,00 a 0,60, de 0,10 em 0,10)","disp":["Lei 8.429/1992, art. 1o par. 7o","Lei 13.467/2017","Lei 9.096/1995, art. 38","STF ADI 5.794","STF MS 21.797-9"]},{"trib":"TJ-GO","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjgo.jus.br/files/concursos/juizsubstituto/concurso59/EspelhoProvaDiscursiva.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/56-Prova-Discursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova discursiva do 59o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva. As provas de sentenca do 59o Concurso estao publicadas (https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/57-Sentenca-Civel.pdf e https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/58-Sentenca-Criminal.pdf), mas nao ha espelho correspondente na base.","cargo":"Juiz Substituto","disc":"Administrativo","tema":"Reexame necessario na improbidade e direito intertemporal (Tema 1.284/STJ)","rot":"Questao 02 - letra b","exig":"O candidato devera demonstrar conhecimento sobre em que consiste o reexame obrigatorio de sentenca, explicando se a vedacao ao reexame obrigatorio da sentenca de improcedencia ou de extincao sem resolucao de merito, contida no Art. 17, par. 19, da Lei n. 8.429/1992, se aplica a qualquer processo em curso ja sentenciado. Devera esclarecer que, sob o rito dos recursos repetitivos, a Primeira Secao do STJ estabeleceu que a vedacao ao reexame necessario (Art. 17, par. 19, IV c/c Art. 17-C, par. 3o, com redacao da Lei n. 14.230/2021) nao se aplica aos processos em curso quando a sentenca for anterior a vigencia da Lei n. 14.230/2021. No Tema 1.284 ficou decidido que vigora o sistema de isolamento dos atos processuais, aplicando-se de imediato a legislacao processual nova aos atos ainda nao praticados, respeitados os ja realizados; assim, a regra da vedacao ao reexame necessario, de carater processual, tem aplicacao imediata aos processos em curso, respeitando o principio tempus regit actum. A interpretacao depende do momento em que a sentenca tiver sido prolatada, aplicando-se a lei vigente nesse momento e afastando-se a retroatividade das normas processuais, conforme o Art. 14 do CPC; a alteracao legislativa nao deve retroagir as decisoes proferidas antes de sua entrada em vigor, ocorrida na data da publicacao, em 26 de outubro de 2021 (REsp 2.117.355).","pont":"ate 0,40 (escala 0,00 a 0,40, de 0,10 em 0,10)","disp":["Lei 8.429/1992, arts. 17 par. 19 IV e 17-C par. 3o","Lei 14.230/2021","CPC, art. 14","Tema 1.284/STJ","STJ REsp 2.117.355"]},{"trib":"TJ-GO","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjgo.jus.br/files/concursos/juizsubstituto/concurso59/EspelhoProvaDiscursiva.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/56-Prova-Discursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova discursiva do 59o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva. As provas de sentenca do 59o Concurso estao publicadas (https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/57-Sentenca-Civel.pdf e https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/58-Sentenca-Criminal.pdf), mas nao ha espelho correspondente na base.","cargo":"Juiz Substituto","disc":"Administrativo","tema":"Frustracao da licitude de processo licitatorio - art. 11, V x art. 10, VIII da LIA","rot":"Questao 02 - letra c","exig":"O candidato devera demonstrar conhecimento esclarecendo em que consiste a frustracao de licitude de processo licitatorio, pontuando mais ao dar exemplos. Devera esclarecer que, ainda que nao haja dano ao erario, a conduta descrita configura ato de improbidade administrativa, amoldando-se ao tipo do Art. 11, V, da Lei n. 8.429/1992. Devera ainda esclarecer que, caso se constate dano ao erario, a tipificacao adequada sera a do Art. 10, VIII, da Lei n. 8.429/1992. O candidato que apontar as diferencas de sancoes e consequencias em razao da tipificacao no Art. 10 ou no Art. 11 recebera pontuacao extra de 0,1.","pont":"ate 0,70 (escala 0,00/0,20/0,40/0,70) + 0,10 extra","disp":["Lei 8.429/1992, arts. 10 VIII e 11 V"]},{"trib":"TJ-GO","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjgo.jus.br/files/concursos/juizsubstituto/concurso59/EspelhoProvaDiscursiva.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/56-Prova-Discursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova discursiva do 59o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva. As provas de sentenca do 59o Concurso estao publicadas (https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/57-Sentenca-Civel.pdf e https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/58-Sentenca-Criminal.pdf), mas nao ha espelho correspondente na base.","cargo":"Juiz Substituto","disc":"Administrativo","tema":"Unificacao de sancoes no cumprimento de sentenca (art. 18-A da LIA)","rot":"Questao 02 - letra d","exig":"O candidato devera demonstrar conhecimento sobre em que consiste o cumprimento de sentenca, apontando que a resposta encontra respaldo no Art. 18-A da Lei n. 8.429/1992: a requerimento do reu, na fase de cumprimento da sentenca, o juiz unificara eventuais sancoes aplicadas com outras ja impostas em outros processos, em virtude de eventual continuidade de ilicito ou da pratica de diversas ilicitudes; no caso de continuidade de ilicito, o juiz promovera a maior sancao aplicada, aumentada de 1/3, ou a soma das penas, o que for mais benefico ao reu; no caso de pratica de novos atos ilicitos pelo mesmo sujeito, o juiz somara as sancoes, observando o limite maximo de 20 anos para a suspensao de direitos politicos e a proibicao de contratar ou receber incentivos fiscais ou crediticios. Devera indicar como definir continuidade de ilicitos para fins de unificacao das penas: no silencio da Lei, o doutrinador Landolfo Andrade, em 'Interesses Difusos e Coletivos', v. I, 13a ed. (fl. 848), ensina que o magistrado deve valer-se, por analogia, do conceito de crime continuado do Art. 71 do Codigo Penal - duas ou mais condutas, dois ou mais atos de improbidade da mesma especie, e, pelas condicoes de tempo, local, modo de execucao e outras semelhantes, os subsequentes havidos como continuacao do primeiro.","pont":"ate 0,80 (escala 0,00/0,40/0,60/0,80)","disp":["Lei 8.429/1992, art. 18-A","CP, art. 71"]},{"trib":"TJ-GO","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjgo.jus.br/files/concursos/juizsubstituto/concurso59/EspelhoProvaDiscursiva.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/56-Prova-Discursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova discursiva do 59o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva. As provas de sentenca do 59o Concurso estao publicadas (https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/57-Sentenca-Civel.pdf e https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/58-Sentenca-Criminal.pdf), mas nao ha espelho correspondente na base.","cargo":"Juiz Substituto","disc":"Civil","tema":"Correcao monetaria e juros de mora em relacao contratual apos a Lei 14.905/2024","rot":"Questao 03 - itens a.1 a a.5 (nota da questao: 2,5)","exig":"a.1) Em se tratando de relacao contratual, para a correcao monetaria o marco inicial sera o do efetivo prejuizo, conforme Sumula n. 43 do STJ (0,20). a.2) Em se tratando de relacao contratual, o marco inicial dos juros de mora sera o vencimento da obrigacao inadimplida (CC, art. 397) (0,20). a.3) Quanto a correcao monetaria, o parametro sera o IPCA, na forma do art. 389, paragrafo unico, do Codigo Civil (0,20). a.4) Quanto aos juros de mora, o parametro sera a SELIC, deduzido o IPCA (CC, art. 406, par. 1o) (0,20). a.5) O STJ, no julgamento do Tema 1368, estabeleceu a aplicacao da SELIC mesmo antes da entrada em vigor da Lei 14.905/2024 (0,20).","pont":"5 itens de 0,20","disp":["Sumula 43/STJ","CC, arts. 389 paragrafo unico, 397 e 406 par. 1o","Lei 14.905/2024","Tema 1368/STJ"]},{"trib":"TJ-GO","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjgo.jus.br/files/concursos/juizsubstituto/concurso59/EspelhoProvaDiscursiva.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/56-Prova-Discursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova discursiva do 59o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva. As provas de sentenca do 59o Concurso estao publicadas (https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/57-Sentenca-Civel.pdf e https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/58-Sentenca-Criminal.pdf), mas nao ha espelho correspondente na base.","cargo":"Juiz Substituto","disc":"Processo Civil","tema":"Consectarios como pedidos implicitos e materia de ordem publica","rot":"Questao 03 - itens b.1 e b.2","exig":"b.1) Os consectarios da condenacao sao pedidos implicitos, conforme disposicao do art. 322, par. 1o, do CPC (0,25). b.2) O STJ ja se posicionou ratificando esse entendimento: 'Os juros moratorios e a correcao monetaria, por se tratar de materia de ordem publica, podem ser apreciadas de oficio pelo magistrado, independentemente de solicitacao ou recurso da parte, e a modificacao dos seus termos nao caracteriza reformatio in pejus' (STJ, 1a Turma, AgInt no AREsp 2.821.566-DF, Rel. Min. Benedito Goncalves, julgado em 22/9/2025, Info 28 - Edicao Extraordinaria) (0,25).","pont":"2 itens de 0,25","disp":["CPC, art. 322 par. 1o","STJ AgInt no AREsp 2.821.566-DF"]},{"trib":"TJ-GO","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjgo.jus.br/files/concursos/juizsubstituto/concurso59/EspelhoProvaDiscursiva.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/56-Prova-Discursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova discursiva do 59o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva. As provas de sentenca do 59o Concurso estao publicadas (https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/57-Sentenca-Civel.pdf e https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/58-Sentenca-Criminal.pdf), mas nao ha espelho correspondente na base.","cargo":"Juiz Substituto","disc":"Processo Civil","tema":"Honorarios advocaticios em condenacoes de valor elevado (Temas 1076/STJ e 1255/STF)","rot":"Questao 03 - itens c.1 e c.2","exig":"c.1) A condenacao em valores elevados nao justifica a fixacao equitativa de honorarios advocaticios, conforme tese fixada pelo STJ no julgamento do Tema 1076; ressalte-se que, apesar de o Tema 1255 do STF tratar sobre a possibilidade de fixacao equitativa em condenacoes elevadas, a discussao diz respeito a condenacao da Fazenda Publica, nao se aplicando ao caso em tela (0,50). c.2) Consoante o entendimento fixado no STJ (2a Secao, REsp 1.746.072-PR, Rel. Min. Nancy Andrighi, Rel. p/ acordao Min. Raul Araujo, julgado em 13/02/2019, Info 645), a ordem do art. 85, par. 2o, do CPC e de observancia obrigatoria, razao pela qual a fixacao dos honorarios deve incidir sobre o valor da condenacao (0,50).","pont":"2 itens de 0,50","disp":["CPC, art. 85 par. 2o","Tema 1076/STJ","Tema 1255/STF","STJ REsp 1.746.072-PR"]},{"trib":"TJ-GO","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjgo.jus.br/files/concursos/juizsubstituto/concurso59/EspelhoProvaDiscursiva.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/56-Prova-Discursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova discursiva do 59o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva. As provas de sentenca do 59o Concurso estao publicadas (https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/57-Sentenca-Civel.pdf e https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/58-Sentenca-Criminal.pdf), mas nao ha espelho correspondente na base.","cargo":"Juiz Substituto","disc":"Processo Penal","tema":"Competencia por conexao probatoria e prevencao por medidas protetivas","rot":"Questao 04 - letra a (nota da questao: 2,5)","exig":"Em razao da conexao probatoria entre as infracoes (art. 76, III, do CPP), diante do concurso de jurisdicoes da mesma categoria, devem ser observadas as disposicoes do art. 78, II, 'a' e 'b', do CPP, preponderando o local da infracao com pena mais grave e, se as penas forem de igual gravidade, o local com o maior numero de infracoes, o que atrai a competencia do Juizado de Violencia Domestica da Comarca de Goiania. A concessao das medidas protetivas de urgencia pelo Juizo da Comarca de Anapolis nao gera a prevencao do Juizo para julgar a futura acao penal, ainda que se trate de crime de descumprimento de tais medidas, diante do carater autonomo das medidas protetivas de urgencia, que nao estao vinculadas e nao dependem da tipificacao penal da violencia, conforme art. 19, par. 5o e 6o, da Lei n. 11.340/06 e jurisprudencia atual do STJ.","pont":"ate 0,50 (escala 0,00 a 0,50, de 0,10 em 0,10)","disp":["CPP, arts. 76 III e 78 II 'a' e 'b'","Lei 11.340/06, art. 19 par. 5o e 6o"]},{"trib":"TJ-GO","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjgo.jus.br/files/concursos/juizsubstituto/concurso59/EspelhoProvaDiscursiva.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/56-Prova-Discursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova discursiva do 59o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva. As provas de sentenca do 59o Concurso estao publicadas (https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/57-Sentenca-Civel.pdf e https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/58-Sentenca-Criminal.pdf), mas nao ha espelho correspondente na base.","cargo":"Juiz Substituto","disc":"Processo Penal","tema":"Cadeia de custodia de prints e representacao no crime de ameaca (Lei 14.994/24)","rot":"Questao 04 - letra b","exig":"Vicios na cadeia de custodia nao invalidam automaticamente a prova, apenas afetam sua eficacia probatoria, cabendo ao juiz avalia-la junto aos demais elementos. No caso analisado, a propria vitima forneceu os prints a policia, e a defesa nao comprovou adulteracao; tambem nao foi demonstrado prejuizo a defesa, conforme exigem os arts. 563 e 566 do CPP, pois a conversa apresentada nao sustenta a condenacao, mas sugere um possivel consentimento da vitima a reaproximacao, conferindo substrato probatorio a tese defensiva de atipicidade do crime de descumprimento de medidas protetivas. Conforme a reforma legislativa promovida pela Lei n. 14.994/24, que introduziu o par. 2o ao art. 147 do Codigo Penal, nao mais se exige representacao para o crime de ameaca cometido contra mulher por razoes da condicao do sexo feminino; alem da reforma, a jurisprudencia do STJ ja era sedimentada no sentido de que a representacao nao exige maiores formalidades, sendo suficiente a demonstracao do interesse da vitima na persecucao criminal.","pont":"ate 0,50 (escala 0,00 a 0,50, de 0,10 em 0,10)","disp":["CPP, arts. 563 e 566","CP, art. 147 par. 2o","Lei 14.994/2024"]},{"trib":"TJ-GO","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjgo.jus.br/files/concursos/juizsubstituto/concurso59/EspelhoProvaDiscursiva.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/56-Prova-Discursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova discursiva do 59o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva. As provas de sentenca do 59o Concurso estao publicadas (https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/57-Sentenca-Civel.pdf e https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/58-Sentenca-Criminal.pdf), mas nao ha espelho correspondente na base.","cargo":"Juiz Substituto","disc":"Penal","tema":"Vias de fato x lesao corporal; emendatio libelli e prova da materialidade","rot":"Questao 04 - letra c","exig":"Quanto a lesao corporal do dia 15 de janeiro, nao ha materialidade para o crime do art. 129, par. 13, do CP, pois o empurrao e o puxao de cabelo nao resultaram em lesao a integridade fisica, conforme laudo de corpo de delito negativo; tais condutas configuram a contravencao penal de vias de fato (art. 21 do DL 3.688/41), com a majorante do par. 2o introduzida pela Lei n. 14.994/2024, cabendo a emendatio libelli (art. 383 do CPP) para readequar a tipificacao. Tambem foram aceitas as respostas que enquadraram a conduta na injuria real do art. 140, par. 2o, do CP. Ja em relacao a lesao corporal do dia 29 de janeiro, embora o exame de corpo de delito seja o meio tecnico mais adequado, sua ausencia nao impede o reconhecimento do crime quando existam outros elementos probatorios idoneos, nos termos dos arts. 167 e 182 do CPP; no caso, ha relatorio medico de profissional habilitado atestando as lesoes, elemento probatorio admitido pelo art. 12, par. 3o, da Lei 11.340/2006, corroborado pelas declaracoes coerentes e firmes da vitima, da testemunha e do proprio acusado, cenario suficiente para a comprovacao da materialidade.","pont":"ate 0,50 (escala 0,00 a 0,50, de 0,10 em 0,10)","disp":["CP, arts. 129 par. 13 e 140 par. 2o","DL 3.688/41, art. 21","CPP, arts. 167, 182 e 383","Lei 11.340/2006, art. 12 par. 3o","Lei 14.994/2024"]},{"trib":"TJ-GO","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjgo.jus.br/files/concursos/juizsubstituto/concurso59/EspelhoProvaDiscursiva.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/56-Prova-Discursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova discursiva do 59o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva. As provas de sentenca do 59o Concurso estao publicadas (https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/57-Sentenca-Civel.pdf e https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/58-Sentenca-Criminal.pdf), mas nao ha espelho correspondente na base.","cargo":"Juiz Substituto","disc":"Penal","tema":"Violacao de domicilio como tipo misto alternativo e consuncao","rot":"Questao 04 - letra d","exig":"Embora o ingresso inicial no apartamento tenha sido autorizado por Amanda, o art. 150 do CP e tipo misto alternativo, contemplando os verbos 'entrar' ou 'permanecer', bastando a pratica de qualquer deles para configurar o delito. A partir do momento em que Amanda ordenou a saida de Gustavo e ele insistiu em permanecer, consumou-se o crime na modalidade de permanencia indevida. Quanto a aplicacao do principio da consuncao entre a violacao de domicilio e a lesao corporal, a tese nao merece acolhimento, pois os crimes tutelam bens juridicos distintos, foram praticados com designios autonomos, e nao ha relacao de meio e fim entre as infracoes, ja que a invasao domiciliar nao constitui etapa necessaria para a consumacao da lesao corporal, conforme jurisprudencia atual do STJ.","pont":"ate 0,50 (escala 0,00 a 0,50, de 0,10 em 0,10)","disp":["CP, art. 150","Jurisprudencia do STJ"]},{"trib":"TJ-GO","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjgo.jus.br/files/concursos/juizsubstituto/concurso59/EspelhoProvaDiscursiva.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/56-Prova-Discursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova discursiva do 59o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva. As provas de sentenca do 59o Concurso estao publicadas (https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/57-Sentenca-Civel.pdf e https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/58-Sentenca-Criminal.pdf), mas nao ha espelho correspondente na base.","cargo":"Juiz Substituto","disc":"Penal","tema":"Atipicidade do descumprimento de medida protetiva por consentimento da vitima","rot":"Questao 04 - letra e","exig":"Quanto ao crime de descumprimento de medidas protetivas de urgencia, a conduta e atipica em razao do consentimento da vitima, conforme jurisprudencia do STJ. Os autos demonstram que foi a propria vitima quem tomou a iniciativa de contatar o reu via WhatsApp, concordando que ele fosse a sua residencia para retirar seus pertences. O reu nao praticou qualquer ato intimidatorio ou ameacador capaz de viciar o consentimento da vitima quando ela restabeleceu o contato, sendo inaplicaveis os precedentes do STJ nesse sentido.","pont":"ate 0,20 (escala 0,00/0,10/0,20)","disp":["Lei 11.340/2006, art. 24-A","Jurisprudencia do STJ"]},{"trib":"TJ-GO","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjgo.jus.br/files/concursos/juizsubstituto/concurso59/EspelhoProvaDiscursiva.pdf","prova":"https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/56-Prova-Discursiva.pdf","prova2":"","gab":"","conc":"https://www.tjgo.jus.br/index.php/juiz-substituto","nota":"Prova discursiva do 59o Concurso. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva. As provas de sentenca do 59o Concurso estao publicadas (https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/57-Sentenca-Civel.pdf e https://docs.tjgo.jus.br/concursos/juizsubstituto/concurso59/58-Sentenca-Criminal.pdf), mas nao ha espelho correspondente na base.","cargo":"Juiz Substituto","disc":"Penal","tema":"Desclassificacao de ameaca para coacao no curso do processo","rot":"Questao 04 - letra f","exig":"Quanto ao segundo crime de ameaca descrito na denuncia, a conduta narrada configura, na verdade, o crime de coacao no curso do processo, previsto no art. 344 do Codigo Penal. A expressao proferida pelo reu, no sentido de que a vitima sofreria consequencias caso prestasse depoimento em juizo, revela nitido proposito de constrange-la a abster-se de prestar depoimento. E irrelevante a inexistencia de acao penal no momento da coacao, pois o tipo penal contempla intervencao em procedimento policial, e no caso ja havia registro da ocorrencia em sede policial e processo de medidas protetivas de urgencia. Nao foram aceitas como respostas validas a tipificacao no crime de ameaca, ou a desclassificacao para tipo penal diverso, haja vista o especial fim de agir na conduta (principio da especialidade), sendo certo que a questao indaga expressamente acerca da desclassificacao.","pont":"ate 0,30 (escala 0,00/0,10/0,20/0,30)","disp":["CP, arts. 147 e 344"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Constitucional","tema":"Competencia do juiz federal de 1o grau em causa entre Estado-membro e Uniao/autarquia federal","rot":"Questao 1","exig":"Sim. Embora o art. 102, I, 'f', da Constituicao Federal aparente determinar a competencia originaria do Supremo Tribunal para todas essas causas, tal regra e aplicavel somente as situacoes que envolvam ou possam envolver risco ao equilibrio do pacto federativo; nao sendo esse o caso, e nem o de outra regra especial, a competencia seguira a regra geral do art. 109, I, da Lei Maior. Artigos de mencao imprescindivel: art. 102, I, 'f', e art. 109, I, da CF. Criterios: respondeu que sim, como se fosse simples caso de aplicacao do art. 109, I, desconhecendo a regra especial - nota zero; respondeu que nao, mostrando conhecer a regra especial mas desconhecendo a exigencia do potencial conflito federativo - 0,25; respondeu no sentido do gabarito, citando o modo de interpretar o art. 102, I, 'f' - nota plena 0,5. Notas intermediarias revelam erros (ex.: 0,4 pela ausencia de indicacao do art. 102, I, 'f', embora com resposta correta).","pont":"0,5 (notas basicas: 0 / 0,25 / 0,50)","disp":["CF, art. 102 I 'f'","CF, art. 109 I"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Processo Civil","tema":"Inadequacao da acao popular usada como sucedaneo de acao civil publica","rot":"Questao 2 - letra (a)","exig":"Deve ser proferida sentenca de extincao: a via eleita e impertinente, pois a acao popular visa a anular ou a declarar a nulidade de ato administrativo lesivo a bens indicados (CF, art. 5o, LXXIII, e art. 1o da Lei 4.717/65), nao se destinando a meramente impor obrigacao de fazer, menos ainda sem apontar ato concreto a ser declarado nulo; admitir o uso contra alegada degradacao ambiental faria com que qualquer cidadao pudesse mover acao civil publica travestida de acao popular, enganando as regras de legitimacao da Lei 7.347/85. Mencao legal obrigatoria: ou ao art. 5o, LXXIII, da Lei Maior, ou ao art. 1o da Lei 4.717/65. Criterio: extincao por inadequacao da via eleita OU ilegitimidade ativa do cidadao para mover ACP recebem o ponto pleno (0,4); julgamento de improcedencia com abordagem dos aspectos indicados, em regra 0,35; quem assinala a incongruencia mas converte em diligencia ou determina alegacoes finais/emenda da inicial, 0,3 ou 0,35 conforme a densidade; quem julga procedente leva zero, assim como quem julga procedente em parte, quem julga improcedente sem notar a ACP travestida, e quem apenas determina abertura para alegacoes finais sem apontar a incongruencia.","pont":"0,4 (dentro de 1,0 da questao)","disp":["CF, art. 5o LXXIII","Lei 4.717/65, art. 1o","Lei 7.347/85"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Processo Civil","tema":"Duplo grau invertido na acao popular","rot":"Questao 2 - letra (b)","exig":"O art. 19 da Lei 4.717/65 e regra especial e a doutrina amplamente majoritaria assinala que se trata de duplo grau invertido, afastando a incidencia do art. 496 do CPC; assim, se o pedido for julgado procedente nao ha o duplo grau. A vasta maioria dos candidatos acertou o item e levou 0,2. Eventualmente, o candidato que - a par do art. 19 - tenha sustentado a incidencia concomitante do art. 496, I, do CPC podera levar de 0,1 a 0,2, desde que com forte e boa fundamentacao (exemplo: aplicacao subsidiaria do CPC somada ao fato de ser iliquida a sentenca, de modo a nao ser barrada a remessa pelo par. 3o do art. 496). Leva zero o candidato que aplicou o art. 496 sem analisar o art. 19 da Lei 4.717/65.","pont":"0,2","disp":["Lei 4.717/65, art. 19","CPC, art. 496"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Processo Civil","tema":"Assistencia litisconsorcial de autarquia federal em acao popular e devolucao dos autos","rot":"Questao 2 - letra (c)","exig":"A acao popular admite apenas a assistencia litisconsorcial formulada por outro cidadao, e nao por pessoa juridica (Lei 4.717/65, art. 6o, par. 5o). O IBAMA, em tese, e legitimado para promover acao civil publica, mas na impertinente acao popular nem ha posicao juridica sua a ser negativamente afetada. O juiz federal deve indeferir o ingresso da autarquia e devolver os autos ao juiz estadual, conforme art. 45, par. 3o, do CPC. Mencao obrigatoria: art. 6o, par. 5o, da Lei 4.717/65 e art. 45, par. 3o, do CPC. Quem respondeu corretamente, mas sem dispositivos legais, leva 0,3; quem citou que nao cabia a assistencia litisconsorcial de pessoa juridica e que a intervencao deve ser indeferida, citando a lei da acao popular mas sem citar a determinacao de retorno, recebe 0,25; quem respondeu que o juiz federal deve analisar o ingresso, ou que deve deferir o ingresso, recebe zero. E improprio determinar a convolacao da acao popular em acao civil publica.","pont":"0,4","disp":["Lei 4.717/65, art. 6o par. 5o","CPC, art. 45 par. 3o"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Administrativo","tema":"Natureza executoria da acao de desapropriacao para reforma agraria e pertinencia da prova pericial sobre produtividade","rot":"Questao 3","exig":"A acao de desapropriacao e processo de natureza executoria, nao de conhecimento: o titulo executivo se forma na fase administrativa, com o decreto que declara a area de interesse social para fins de reforma agraria, titulo com assento constitucional (CF, art. 184, par. 2o). Para levar o ponto cheio (0,75) o candidato deve: (a) apontar que a prova e impertinente devido a natureza executoria da acao, inclusive com rito sumario (CF, art. 184, par. 3o); (b) referir, de passagem, a relevancia da produtividade e do cumprimento da funcao social, nos termos do art. 185, II, e paragrafo unico, da CF, pois isso impossibilita a desapropriacao-sancao; (c) referir que a insurgencia contra esse aspecto, apurado no laudo administrativo, apenas pode ser discutida em acao autonoma, com embasamento legal - citar apenas a lei geral (art. 20 do Decreto-lei 3.365/41) sem a LC 76 ou ao menos o art. 5o da Lei 4.132/62 gera menos 0,1. Em geral cada item vale ate 0,25. A completa ausencia de base legal gera perda de 0,3. Quem afirma que a prova e pertinente perde dois tercos da questao, podendo atingir no maximo 0,25, e isso apenas se apontou, com precisao e base legal, a importancia da produtividade e do cumprimento da funcao social como impeditivos da desapropriacao-sancao; quem afirma pertinencia 'em nome do contraditorio e outras generalidades' leva zero. Quem assinala a impertinencia com a tese de que o merito administrativo nao pode ser discutido leva ate 0,25, ja que isso esta errado - nao se trata de avanco sobre o merito do ato administrativo, e sim de aspecto de legalidade.","pont":"0,75","disp":["CF, arts. 184 par. 2o e 3o, e 185 II e paragrafo unico","Decreto-lei 3.365/41, art. 20","LC 76/93, art. 9o","Lei 4.132/62, art. 5o"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Administrativo","tema":"Legitimidade ativa de autarquia federal em acao de improbidade apos a Lei 14.230/21","rot":"Questao 4 - item (a)","exig":"O candidato deve afastar a aplicacao literal do art. 17, caput, da Lei 8.429/92, julgado inconstitucional, e justificar a razao de a autarquia ter legitimidade ativa: o preceito, ao conferir legitimacao exclusiva ao MP, foi afastado pelo STF, ja que a legitimidade dos entes publicos prejudicados pelo ato improbo e ordinaria - defendem direito proprio e tem dever legal de zelar pela probidade de sua atuacao; o STF apontou que o art. 129, par. 1o, da Constituicao assinala que a legitimidade do Ministerio Publico para as acoes civis publicas nao impede a acao por outros legitimados. Resposta correta para levar 0,5: justifica a inconstitucionalidade, assinala o interesse da autarquia e cita o art. 129, par. 1o, da CF; tambem recebe 0,5 quem, sem citar esse preceito, explica a razao do afastamento do art. 17, caput, com principio constitucional e aponta ser a autarquia a pessoa interessada. Quem apenas copiou nota de rodape de vade mecum leva 0,2 (maximo 0,25); quem copiou o rodape e omitiu a referencia ao art. 17 leva 0,15; leva de 0,3 a 0,35 quem menciona a inconstitucionalidade do art. 17 e explica a legitimidade em razao da assercao do prejuizo, mas sem mencionar a razao da inconstitucionalidade; leva zero quem responde no sentido da ilegitimidade.","pont":"0,5","disp":["Lei 8.429/92, art. 17 caput","Lei 14.230/2021","CF, art. 129 par. 1o"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Administrativo","tema":"Atipicidade do ato de improbidade do art. 9o, V, da Lei 8.429/92","rot":"Questao 4 - item (b)","exig":"O candidato deve mostrar que a conduta nao corresponde, nem de longe, ao tipo do art. 9o, V, da Lei 8.429/92. A tipologia do art. 9o, embora nao exaustiva, exige vantagem ilicita, e nada no problema o indica - esse e o aspecto principal; nao ha vantagem ilicita nem desonestidade contra a administracao. Nao ha lenocinio nem tolerancia para com o lenocinio; eventual acordo entre colegas nao e vantagem indevida. A atuacao ao aferir dados de remuneracao de colegas e a eventual interferencia no desempenho das funcoes sao apuradas em processo disciplinar; a mera mencao a imoralidade so seria pertinente se ligada a um dos incisos do art. 11. O candidato que afastou o tipo, de modo claro e bem redigido, especialmente ao afastar a vantagem ilicita, leva 0,5. E equivocado afirmar que nao houve dolo ou dolo especifico: quem apenas afastou o dolo leva 0,1; quem deu explicacao correta mas disse nao existir dolo perde 0,1 (maximo 0,4); confundir lenocinio com prostituicao, -0,15; dizer que o rol do art. 9o e taxativo, -0,1; dizer que nao houve qualquer ilicito, -0,1; quem disse que ha improbidade leva zero.","pont":"0,5","disp":["Lei 8.429/92, arts. 9o V e 11"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Administrativo","tema":"Dispensa x inexigibilidade de licitacao em situacao emergencial (Lei 14.133/2021)","rot":"Questao 5 - letra (a)","exig":"A contratacao direta compreende a inexigibilidade e a dispensa de licitacao. O candidato deve explicar a razao de o caso nao se enquadrar como inexigibilidade; nao basta dizer que incide a regra de dispensa e citar o art. 75, VIII, afinal os casos de inexigibilidade sao numerus apertus (art. 74 da Lei 14.133). A inexigibilidade ocorre quando ha inviabilidade de competicao e, na situacao descrita, ha viabilidade - tanto que a licitacao ocorrera -, mas antes do seu termino e urgente e imperativa a contratacao direta, presente a situacao do art. 75, VIII. Obrigatoria a mencao ao art. 74, caput, e ao art. 75, VIII. Criterio: ponto cheio (0,5) para quem fez a diferenca e citou a lei; quem fez a diferenca e nao citou a legislacao perde 0,1; para quem apenas disse ser a situacao de dispensa, citando o art. 75, VIII, e mostrando adequacao ao caso, mas sem distinguir as duas figuras - 0,25; pontuacao menor (0,15) para quem disse ser a hipotese de dispensa sem ao menos explicar.","pont":"0,5","disp":["Lei 14.133/2021, arts. 74 caput e 75 VIII"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Administrativo","tema":"Vedacao de recontratacao do art. 75, VIII, e participacao da contratada na licitacao subsequente","rot":"Questao 5 - letra (b)","exig":"O candidato deve citar o art. 75, VIII, da Lei 14.133 e examinar se a parte final do preceito, ao vedar a recontratacao, inibe a possibilidade de quem foi contratado diretamente vencer o certame, mencionando a interpretacao do STF (a recontratacao vedada nao atinge a possibilidade de contratacao por licitacao e nem inibe a recontratacao emergencial que nao extrapole o prazo anuo). Criterio: quem nao abordou nem mencionou a parte final do inciso VIII, ainda que acerte a viabilidade do exito na licitacao, pode ganhar no maximo 0,2. Para o ponto pleno, alem de indicar a correta interpretacao, o candidato deve justificar que vedar a possibilidade de a contratada competir em licitacao equanime e violar a isonomia e a competitividade, e a propria essencia do art. 37, XXI, da CF. Varios candidatos citam erradamente a impossibilidade de recontratacao ou prorrogacao do contrato sem observar que isso pode ocorrer desde que nao ultrapassado o prazo de 1 ano; e errado citar recente decisao do STJ ou repetir a formula 'conforme decisoes dos Tribunais Superiores'. Referencia da banca: tese fixada pelo STF na ADI 6.890/DF, julgada em setembro de 2024, Rel. Min. Zanin.","pont":"0,5","disp":["Lei 14.133/2021, art. 75 VIII","CF, art. 37 XXI","STF ADI 6.890/DF"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Civil","tema":"Nexo de causalidade - dano direto e imediato (art. 403 do CC)","rot":"Questao 6","exig":"Nao ha nexo causal entre o falecimento de Justiniano e a conduta da Policia Rodoviaria Federal ao reter o veiculo. O art. 403 do Codigo Civil, inserido no capitu
