lo do inadimplemento das obrigacoes, traz a norma geral aplicavel, da qual se extrai que o nexo apenas existe se o dano e consequencia direta e imediata da conduta apontada como sua causa. O candidato nao precisa citar qualquer teoria (causalidade adequada, interrupcao do nexo causal, causa direta e imediata). Para o ponto cheio e necessario citar o art. 403 e indicar breve nocao sobre como se afere se o evento danoso e consequencia direta e imediata de certa conduta (exemplo dado pela banca: 'em abstrato, retrocedendo ao momento da retencao ilegal do veiculo, ve-se que a morte nao e, nem de longe, desdobramento normal, adequado ou provavel dessa conduta'). Ha tres notas basicas: zero para quem reconheceu a responsabilidade pela morte; 0,3 para quem afirmou corretamente que nao ha nexo mas nao explica como isso e aferido nem cita o art. 403 ou outra regra legal de causalidade (inclusive quem apenas cita a adocao de certa teoria); e a nota cheia (0,5) nos termos destacados.","pont":"0,5 (notas basicas: 0 / 0,3 / 0,5)","disp":["CC, art. 403"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Processo Civil","tema":"Cessao de credito judicial e desnecessidade de anuencia do executado no cumprimento de sentenca","rot":"Questao 7 - item (a)","exig":"A decisao e equivocada: nao ha necessidade de anuencia da Caixa Economica. O art. 108 do CPC e direcionado a fase de conhecimento; o cumprimento de sentenca (execucao de titulo judicial) segue, no que couber, o sistema do processo de execucao, conforme art. 771 do CPC, incidindo o art. 778, par. 1o, III, e par. 2o. Criterios: quem afirma estar correta a decisao com base no art. 108 leva zero, podendo levar 0,1 se percebeu que a regra diz respeito a fase de conhecimento; quem afirma que se trata de cessao de precatorio, zero; quem discute a validade da cessao sem aferir que a pergunta e sobre o ingresso do cessionario, zero; quem apenas afirma ser desnecessaria a anuencia sem citar legislacao, 0,3; quem cita o art. 778 e paragrafos mas nao o 771 ou o 513, nem diz que o sistema da execucao se aplica ao cumprimento, 0,4 (maximo 0,45). A pontuacao plena (0,5) exige a mencao ao art. 778 do CPC e seus paragrafos e ainda ao art. 771 ou 513, ou pelo menos a referencia de que o sistema do processo de execucao se aplica ao cumprimento.","pont":"0,5","disp":["CPC, arts. 108, 513, 771 e 778 par. 1o III e par. 2o"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Civil","tema":"Responsabilidade do cedente pela existencia do credito (art. 295 do CC) apos rescisoria","rot":"Questao 7 - item (b)","exig":"O candidato deve identificar que se trata de cessao de credito, com disciplina especifica. A cessao foi onerosa e o cedente responde pela existencia do credito (CC, art. 295). E errado dizer que nao ha responsabilidade porque a rescisao do julgado aconteceu depois da transferencia: quando o CC fala em responsabilidade pela existencia 'ao tempo da cessao', isso abrange o credito anulado ou declarado nulo, ou desconstituido por fato anterior ao negocio - a causa do esvaziamento e anterior e o credito e desconstituido desde a origem. A falta de nocao da possibilidade de rescisao e a boa-fe do cedente nao afastam a responsabilidade, que seria agravada em caso de ma-fe; essa responsabilidade se equipara, com a mesma logica, a decorrente de evicção. Ainda que nao houvesse a disciplina propria do art. 295, incidiria a regra do art. 884 do CC, nao sendo possivel que o cedente embolsasse valor sem causa. Quem respondeu que Pompeu nao tem direitos contra Brutus leva zero; quem respondeu apenas com base no enriquecimento sem causa, citando o art. 884, leva 0,2; quem apenas aplicou a evicção sem explicar o raciocinio analogico, 0,25 ou 0,3 conforme a profundidade. E necessario que o candidato diga o alcance da responsabilidade; afirmar a plena responsabilidade por perdas e danos e equivocado, ja que havia boa-fe (-0,1).","pont":"0,5","disp":["CC, arts. 295 e 884","CC/1916, art. 1.073"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Civil","tema":"Vicios redibitorios e autonomia do contrato de mutuo com alienacao fiduciaria","rot":"Questao 8 - item (a)","exig":"A garantia contra os vicios redibitorios existe em contratos comutativos e impoe que o alienante responda pelos defeitos ocultos existentes no bem transferido que o tornem improprio para uso adequado ou lhe diminuam o valor (CC, arts. 441 e ss.; CDC, art. 18). Essa garantia e a cargo do alienante e nada tem a ver com o contrato de mutuo (que nem e comutativo); nem ha sentido em 'redibir' o mutuo. A Caixa e fornecedora apenas de credito e sua atividade e posterior e independente da incorporacao; nada indica situacao proxima a do art. 54-F da Lei 8.078/90. Criterio: o candidato deve dizer que o contrato de financiamento nao se confunde com o de venda - o comprador adquiriu imovel pronto e de sua livre escolha, construido e vendido pela incorporadora -, com mencao ao art. 441 do CC ou ao art. 18 do CDC, ou ao menos que o mutuo e ajuste unilateral e gera obrigacoes diretas apenas do mutuario (ponto pleno 0,5); se nao citou preceito legal mas mostrou que nao se confundem os contratos, 0,35 ou 0,4 conforme a profundidade; se respondeu somente que a Caixa e apenas financiadora, sem citar a distincao dos contratos ou a lei, 0,2; respondeu que havia decadencia, zero; e erro dizer que o mutuo deve ser redibido ou rescindido por vicio de construcao, zero.","pont":"0,5","disp":["CC, arts. 441 e ss.","CDC, arts. 18 e 54-F"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Consumidor","tema":"Vistoria do agente financeiro e ausencia de solidariedade por vicios de construcao","rot":"Questao 8 - item (b)","exig":"O candidato deve apontar que a vistoria que a Caixa faz nao e um servico em prol do consumidor, e sim providencia em beneficio proprio, para aceitar a garantia que o mutuario dara ao financiamento; se o mutuante avaliou mal, isso se da em seu prejuizo proprio, ao nao exigir outra garantia. Ponto pleno 0,25. Citou apenas que a CEF, como mero agente financeiro, nao responde solidariamente por esses vicios, conforme tese do STJ (REsp 1.163.228), mas sem debater a que titulo ocorrem a vistoria e a avaliacao: recebe 0,15. A alegacao e de ilicito da Caixa e a suposta falha da vistoria deve ser analisada; por isso, quem apenas respondeu que a solidariedade nao se presume tambem leva zero. Respondeu que a CEF responde solidariamente: zero.","pont":"0,25","disp":["STJ REsp 1.163.228"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Tributário","tema":"Imunidade reciproca e responsabilidade da Uniao sucessora da RFFSA por IPTU preterito","rot":"Questao 9 - item (A)(i)","exig":"Quanto ao IPTU, o candidato deve dizer que a imunidade tributaria reciproca nao exonera o sucessor das obrigacoes tributarias relativas aos fatos juridicos tributarios ocorridos antes da sucessao. A materia e o Tema 224 do STF. Como a RFFSA nao era imune, a epoca da constituicao do fato gerador o IPTU era por ela devido.","pont":"0,3","disp":["Tema 224/STF","CTN, art. 130"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Tributário","tema":"Taxa de coleta domiciliar de lixo e alcance da imunidade reciproca","rot":"Questao 9 - item (A)(ii)","exig":"Quanto a TCDL, por se tratar de taxa, o candidato deve dizer que a exacao nao e abarcada pela imunidade de impostos, podendo ser cobrada - cf. art. 150, VI, caput, da CF/1988.","pont":"0,3","disp":["CF, art. 150 VI"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Tributário","tema":"Certidao positiva com efeito de negativa em favor da Fazenda Publica (Tema 273/STJ)","rot":"Questao 9 - item (B)","exig":"O item vale 0,4: a primeira parte vale 0,2, sendo 0,1 apenas por dizer o nome correto da certidao a ser emitida - certidao positiva com efeito de negativa - e mais 0,1 pela citacao da base legal, o art. 206 do CTN. O restante (0,2) e atribuido a explicacao da razao para expedicao de tais certidoes, cf. Tema Repetitivo 273: 'A Fazenda Publica, quer em acao anulatoria, quer em execucao embargada, faz jus a expedicao da certidao positiva de debito com efeitos negativos, independentemente de penhora, posto inexpropriaveis os seus bens'. Aceitou-se tambem, como variante, quem afirmou que a Fazenda Publica paga seus debitos judiciais pelo regime de precatorios, bem como o argumento da presuncao de solvabilidade dos entes publicos.","pont":"0,4 (0,1 + 0,1 + 0,2)","disp":["CTN, art. 206","Tema Repetitivo 273/STJ"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Outros","tema":"Salario-maternidade da segurada empregada e conceito de carencia (Previdenciario)","rot":"Questao 10 - letra (a)","exig":"Nao ha carencia para a segurada empregada receber o salario-maternidade, observadas as condicoes do art. 71 da Lei 8.213/91. Carencia e o numero de contribuicoes mensais indispensaveis para que o beneficiario faca jus ao beneficio, consideradas a partir do transcurso do primeiro dia dos meses de suas competencias (arts. 24 e 25 da Lei 8.213/91). Criterio de pontuacao: se colocar 'sim' leva zero; sem nenhum artigo de lei, mas resposta correta, 0,10; citar ao menos um dispositivo legal para obter 0,15; se apenas acertou o conceito de carencia, 0,05.","pont":"0,15","disp":["Lei 8.213/91, arts. 24, 25 e 71"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Outros","tema":"Carencia do salario-maternidade para contribuinte individual e facultativa (ADI 2110 e 2111)","rot":"Questao 10 - letra (b)","exig":"A Lei 8.213/91, no art. 25, III, preve carencia de 10 contribuicoes mensais para as seguradas contribuinte individual ou facultativa. Porem, no julgamento das ADI 2110 e 2111, o Plenario do STF julgou a inconstitucionalidade da exigencia de carencia para a fruicao do salario-maternidade, por ferir o principio da isonomia ao dar tratamento diferenciado a mulheres seguradas gravidas. Atualmente nao ha carencia. Pontuacao: sem a lei ou referencia ao STF (mencionar tribunais genericamente etc.), mas resposta correta, 0,15; para a pontuacao total tem que abordar 1) a diferenca existente na Lei, art. 25, III (categorias de segurados); 2) a decisao do STF; 3) o fundamento da decisao - cada item valendo de 0,1 a 0,15 pelo contexto.","pont":"0,35","disp":["Lei 8.213/91, art. 25 III","STF ADI 2110 e ADI 2111"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Outros","tema":"Salario-maternidade da mae adotante (Previdenciario)","rot":"Questao 10 - letra (c)","exig":"Nao faz diferenca. A Lei 12.873/13 altera a redacao do art. 71-A da Lei 8.213/91 e assegura a mae segurada adotante o mesmo periodo de 120 dias de salario-maternidade; ha diferenca apenas quanto ao fato de o INSS suportar o pagamento no caso da mae segurada adotante. Criterio de pontuacao: valor 0,15 - citar a Lei ou pelo menos o art. 71-A para pontuacao integral; nao precisa falar que o INSS paga ou a data de inicio do beneficio; sem a lei, mas resposta correta, 0,05.","pont":"0,15","disp":["Lei 8.213/91, art. 71-A","Lei 12.873/13"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Outros","tema":"Salario-maternidade da mae nao gestante em uniao homoafetiva (Tema 1072/STF)","rot":"Questao 10 - letra (d)","exig":"Quanto a mae segurada nao gestante, o STF fixou a tese, no RE 1.211.446 (Tema 1072), de que a mae segurada nao gestante tem direito ao gozo da licenca-maternidade (salario-maternidade); caso a companheira gestante tenha utilizado o beneficio, a mae nao gestante fara jus ao periodo analogo ao da licenca-paternidade. Criterio de pontuacao: fez a correta diferenciacao dos prazos e que so uma mae usa o beneficio pelos 120 dias, mesmo que ambas sejam seguradas, indicando que a questao e oriunda de decisao do STF em tese de repercussao geral - integral, 0,35; nao falou do prazo analogo da licenca-paternidade, perde 0,15; falou muito genericamente, 0,10. Observacao final da banca: 'Atencao ao portugues, regras de regencia e clareza de texto (em geral, pela gravidade do erro foi retirado em torno de 0,05 por cada item)'.","pont":"0,35","disp":["STF RE 1.211.446 - Tema 1072"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Processo Penal","tema":"Encontro fortuito de provas (serendipidade de segundo grau) em busca e apreensao","rot":"Questao 11 - item (a)","exig":"Trata-se de encontro fortuito de provas, tambem chamado de serendipidade - de segundo grau, pois as provas encontradas nao tem conexao com o objeto originario da busca. Nesse caso, a validade do encontro esta vinculada ao devido processo legal no cumprimento do mandado: se a prova foi encontrada no desdobramento normal da busca autorizada, ela esta integralmente valida. O fato de as provas terem sido encontradas em notebook pessoal, nao relacionado as atividades empresariais, nao desvirtua a busca, ja que havia previsao de apreensao desses dispositivos no mandado; o fato de ter sido encontrado em notebook localizado entre os pertences do filho menor tambem nao interfere na validade, ja que o mandado nao restringia a coleta de dispositivos e persiste a necessidade de investigacao da origem do material antes de haver imputacao. TABELA DE PONTUACAO: responde tratar-se de encontro fortuito de provas ou serendipidade, assinala que a prova nao tem relacao com o objeto do mandado inicial mas sua apreensao sera licita se o mandado foi cumprido de forma legal, e aponta que o material foi apreendido entre os objetos abrangidos pela autorizacao judicial - 0,5 pontos; indica que o material nao tem relacao com a medida de busca originaria e portanto e prova invalida - zero; indica tratar-se de encontro fortuito, mas por se tratar de notebook de menor conclui pela invalidade - zero; defende a validade da prova mas nao menciona 'encontro fortuito' ou 'serendipidade' - zero; nao menciona a ausencia de conexao com o crime investigado, mas aborda o restante - 0,3 pontos.","pont":"0,5 (tabela fechada)","disp":["CPP, arts. 240 e ss."]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Processo Penal","tema":"Competencia da Justica Federal em crimes de pornografia infantil (Tema 393/STF)","rot":"Questao 11 - item (b)","exig":"O material pedofilo-pornografico apreendido podera se subsumir aos tipos dos arts. 241, 241-A ou 241-B da Lei 8.069/90, a depender das investigacoes. Em principio a competencia federal estaria garantida pelo art. 109, V, da Constituicao, mas isso nao basta: o STF, no Tema 393, fixou tese assinalando o criterio da transnacionalidade - 'Compete a Justica Federal processar e julgar os crimes consistentes em disponibilizar ou adquirir material pornografico, acessivel transnacionalmente, envolvendo crianca ou adolescente, quando praticados por meio da rede mundial de computadores (arts. 241, 241-A e 241-B da Lei n. 8.069/1990)'. TABELA DE PONTUACAO: resposta completa (tipos possiveis + exigencia de demonstracao da transnacionalidade, seja pelos participantes do grupo de troca, seja pela natureza da plataforma) - 0,5 pontos; nao menciona os tipos penais, mas fala de transnacionalidade - 0,2; nao menciona nenhum destes tipos da Lei 8.069 nem fala de transnacionalidade - zero; menciona apenas 2 tipos possiveis (241-A e 241-B), nao fundamentando - nao desconta nada; menciona apenas 1 tipo (241-A ou 241-B) - desconta 0,2; menciona apenas o 241 - zero; menciona genericamente tipos contidos entre 240 e 241-C do ECA - nao desconta; menciona 241 em associacao com o A ou B - desconta 0,3; nao menciona a transnacionalidade (ou termo equivalente) como criterio de definicao da competencia - zero; menciona que a competencia da justica federal se define pelo art. 109, V, da Constituicao - zero.","pont":"0,5 (tabela fechada)","disp":["ECA (Lei 8.069/90), arts. 241, 241-A e 241-B","CF, art. 109 V","Tema 393/STF"]},{"trib":"TRF2","ano":2024,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/gabarito-prova-discursiva-XVIII-cpjfs.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-discursiva.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova discursiva do XVIII Concurso, aplicada em 03/11/2024. O espelho publicado ja e o documento de gabarito da discursiva.","cargo":"Juiz Federal Substituto","disc":"Processo Penal","tema":"ANPP em processos em curso na vigencia da Lei 13.964/19 - direito intertemporal e confissao","rot":"Questao 12","exig":"A questao e resolvida aplicando-se a tese firmada pelo STF referente a aplicacao do ANPP em processos que ja estavam em curso no inicio da vigencia da Lei 13.964/19. O candidato deve registrar que a possibilidade de oferecimento de ANPP ate o transito em julgado se aplica como solucao de direito intertemporal; a regra do CPP para acoes ajuizadas apos a vigencia da lei estabelece que o ANPP seja proposto antes do oferecimento da denuncia, e nesses casos o STF so admite o ANPP apos a denuncia quando ha circunstancia superveniente de carater objetivo que autorize o acordo, por exemplo a emendatio libelli (item 4 da tese aprovada). O candidato deve afirmar que nao e exigida a confissao dos reus na fase de investigacao ou no curso do processo para o firmamento do ANPP; na questao, ambos os reus fazem jus a proposta, nao havendo distincao entre a re que confessou em sede policial e o reu que nao confessou. TABELA DE PONTUACAO: resposta completa e bem estruturada, sem erros de portugues - 0,5 pontos; afirmar que o MP tem razao quanto aos obices de preclusao e de ausencia de confissao - zero; responde que o STF afirmou que o ANPP pode ser apresentado a qualquer tempo ate o transito em julgado, ainda que sem confissao, sem destacar que se trata de questao de direito intertemporal - 0,3 ou 0,4; responde corretamente sobre o oferecimento ate o transito em julgado para processos em curso, ressaltando a regra de transicao, mas nao trata do momento da exigencia da confissao - 0,3; responde sobre o ANPP ate o transito em julgado sem destacar a questao intertemporal e sem tratar da confissao - 0,2; trata apenas da questao da confissao - 0,1 ou 0,2; responde de forma generica que 'os tribunais superiores decidiram' - 0,1.","pont":"0,5 (tabela fechada)","disp":["CPP, art. 28-A","Lei 13.964/2019","CPP, art. 383 (emendatio libelli)"]},{"trib":"TRF2","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/espelho-prova-de-sentenca-civel-rev1.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-sentenca-civil.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova pratica de sentenca civel do XVIII Concurso, aplicada em 02/11/2024 (espelho publicado em 15/01/2025). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Processo Civil","tema":"Competencia da Justica Federal em execucao fiscal movida pela Uniao (art. 109, I, da CF)","rot":"Aspecto 1 - Preliminar de competencia","exig":"O candidato deve iniciar a analise pela afirmacao da competencia da Justica Federal, questionada nos embargos. Basta dizer que a Uniao Federal e a parte exequente, o que faz incidir a regra do art. 109, I, da Lei Maior; por ser a Justica Federal competente, ela examinara se o exequente e parte legitima. A inversao e erro: e incorreto iniciar o exame pelo tema da legitimidade ativa, desafiando a ordem tecnica e logica que exige, primeiramente, o exame dos pressupostos processuais a partir da competencia do juizo - apenas o juizo competente pode examinar a legitimidade da parte. E equivocado dizer que competencia se confunde com legitimidade, ou que, fixada a legitimidade, existe a competencia federal. E a presenca, na posicao legalmente indicada, das pessoas listadas no art. 109, I, da CF, que afirma a competencia civel da Justica Federal, e nao o eventual interesse abstrato. Disputa no maximo 0,5 quem afirma que competencia se confunde com legitimidade, ou inverte a analise, ou comete os dois erros - e, para obter esse saldo de 0,5, e necessario que, apesar da confusao, afirme claramente que o bastante e a incidencia do art. 109, I, da Lei Maior.","pont":"1,0","disp":["CF, art. 109 I"]},{"trib":"TRF2","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/espelho-prova-de-sentenca-civel-rev1.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-sentenca-civil.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova pratica de sentenca civel do XVIII Concurso, aplicada em 02/11/2024 (espelho publicado em 15/01/2025). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Tributário","tema":"Capacidade tributaria ativa quanto as contribuicoes de terceiros (Sistema S) apos a Lei 11.457/2007","rot":"Aspecto 2 - Legitimidade ativa da Uniao","exig":"A legitimidade ativa da Uniao e ordinaria, na qualidade de detentora da capacidade tributaria ativa e de titular do direito/dever de fiscalizar e arrecadar as contribuicoes em favor do Sistema 'S', desde o advento da Lei 11.457/2007 (Lei da SuperReceita): ate 1,40 para a explanacao e 0,10 para a citacao do art. 3o, caput, da Lei 11.457/2007. Mesmo sem citar o art. 3o, o candidato pode apontar a legitimacao ordinaria com raciocinio a partir de posicao do STJ, ainda que sem citar a numeracao do enunciado 666 da Sumula do STJ (a legitimidade passiva em demandas de restituicao de contribuicoes de terceiros esta vinculada a capacidade tributaria ativa; as entidades terceiras, meras destinatarias, nao tem legitimidade). Como sao meras destinatarias e nao podem figurar no polo passivo de demandas de repeticao, tampouco podem ser sujeito ativo desta cobranca (CTN, art. 7o). Observacoes da banca: e erro centrar o argumento sobre a legitimidade ad causam na teoria da assercao, pois aqui nao ha assercao a ser discutida como merito; e tambem e impreciso dizer que a titularidade do direito equivale a legitimacao ad causam ativa, pois isso ignora a legitimacao extraordinaria. Precedente citado: STJ, EREsp 1.571.933/SC, Rel. Min. Gurgel de Faria, 1a Secao, j. 13/12/2023.","pont":"1,5 (ate 1,40 explanacao + 0,10 dispositivo)","disp":["Lei 11.457/2007, art. 3o caput","Sumula 666/STJ","CTN, art. 7o","STJ EREsp 1.571.933/SC"]},{"trib":"TRF2","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/espelho-prova-de-sentenca-civel-rev1.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-sentenca-civil.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova pratica de sentenca civel do XVIII Concurso, aplicada em 02/11/2024 (espelho publicado em 15/01/2025). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Tributário","tema":"Contagem do prazo do art. 40 da LEF e Tema 566/STJ","rot":"Aspecto 3 - Prescricao intercorrente","exig":"Quem acata a prescricao perde os pontos do item e, ao nao examinar os aspectos 4 e 5, ou ao faze-lo erradamente, tambem perde os pontos desses itens subsequentes. Os dois pontos sao divididos em duas analises. No primeiro aspecto (valor total 1,5), o candidato deve abordar a contagem do prazo e afirmar que a prescricao intercorrente nao se consumou, ja que os cinco anos do art. 40 da LEF (mencao obrigatoria) so se iniciam apos transcorrido um ano da decisao que suspendeu a execucao fiscal (art. 40, par. 4o, da LEF): no prazo de 5 anos nao se computa o ano de suspensao, de modo que a afirmacao da prescricao exigiria o total de 6 anos (Sumula 314/STJ). No caso, a penhora se deu 5 anos e 9 meses apos a decisao que suspendeu o curso da execucao, de modo que nao ha consumacao do tempo exigido. O meio ponto restante advem da identificacao de que a ausencia de decisao de arquivamento nao afeta a contagem (0,40) e da mencao a existencia de posicao do STJ, ainda que sem citar numeracao de tese (0,10) - Tema 566 do STJ.","pont":"2,0 (1,5 + 0,40 + 0,10)","disp":["Lei 6.830/80 (LEF), art. 40 e par. 1o, 2o, 3o e 4o","Sumula 314/STJ","Tema 566/STJ"]},{"trib":"TRF2","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/espelho-prova-de-sentenca-civel-rev1.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-sentenca-civil.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova pratica de sentenca civel do XVIII Concurso, aplicada em 02/11/2024 (espelho publicado em 15/01/2025). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Tributário","tema":"EC 33/2001, art. 149, par. 2o, III, 'a', e art. 240 da CF (Tema 325/STF)","rot":"Aspecto 4 - Recepcao das contribuicoes do Sistema S","exig":"O candidato deve afirmar a recepcao, pela Constituicao de 1988, das contribuicoes do Sistema 'S'. Por dois caminhos pode obter a pontuacao plena. Caminho 1: explanacao de que o rol de bases de calculo do art. 149, par. 2o, III, 'a', da CF/1988 (redacao da EC 33/2001) e meramente exemplificativo e nao exclui a incidencia de contribuicoes do Sistema 'S' sobre folha de salarios, conforme o Tema 325 do STF ('As contribuicoes devidas ao SEBRAE, a APEX e a ABDI com fundamento na Lei 8.029/1990 foram recepcionadas pela EC 33/2001') - 1,8 pela explanacao, 0,1 pela mencao obrigatoria ao art. 149, par. 2o, III, 'a', e 0,1 pela citacao da existencia de decisao do STF com repercussao geral. Caminho 2: anotar que o art. 240 da CF/1988 expressamente ressalva as atuais contribuicoes compulsorias dos empregadores sobre a folha de salarios destinadas as entidades privadas de servico social e de formacao profissional vinculadas ao sistema sindical - ate 1,80 para a explanacao, 0,10 para a citacao do art. 240 e 0,10 para a citacao da existencia de posicao especifica do STF ou do STJ (EREsp 1.571.933/SC).","pont":"2,0 (1,8 + 0,1 + 0,1)","disp":["CF, arts. 149 par. 2o III 'a' e 240","EC 33/2001","Tema 325/STF","STJ EREsp 1.571.933/SC"]},{"trib":"TRF2","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/espelho-prova-de-sentenca-civel-rev1.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-sentenca-civil.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova pratica de sentenca civel do XVIII Concurso, aplicada em 02/11/2024 (espelho publicado em 15/01/2025). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Tributário","tema":"Base de calculo das contribuicoes ao Sistema S (Tema Repetitivo 1079/STJ)","rot":"Aspecto 5 - Limite de 20 salarios minimos","exig":"O candidato deve afastar o limite de 20 salarios-minimos como teto a base de calculo das contribuicoes ao SENAC: 2,00 pontos, sendo ate 1,90 para a explanacao e 0,10 para a citacao da existencia de posicao especifica do STJ em recurso repetitivo, sem necessidade de citar a numeracao. O STJ, no Tema Repetitivo 1079, decidiu que, para fatos geradores ocorridos em 2016, nao subsiste a limitacao de 20 salarios-minimos da base de calculo das contribuicoes parafiscais devidas ao SENAI, SESI, SESC e SENAC (Decreto-Lei 1.861/1981 com a redacao do DL 1.867/1981; Lei 6.950/1981, art. 4o e paragrafo unico; Decreto-Lei 2.318/1986, arts. 1o, I, e 3o). E incorreto falar, quanto ao item, que os embargos sao ineptos com o argumento de que nao discriminam o valor devido, pois a imputacao e de erro de lancamento, materia que - se correta a tese - poderia ser conhecida de oficio.","pont":"2,0 (1,9 + 0,1)","disp":["Tema Repetitivo 1079/STJ","Decreto-Lei 1.861/1981","Lei 6.950/1981, art. 4o","Decreto-Lei 2.318/1986, art. 1o I"]},{"trib":"TRF2","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/espelho-prova-de-sentenca-civel-rev1.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-sentenca-civil.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova pratica de sentenca civel do XVIII Concurso, aplicada em 02/11/2024 (espelho publicado em 15/01/2025). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Sentença (estrutura)","tema":"Improcedencia dos embargos, custas, honorarios e remessa necessaria","rot":"Aspecto 6 - Dispositivo","exig":"No caso de ter seguido a linha correta, o candidato deve julgar improcedentes os embargos a execucao fiscal, com resolucao do merito - essa simples referencia vale 0,50. Nao ha custas (0,50 - art. 7o da Lei 9.289/1996) e os honorarios advocaticios em favor da Uniao estao abrangidos pelo encargo legal presente na CDA (0,50), conforme art. 1o do Decreto-Lei 1.025/69, Sumula 168 do TFR ou REsp 1.143.320 (repetitivo), sem necessidade de citacao de dispositivo ou sumula. Nao ha necessidade de indicar a inexistencia de remessa necessaria; caso o candidato submeta erroneamente o feito ao reexame necessario, perde 0,25; e errado dizer, para quem rejeitou os embargos, que o feito nao se submete a remessa por nao ter atingido o valor de alcada. Dois candidatos julgaram procedente a execucao, 'em erro colossal', pois sao os embargos que estao em julgamento - aplicado zero no item e perda de pontos. Os candidatos que acataram os embargos, no todo ou em parte, tiveram o dispositivo avaliado (tambem ate 1,5) a partir da congruencia com a fundamentacao; e tumultuario julgar procedente em parte os embargos e abrir posterior liquidacao; considerou-se adequada a determinacao de substituicao da CDA para permitir a continuidade da execucao, com nova intimacao; tambem nesse caso nao ha custas e os honorarios continuam computados no encargo legal da CDA ajustada; aceitou-se, com justificacao, tanto a afirmacao da submissao ao duplo grau obrigatorio, diante do valor iliquido, quanto a aplicacao do art. 496, par. 3o, do CPC.","pont":"1,5 (0,50 + 0,50 + 0,50)","disp":["Lei 9.289/1996, art. 7o","Decreto-Lei 1.025/69, art. 1o","Sumula 168/TFR","STJ REsp 1.143.320","CPC, art. 496 par. 3o"]},{"trib":"TRF2","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/espelho-prova-de-sentenca-civel-rev1.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-sentenca-civil.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova pratica de sentenca civel do XVIII Concurso, aplicada em 02/11/2024 (espelho publicado em 15/01/2025). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Sentença (estrutura)","tema": c.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/espelho-de-sentenca-criminal.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-sentenca-criminal.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova pratica de sentenca criminal do XVIII Concurso, aplicada em 03/11/2024 (espelho publicado em 15/01/2025). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Processo Penal","tema":"Alegada infiltracao de agentes","rot":"Preliminar 3","exig":"Rejeicao da alegacao de nulidade da tecnica de investigacao consistente no uso de agente infiltrado: a situacao nao se confunde com infiltracao, pois o integrante do grupo criminoso que, por conta propria, realiza a gravacao ambiental de conversas com outros integrantes e assume postura colaborativa nao se equipara ao agente policial infiltrado de que tratam o art. 53, I, da Lei 11.343/06 e os arts. 10 a 14 da Lei 12.850/13.","pont":"0,40","disp":["Lei 11.343/06, art. 53 I","Lei 12.850/13, arts. 10 a 14"]},{"trib":"TRF2","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca criminal","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/espelho-de-sentenca-criminal.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-sentenca-criminal.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova pratica de sentenca criminal do XVIII Concurso, aplicada em 03/11/2024 (espelho publicado em 15/01/2025). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Processo Penal","tema":"Provas derivadas, interceptacoes telefonicas e prorrogacoes (Tema 661/STF)","rot":"Preliminar 4","exig":"Rejeicao da alegacao de nulidade de todas as provas que derivaram das gravacoes e de seu desentranhamento, notadamente as interceptacoes telefonicas e a apreensao da substancia entorpecente. Sendo licita a gravacao ambiental produzida pelo correu colaborador, nao ha provas ilicitas por derivacao; as interceptacoes foram autorizadas por juiz competente, as prorrogacoes respeitaram o prazo de 15 dias e foram renovadas de maneira fundamentada entre 15.09.22 e 23.12.22, o que se coaduna com a jurisprudencia do STF (Tema 661: sao licitas as sucessivas renovacoes de interceptacao telefonica, desde que verificados os requisitos do art. 2o da Lei 9.296/1996 e demonstrada a necessidade, com decisoes motivadas; sao ilegais as motivacoes padronizadas). O mandado de busca e apreensao tambem foi expedido pelo juiz competente.","pont":"0,40","disp":["Tema 661/STF","Lei 9.296/1996, art. 2o"]},{"trib":"TRF2","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca criminal","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/espelho-de-sentenca-criminal.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-sentenca-criminal.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova pratica de sentenca criminal do XVIII Concurso, aplicada em 03/11/2024 (espelho publicado em 15/01/2025). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Processo Penal","tema":"Compartilhamento de RIFs do COAF sem autorizacao judicial (Tema 990/STF)","rot":"Preliminar 5","exig":"Rejeicao da alegacao de nulidade dos relatorios do COAF juntados aos autos, encaminhados ao MPF sem autorizacao judicial, e, em decorrencia, rejeicao da nulidade da quebra de sigilo fiscal dos reus como prova derivada. O tema foi apreciado pelo STF em repercussao geral (Tema 990), reputando constitucional o compartilhamento dos RIFs do COAF (atual UIF) sem previa autorizacao judicial, bastando que a comunicacao seja feita por meio oficial e mantido o sigilo. Na hipotese nao houve requisicao do MPF ao COAF, mas compartilhamento por iniciativa do proprio orgao de fiscalizacao; nao ha ilegalidade na quebra de sigilo fiscal deferida pelo juiz federal competente.","pont":"0,40","disp":["Tema 990/STF"]},{"trib":"TRF2","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca criminal","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/espelho-de-sentenca-criminal.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-sentenca-criminal.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova pratica de sentenca criminal do XVIII Concurso, aplicada em 03/11/2024 (espelho publicado em 15/01/2025). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Processo Penal","tema":"Inepcia da denuncia arguida pela defesa de Maria","rot":"Preliminar 6 (ineptia da denuncia quanto a Maria)","exig":"A Banca considerou admissivel o acolhimento da alegacao de inepcia ou o exame do tema como merito (a pontuacao ocorre em conjunto com o merito). Nao houve conduta tipica atribuivel a Maria: ha mera mencao a suposta participacao ativa, sem liga-la a qualquer fato, e ha diversos precedentes do STJ permitindo a alegacao de vicios da denuncia ate as alegacoes finais. Era igualmente admissivel deixar para o merito a analise da tese defensiva.","pont":"pontuada em conjunto com o merito","disp":["CPP, arts. 395 I e 41","STJ ivas. Devem ser rejeitadas as alegacoes de inexigibilidade de conduta diversa, pois nao ha situacao limite que o tenha compelido a aderir ao grupo criminoso; Antonio e coautor dos crimes e nao participe, nao se caracterizando participacao de menor importancia.","pont":"0,75","disp":["Lei 11.343/06, arts. 33, 35 e 40 I","Lei 9.613/98, art. 1o","CP, arts. 29 par. 1o e 69"]},{"trib":"TRF2","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca criminal","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/espelho-de-sentenca-criminal.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-sentenca-criminal.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova pratica de sentenca criminal do XVIII Concurso, aplicada em 03/11/2024 (espelho publicado em 15/01/2025). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Penal","tema":"Absolvicao por atipicidade ou rejeicao da denuncia por inepcia","rot":"Merito - autoria de MARIA","exig":"Absolvicao de todos os delitos por atipicidade da conduta ou rejeicao da denuncia por inepcia. Maria deve ser absolvida, pois o fato de figurar como socia na empresa utilizada para o trafico nao e suficiente para condena-la; o MPF nao imputou nenhum fato tipico nem especificou como se deu sua participacao, restringindo-se a afirmar que, por ser socia-gerente da GRAO DO BRASIL LTDA, teria contribuido para a pratica criminosa.","pont":"0,75","disp":["CPP, arts. 386 III e 395 I"]},{"trib":"TRF2","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca criminal","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/espelho-de-sentenca-criminal.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-sentenca-criminal.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova pratica de sentenca criminal do XVIII Concurso, aplicada em 03/11/2024 (espelho publicado em 15/01/2025). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Penal","tema":"Condenacao com perdao judicial ao colaborador e extincao da punibilidade","rot":"Merito - autoria de ROGERIO","exig":"Condenacao por associacao e trafico, mas com perdao judicial e extincao da punibilidade. Tendo em vista a participacao decisiva de Rogerio no desbaratamento da associacao criminosa, na apreensao da droga no Porto de Itaguai e na prisao dos agentes, deve ser aplicado o perdao judicial nos termos do art. 13 da Lei 9.807/1999 e do art. 4o da Lei 12.850/13, declarando-se extinta a punibilidade (CP, art. 107, IX). As regras sao aplicaveis a qualquer colaboracao, admitindo o processo penal interpretacao extensiva e analogica (STJ, HC 582.678/RJ, Rel. Min. Laurita Vaz, 6a Turma, j. 14/6/2022, Informativo 742).","pont":"0,75","disp":["Lei 9.807/1999, art. 13","Lei 12.850/13, art. 4o","CP, art. 107 IX","STJ HC 582.678/RJ"]},{"trib":"TRF2","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca criminal","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/espelho-de-sentenca-criminal.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-sentenca-criminal.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova pratica de sentenca criminal do XVIII Concurso, aplicada em 03/11/2024 (espelho publicado em 15/01/2025). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Penal","tema":"Condenacao por trafico internacional com trafico privilegiado e absolvicao da associacao","rot":"Merito - autoria de PAULO","exig":"Rejeicao da tese defensiva de ausencia de dolo e condenacao por trafico internacional de drogas, com a causa de diminuicao relativa ao trafico privilegiado, e absolvicao quanto ao delito de associacao para o trafico, por ausencia de provas (CPP, art. 386, V ou VII). Paulo transportou a droga apreendida no Porto de Itaguai, mas nao ha evidencia de que integrasse a associacao criminosa ou participasse de outros eventos de trafico internacional.","pont":"0,75","disp":["Lei 11.343/06, arts. 33 par. 4o e 40 I","CPP, art. 386 V e VII"]},{"trib":"TRF2","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca criminal","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/espelho-de-sentenca-criminal.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-sentenca-criminal.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova pratica de sentenca criminal do XVIII Concurso, aplicada em 03/11/2024 (espelho publicado em 15/01/2025). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Penal","tema":"Condenacao apenas por lavagem de dinheiro","rot":"Merito - autoria de CRISTINA","exig":"Rejeicao da tese defensiva de desconhecimento da origem ilicita dos recursos, com condenacao por lavagem de dinheiro e absolvicao quanto a imputacao de associacao para o trafico, por ausencia de provas (CPP, art. 386, V ou VII). Cristina nao praticou o crime antecedente como autora ou participe, mas tinha ciencia da origem criminosa do dinheiro, evidenciada nos dialogos interceptados.","pont":"0,75","disp":["Lei 9.613/98, art. 1o","CPP, art. 386 V e VII"]},{"trib":"TRF2","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca criminal","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/espelho-de-sentenca-criminal.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-sentenca-criminal.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova pratica de sentenca criminal do XVIII Concurso, aplicada em 03/11/2024 (espelho publicado em 15/01/2025). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Sentença (estrutura)","tema":"Parte dispositiva da sentenca criminal","rot":"Dispositivo","exig":"O pedido formulado na denuncia deve ser julgado parcialmente procedente, para: CONDENAR JOSE e ANTONIO nas penas dos arts. 33 e 35 c/c art. 40, I, da Lei 11.343/06 e art. 1o da Lei 9.613/98; ABSOLVER MARIA de todas as imputacoes (CPP, art. 386, III) ou REJEITAR A DENUNCIA (CPP, art. 395, I); DECLARAR A EXTINCAO DA PUNIBILIDADE DE ROGERIO (CP, art. 107, IX, e art. 13 da Lei 9.807/99) ou CONDENA-LO nas penas dos arts. 33 e 35 c/c arts. 40, I, e 41 da Lei 11.343/06, em concurso material (CP, art. 69); CONDENAR PAULO somente no art. 33, par. 4o, c/c art. 40, I, da Lei 11.343, pelo envio dos 230 quilos, absolvendo-o (CPP, art. 386, V ou VII) quanto a associacao; CONDENAR CRISTINA somente no art. 1o da Lei 9.613/98, absolvendo-a (CPP, art. 386, V ou VII) quanto ao trafico e a associacao.","pont":"0,50","disp":["Lei 11.343/06, arts. 33, 35, 40 I e 41","Lei 9.613/98, art. 1o","CP, arts. 69 e 107 IX","CPP, arts. 386 III, V e VII, e 395 I"]},{"trib":"TRF2","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca criminal","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/espelho-de-sentenca-criminal.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-sentenca-criminal.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova pratica de sentenca criminal do XVIII Concurso, aplicada em 03/11/2024 (espelho publicado em 15/01/2025). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Penal","tema":"Sistema trifasico, art. 42 da Lei de Drogas, agravante de lideranca, causas de aumento e diminuicao","rot":"Diretrizes para a dosimetria","exig":"O candidato devera efetuar a dosimetria das penas de JOSE e ANTONIO (arts. 33 e 35 c/c art. 40, I, da Lei 11.343/2006 e art. 1o da Lei 9.613/1998, na forma do art. 69 do CP), de PAULO (art. 33, par. 4o) e de CRISTINA (art. 1o da Lei 9.613/98). Na 1a fase, valorar as circunstancias judiciais do art. 59 do CP (excetuado o comportamento da vitima); quanto aos arts. 33 e 35 da Lei 11.343/2006, sopesar a natureza e a qualidade da droga (art. 42) na circunstancia 'circunstancias do crime'. O criterio de fixacao da pena-base deve ser o de exasperacao de 1/8 do intervalo entre as penas minima e maxima para cada circunstancia judicial negativa, admitida certa discricionariedade. Na 2a fase, analisar atenuantes e agravantes, evitando bis in idem; poderia ser reconhecida a agravante de lideranca (CP, art. 62, I) em desfavor de Jose, desde que nao valorada negativamente sua culpabilidade pelo mesmo fato. Na 3a fase, a causa de diminuicao do art. 33, par. 4o, nao deve ser considerada para os reus que integram o grupo de forma estavel e permanente, sendo possivel para o que teve participacao episodica, com fracao concretamente fundamentada; a causa de aumento do art. 40, I, deve ser aplicada, embora sem pedido na denuncia, pois houve pedido expresso em alegacoes finais e a denuncia descreve a transnacionalidade, com fracao fundamentada e incidencia em cascata. Quanto a lavagem, nao deve ser aplicada a causa de aumento do par. 4o do art. 1o da Lei 9.613/1998, por ausencia de imputacao de organizacao criminosa e de pedido expresso. A atenuante da confissao espontanea (CP, art. 65, III, 'd') deve ser aplicada ao reu que confessou integralmente e a re que confessou parcialmente (Sumula 545 do STJ), sendo admissivel afasta-la em favor de Rogerio por bis in idem. Fixadas as penas individualmente, fazer o somatorio (CP, art. 69), fixar o valor do dia-multa, os regimes iniciais (CP, art. 33), a eventual detracao (CPP, art. 387, par. 2o) e analisar a substituicao (CP, art. 44). Realizada ou nao a dosimetria, deve ser concedido o perdao judicial (Lei 9.807/1999, art. 13) ao colaborador, com extincao da punibilidade; caso nao concedido, aplicar a fracao maxima do art. 41 da Lei 11.343/2006, com justificativa expressa.","pont":"2,0","disp":["CP, arts. 33, 44, 59, 62 I, 65 III 'd', 68 e 69","Lei 11.343/2006, arts. 33 par. 4o, 40 I, 41 e 42","Lei 9.613/1998, art. 1o par. 4o","Sumula 545/STJ","CPP, art. 387 par. 2o","Lei 9.807/1999, art. 13"]},{"trib":"TRF2","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca criminal","url":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/18/espelho-de-sentenca-criminal.pdf","prova":"https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/24/prova-sentenca-criminal.pdf","prova2":"","gab":"","conc":"https://www.trf2.jus.br/trf2/artigo/acma/18o-concurso-para-juiz-federal-substituto-da-2a-regiao","nota":"Prova pratica de sentenca criminal do XVIII Concurso, aplicada em 03/11/2024 (espelho publicado em 15/01/2025). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Processo Penal","tema":"Perdimento de bens, prisao preventiva, custas, art. 387, IV, do CPP e comandos finais","rot":"Disposicoes finais","exig":"Nao deve ser declarado o perdimento de todos os bens imoveis sequestrados e ativos financeiros bloqueados, mas apenas daqueles em relacao aos quais a acusacao estabeleceu link com a pratica dos crimes, quantificando o proveito auferido; deve ser decretado o perdimento dos bens comprovadamente havidos com a pratica do crime e utilizados na lavagem (CF, art. 243, paragrafo unico; Lei 11.343, art. 63, I; Lei 9.613/98, art. 4o, par. 10), liberando-se as constricoes sem comprovacao do link. Nao deve ser decretada a prisao preventiva da re absolvida nem do reu com perdao judicial; tampouco dos reus condenados, pois nao ha fato novo ou alteracao do quadro fatico - alternativamente, podem ser estabelecidas medidas cautelares (retencao de passaporte, autorizacao judicial previa para viagens internacionais); nao deve ser decretada prisao preventiva de reus cujo regime inicial seja aberto ou semiaberto, por incompatibilidade. Os reus condenados devem arcar com custas judiciais pro rata. Nao deve ser fixado valor minimo de reparacao (CPP, art. 387, IV), pois nao houve pedido do MPF na denuncia nem nas alegacoes finais, nao podendo o juiz faze-lo de oficio (STF RE 1.107.923 AgR; STJ REsp 2.149.880/MG). Deve haver comando de destruicao da droga, expedicao da carta de execucao apos o transito em julgado e oficio ao TRE.","pont":"0,50","disp":["CF, art. 243 paragrafo unico","Lei 11.343/06, art. 63 I","Lei 9.613/98, art. 4o par. 10","CPP, arts. 312, 319 e 387 IV","STF RE 1.107.923 AgR","STJ REsp 2.149.880/MG"]},{"trib":"TRF3","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca criminal","url":"https://www.trf3.jus.br/documentos/roco/XX_CONCURSO/ESPELHO_criminal_definitivo.pdf","prova":"https://www.trf3.jus.br/documentos/roco/XX_CONCURSO/Prova_sentenca_criminal_editada.pdf","prova2":"","gab":"","conc":"https://www minares - legitimidade da Associacao (letras a e b)","exig":"a) Refutar a primeira preliminar quanto a legitimidade da Associacao (0,25). b) Apresentar fundamentacao no sentido de que, apesar da constituicao ha menos de um ano, dada a relevancia do tema e a protecao de bem juridico coletivo, alem do objetivo associativo de defesa dos interesses da Comunidade Indigena, ha legitimidade com base no art. 232 da CF; o alcance da norma restritiva e combater a criacao artificial de associacoes, o que nao ocorre no caso. Os pontos so sao atribuidos com a referencia legal expressa a LACP, art. 5o, V, 'a', c/c par. 4o, e ao art. 232 da CF (0,50).","pont":"0,25 + 0,50 (bloco de preliminares: 2,0)","disp":["Lei 7.347/85, art. 5o V 'a' e par. 4o","CF, art. 232"]},{"trib":"TRF3","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.trf3.jus.br/documentos/roco/XX_CONCURSO/Espelho_-_Prova_Sentenca_Civil_denitivoRevisado2_.pdf","prova":"https://www.trf3.jus.br/documentos/roco/XX_CONCURSO/PrEscrita-SentencaCivil_reduzida.pdf","prova2":"","gab":"","conc":"https://www.trf3.jus.br/concurso-magistrado/concursos-anteriores/19o-concurso/default-title","nota":"2a Prova Escrita (Sentenca Civil) do XX Concurso, aplicada em 15/10/2022. URL listada na pagina oficial do XX Concurso do TRF3; o dominio trf3.jus.br bloqueia download direto deste ambiente (o espelho correspondente foi lido via fetch da propria URL). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Processo Civil","tema":"Falta de interesse processual e desnecessidade de previa tentativa de TAC","rot":"1) Preliminares - interesse de agir e TAC (letras c e d)","exig":"c) Refutar a falta de interesse de agir, relacionando essa condicao da acao a ausencia de utilidade e adequacao processual (CPC, art. 485, VI), com referencia expressa ao TAC - e nao ao inquerito civil, conforme o enunciado (0,25). d) Fundamentar que o TAC constitui negocio juridico bilateral expressamente previsto no par. 6o do art. 5o da Lei 7.347/1985, servindo como instrumento de conciliacao que exige interesse conciliatorio de ambas as partes; o sistema processual nao condiciona o ajuizamento da acao a previa tentativa de conciliacao, conforme o STJ (AgRg no AREsp 707.547/RS, Rel. Min. Benedito Goncalves, 17/11/2015). Os pontos sao atribuidos quando o candidato referencia a norma e a natureza conciliatoria do instituto; o conhecimento da decisao do STJ pode ser creditado na secao geral (portugues, raciocinio logico, erudicao) (0,25).","pont":"0,25 + 0,25","disp":["CPC, art. 485 VI","Lei 7.347/1985, art. 5o par. 6o","STJ AgRg no AREsp 707.547/RS"]},{"trib":"TRF3","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.trf3.jus.br/documentos/roco/XX_CONCURSO/Espelho_-_Prova_Sentenca_Civil_denitivoRevisado2_.pdf","prova":"https://www.trf3.jus.br/documentos/roco/XX_CONCURSO/PrEscrita-SentencaCivil_reduzida.pdf","prova2":"","gab":"","conc":"https://www.trf3.jus.br/concurso-magistrado/concursos-anteriores/19o-concurso/default-title","nota":"2a Prova Escrita (Sentenca Civil) do XX Concurso, aplicada em 15/10/2022. URL listada na pagina oficial do XX Concurso do TRF3; o dominio trf3.jus.br bloqueia download direto deste ambiente (o espelho correspondente foi lido via fetch da propria URL). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Processo Civil","tema":"Litispendencia entre acao civil publica e acao popular","rot":"1) Preliminares - litispendencia (letras e e f)","exig":"e) Examinar a preliminar de litispendencia entre a acao civil publica e a acao popular (CPC, art. 485, V), demonstrando a ausencia da triplice identidade, especificamente pela divergencia de pedidos, em que um pedido abrange o outro (0,25). f) Fundamentar que, embora o STJ entenda que os autores do processo coletivo atuam como substitutos processuais dos titulares do direito material coletivo (AgRg no REsp 1.505.359/PE, Rel. Min. Herman Benjamin, 2a Turma, j. 22/11/2016), falta identidade de pedidos; as acoes foram reunidas por conexao (CPC, art. 55, III, e Lei 7.347/1985, art. 2o, paragrafo unico), para evitar decisoes contraditorias, abrangendo a decisao os autos da acao popular. Os 0,25 sao atribuidos apenas quando o candidato examina o caso concreto e o processo coletivo especificamente (0,25).","pont":"0,25 + 0,25","disp":["CPC, arts. 55 III e 485 V","Lei 7.347/1985, art. 2o paragrafo unico","STJ AgRg no REsp 1.505.359/PE"]},{"trib":"TRF3","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.trf3.jus.br/documentos/roco/XX_CONCURSO/Espelho_-_Prova_Sentenca_Civil_denitivoRevisado2_.pdf","prova":"https://www.trf3.jus.br/documentos/roco/XX_CONCURSO/PrEscrita-SentencaCivil_reduzida.pdf","prova2":"","gab":"","conc":"https://www.trf3.jus.br/concurso-magistrado/concursos-anteriores/19o-concurso/default-title","nota":"2a Prova Escrita (Sentenca Civil) do XX Concurso, aplicada em 15/10/2022. URL listada na pagina oficial do XX Concurso do TRF3; o dominio trf3.jus.br bloqueia download direto deste ambiente (o espelho correspondente foi lido via fetch da propria URL). Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Federal Substituto","disc":"Sentença (estrutura)","tema":"Ordem de exame dos pedidos, limites da lide e providencias finais","rot":"2) Parte processual do dispositivo - aspectos gerais","exig":"Exame na ordem adequada dos pedidos principais e subsidiarios, julgamento nos limites do pedido, determinacao de publicacao/registro/intimacao e cumprimento.","pont":"0,25 (bloco de 1,0)","disp":["CPC, arts. 141 e 492"]},{"trib":"TRF3","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"se
