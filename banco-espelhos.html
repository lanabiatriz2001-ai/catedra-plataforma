5, 'a pontuação somente será conferida pela mencao concomitante ao caput e ao par. 6o' e 'a pontuação somente será atribuida se todas as opcoes legais forem apresentadas na resposta'.","o":"TJ-TO 2025"},{"t":"Diversos itens indicam 'Bibliografia de referência' com precedente do STF/STJ e numero do Informativo.","o":"TJ-TO 2025"},{"t":"Documento 'Conferência da Tabela de Questões - Disciplina A - Juiz Substituto'; a sentença cível indica 'Itens = 8' e a criminal 'Itens = 18', com 'Nota da Questão' = 10 em cada.","o":"TJ-TO 2025"},{"t":"Na sentença criminal, cada bloco traz entre parenteses a escala de pontuação no próprio titulo (p. ex., '0/0,25/0,50', '0/0,50/1,0/1,5', '0/0,20/0,40').","o":"TJ-TO 2025"},{"t":"A sentença criminal e dividida em '1. Fundamentação' e '2. Dispositivo (dosimetria e disposicoes finais) - (total: 6,0 pontos)'.","o":"TJ-TO 2025"},{"t":"Documento intitulado 'Espelho das Questões Discursivas TJPE'. Cada questão traz a coluna 'Itens' com o somatorio bruto dos itens e a linha 'Nota da Questão - Gabarito 1' com o valor final (1 ou 2 pontos).","o":"TJ-PE 2023"},{"t":"Cada item e pontuado por escala fechada de valores possíveis (ex.: 0,00 / 0,10 / 0,20 / 0,30), sem valores intermediarios.","o":"TJ-PE 2023"},{"t":"Em alguns itens há resposta alternativa admitida, indicada por 'OU' (p. ex., Questão 05).","o":"TJ-PE 2023"},{"t":"Documento 'ESPELHOS DAS SENTENCAS' do concurso TJPE, com blocos por quesito e coluna 'ITENS' com a pontuação.","o":"TJ-PE 2023"},{"t":"Cada quesito da sentença criminal traz linha final 'Pontuação: Adequacao da resposta ao gabarito proposto. Dispositivos legais [e Súmula do STJ]'.","o":"TJ-PE 2023"},{"t":"Cada quesito criminal traz também 'Fatores ensejadores de perda de pontos, para além da não adequacao ao gabarito proposto', com hipóteses expressas (p. ex., estruturação inadequada, analise no bojo do mérito propriamente dito, indicacao erronea de dispositivo, realização da dosimetria com base em crime diverso).","o":"TJ-PE 2023"},{"t":"Na sentença cível consta expressamente que 'A referência a teoria da asserção deveria ser acompanhada da cabivel conceituacao, além da aplicação no caso, com os motivos concretos para afastamento das preliminares'.","o":"TJ-PE 2023"},{"t":"Consta ainda: 'Não bastava a mencao do dispositivo legal, sem a pertinente fundamentação para sua incidência' e 'A singela asserção de que o dispositivo impoe a suspensão do prazo em vez de sua interrupcao não pontuou, porque parte da premissa equivocada'.","o":"TJ-PE 2023"},{"t":"Ao final da sentença cível: 'Em todos os topicos, foi avaliado, também, o raciocinio jurídico, a clareza e a forca [da argumentação]'.","o":"TJ-PE 2023"},{"t":"Documento 'Conferência da Tabela de Questões - Disciplina A - Juiz Substituto'; cada questão indica 'Itens = X' (somatorio bruto dos itens) e a linha 'Nota da Questão - Gabarito 1' com o valor final da questão (2 pontos cada).","o":"TJ-PE 2024"},{"t":"Diversos itens indicam 'Bibliografia de referência' com doutrina ou precedente (STJ/STF) e o numero do tema repetitivo.","o":"TJ-PE 2024"},{"t":"Espelho em tabela; cada quesito traz a escala completa de pontuação possível em incrementos de 0,10, de 0,00 até o teto do quesito.","o":"TJ-PE 2024"},{"t":"Cada sentença vale 10 pontos ('Nota da Questão' = 10).","o":"TJ-PE 2024"},{"t":"Varios quesitos exigem expressamente a 'necessária mencao' a um dispositivo determinado (p. ex., Art. 443, II, do CPC; Art. 834 do CC; Art. 209 do CC; Art. 119 da Lei de Recuperação e Falência; Art. 837 do CC).","o":"TJ-PE 2024"},{"t":"Documento reune os espelhos das varias questões dissertativas/discursivas, cada uma com seu valor total e a distribuição de pontos por item ('Critérios e distribuição dos pontos').","o":"TJ-PR 2021"},{"t":"Cabia ao candidato redigir a sentença cível - nota entre 0,00 e 10,00 -, dando solucao ao caso, em analise das questões postas pelas partes, das matérias de fato é de direito e da prova produzida, dispensado o relatório e sem o acrescimo de fatos novos, notadamente com observancia dos incisos II (fundamentos) e III (dispositivo) do art. 489 do CPC, além dos seus paragrafos 1o a 3o.","o":"TJ-PR 2021"},{"t":"Espelho estruturado em 'Aspectos', cada um com faixa de pontuação ('entre 0,00 a X'), acompanhados de blocos de 'Critério de pontuação' e 'Justificativa' (com os precedentes do STJ).","o":"TJ-PR 2021"},{"t":"Critério expresso no Aspecto 1: 'para obtencao da nota integral, a rejeicao da preliminar deve conter tal fundamentação, com alusao a mais de um dos dispositivos legais referidos'.","o":"TJ-PR 2021"},{"t":"Critério expresso no Aspecto 2: 'receberá pontuação parcial a rejeicao da prejudicial, com lastro em prazo quinquenal disposto em outra legislação'.","o":"TJ-PR 2021"},{"t":"Critério expresso no Aspecto 3: 'receberá pontuação parcial tanto a apreciacao do mérito sob o enfoque da responsabilidade objetiva, como o eventual reconhecimento de culpa concorrente do autor, vertente que também repercutira na avaliacao dos demais pontos, em face do regramento do art. 945 do Código Civil'.","o":"TJ-PR 2021"},{"t":"Aspecto 10, conforme o edital: '14.1.2 Na avaliacao das provas, estando correta a resposta, considerar-se-a: conteudo e desenvolvimento pertinentes ao tema, capacidade de exposição e utilização correta da Língua Portuguesa'; '14.1.2.1 No topico referente a utilização correta da Língua Portuguesa, poderá ser descontado até no máximo 10% do valor total da nota'.","o":"TJ-PR 2021"},{"t":"A pontuação e atribuida por BLOCOS da sentença (o relatório foi dispensado): I - Fundamentação: 4,5; II - Dispositivo: 1,0; III - Dosimetria, inclusive multa, regime inicial, substituição e sursis: 3,3; IV - Demais questões e providências (reparação de danos materiais e morais coletivos, perdimento de bens, providências finais, autenticacao): 1,2.","o":"TJ-PR 2021"},{"t":"'Vicios da sentença que a tornem nula ou inexistente (por exemplo, ausência de dispositivo) resultarao na atribuição de nota zero a prova.'","o":"TJ-PR 2021"},{"t":"'Serão considerados na pontuação, além do acerto das questões técnicas, também: a estruturação da sentença, a pertinencia, clareza e lógica da fundamentação, o enfrentamento abrangente das questões suscitadas e relevantes ao caso e a qualidade da redação.'","o":"TJ-PR 2021"},{"t":"'Eventual dissenso da resposta do candidato em relação a proposta da banca será ponderada e eventualmente acolhida, desde que devidamente fundamentada no texto da prova de sentença.'","o":"TJ-PR 2021"},{"t":"'O candidato não deve se limitar a reproduzir o texto do enunciado e sim demonstrar que tem redação própria'; 'A discussao sobre temas estranhos ao objeto da fundamentação será ponderada em desfavor do candidato'.","o":"TJ-PR 2021"},{"t":"'A Banca reputa como erro de extrema gravidade o emprego do preceito secundario do art. 337-E do CP [para fatos de 2010], pois viola o princípio da irretroatividade da lei penal mais gravosa (CF, art. 5o, XL).'","o":"TJ-PR 2021"},{"t":"'A qualidade da fundamentação da dosimetria e erros como bis in idem serão ponderados na nota'; 'E impositivo que o candidato fundamente os critérios empregados, não bastando o emprego de expressoes genéricas'.","o":"TJ-PR 2021"},{"t":"Há item residual de 0,05 a 0,10 por questão para 'Abordagem geral: Desenvolvimento, correção da linguagem, fluência e coerência da exposição'.","o":"TJ-SE 2024"},{"t":"Diversos itens trazem 'Bibliografia de referência' com o precedente do STF/STJ.","o":"TJ-SE 2024"},{"t":"Diversos quesitos da sentença cível trazem, dentro do texto, a faixa parcial de cada subitem entre parenteses (p. ex., '(0,00 a 0,25)'), ao lado do valor total do quesito na coluna de pontuação.","o":"TJ-SE 2024"},{"t":"Há item negativo expresso: 'Língua portuguesa: Desconto de até 10% (dez por cento) do valor total da prova' - pontuação -1,00.","o":"TJ-SE 2024"},{"t":"Repetido no cabecalho de todas as questões: 'Para a pontuação da questão dissertativa, foram considerados os seguintes critérios: A correção da linguagem, o domínio técnico dos temas, o poder de síntese, o desenvolvimento claro, coerente e lógico das respostas, com indicacao dos dispositivos legais pertinentes, com eventual citacao de doutrina e jurisprudência.'","o":"TRF1 2023"},{"t":"O espelho apresenta as RESPOSTAS consideradas corretas, sem discriminar pontuação por item.","o":"TRF1 2023"},{"t":"Na sentença cível o espelho e organizado em dez quesitos numerados por extenso ('Primeiro Quesito', 'Segundo Quesito'...), cada um com o valor entre parenteses; total 10,00.","o":"TRF1 2023"},{"t":"O Primeiro Quesito exige que o candidato demonstre perceber a relação de subordinacao entre as questões, sendo admitidas como corretas três sequências alternativas de resolução expressamente listadas.","o":"TRF1 2023"},{"t":"No Quarto Quesito consta que 'A resposta será considerada exauriente se o candidato pontuar, ao lado disso, que...' - há, portanto, gradacao entre resposta com aproveitamento e resposta exauriente.","o":"TRF1 2023"},{"t":"No Terceiro Quesito consta que, 'Em razao da específica posição do Tribunal Regional Federal da 1a Regiao a respeito do tema, também deverá ser admitida como correta a resposta do candidato que aludir ao fato de a execução fiscal haver sido proposta depois...'.","o":"TRF1 2023"},{"t":"Na sentença criminal a pontuação e por BLOCOS com faixas decrescentes conforme o grau de acerto: I) Apreciacao e fundamentação das alegacoes - até 3,0; II) Aplicação das penas e seus efeitos - até 3,0; III) Tipificação das condutas - até 1,0; IV) Conclusão da sentença - até 1,0; V) Domínio dos institutos jurídico-penais - até 1,5; VI) Uso correto da língua portuguesa - até 0,50.","o":"TRF1 2023"},{"t":"Na sentença criminal há hipóteses expressas de NOTA ZERO no bloco I: sentença que acolher a alegacao de incompetência do juízo federal; que acolher nulidade do processo (ilicitude da prova ou falta de justa causa), insuficiencia de prova ou ausência de dolo; ou que absolver todos os denunciados de todos os crimes. No bloco II: sentença que não cumprir o metodo trifásico ou que deixar de aplicar as penas privativas de liberdade.","o":"TRF1 2023"},{"t":"Bloco IV: 'Sentença absolutória ou de incompetência do juízo: 0,00. Totalmente condenatória: 0,50. Parcialmente condenatória: 1,0.'","o":"TRF1 2023"},{"t":"Blocos V e VI usam escala qualitativa: 'Insuficiente: 0. Ruim/regular: 0,50. Bom/muito bom: 1,5' (V) e 'Insuficiente: 0,00. Ruim/regular 0,25. Bom/muito bom: 0,50' (VI).","o":"TRF1 2023"},{"t":"Espelho da Comissão Organizadora e Examinadora do XXI Concurso do TRF3, dividido em seis TEMAS, cada um com 'PONTUACAO TOTAL' própria.","o":"TRF3 2025"},{"t":"Nos temas em formato de tabela, as colunas são 'Perguntas / Resposta Esperada / P.M', com nota de rodape '* PM - Pontuação máxima'.","o":"TRF3 2025"},{"t":"No Tema 1 consta expressamente: 'Foram consideradas citacoes diretamente relacionadas a apresentação do conceito específico, não servindo mencoes genéricas ou sem vinculacao expressa a um ou outros pontos do Tema 1' e 'As notas foram atribuidas pela quantidade de referências expressas'.","o":"TRF3 2025"},{"t":"No Tema 2, além do roteiro de mérito, foram examinadas: a capacidade de exposição, coerência, consistencia e profundidade na argumentação (0,4); a aderencia da prova ao idioma oficial (0,14); a caligrafia do candidato (0,06).","o":"TRF3 2025"},{"t":"Documento 'Gabarito da Sentença Cível' da Comissão Organizadora e Examinadora do XXI Concurso do TRF3, com duas partes: uma tabela 'Itens para correção / Anotacoes sobre a resposta' e, ao final, a tabela sintetica 'Itens para correção / Pontuação' com o TOTAL 10.","o":"TRF3 2025"},{"t":"Além dos itens de mérito, o espelho pontua autonomamente: I - Caligrafia (0,30); J - Idioma (0,70) ('Foram avaliados padrao de linguagem, ortografia e gramática'); K - Capacidade de exposição (3,00); L - Observancia da ordem de enfrentamento das questões (1,40).","o":"TRF3 2025"},{"t":"Sobre a caligrafia consta que ela influi na compreensão da resposta, 'além de ser exigencia normativa a atribuição de nota' a esse item.","o":"TRF3 2025"},{"t":"Documento intitulado 'ESPELHO DA PROVA DISCURSIVA - 2a FASE - JUIZ SUBSTITUTO', XLVIII Concurso para Ingresso na Magistratura de Carreira do Estado do Rio de Janeiro (PDF gerado em 14/09/2021).","o":"TJ-RJ 2021"},{"t":"Cada questao vale 0,40; a prova reune 24 questoes distribuidas por disciplina.","o":"TJ-RJ 2021"},{"t":"Em Direito Constitucional o espelho consigna: 'na atribuicao de grau, sera considerada adequada correcao vernacular na elaboracao da resposta e realizacao de redacao com absoluta observancia da terminologia constitucional aplicavel a tematica vertida na pergunta'.","o":"TJ-RJ 2021"},{"t":"Em Direitos Difusos e Coletivos a banca discriminou a subdivisao do 0,40 em A) 0,1; B) 0,1; C) 0,15; D) 0,05 'consoante a correcao do Portugues, e a coordenacao do raciocinio'.","o":"TJ-RJ 2021"},{"t":"'Pontos fundamentais': ordem adequada na solucao das questoes processuais, conduzindo a perfeita estrutura da sentenca; redacao clara e escorreita, com emprego correto dos termos juridicos; fundamentacao precisa, adequada e completa na solucao de cada questao apresentada.","o":"TJ-RJ 2022"},{"t":"O espelho nao discrimina pontuacao por quesito (PDF gerado em 24/01/2022).","o":"TJ-RJ 2022"},{"t":"'Considerando tratar-se de concurso para a Magistratura e em sendo uma prova para avaliacao do candidato, no momento em que prestara, efetivamente, a jurisdicao sentenciando um feito penal, impoe-se que se exija do julgador conhecimento adequado e consistente.'","o":"TJ-RJ 2022"},{"t":"'Evidente que a afericao da nota ou grau se fez pelo conjunto da sentenca prolatada e nao por etapas, ou seja, individualizando cada questao a exemplo de pontos independentes para questao preliminar; para a adequacao tipica das condutas de cada acusado; para as respectivas dosimetrias, etc.' (PDF gerado em 25/01/2022)","o":"TJ-RJ 2022"},{"t":"'ESPELHO DE CORRECAO DA PROVA DISCURSIVA (2a Etapa) - JUIZ SUBSTITUTO', XLIX Concurso para Ingresso na Magistratura de Carreira do TJRJ (PDF gerado em 12/12/2023).","o":"TJ-RJ 2023"},{"t":"Cada questao vale 0,40; 24 questoes distribuidas por disciplina.","o":"TJ-RJ 2023"},{"t":"Em Direito do Consumidor o espelho registra, para as duas questoes: 'ainda que o candidato acerte a questao, sera levada em consideracao a qualidade da redacao que se espera de um Juiz de Direito'.","o":"TJ-RJ 2023"},{"t":"Em Direito Penal e Direito Ambiental a banca discriminou subpontuacoes internas (0,10 / 0,20) por topico.","o":"TJ-RJ 2023"},{"t":"'ESPELHO DE CORRECAO DA PROVA DISCURSIVA (2a Etapa) - JUIZ(A) SUBSTITUTO(A)', L Concurso para Ingresso na Magistratura de Carreira do TJRJ (PDF gerado em 11/04/2025).","o":"TJ-RJ 2025"},{"t":"Cada questao vale 0,40; 25 questoes distribuidas por disciplina.","o":"TJ-RJ 2025"},{"t":"Em Direito Ambiental e Direito Administrativo a banca discriminou subpontuacoes internas (0,10/0,15/0,20) por topico.","o":"TJ-RJ 2025"},{"t":"Examinadores: Direito Civil - Desembargador Gabriel de Oliveira Zefiro; Direito Processual Civil - Desembargador Paulo Wunder de Alencar.","o":"TJ-RJ 2025"},{"t":"'IMPORTANTE: Sera avaliado o raciocinio juridico e sua exposicao. O examinador nao e o dono da verdade.'","o":"TJ-RJ 2025"},{"t":"'Sempre e sempre o que nos interessa e o raciocinio juridico e a sua escorreita exposicao.'","o":"TJ-RJ 2025"},{"t":"O espelho nao discrimina pontuacao por quesito (PDF gerado em 24/07/2025).","o":"TJ-RJ 2025"},{"t":"Examinadores: Direito Penal - Desembargador Jose Muinos Pineiro Filho; Direito Processual Penal - Desembargador Paulo Cesar Vieira de Carvalho Filho.","o":"TJ-RJ 2025"},{"t":"'No mais, a banca flexibilizou, no exame, o rigor nos fundamentos apresentados pelo candidato para examinar eventuais circunstancias judiciais na fixacao da(s) pena(s) base e nas possiveis circunstancias agravantes, mas nao admitindo afastamento da menoridade relativa em sede penal, bem como considerar in malam partem causa especial de aumento prevista no art. 226 do CP.'","o":"TJ-RJ 2025"},{"t":"'CONCURSO PUBLICO 2023 - ESPELHOS DE CORRECAO (SENTENCAS) - PROVAS APLICADAS NO DIA 20/03/2024'.","o":"TJ-GO 2024"},{"t":"'Conferencia da Tabela de Questoes - Disciplina A - Juiz Substituto'.","o":"TJ-GO 2024"},{"t":"Questao 01 (Sentenca Civel): 14 itens, 'Nota da Questao 01 - Gabarito 1' = 10. Questao 02 (Sentenca Criminal): 9 itens, 'Nota da Questao 02 - Gabarito 1' = 10.","o":"TJ-GO 2024"},{"t":"Cada item tem escala fechada de pontuacao (ex.: 0,00 / 0,10 / 0,20 / 0,30 / 0,40 / 0,50); o valor registrado abaixo e o teto do item.","o":"TJ-GO 2024"},{"t":"'Conferencia da Tabela de Questoes - Disciplina A - Juiz Substituto'; 58o Concurso, identificado no portal do TJGO como concurso de 2023 (o documento nao traz data).","o":"TJ-GO 2023"},{"t":"8 questoes, cada uma com 'Itens = N' e nota final por questao: Questoes 01 e 02 valem 2,0; Questoes 03 a 08 valem 1,0 cada (total 10).","o":"TJ-GO 2023"},{"t":"Todos os itens tem escala fechada de pontuacao; em todas as questoes ha item final de 'Utilizacao correta do idioma oficial e capacidade de exposicao'.","o":"TJ-GO 2023"},{"t":"'Tribunal de Justica do Estado de Goias - Juiz Substituto'. 59o Concurso (identificado no portal do TJGO como concurso de 2025).","o":"TJ-GO 2025"},{"t":"4 questoes, cada uma valendo 2,5 (total 10), com itens de escala fechada ('Itens = N').","o":"TJ-GO 2025"},{"t":"Na Questao 02, letra 'c', o espelho preve pontuacao extra: 'O candidato que apontar as diferencas de sancoes e consequencias em razao da tipificacao no Art. 10 ou no Art. 11 recebera pontuacao extra em 0,1'.","o":"TJ-GO 2025"},{"t":"Na Questao 04, letra 'c', o espelho registra que 'tambem foram aceitas as respostas que enquadraram a conduta na injuria real do art. 140, par. 2o do CP'; na letra 'f', que 'nao foram aceitas como respostas validas a tipificacao no crime de ameaca, ou a desclassificacao para tipo penal diverso'.","o":"TJ-GO 2025"},{"t":"'Espelho de correcao, para efeito de recurso.' (publicado em 05/12/2024; provas aplicadas em 03/11/2024).","o":"TRF2 2024"},{"t":"12 questoes com valores proprios (0,5 a 1,0 ponto), varias subdivididas em letras com pontuacao autonoma.","o":"TRF2 2024"},{"t":"A banca fixa 'notas basicas' por questao (ex.: zero, 0,25 e 0,50) e explica que 'as notas intermediarias revelam erros em relacao a nota maior'.","o":"TRF2 2024"},{"t":"'Erros de portugues e atentados a boa expressao geraram diminuicao da nota'.","o":"TRF2 2024"},{"t":"'Desconto de 0,2 decimos de candidatos com redacao mal estruturada ou de dificil compreensao. Eventuais erros materiais na escrita, decorrentes do tempo exiguo para responder, que nao comprometam a compreensao da resposta, nao ensejam desconto de pontuacao.'","o":"TRF2 2024"},{"t":"Diversas questoes trazem 'mencao legal obrigatoria' de dispositivos, cuja ausencia reduz a nota mesmo com resposta correta.","o":"TRF2 2024"},{"t":"'ESPELHO DE CORRECAO - PROVA PRATICA DE SENTENCA CIVEL' (publicado em 15/01/2025; prova aplicada em 02/11/2024).","o":"TRF2 2025"},{"t":"'Sao sete itens examinados, para efeito de pontuacao': 1) Competencia da Justica Federal (1 ponto); 2) Legitimidade ativa da Uniao Federal (1,5); 3) Nao consumacao da prescricao intercorrente (2 pontos); 4) Recepcao das contribuicoes do Sistema S (2 pontos); 5) Ausencia da limitacao da base de calculo (2 pontos); 6) Dispositivo da sentenca (1,5); 7) somatorio de 10,0 (nota maxima). No topico 7 (Aspectos estruturais e de redacao) 'o melhor resultado e a neutralidade, e os erros de portugues e de estruturacao apenas retiram pontos'.","o":"TRF2 2025"},{"t":"'Em cada um dos itens, caso a explanacao seja parcial ou insuficiente, a pontuacao e proporcional a proximidade da resposta para com o gabarito, e com abate dos erros.'","o":"TRF2 2025"},{"t":"'ESPELHO DA CORRECAO - PROVA PRATICA DE SENTENCA CRIMINAL' (publicado em 15/01/2025; prova aplicada em 03/11/2024).","o":"TRF2 2025"},{"t":"Distribuicao: Preliminares 2,00 (0,40 para cada um dos 5 itens); Merito 5,00; Dispositivo 0,50; Diretrizes para a dosimetria 2,0; Disposicoes Finais 0,50.","o":"TRF2 2025"},{"t":"PENALIDADES: 'Tratou-se de prova de tempo, em que os candidatos tiveram exiguo periodo para resolver prova longa. Mas isso se impos a todos, e fez parte do teste. A sentenca com plena ausencia de dispositivo ou de dosimetria foi apenada com nota zero. Varios candidatos pularam uma ou mais dosimetrias... optou-se por apena-las com perda de um a dois pontos, conforme a grandeza da omissao.'","o":"TRF2 2025"},{"t":"Espelho de correcao da prova pratica de sentenca criminal do XX Concurso do TRF3 (provas escritas aplicadas em 14, 15 e 16 de outubro de 2022).","o":"TRF3 2022"},{"t":"Distribuicao total de 10,0 pontos em seis blocos: 1) Preliminares 1,5; 2) Autoria 1,75; 3) Tipificacao 1,75; 4) Dosimetria 2,0; 5) Consectarios 1,0; 6) Linguagem e coerencia 2,0.","o":"TRF3 2022"},{"t":"Varios blocos preveem 'bonus' por fundamentacao solida/analise completa, ate o limite indicado.","o":"TRF3 2022"},{"t":"Documento intitulado 'SENTENCA CIVIL - APONTAMENTOS SOBRE A CORRECAO', do XX Concurso do TRF3 (provas escritas aplicadas em 14, 15 e 16 de outubro de 2022).","o":"TRF3 2022"},{"t":"A pontuacao e distribuida em blocos, com subitens de 0,25 em 0,25; varios itens exigem referencia legal expressa, sob pena de nao pontuacao.","o":"TRF3 2022"},{"t":"Ha blocos finais de coerencia argumentativa/global e de adequacao da linguagem juridica, com escalas de 1,0 / 0,75 / 0,50.","o":"TRF3 2022"},{"t":"Espelho da prova discursiva do XX Concurso do TRF3 (prova discursiva aplicada em 14/10/2022).","o":"TRF3 2022"},{"t":"O documento apresenta o roteiro de resposta esperado para 5 questoes, sem discriminar pontuacao por quesito.","o":"TRF3 2022"},{"t":"Nota IMPORTANTE constante da 1a questao de Direito Empresarial: '1. A resposta deve ser fundamentada, de modo que a mera referencia a um en tes/default/files/concursos/trf6-resultado-definitivo-provas-escritas-vf.pdf) — espelho apenas em vista individual, nao e falha de busca.","TRF5 (trf5juiz) - Juiz Federal Substituto: não localizado espelho de correção publicado na pagina do certame.","ENAM - Exame Nacional da Magistratura (FGV/ENFAM), exames 2024.1 a 2026.1: o exame e composto exclusivamente de prova objetiva; há apenas gabaritos preliminares/definitivos, não existindo espelho de correção de prova discursiva ou prática.","TJ-PE 2026 (FGV, Juiz Substituto) — rebuscado em 20/08/2026: pagina https://conhecimento.fgv.br/concursos/tjpe26 segue em inscricoes/homologacao (resultado definitivo de homologacao 12/08/2026). Objetiva nao aplicada; nao existe espelho porque a fase discursiva nem ocorreu. Rebuscar apos a 2a fase.","TJ-RJ LI Concurso (VUNESP, TJRJ2503) — sentenca civel e sentenca penal: provas aplicadas em 12-13/07/2026, cadernos publicados, mas espelhos das sentencas NAO publicados em 20/08/2026 (correcao em andamento; Edital 28-2026 convoca desidentificacao). O espelho da DISCURSIVA saiu e ja esta no banco (TJ-RJ 2026). Rebuscar apos o resultado das sentencas.","TJ-GO 57o Concurso (2021) - concurso listado no portal do TJGO, sem documento de espelho publicado; URLs de espelho testadas retornaram pagina de erro","TJ-GO 60o Concurso - URL de espelho testada (docs.tjgo.jus.br/concursos/juizsubstituto/concurso60) inexistente ate a data da pesquisa","TJ-SP 189o, 190o, 191o e 192o Concursos de Ingresso na Magistratura (VUNESP) - o portal do TJSP e a pagina da VUNESP (vunesp.com.br/TJSP2402) disponibilizam edital, provas, gabaritos objetivos e vista de prova, mas nao publicam espelho de correcao nem padrao de resposta das provas discursiva e de sentenca","TRF2 XIX Concurso (2026, Juiz Federal Substituto, banca propria — Comissao do XIX Concurso) — rebuscado em 20/08/2026: a pagina oficial (https://www.trf2.jus.br/trf2/consultas-e-servicos/concursos-publicos-para-magistrados) ja tem secao propria 'Espelho de Correcao das Provas Discursivas', mas marcada 'Em breve.' — espelho ainda nao publicado. Cadernos ja disponiveis: prova discursiva (https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/19/Prova_Discursiva_XIX_CPJFS_2R.pdf), sentenca civil (https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/19/Prova_Sentenca_Civil_XIX_CPJFS_2R.pdf) e sentenca criminal (https://static.trf2.jus.br/nas-internet/documento/consultas/concursos/magistrados/19/Prova_Sentenca_Criminal_XIX_CPJFS_2R.pdf), aplicadas em 08-09/08/2026. Rebuscar apos a publicacao anunciada.","TRF2 XVII Concurso - espelhos existem (discursiva 04/02/2019; sentenca civil e criminal 27/03/2019), porem fora da janela 2021-2026","TRF4 XVIII Concurso (2022/2023, banca propria) - a pagina oficial do concurso publica apenas os cadernos da prova discursiva e das provas de sentenca civel e penal; nenhum espelho, padrao de resposta ou criterio de correcao foi localizado","TRF5 XV Concurso - certame conduzido pela FGV; nenhum espelho de correcao publicado localizado (o TRF6 I Concurso, tambem FGV, tem registro proprio nesta lista, rebuscado em 20/08/2026).","TRF1 - concurso conduzido pela FGV (fora do escopo desta coleta)","TJ-MG Concurso de Juiz de Direito Substituto (Edital 1/2021 e Edital 1/2026, Instituto Consulplan) - paginas de cadernos de prova do TJMG retornaram 403 e nenhum espelho de correcao foi localizado no site do TJMG ou do Instituto Consulplan","TJ-RS - concurso de 2022 (FAURGS): nenhum espelho ou padrao de resposta localizado no portalfaurgs.com.br; o concurso seguinte (2025/2026) foi atribuido a FGV","TJ-PA, TJ-PB, TJ-PI, TJ-AM, TJ-AL, TJ-RN - nenhum espelho de correcao de prova de magistratura localizado no periodo 2021-2026","TJ-SE 2025 - concurso conduzido pela FGV (fora do escopo desta coleta)","TJM-SP - o ultimo concurso para Juiz de Direito Substituto da Justica Militar paulista foi o de 2015 (VUNESP, vunesp.com.br/tjme1501), fora da janela; novo concurso apenas previsto na LOA 2026, sem provas realizadas","TJM-MG e TJM-RS - nenhum concurso para juiz de direito da Justica Militar estadual com provas aplicadas no periodo 2021-2026 foi localizado","Justica do Trabalho - Concurso Nacional Unificado da Magistratura do Trabalho (CSJT, 2023): o espelho de correcao das provas praticas de sentenca existe, mas o certame foi conduzido pela FGV (fora do escopo). Nenhum espelho de concurso regional de Juiz do Trabalho Substituto (TRTs) de banca propria ou de outra banca foi localizado no periodo","FCC - nenhum concurso de magistratura com espelho de correcao publicado localizado no periodo 2021-2026","CEBRASPE/CESPE - nenhum concurso de magistratura com espelho de correcao publicado localizado no periodo 2021-2026","FUNDEP e IESES - nenhum concurso de magistratura com espelho de correcao publicado localizado no periodo 2021-2026","Instituto Consulplan - atuou no TJ-MG, mas sem espelho de correcao publicamente acessivel"]};
const F = {q:'', disc:new Set(), tipo:new Set(), trib:new Set(), ano:new Set()};
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

D.rows.forEach(r => { r._b = norm([r.tema, r.exig, r.disp.join(' '), r.rot, r.trib, r.disc].join(' ')); });

function hl(t){
  const s = esc(t); if(!F.q) return s;
  const terms = norm(F.q).split(/\s+/).filter(x => x.length > 2);
  if(!terms.length) return s;
  let out = ''; let i = 0;
  const ns = norm(s);
  while(i < s.length){
    let hit = null;
    for(const t2 of terms) if(ns.startsWith(t2, i)) { if(!hit || t2.length > hit.length) hit = t2; }
    if(hit){ out += '<mark>' + s.slice(i, i+hit.length) + '</mark>'; i += hit.length; }
    else { out += s[i]; i++; }
  }
  return out;
}

function lnk(r){
  const a = (u, t, ic) => `<a href="${esc(u)}" target="_blank" rel="noopener"><i>${ic}</i>${t}</a>`;
  const out = [];
  if(r.prova)  out.push(a(r.prova,  r.prova2 ? 'prova cível' : 'prova', '\u2197'));
  if(r.prova2) out.push(a(r.prova2, 'prova penal', '\u2197'));
  if(r.url)    out.push(a(r.url, 'espelho', '\u2197'));
  if(r.gab)    out.push(a(r.gab, 'gabarito da objetiva', '\u2197'));
  if(r.conc)   out.push(a(r.conc, 'página do concurso', '\u2197'));
  if(!r.prova) out.push('<em>prova não publicada</em>');
  return out.join('');
}

function chips(el, vals, key, lbl){
  document.getElementById(el).innerHTML = vals.map(v =>
    `<button class="chip" data-k="${key}" data-v="${esc(String(v))}">${esc(lbl?lbl(v):String(v))}</button>`).join('');
}

function filtra(){
  const terms = norm(F.q).split(/\s+/).filter(Boolean);
  return D.rows.filter(r =>
    (!F.disc.size || F.disc.has(r.disc)) &&
    (!F.tipo.size || F.tipo.has(r.tipo)) &&
    (!F.trib.size || F.trib.has(r.trib)) &&
    (!F.ano.size  || F.ano.has(String(r.ano))) &&
    terms.every(t => r._b.includes(t)));
}

function render(){
  const rs = filtra();
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', F[c.dataset.k].has(c.dataset.v)));

  const nq = rs.length, np = new Set(rs.map(r => r.trib+r.ano+r.tipoRaw)).size;
  document.getElementById('res').innerHTML = nq === D.rows.length
    ? `<b>${nq}</b> quesitos de <b>${D.nEsp}</b> espelhos`
    : `<b>${nq}</b> quesito${nq===1?'':'s'} em <b>${np}</b> espelho${np===1?'':'s'} · <button class="chip" onclick="limpa()">limpar filtros</button>`;

  if(!nq){ document.getElementById('lista').innerHTML = '<p class="vazio">Nenhum quesito com esses filtros.</p>'; return; }

  const byD = {};
  rs.forEach(r => (byD[r.disc] = byD[r.disc] || []).push(r));
  document.getElementById('lista').innerHTML = D.discs.filter(d => byD[d]).map(d => {
    const items = byD[d].sort((a,b) => b.ano - a.ano || a.trib.localeCompare(b.trib)).map(r => `
      <div class="q">
        <div class="qh"><span class="qt">${hl(r.tema)}</span><span class="pt">${esc(r.pont)}</span></div>
        <div class="src">${esc(r.trib)} ${r.ano} · ${esc(r.tipoRaw)} · ${esc(r.rot)}</div>
        <div class="lnk">${lnk(r)}</div>
        <div class="ex">${hl(r.exig)}</div>
        ${r.disp.length ? `<div class="dp">${r.disp.map(x => `<span>${hl(x)}</span>`).join('')}</div>` : ''}
      </div>`).join('');
    return `<div class="dh">${esc(d)} · ${byD[d].length}</div>${items}`;
  }).join('');
}

function limpa(){ F.q=''; document.getElementById('q').value='';
  ['disc','tipo','trib','ano'].forEach(k => F[k].clear()); render(); }

document.getElementById('kpis').innerHTML =
  `<div class="kpi"><span class="n">${D.nEsp}</span><span class="l">espelhos lidos</span></div>
   <div class="kpi"><span class="n">${D.rows.length}</span><span class="l">quesitos extraídos</span></div>
   <div class="kpi"><span class="n">${D.tribs.length}</span><span class="l">tribunais</span></div>
   <div class="kpi"><span class="n">${D.discs.length}</span><span class="l">disciplinas</span></div>
   <div class="kpi"><span class="n">${D.anos[0]}–${D.anos[D.anos.length-1]}</span><span class="l">período</span></div>`;

chips('fd', D.discs, 'disc'); chips('ft', D.tipos, 'tipo');
chips('fb', D.tribs, 'trib'); chips('fa', D.anos.map(String), 'ano');

document.addEventListener('click', e => {
  const c = e.target.closest('.chip[data-k]'); if(!c) return;
  const s = F[c.dataset.k]; s.has(c.dataset.v) ? s.delete(c.dataset.v) : s.add(c.dataset.v); render();
});
let t; document.getElementById('q').addEventListener('input', e => {
