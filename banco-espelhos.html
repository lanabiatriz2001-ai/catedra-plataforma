 gramatica e a teoria do tipo o uso do verbo 'compartilhar' para indicar autoria/coautoria; examinar se concorrem, nos termos do art. 29 do CP, aqueles que nao praticavam diretamente a acao (STJ, AgRg no REsp 1.730.026/RJ, Rel. Min. Nefi Cordeiro). (2) 0,10 - embora 'trazer consigo' seja elementar dos arts. 28 e 33 da Lei 11.343/06, por se tratar de definicao tipica a partir do elemento subjetivo do tipo (destinacao para comercio ilicito ou consumo pessoal), a orientacao dos Tribunais Superiores ainda nao esta sedimentada quanto a necessidade de aditamento ou retificacao da peca acusatoria; espera-se do candidato o exame do dolo de agir e sua configuracao como elemento do tipo. (3) 0,10 - a doutrina estrangeira e nacional orienta-se no sentido de que o crime de mao propria, distinto do crime proprio e do crime comum, nao admite coautoria ou autoria mediata (Manzanares Samaniego; Cobo del Rosal e Vives Anton; Maurach; Welzel; Nilo Batista), porem admite a participacao criminosa.","pont":"0,40 (0,20 + 0,10 + 0,10)","disp":["CP, arts. 29 e 180","Lei 11.343/06, arts. 28 e 33","Lei 10.826/03, arts. 14 e 16","STJ AgRg no REsp 1.730.026/RJ"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Penal","tema":"Qualificadora sobejante no Tribunal do Juri e compensacao com atenuante nao debatida","rot":"Direito Penal - 2a questao","exig":"Subitens pontuados: (1) 0,20 - o art. 61 do CP dispoe que sao circunstancias que sempre agravam a pena, quando nao constituem ou qualificam o crime, e o art. 68 estabelece o processo trifasico; portanto qualificadora nao e circunstancia agravante e muito menos causa especial de aumento; no homicidio duplamente qualificado a sancao vai de 12 a 30 anos; no dizer da lei nao ha margem para que qualificadoras reconhecidas pelo Conselho de Sentenca sejam admitidas como agravantes genericas na segunda fase, o que desrespeitaria a decisao soberana dos jurados e afrontaria lei federal; nao e assente, porem, na jurisprudencia dos Tribunais Superiores, que admitem a valoracao de qualificadoras remanescentes ou sobejantes na segunda fase; a questao pretende verificar como o futuro magistrado analisa o tema sem condicionamentos jurisprudenciais. (2) 0,20 - caso a resposta seja pela inexistencia de afronta a lei federal e a soberania dos veredictos, transformando qualificadora em agravante generica, como podera o juiz-presidente considerar qualquer atenuante e compensa-la se nao consta da ata que a atenuante foi alegada nos debates (CPP, art. 492, I, 'b')? Pretende-se examinar o raciocinio do candidato sem condicionamentos doutrinarios e/ou jurisprudenciais, admitindo-se, por exemplo, que atenuantes de natureza objetiva se imponham face ao processo de individualizacao da pena, de matiz constitucional.","pont":"0,40 (0,20 + 0,20)","disp":["CP, arts. 59, 61, 65, 68 e 121 par. 2o","CPP, art. 492, I, 'b'"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Processo Penal","tema":"Causas impeditivas de declaracao e arguicao de nulidades","rot":"Direito Processual Penal - 1a questao","exig":"Topicos necessarios: a) conceituar nulidade como qualidade negativa do ato processual (invalidade) e nao como sancao (ineficacia); b) indicar os dispositivos do CPP que tratam das causas impeditivas de declaracao ou arguicao de nulidade (arts. 563, 565 e 566); c) a sentenca penal absolutoria transitada em julgado e causa impeditiva de declaracao de nulidade, ainda que absoluta; d) a jurisprudencia do STF (RE 1.228.372 AgR, Rel. Min. Roberto Barroso, Primeira Turma, julgado em 20/12/2019) e no sentido da incidencia das causas impeditivas de declaracao ou arguicao de nulidade tambem nos casos de nulidade absoluta.","pont":"0,40","disp":["CPP, arts. 563, 565 e 566","STF RE 1.228.372 AgR"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Processo Penal","tema":"Teoria da dissonancia cognitiva e juiz das garantias","rot":"Direito Processual Penal - 2a questao","exig":"Topicos necessarios: a) a Teoria da dissonancia cognitiva, originariamente objeto de estudo da Psicologia Social, foi transposta para o processo penal pelo jurista alemao Bernd Schunemann, e pode ser resumida na busca, muitas vezes inconsciente, de algum nivel de coerencia entre valores, ideias e crencas, sendo as incoerencias a causa da dissonancia; b) e a base logica da inferencia que levou o legislador a redacao do art. 157, par. 5o, do CPP, visando fortalecer a imparcialidade do juiz e a propria figura do juiz de garantias; c) o STF (Informativo 1106) declarou a inconstitucionalidade do par. 5o do art. 157 do CPP; d) o STF (Informativo 1106) declarou a inconstitucionalidade, com reducao de texto, dos par. 3o e 4o do art. 3o-C do CPP, e atribuiu interpretacao conforme para entender que os autos que compoem as materias de competencia do juiz das garantias serao remetidos ao juiz da instrucao e julgamento; e) tais aspectos conduzem a conclusao de que, no minimo, restou mitigada a ideia de contaminacao do juiz da instrucao pelo contato com as pecas produzidas na fase anterior, nao tendo sido prestigiadas, ao menos na sua inteireza, as conclusoes da aludida Teoria.","pont":"0,40","disp":["CPP, arts. 3o-C par. 3o e 4o, e 157 par. 5o","STF Informativo 1106"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Constitucional","tema":"Eliminacao em investigacao social por condenacao antiga com reabilitacao criminal","rot":"Direito Constitucional - 1a questao","exig":"Aplicar o Tema 22 de repercussao geral do STF (RE 560.900): a idoneidade moral decorrente do principio da moralidade administrativa nao pode ser confundida com moralismo; nenhum candidato pode ser eliminado por nao compartilhar da mesma concepcao de vida boa e da mesma moral privada dos membros da banca - trata-se de moralidade publica e laica, de uma etica minima e intersubjetivamente aceitavel; todavia, alem do principio geral da moralidade, outros fatores podem exigir graus de escrutinio mais severos, a depender da relevancia e essencialidade do cargo, como na selecao de magistrados e de policiais, em que adquire relevo o bem juridico da seguranca publica (CF, art. 144). Considera-se correta a decisao administrativa, pois de natureza incompativel o crime praticado com as funcoes de agente da autoridade policial. No entanto, tambem sera considerada correta, em menor grau, resposta favoravel ao candidato fundada em ponderacao de principios constitucionais, no sentido de que o impedimento de admissao significaria conden-lo de forma perpetua a pena de proibicao do exercicio de cargo publico, inadmissivel no ordenamento (CF, art. 5o, XLVII), ate porque a reabilitacao criminal impede a expedicao de certidao que revele a condenacao.","pont":"0,40","disp":["Tema 22/STF (RE 560.900)","CF, arts. 5o XLVII, 37 I e 144"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Constitucional","tema":"Regime Constitucional de Colaboracao na Educacao e universalizacao do ensino fundamental","rot":"Direito Constitucional - 2a questao","exig":"O termo 'Regime de Colaboracao' significa trabalho elaborado de maneira coordenada entre os entes federativos (Uniao, Estados, Distrito Federal e municipios), com objetivo estabelecido no art. 205 da CF: promover e incentivar a educacao, definida como direito de todos e dever do Estado e da familia, visando ao pleno desenvolvimento da pessoa, seu preparo para o exercicio da cidadania e sua qualificacao para o trabalho. Os mecanismos funcionais direcionados a universalizacao do ensino fundamental encontram-se nos arts. 208 e 211 da CF; trata-se de direito publico subjetivo, de natureza universal, outorgado e imposto gratuitamente a todos os brasileiros. A Constituicao cobra atuacao prioritaria dos Municipios, dos Estados e do DF, competindo ao Poder Publico oferecer o ensino fundamental de maneira regular; as autoridades responderao pelo descumprimento ou cumprimento irregular; o Poder Publico deve manter constante recenseamento dos menores, fiscalizando a frequencia a escola e chamando a responsabilidade os pais ou responsaveis negligentes.","pont":"0,40","disp":["CF, arts. 205, 208 e 211"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Eleitoral","tema":"Razoabilidade e proporcionalidade na prestacao de contas de campanha","rot":"Direito Eleitoral - 1a questao","exig":"Necessario reconhecer que se trata de falhas que nao comprometam a higidez do balanco, ausencia de ma-fe e valor que nao ultrapasse R$ 1.064,00 ou 10% do movimento financeiro declarado. Dependendo do reconhecimento ou nao, implicara desaprovacao ou aprovacao com ressalvas das contas apresentadas, consoante o art. 28 e seguintes da Lei 9.504/97.","pont":"0,40","disp":["Lei 9.504/97, art. 28 e ss."]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Empresarial","tema":"Habilitacao de credito fiscal na falencia com execucao fiscal em curso","rot":"Direito Empresarial - 1a questao","exig":"Aplicar o Tema Repetitivo 1092 do STJ (REsp 1.872.759/SP): 'E possivel a Fazenda Publica habilitar em processo de falencia credito objeto de execucao fiscal em curso, mesmo antes da vigencia da Lei n. 14.112/2020, e desde que nao haja pedido de constricao no juizo executivo'. Antes da alteracao ja se admitia a coexistencia do executivo fiscal com o pedido de habilitacao. Como a execucao fiscal nao representa, por si so, salvaguarda para o credor - o que so se concretiza com a penhora ou indisponibilidade -, e cabivel a habilitacao concomitante, desde que nao haja requerimento de constricao no juizo executivo, sob pena de duplice garantia e bis in idem. Apos a Lei 14.112/20, que introduziu o art. 7o-A na Lei 11.101/05, nao ha duvida de que a Fazenda pode habilitar os creditos ainda que pendente execucao fiscal, a qual ficara suspensa ate o encerramento da falencia, sem prejuizo do prosseguimento contra os corresponsaveis (par. 4o, V); a habilitacao nao importa renuncia ao direito de cobrar pela via executiva, mas a execucao devera estar desprovida de garantia.","pont":"0,40","disp":["Tema Repetitivo 1092/STJ","Lei 11.101/05, art. 7o-A","Lei 14.112/2020"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Empresarial","tema":"Submissao de credito iliquido de indenizacao aos efeitos da recuperacao judicial","rot":"Direito Empresarial - 2a questao","exig":"Aplicar o Tema Repetitivo 1051 do STJ (REsp 1.843.332/RS): 'Para o fim de submissao aos efeitos da recuperacao judicial, considera-se que a existencia do credito e determinada pela data em que ocorreu o seu fato gerador'. Nem todos os credores estao submetidos aos efeitos, apenas os titulares de creditos existentes na data do pedido, ainda que nao vencidos (Lei 11.101/05, art. 49). A existencia do credito esta ligada a relacao juridica entre devedor e credor; na responsabilidade contratual o vinculo precede o ilicito, e na extracontratual o liame se estabelece com o evento danoso; ocorrido o ato lesivo, surge o direito ao credito relativo a reparacao. Assim, submetem-se os creditos decorrentes de fatos praticados ou negocios celebrados antes do pedido, sendo o adimplemento e a responsabilidade elementos subsequentes. Concluiu o STJ que a submissao nao depende de sentenca que declare ou quantifique o credito, menos ainda de seu transito em julgado, bastando a ocorrencia do fato gerador.","pont":"0,40","disp":["Tema Repetitivo 1051/STJ","Lei 11.101/05, art. 49"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Tributário","tema":"Sujeicao passiva do IPTU, convencoes particulares e imunidade reciproca","rot":"Direito Tributario - 1a questao","exig":"De acordo com o art. 34 do CTN, o sujeito passivo do IPTU e o proprietario do imovel; as convencoes particulares nao sao oponiveis a Fazenda Publica, nos termos do art. 123 do CTN. Dessa forma, nao ha que se falar em redirecionamento das execucoes fiscais, nao se aplicando ainda a imunidade reciproca ao contrato celebrado com a autarquia federal, na medida em que essa e contribuinte de fato, e nao de direito.","pont":"0,40","disp":["CTN, arts. 34 e 123","CF, art. 150, VI, 'a'"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Tributário","tema":"Decadencia no lancamento por homologacao, defesa administrativa intempestiva e parcelamento inadimplido","rot":"Direito Tributario - 2a questao","exig":"O ICMS e tributo lancado por homologacao, sendo a decadencia regida pelo art. 150, par. 4o, do CTN; todavia, segundo entendimento do STJ, na hipotese de ausencia de pagamento de tributo sujeito a lancamento por homologacao, o prazo decadencial segue a regra do art. 173, I, do CTN (Tema Repetitivo 163). A peticao ou recurso administrativo somente suspende a exigibilidade do tributo se apresentada tempestivamente, nos termos das normas do processo administrativo tributario (CTN, art. 151, III). O parcelamento somente suspende a exigibilidade se estiver sendo adimplido pelo contribuinte. Em razao desses tres fundamentos, a liminar deve ser indeferida.","pont":"0,40","disp":["CTN, arts. 150 par. 4o, 151 III e 173 I","Tema Repetitivo 163/STJ"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Ambiental","tema":"Poco artesiano, ligacao a rede publica, outorga de uso de agua subterranea e competencias","rot":"Direito Ambiental - 1a questao","exig":"Pontuacao discriminada pela banca: 1) Sim, Joaquim esta obrigado a efetuar a ligacao a rede publica e a pagar pelo servico disponibilizado - arts. 2o e 3o, I, da Lei 11.445/07 e art. 1o, II, da Lei 9.433/97 (0,1). 2) Sim, e necessaria autorizacao para utilizacao da agua subterranea - arts. 11 e seguintes da Lei 9.433/97 e art. 45 da Lei 11.445/07 ('dupla protecao') (0,1). 3) Entes competentes: Uniao para legislar (CF, arts. 21, XIX e 22, IV); Estado (CF, arts. 23, XI, 24, VI e 26, I; Lei 9.433/97, art. 4o - INEA); Municipio para legislar (CF, arts. 24, VI e 125, par. 2o); fiscalizacao como competencia comum de implementacao da Uniao, Estados e Municipios (CF, art. 23, VI e XI) (0,1). 4) Jurisprudencia: STJ, EREsp 1.335.535/RJ, Primeira Secao, Rel. Min. Herman Benjamin - necessidade de outorga e autorizacao ambiental para poco artesiano (arts. 12, II, da Lei 9.433/1997 e 45, par. 2o, da Lei 11.445/2007); e Tema 145 do STF (RE 586.224): 'O municipio e competente para legislar sobre o meio ambiente com a Uniao e o Estado, no limite do seu interesse local e desde que tal regramento seja harmonico com a disciplina estabelecida pelos demais entes federados (art. 24, VI, c/c 30, I e II, da Constituicao Federal)' (0,1).","pont":"0,40 (4 subitens de 0,10)","disp":["Lei 11.445/07, arts. 2o, 3o I e 45 par. 2o","Lei 9.433/97, arts. 1o II, 4o, 11 e 12 II","CF, arts. 21 XIX, 22 IV, 23 VI e XI, 24 VI, 26 I e 125 par. 2o","STJ EREsp 1.335.535/RJ","Tema 145/STF (RE 586.224)"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Administrativo","tema":"Responsabilidade subsidiaria do Estado por dano de concessionaria, actio nata e bens reversiveis","rot":"Direito Administrativo - 1a questao","exig":"a) O candidato devera observar que a delegataria de servico publico e pessoa juridica distinta do Estado, respondendo diretamente por suas acoes, sendo certo que o Estado, por ser o ente delegante, apenas possui responsabilidade subsidiaria; assim, o Estado apenas sera chamado a responder quando a empresa delegataria nao possuir patrimonio para arcar com sua responsabilidade, como em casos de falencia decretada. b) O candidato devera observar que nao ocorre a prescricao, que e quinquenal (Decreto 20.910/1932), pois apenas apos o estado de insolvencia da delegataria ser reconhecido (15.08.2020) e que o particular lesado poderia postular o ressarcimento diretamente ao ente delegante; devera externar conhecimento da teoria nominada 'actio nata'. c) O candidato devera observar que os bens vinculados a prestacao do servico delegado sao considerados bens publicos, nao sendo penhoraveis; devera explicitar o que se entende por reversao, mostrando que tais bens nao podem servir ao processo falencial, pois nao pertencem a empresa de transporte publico.","pont":"0,40","disp":["Decreto 20.910/1932","Lei 8.987/95","CF, art. 37 par. 6o"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Administrativo","tema":"Limitacoes administrativas e dever de indenizar","rot":"Direito Administrativo - 2a questao","exig":"O candidato devera observar que as limitacoes administrativas, em regra, nao geram o dever de indenizar, face ao carater generico a atingir a ideia de fruicao e gozo do bem em sua origem. Excepcionalmente, quando a limitacao se fizer em momento posterior a aquisicao da propriedade, retirando elementos economicos, e que se podera ter a perspectiva de indenizacao diretamente proporcional a retirada da fruicao economica. Por conseguinte, em um primeiro momento, quando adquirida a propriedade ela ja continha restricoes de uso, que influenciaram no proprio valor da aquisicao, sem que se possa falar em perda economica; ja no segundo momento, quando retirada a limitacao inicial e lancada nova restricao, o entendimento prevalecente e no sentido da nao ocorrencia de lesao, pois nao teria existido mudanca do status economico da propriedade desde quando adquirida.","pont":"0,40","disp":[]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Filosofia do Direito","tema":"Fundamentos da liberdade de expressao como direito fundamental","rot":"Nocoes Gerais de Direito e Formacao Humanistica - 1a questao","exig":"Nao se discute que a liberdade de expressao e um direito fundamental, consagrado na maioria dos paises civilizados. Os fundamentos que justificam a afirmativa estao divididos em duas categorias: a) trata-se de meio para realizacao de fim importante; e b) pressupoe que a liberdade de expressao e importante por si so, e nao somente pelas consequencias que pode acarretar. A doutrina majoritaria aponta quatro argumentos: i) garantir uma autossatisfacao (self-fulfilment) individual; ii) ser importante instrumento para a descoberta da verdade; iii) possibilitar a participacao do cidadao na democracia; iv) determinar a manutencao da balanca entre a estabilidade e a mudanca da sociedade.","pont":"0,40","disp":[]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Direitos Humanos","tema":"Protocolo para Julgamento com Perspectiva de Genero na aplicacao da pena em feminicidio","rot":"Nocoes Gerais de Direito e Formacao Humanistica - 2a questao","exig":"O Protocolo para Julgamento com Perspectiva de Genero traduz diretrizes que passaram a ser obrigatorias e tem por objetivo evitar que as decisoes judiciais acabem por perpetuar e reforcar caracteristicas socialmente construidas em relacao ao genero e a outros aspectos. O caso contem varias questoes atinentes a discriminacao: primeiramente, o feminicidio, que por si so ja demonstra a desigualdade relacionada ao genero, inclusive pela motivacao de a vitima nao cuidar bem dos filhos - expectativas socialmente construidas sobre o comportamento das mulheres, a quem se delega as atividades de cuidado e nao as laborativas; alem disso, o fato de as mulheres negras serem as que mais sofrem violencia de genero, de acordo com as pesquisas; e ainda a questao da liberdade religiosa, pois culturalmente as religioes de origem africana sao consideradas diferentes e desviantes, caracterizando mais um fato a ser levado em consideracao pelo magistrado ou magistrada.","pont":"0,40","disp":["Protocolo para Julgamento com Perspectiva de Genero (CNJ)","CP, art. 121 par. 2o VI"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Direitos Humanos","tema":"Controle de convencionalidade do crime de desacato e status da CADH","rot":"Direitos Humanos - 1a questao","exig":"A Corte Interamericana de Direitos Humanos afirmou, no Marco Juridico Interamericano sobre o Direito a Liberdade de Expressao (30/12/2009), que a liberdade de expressao nao e direito absoluto - o art. 13 da CADH dispoe, nos incisos 2, 4 e 5, que ela pode estar sujeita a certas restricoes e as condicoes para que sejam legitimas. Em julho de 2020, na ADPF 496/DF, julgada improcedente, o STF fixou a tese: 'Foi recepcionada pela Constituicao de 1988 a norma do art. 331 do Codigo Penal, que tipifica o crime de desacato'. A convencionalidade e a constitucionalidade do art. 331 foram analisadas pelo STJ (HC 379.269) e pelo STF (HC 141.949), com firme entendimento de compatibilidade com a CF e o Pacto de Sao Jose da Costa Rica. Quanto ao status: o art. 5o, par. 2o, da CF e clausula aberta de recepcao, e parte da doutrina (Cancado Trindade; Flavia Piovesan) entende que os tratados de direitos humanos possuem estatura constitucional; apos a EC 45/2004, que acrescentou o par. 3o ao art. 5o, foi conferida equivalencia as emendas constitucionais aos tratados aprovados em dois turnos por tres quintos; em dezembro de 2008, no RE 466.343 (Tema 60, repercussao geral), o STF decidiu que os tratados de direitos humanos nao incorporados como emenda tem natureza supralegal, paralisando a eficacia de todo o ordenamento infraconstitucional em sentido contrario.","pont":"0,40","disp":["CP, art. 331","CADH (Decreto 678/1992), art. 13","STF ADPF 496/DF","STF RE 466.343 - Tema 60","CF, art. 5o par. 2o e par. 3o","EC 45/2004"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Civil","tema":"Privacidade x intimidade de pessoa publica e dano moral","rot":"Direito Civil - 1a questao","exig":"Trata-se de diferenciar privacidade de intimidade. A privacidade pode ser comprometida diante da conduta do individuo que, pela atividade profissional, exige exposicao publica, como a dos artistas de TV. A intimidade esta ligada ao amago emocional do homem, a porcao mais intima do seu ser, e tem de ser respeitada por todos, inclusive a imprensa; sua ofensa gera ato ilicito e atrai a indenizacao por danos morais.","pont":"0,40","disp":["CF, art. 5o X","CC, arts. 20 e 21"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Civil","tema":"Nexo causal e responsabilidade do fabricante por defeito de airbag","rot":"Direito Civil - 2a questao","exig":"Deve ser analisado o conflito em si, ou seja, a pretensao e sua resistencia. Nao ha discussao entre as partes acerca da aplicacao do CDC; a materia da questao e direito civil. A cadeia causal do evento e o cerne da questao: o motorista foi culpado pelo acidente, mas o airbag foi instalado no veiculo para funcionar em eventos com ou sem culpa do condutor; a culpa pelo acidente pode ter sido do motorista, mas a culpa pelos danos por ele sofridos foi do defeito do airbag. Dai a responsabilidade do fabricante. A do vendedor dependeria do CDC - por certo inexiste.","pont":"0,40","disp":["CC, arts. 186, 927 e 931"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Processo Civil","tema":"Prova deferida no saneamento e nao produzida; venire contra factum proprium; preclusao sobre a distribuicao do onus da prova","rot":"Direito Processual Civil - 1a questao","exig":"A finalidade do oficio ao sindico era comprovar o exercicio da posse continua e ininterrupta, elemento essencial para o reconhecimento da usucapiao; foi deferido pelo 1o juiz, mas nao efetivado, pois os autos foram imediatamente remetidos ao grupo de sentenca. Ao julgar a reconvencao improcedente por ausencia de provas, o 2o magistrado afirmou que caberia ao reu ter produzido tal prova diretamente, alterando o entendimento anteriormente adotado - mudanca que configura venire contra factum proprium. A atitude contraditoria entre os juizes tambem enseja violacao ao principio da nao surpresa, ja que o reu/reconvinte tinha legitima expectativa de que a prova seria obtida mediante a diligencia deferida, gerando prejuizo direto a ampla defesa e ao contraditorio; viola ainda o dever de cooperacao processual, pois o juiz nao pode impor onus excessivo a parte e dela exigir a obtencao direta de documento cuja producao ja havia sido determinada. Ademais, como o juiz entendeu pela necessidade da prova no saneamento e dela se incumbiu, operou-se para ele a preclusao sobre a analise da distribuicao da carga probatoria. Isso posto, ambos os magistrados agiram em error in procedendo, sendo a sentenca nula, devendo a instrucao ser reaberta e a prova (oficio ao sindico) efetivamente produzida.","pont":"0,40","disp":["CPC, arts. 6o, 9o, 10, 357 e 373"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Processo Civil","tema":"Sistema de precedentes: tese, ratio decidendi e obiter dictum","rot":"Direito Processual Civil - 2a questao","exig":"Precedente e a decisao judicial que, embora voltada a solucao de um caso concreto, produz um elemento normativo usado posteriormente em julgamentos de casos analogos; compoe-se das circunstancias faticas, da argumentacao juridica usada para a solucao e da tese final do julgamento. Ratio decidendi e o conjunto das razoes adotadas pelo juiz para a decisao, isto e, as premissas do raciocinio que suportam a conclusao, incluindo toda a cadeia argumentativa necessaria e suficiente a fundamentacao, bem como a sua conclusao - e a soma da fundamentacao juridica com a tese final do julgado. A tese e o elemento da ratio decidendi correspondente a conclusao do julgado, formulada como norma abstrata, com estrutura semelhante a lei, voltada a decidir demandas repetitivas sobre casos identicos. Obiter dictum e tudo aquilo que consta da decisao mas e desnecessario para sustentar a cadeia logica do resultado. A eficacia vinculante dos precedentes esta na ratio decidendi, em ambas as suas partes: tanto na fundamentacao juridica como na tese.","pont":"0,40","disp":["CPC, arts. 926 e 927"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Consumidor","tema":"Resolucao de promessa de compra e venda por iniciativa do comprador: restituicao, corretagem, juros e prescricao","rot":"Direito do Consumidor - 1a questao","exig":"Objetivo: avaliar se o candidato conhece o entendimento consolidado do STJ. Aplicar o Tema 577 (e abusiva a clausula que determina a restituicao dos valores somente ao termino da obra ou de forma parcelada); o Tema 938 (i - prescricao trienal da pretensao de restituicao dos valores pagos a titulo de comissao de corretagem ou SATI, art. 206, par. 3o, IV, do CC; ii - validade da clausula que transfere ao promitente-comprador a comissao de corretagem, desde que previamente informado o preco total com destaque do valor; ii, parte final - abusividade da cobranca de SATI); o Tema 1002 (nos compromissos anteriores a Lei 13.786/2018, resolvidos por iniciativa do promitente comprador de forma diversa da clausula penal convencionada, os juros de mora incidem a partir do transito em julgado); e a Sumula 543. Resumindo: como o desfazimento ocorre por vontade da promitente compradora, a restituicao deve ser parcial (retencao de 10% a 25%) e imediata; os juros contam-se do transito em julgado, pois o contrato e anterior a Lei 13.786/2018; a prescricao para devolucao das parcelas e decenal (CC, art. 205), mas a pretensao de restituicao da comissao de corretagem esta prescrita (prazo trienal).","pont":"0,40","disp":["Temas 577, 938 e 1002/STJ","Sumula 543/STJ","CC, arts. 205 e 206 par. 3o IV","Lei 13.786/2018"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Consumidor","tema":"Repeticao em dobro e engano justificavel em fraude de terceiro","rot":"Direito do Consumidor - 2a questao","exig":"A questao envolve o paragrafo unico do art. 42 do CDC. De acordo com a jurisprudencia, nesses casos de fraude perpetrada por terceiro entende-se que a instituicao financeira igualmente foi vitima do engodo, o que caracteriza o 'engano justificavel' que ressalva a devolucao em dobro. Alem disso, a propria fraude evidencia a ausencia de dolo ou ma-fe - para quem entende necessario esse elemento volitivo. Por outro lado, ha quem entenda prescindivel o elemento volitivo, sendo a devolucao em dobro cabivel somente quando a cobranca indevida consubstanciar conduta contraria a boa-fe objetiva, restando fixado como parametro excludente da repeticao dobrada a boa-fe objetiva do fornecedor (onus da defesa), para apurar, no ambito da causalidade, o engano justificavel da cobranca. Por todos os lados, constata-se que nao foi acertada a repeticao do indebito por valor igual ao dobro do que foi descontado.","pont":"0,40","disp":["CDC, art. 42 paragrafo unico"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"ECA/Infância","tema":"Familia eudemonista e adocao","rot":"Direito da Crianca e do Adolescente - 1a questao","exig":"Art. 39 do ECA: adocao concebida com a finalidade de plena integracao do adotando a familia pretendente, que passa a assumir verdadeira posicao juridico-social de filho/pai, consoante arts. 226 e 227, par. 6o, ambos da CF; art. 39, par. 1o: adocao irrevogavel. Familia eudemonista: de 'eudaimonia' (grego = felicidade); Aristoteles - 'a felicidade e o objetivo final da vida humana' e 'felicidade e um principio, e para alcanca-la realizamos todos os atos'. A familia eudemonista e tendencia no Direito brasileiro, abrindo leque de novos modelos familiares nos quais o vinculo afetivo, a dedicacao, o companheirismo e a uniao valem mais do que a relacao biologica; novas formacoes familiares embasadas no afeto garantem estrutura com ideais e valores necessarios a uma vida digna. O STF reconheceu, como decorrencia direta do valor constitucional dignidade da pessoa humana, o AFETO como premissa maior das relacoes familiares, retirando da familia o carater patrimonialista e reconhecendo implicito o DIREITO FUNDAMENTAL A FELICIDADE (eudemonismo); a jurisprudencia do STJ reconhece a familia eudemonista em casos de adocao. A jurisprudencia entende validos arranjos como a familia homoafetiva e a anaparental (grupo sem pais, apenas parentes colaterais), assim como a novel pratica da inseminacao artificial caseira.","pont":"0,40","disp":["ECA, art. 39 e par. 1o","CF, arts. 226 e 227 par. 6o"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"ECA/Infância","tema":"Principios da educacao inclusiva e judicializacao da omissao escolar","rot":"Direito da Crianca e do Adolescente - 2a questao","exig":"Os principios da educacao inclusiva sao fundamentais para garantir a igualdade e a equidade dos sistemas educativos: respeito a diversidade; acessibilidade; igualdade de oportunidades; aprendizagem colaborativa; resposta as necessidades individuais; e cooperacao e participacao de todos - principios interdependentes que se reforcam mutuamente. A escola, publica ou particular, deve promover a educacao inclusiva; caso falhe, pode-se recorrer ao Poder Judiciario. O suporte tem base constitucional e legal variada: Constituicao Federal, ECA, Lei Berenice Piana, Lei Brasileira de Inclusao (derivada da Convencao de Nova Iorque de 2009) e o Parecer 50/2023 do Conselho Nacional de Educacao, que estabeleceu diretrizes para a educacao de alunos com TEA; alem de tratados e convencoes de que o Brasil e signatario (Declaracao de Salamanca de 1994, Convencao da Guatemala de 1999, Declaracao de Incheon/Coreia do Sul de 2015). A jurisprudencia quase pacificada do TJRJ obriga as escolas a contratar mediadores escolares.","pont":"0,40","disp":["Lei 13.146/2015 (LBI)","Lei 12.764/2012 (Berenice Piana)","Parecer CNE 50/2023","ECA","CF, art. 208 III"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Penal","tema":"Violencia domestica: vedacao de multa isolada (Tema 1189/STJ), concurso formal homogeneo e dano moral in re ipsa (Tema 983/STJ)","rot":"Direito Penal - 1a questao","exig":"Como houve compensacao entre a agravante e a atenuante da confissao, o candidato devera estabelecer a dosimetria considerando, na fixacao da pena-base, a pena privativa de liberdade prevista no art. 147 do CP (minimo e maximo), tendo em vista o Tema 1189 do STJ: 'A vedacao constante do art. 17 da Lei n. 11.340/2006 (Lei Maria da Penha) obsta a imposicao, nos casos de violencia domestica e familiar contra a mulher, de pena de multa isoladamente, ainda que prevista de forma autonoma no preceito secundario do tipo penal imputado'. Trata-se de concurso formal homogeneo de delitos, porquanto uma unica acao criminosa foi praticada, dirigida a duas vitimas determinadas, em contexto unico, o que se distingue do crime unico. Quanto a indenizacao por dano moral, este e in re ipsa, presumido, nao necessitando de especificacao de valor certo e definido, desde que formulado o pedido expressamente na denuncia, para garantir ampla defesa e contraditorio - Tema 983 do STJ: 'Nos casos de violencia contra a mulher praticados no ambito domestico e familiar, e possivel a fixacao de valor minimo indenizatorio a titulo de dano moral, desde que haja pedido expresso da acusacao ou da parte ofendida, ainda que nao especificada a quantia, e independentemente de instrucao probatoria'. Finalmente, indicar a fracao de aumento de pena em razao do concurso formal de delitos.","pont":"0,40","disp":["CP, arts. 59, 61 II 'f', 70 e 147","Lei 11.340/2006, art. 17","CPP, art. 387 IV","Temas 983 e 1189/STJ"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Penal","tema":"Concurso formal entre tipos omissivos","rot":"Direito Penal - 2a questao","exig":"Sim. A resposta e positiva, pouco importando se o concurso formal de delitos for proprio ou improprio, homogeneo ou heterogeneo, podendo ainda se tratar de crimes omissivos proprios ou comissivos por omissao. Com uma unica acao, em um mesmo contexto fatico, pode o agente se omitir, deixando dolosamente de impedir dois resultados proibidos. O exemplo dado por ZAFFARONI, citado por NUCCI, esclarece a hipotese: se um funcionario do presidio deixa uma porta aberta para que um preso fuja e outro se vingue, matando o carcereiro, temos homicidio e favorecimento. Tal nao ocorreria, entretanto, quando se esta diante de concurso aparente de normas, seja pela absorcao de um crime por outro, seja pela consuncao.","pont":"0,40","disp":["CP, arts. 13 par. 2o e 70"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Processo Penal","tema":"Standard probatorio na admissibilidade da acusacao","rot":"Direito Processual Penal - 1a questao","exig":"Poe-se em destaque o principio constitucional da presuncao de inocencia (CF, art. 5o, LVII) e a exigencia de fundamentacao de todas as decisoes judiciais (CF, art. 93, IX), o que inclui a decisao de recebimento da denuncia. Embora essa decisao necessite de standard probatorio menos rigoroso do que a prisao preventiva ou a sentenca, o juizo positivo de admissibilidade so e possivel diante da demonstracao de que a acusacao 'nao e temeraria ou leviana, por isso que lastreada em um minimo de prova'. Citar Afranio Silva Jardim (o suporte probatorio minimo se relaciona com os indicios de autoria, existencia material de conduta tipica e alguma prova de antijuridicidade e culpabilidade) e a Ministra Maria Thereza de Assis Moura (a justa causa nao sobressai apenas dos elementos formais, mas de sua fidelidade a prova que demonstre a legitimidade da imputacao). Irrefutavel a incidencia do in dubio pro reo, o que enseja um standard de probabilidade prevalente - hipotese mais provavel do que improvavel. Observar a relacao entre onus da prova, presuncao de inocencia e decisao judicial, invocando Gustavo Badaro. Inadmissivel qualquer referencia a estranha figura do in dubio pro societate, principio sem base constitucional. Por tudo, exige-se 'a demonstracao - fundada em elementos probatorios minimos e licitos - da realidade material do evento delituoso e da existencia de indicios de sua possivel autoria' (STF Inq. 3.507/MG, Rel. Min. Gilmar Mendes; STF Inq. 3.719/DF, Rel. Min. Fachin).","pont":"0,40","disp":["CF, art. 5o LVII e art. 93 IX","CPP, arts. 395 e 396","STF Inq. 3.507/MG","STF Inq. 3.719/DF"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Processo Penal","tema":"Foro por prerrogativa de funcao - crime praticado antes da investidura","rot":"Direito Processual Penal - 2a questao","exig":"TESE FIXADA: 'A prerrogativa de foro para julgamento de crimes praticados no cargo e em razao das funcoes subsiste mesmo apos o afastamento do cargo, ainda que o inquerito ou a acao penal sejam iniciados depois de cessado seu exercicio' (STF, HC 232.627/DF, Rel. Min. Gilmar Mendes, Plenario, julgamento virtual finalizado em 11.03.2024). Expor a finalidade do foro especial (CF, art. 102, I, 'b'), que nao e privilegio pessoal mas garantia do adequado exercicio das funcoes publicas; a oscilacao jurisprudencial (regra da contemporaneidade/pertinencia tematica x regra da atualidade); o cancelamento da Sumula 394/STF na QO no Inq. 687/SP; a QO na AP 937/RJ; e a razao da perpetuacao da competencia para crimes funcionais, centrada na natureza do crime e nao em criterios temporais manipulaveis pelo acusado. Ponto decisivo: a saida do cargo somente afasta o foro privativo na hipotese de crimes perpetrados antes da investidura no cargo ou que nao possuam relacao com o seu exercicio - como o estupro praticado antes da eleicao.","pont":"0,40","disp":["CF, art. 102 I 'b'","STF HC 232.627/DF","STF QO no Inq. 687/SP","STF QO na AP 937/RJ","Sumula 394/STF (cancelada)"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Constitucional","tema":"Iniciativa parlamentar de lei municipal que cria despesa (Tema 917/STF)","rot":"Direito Constitucional - 1a questao","exig":"A jurisprudencia do STF registra que a iniciativa privativa do Chefe do Poder Executivo para legislar sobre a organizacao administrativa proibe que os demais legitimados proponham leis que criem, alterem ou extingam orgaos publicos, ou que lhes cominem novas atribuicoes. No caso em exame, a norma municipal cria despesas para o Poder Executivo, mas nao trata da sua estrutura ou da atribuicao de seus orgaos, nem do regime juridico de servidores publicos. A situacao descrita nao incorre em inconstitucionalidade, conforme assentado no Tema 917 do STF: 'Nao usurpa competencia privativa do Chefe do Poder Executivo lei que, embora crie despesa para a Administracao, nao trata da sua estrutura ou da atribuicao de seus orgaos nem do regime juridico de servidores publicos (art. 61, par. 1o, II, a, c e e, da Constituicao Federal)'.","pont":"0,40","disp":["Tema 917/STF","CF, art. 61 par. 1o II 'a', 'c' e 'e'"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Constitucional","tema":"Apatrida clandestina, prevalencia dos direitos humanos, SUS e assistencia social","rot":"Direito Constitucional - 2a questao","exig":"O art. 5o da CF estabelece igualdade de direito aos brasileiros e estrangeiros residentes no pais. O problema reconduz a equacionamento pela vertente humanitaria porque, embora se trate de estrangeira clandestina, e de se reconhecer em seu beneficio a prevalencia dos direitos humanos no que tange a regencia das relacoes internacionais brasileiras (CF, art. 4o, II). E de se invocar o art. 196, que estabelece o acesso universal as acoes e servicos para promocao e recuperacao da saude, pois se trata de pessoa em situacao de vulnerabilidade (apatridia e idade avancada). E de se lhe franquear o acesso a assistencia social, com percepcao, inclusive, de um salario minimo de beneficio mensal, nos termos do art. 203.","pont":"0,40","disp":["CF, arts. 4o II, 5o caput, 196 e 203 V"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Eleitoral","tema":"Pesquisa eleitoral sem registro, inelegibilidade por trafico privilegiado e prazo dos embargos de declaracao","rot":"Direito Eleitoral - 1a questao","exig":"A divulgacao de pesquisa eleitoral sem previo registro pode gerar multa ou constituir crime (Lei 9.504/97, art. 33, par. 2o, 3o e 4o), mas nao e causa de inelegibilidade. A inelegibilidade imposta pela LC 64/90 aplica-se a pratica de trafico de drogas, independentemente de se tratar de trafico privilegiado. O pedido de registro de candidatura deve ser negado pelo segundo motivo. Os Embargos de Declaracao nao devem ser conhecidos, pois o ponto que lhes deu causa deve ser alegado no prazo do recurso, que e de 3 dias.","pont":"0,40","disp":["Lei 9.504/97, art. 33 par. 2o, 3o e 4o","LC 64/90","Codigo Eleitoral, art. 275 par. 3o"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Empresarial","tema":"Supressao de garantias reais e fidejussorias no plano de recuperacao judicial e credor que se absteve de votar","rot":"Direito Empresarial - 1a questao","exig":"Sem embargo da soberania da decisao da Assembleia Geral de Credores, devem ser respeitados os limites legais, sendo possivel o controle judicial da legalidade do plano. A Segunda Secao do STJ, no REsp 1.333.349/SP (Tema 885, repetitivo), consolidou que a recuperacao judicial do devedor principal nao impede o prosseguimento das execucoes nem induz suspensao ou extincao de acoes contra terceiros devedores solidarios ou coobrigados, por garantia cambial, real ou fidejussoria, nao se lhes aplicando os arts. 6o, caput, 52, III, ou a novacao do art. 59, caput, por forca do art. 49, par. 1o, da Lei 11.101/2005; no mesmo sentido a Sumula 581 do STJ. A jurisprudencia consolidou-se no sentido de que a clausula que estende a novacao aos coobrigados e legitima e oponivel apenas aos credores que aprovaram o plano sem ressalva, nao sendo eficaz em relacao aos ausentes, aos que se abstiveram de votar ou se posicionaram contra (REsp 2.114.437/CE; AgInt no AREsp 1.859.659/RS; AgInt nos EDcl no CC 172.379/PE; AREsp 2.552.547/MT). Nao e possivel a Assembleia suprimir garantias reais e fidejussorias sem a anuencia do credor (REsp 1.794.209/SP), pois o art. 49, par. 2o, da Lei 11.101/2005, ao mencionar que as obrigacoes observarao as condicoes originalmente contratadas salvo se de modo diverso ficar estabelecido no plano, refere-se a obrigacao, desagios, prazos e encargos, e nao a garantias; a novacao da lei falimentar difere da do Codigo Civil e nao atinge as garantias prestadas por terceiros. Assim, embora valida, a clausula de supressao de garantias nao sera eficaz para aqueles que a ela nao anuiram expressamente; e caso particular em que o silencio nao e interpretado como concordancia, mas opera em favor do credor inerte. Devem ser observadas a natureza contratual do plano, a necessidade de anuencia expressa e a ineficacia da clausula de exoneracao relativamente ao credor que com ela nao concordou.","pont":"0,40","disp":["Lei 11.101/2005, arts. 6o, 49 par. 1o e 2o, 52 III e 59","Tema 885/STJ (REsp 1.333.349/SP)","Sumula 581/STJ","STJ REsp 1.794.209/SP"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Empresarial","tema":"Extensao da falencia aos socios e desconsideracao da personalidade juridica no ambito falimentar","rot":"Direito Empresarial - 2a questao","exig":"Na sociedade sob regime de responsabilidade ilimitada, os socios submetem-se a todos os efeitos da falencia (Lei 11.101/05, art. 81), quebrando e respondendo com patrimonio pessoal, com responsabilidade solidaria pelas obrigacoes sociais (art. 77), instituindo-se excecao ao principio da autonomia da pessoa juridica; e desnecessaria a desconsideracao, ja que a falencia arrasta o socio de responsabilidade ilimitada (AgInt no AREsp 1.868.007/SP). Na sociedade limitada, a responsabilidade pessoal de socios, controladores e administradores e disciplinada no art. 82, sendo que o art. 82-A, com a redacao da Lei 14.112/20, passou a vedar a extensao da falencia ou de seus efeitos, admitindo, contudo, a desconsideracao da personalidade juridica com base na Teoria Maior (CC, art. 50); tal disposicao so se aplica as falencias decretadas apos a vigencia da Lei 14.112/20 (30 dias apos a publicacao - art. 7o). Antes da alteracao, o art. 82-A admitia a extensao quando presentes os requisitos do art. 50 do CC; parte minoritaria da doutrina admite a extensao a outras pessoas juridicas, ao argumento de que o art. 82-A limitou-se a proibir a extensao aos socios pessoas fisicas. A extensao da falencia foi criada pela jurisprudencia para instrumentalizar a desconsideracao no processo falimentar, mas e mais gravosa, pois alem dos efeitos patrimoniais sujeita o devedor a obrigacoes de outras naturezas e restricoes de direito (arts. 102 a 104 da Lei 11.101/05). A desconsideracao somente pode ser decretada com observancia do art. 50 do CC e dos arts. 133 a 137 do CPC, nao se aplicando a suspensao do art. 134, par. 3o, do CPC. Segundo o STJ (CC 200.775/SP, Rel. Min. Nancy Andrighi, j. 28/08/2024), o proposito do art. 82-A, paragrafo unico, nao e conferir ao Juizo Universal competencia exclusiva para determinar a desconsideracao, mas estabelecer que ela so podera ser decretada com observancia dos requisitos legais, nada impedindo que outros juizos a decretem em demandas diversas.","pont":"0,40","disp":["Lei 11.101/05, arts. 77, 81, 82, 82-A e 102 a 104","Lei 14.112/2020","CC, art. 50","CPC, arts. 133 a 137"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Tributário","tema":"ITCMD na doacao com reserva de usufruto e diferimento do pagamento (RE 1.363.013)","rot":"Direito Tributario - 1a questao","exig":"De acordo com o recente julgado do STF no RE 1.363.013, julgado sob o regime de repercussao geral, o art. 42 da Lei 7.174/15 e constitucional ao exigir o pagamento dos 50% de ITCMD restantes na extincao do usufruto. Segundo o voto do Ministro Relator, Dias Toffoli, nao se trata de criar novo fato gerador do ITCMD na extincao do usufruto, mas sim de diferimento do pagamento do tributo devido a partir da doacao realizada.","pont":"0,40","disp":["STF RE 1.363.013 (repercussao geral)","Lei estadual 7.174/15, art. 42"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Tributário","tema":"Excecao de pre-executividade, dissolucao irregular presumida (Sumula 435/STJ) e Tema 981","rot":"Direito Tributario - 2a questao","exig":"A excecao de pre-executividade e cabivel na medida em que os argumentos apresentados nao necessitam de dilacao probatoria. O cumprimento negativo de mandado de citacao em execucao fiscal no endereco desatualizado da contribuinte, por culpa da Secretaria de Fazenda - ja que a contribuinte procedeu a atualizacao dos dados -, nao autoriza a presuncao de dissolucao irregular que determine o redirecionamento da execucao para os socios, nos termos da Sumula 435 do STJ. Como Luci nao estava mais na sociedade na epoca da suposta dissolucao irregular, nao ha que se falar em responsabilidade, nos termos do julgamento do STJ submetido ao rito dos recursos repetitivos (Tema 981).","pont":"0,40","disp":["Sumula 435/STJ","Tema 981/STJ","CTN, art. 135 III"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Ambiental","tema":"Ligacao de energia eletrica em APP, teoria do fato consumado e reducao de area de preservacao","rot":"Direito Ambiental - 1a questao","exig":"Pontuacao discriminada pela banca: A) mencionar a jurisprudencia e a Sumula 613 do STJ, afastando a teoria do fato consumado (0,15). O STJ consolidou que e induvidosa a posicao intangivel e o carater non aedificandi da APP, interditando ocupacao ou construcao com pouquissimas excecoes (utilidade publica e interesse social) submetidas a licenciamento; constatada a existencia de edificacoes em APP, a demolicao e medida que se impoe; nao incide a teoria do fato consumado (REsp 1.989.227/SC, Rel. Min. Herman Benjamin, 2a Turma, j. 11/6/2024; Sumula 613/STJ). No STF, a teoria do fato consumado nao pode ser invocada para conceder direito inexistente sob alegacao de consolidacao da situacao fatica pelo decurso do tempo (RE 609.748/RJ AgR; RE 1.513.787, Rel. Min. Gilmar Mendes, 17/03/2025). B) ponderacao de interesses constitucionais - direito a moradia versus direito ambiental; preservacao do meio ambiente como preservacao da vida e das futuras geracoes; preponderancia do direito ambiental/direito a vida - CF, arts. 6o e 225 (0,10). C) possibilidade de reducao da area - Lei 12.651/2012, art. 3o, IX, 'd', e art. 8o; Lei 14.285/2021, art. 4o - area urbana consolidada, porem via lei e desde que nao incidam as hipoteses do par. 10 do citado artigo (nao ocupacao de areas com risco de desastres; observancia das diretrizes do plano de recursos hidricos, de bacia, de drenagem ou de saneamento basico; e previsao de que as atividades observem os casos de utilidade publica, interesse social ou baixo impacto ambiental) (0,15).","pont":"0,40 (0,15 + 0,10 + 0,15)","disp":["Sumula 613/STJ","STJ REsp 1.989.227/SC","STF RE 609.748/RJ AgR","STF RE 1.513.787","CF, arts. 6o e 225","Lei 12.651/2012, arts. 3o IX 'd' e 8o","Lei 14.285/2021, art. 4o"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Administrativo","tema":"Conservacao e aproveitamento de atos administrativos viciados","rot":"Direito Administrativo - 1a questao","exig":"Pontuacao discriminada: (1) 0,20 - a inercia da Administracao em anular seus proprios atos pode levar ao aproveitamento irreversivel de atos viciados; fora da estabilizacao temporal, admite-se a convalidacao, quando os defeitos sao sanaveis e podem ser legal e racionalmente supridos; tambem e possivel a confirmacao, hipotese em que o ato, embora ilegal, e aceito tal como foi praticado, com preservacao de seus efeitos. (2) 0,20 - a Lei 9.784/1999 fixa o prazo de cinco anos para a Administracao Federal anular seus proprios atos; o STJ pacificou que a lei pode ser aplicada subsidiariamente a estados e municipios (Sumula 633); o STF declarou inconstitucional lei local que previa prazo superior a cinco anos (ADI 6.019); a LINDB, apos a Lei 13.655/2018, traz hipoteses de conservacao de efeitos de atos administrativos viciados (arts. 21, 23 e 24); do ponto de vista jurisdicional, ate mesmo atos administrativos inconstitucionais podem ser preservados pela modulacao, conforme as Leis 9.868/1999 (art. 27) e 9.882/1999 (art. 11).","pont":"0,40 (0,20 + 0,20)","disp":["Lei 9.784/1999, art. 54","Sumula 633/STJ","STF ADI 6.019","LINDB, arts. 21, 23 e 24 (Lei 13.655/2018)","Lei 9.868/1999, art. 27","Lei 9.882/1999, art. 11"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Administrativo","tema":"Lei 14.230/2021: alteracoes relevantes, teses vinculantes do STF e prosseguimento do feito apos prescricao da pretensao sancionatoria","rot":"Direito Administrativo - 2a questao","exig":"Pontuacao discriminada: (1) 0,20 - as alteracoes da LIA sao a exigencia do dolo para configuracao do ato improbo, com exclusao de qualquer conduta ou omissao culposa, bem como as novas restricoes para acolhimento dos pedidos de indisponibilidade de bens in limine. O STF afirmou que a Lei 14.230/2021 nao excluiu a natureza civil dos atos de improbidade e, por isso, o principio da retroatividade da lei penal mais benefica nao se aplica perante coisa julgada, inclusive durante a execucao das penalidades e seus incidentes; a Corte assentou ainda que a nova lei excluiu a modalidade culposa tambem dos atos praticados na vigencia da lei anterior, o que devera ser considerado nos processos sem condenacao transitada em julgado; e que o novo regime prescricional e irretroativo. (2) 0,20 - as acoes de ressarcimento ao erario nao sao necessariamente imprescritiveis, mesmo nos casos de danos dolosos: apenas os atos dolosos tipificados na Lei de Improbidade atraem a imprescritibilidade (RE 852.475-SP). Por isso, ainda que prescrita a pretensao sancionatoria, a audiencia devera ser realizada para o exame do merito, nos termos do art. 18 da LIA e do Tema 1.089 do STJ.","pont":"0,40 (0,20 + 0,20)","disp":["Lei 8.429/1992, art. 18","Lei 14.230/2021","STF RE 852.475-SP","STF ADI 7.236 / Tema 1.199","Tema 1.089/STJ"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Processo Civil","tema":"Resolucao CNJ 125/2010, meios adequados de solucao de conflitos e principio da competencia-competencia","rot":"Nocoes Gerais de Direito e Formacao Humanistica - 1a questao","exig":"O CNJ, pela Resolucao 125, utilizou a denominacao Meios Adequados de Solucao de Conflitos, numa perspectiva mais democratizante e condizente com a ordem juridica brasileira, ja que do ponto de vista social o Estado nao e o unico detentor do poder jurisdicional. Foram incorporados a legislacao equivalentes jurisdicionais, incentivando uma nova cultura dialogica e menos beligerante: AUTOCOMPOSICAO, MEDIACAO e ARBITRAGEM. Os incisos II, III e V do art. 487 do CPC permitem a homologacao por sentenca de merito da autocomposicao; a mediacao foi disciplinada por lei propria; a arbitragem esta prevista na Lei 9.307/96, com reforco no art. 3o, par. 1o, no art. 485, V e VII, e no art. 1.012, par. 1o, IV, do CPC. O principio da competencia-competencia (Lei 9.307/96) determina caber ao arbitro reconhecer, de oficio ou por provocacao das partes, sua propria competencia para julgar as questoes acerca da validade e eficacia da convencao de arbitragem e do contrato que contenha a clausula compromissoria; mesmo em contrato de adesao o STJ tem prestigiado o principio. Se o arbitro reconhecer sua competencia e houver acao judicial em curso sobre o mesmo tema, o juiz devera julgar o feito extinto sem resolucao de merito. Registre-se que o controle da convencao de arbitragem podera ser feito pelo Poder Judiciario, mas somente em futura acao anulatoria da sentenca arbitral (art. 32 da Lei de Arbitragem).","pont":"0,40","disp":["Resolucao CNJ 125/2010","CPC, arts. 3o par. 1o, 485 V, 487 II, III e V, e 1.012 par. 1o IV","Lei 9.307/96, arts. 8o e 32"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Direitos Humanos","tema":"Direito Antidiscriminatorio: sujeito, objeto e base constitucional","rot":"Nocoes Gerais de Direito e Formacao Humanistica - 2a questao","exig":"O Direito Antidiscriminatorio parte da ideia de que a igualdade prevista na lei pode perpetuar e promover desigualdades sociais graves. Busca, portanto, anular as praticas discriminatorias, visando uma adaptacao razoavel das normas e a aplicacao de politicas afirmativas publicas e privadas. Os sujeitos do Direito Antidiscriminatorio sao as minorias vulnerabilizadas; o objeto sao as praticas, normas ou ambientes que impliquem a negacao de reconhecimento, gozo ou exercicio de direitos e liberdades fundamentais na vida em sociedade pelas minorias e grupos vulnerabilizados. A base constitucional e o art. 3o, IV, da Constituicao (no documento consta 'art. 30, inciso IV') e os tratados e convencoes internacionais de direitos humanos que tratem das pessoas vulnerabilizadas.","pont":"0,40","disp":["CF, art. 3o IV","Tratados e convencoes internacionais de direitos humanos"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_da_prova_discursiva","prova":"https://www.tjrj.jus.br/documents/d/guest/prova_discursiva_aplicada_em_06-04-2025","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova discursiva do L Concurso, aplicada em 06/04/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz(a) Substituto(a)","disc":"Direitos Humanos","tema":"Tema 944/STF - imunidade de jurisdicao de Estado estrangeiro e violacao a direitos humanos","rot":"Direitos Humanos - 1a questao","exig":"Em 2021 o STF apreciou recurso extraordinario com repercussao geral relativo a imunidade de jurisdicao invocada pela Alemanha em face do afundamento do barco de pesca brasileiro Changri-la pelo submarino alemao U-199, na 2a Guerra Mundial, proximo a Cabo Frio/RJ, em 1943, reconhecido pelo Tribunal Maritimo em 2001; os familiares das vitimas requereram indenizacao. O STF fixou a tese do Tema 944 (ARE 954.858, Rel. Min. Edson Fachin): 'Os atos ilicitos praticados por Estados estrangeiros em violacao a direitos humanos, dentro do territorio nacional, nao gozam de imunidade de jurisdicao'. Soberania e o poder que detem o Estado de impor, dentro do seu territorio, suas decisoes, editando leis e executando-as por si proprio; poder que internamente nao encontra outro superior, aferivel e executavel somente no plano domestico. Nao ha soberania no plano das relacoes internacionais, pois os Estados encontram-se em situacao de igualdade juridica, com o mesmo status independentemente de extensao territorial ou poder economico ou militar. Segundo a decisao do STF, as imunidades dos Estados continuam validas, nos termos do direito costumeiro, quando se tratar de atos de imperio, salvo se o ilicito violar direitos humanos - que constituem excecao, demonstrando que tais imunidades nao sao absolutas (diferentemente do decidido pela Corte da Haia em 2012). A imunidade de jurisdicao decorre de regra costumeira e tambem da Convencao das Nacoes Unidas sobre as Imunidades Jurisdicionais dos Estados e dos seus Bens (par in parem non habet judicium); o Brasil ratificou apenas a Convencao de Viena sobre Relacoes Diplomaticas. Estados da Comunidade Europeia (Convencao Europeia sobre Imunidade de Jurisdicao, 1972), alem de EUA, Inglaterra, Australia e Argentina, preveem imunidade relativa.","pont":"0,40","disp":["Tema 944/STF (ARE 954.858/RJ)","Convencao das Nacoes Unidas sobre Imunidades Jurisdicionais dos Estados e dos seus Bens","Convencao Europeia sobre Imunidade de Jurisdicao (1972)"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_prova_de_sentenca_civel","prova":"https://www.tjrj.jus.br/documents/d/guest/prova-sentenca-civel","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova de sentenca civel do L Concurso, aplicada em 05/07/2025. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Processo Civil","tema":"Conexao por prejudicialidade externa","rot":"Preliminar 1 - Suspensao do processo por acao movida pela tia do falecido","exig":"Trata-se de fenomeno processual equiparado a 'conexao por prejudicabilidade externa', situacao na qual os dois processos conexos devem ser reunidos pelo risco de decisoes conflitantes; nao sendo possivel a reuniao, um deles fica suspenso a aguardar a solucao do outro (o mais recente). O fenomeno nao se deu na questao: as decisoes podem ser diversas, como de fato seriam.","pont":"nao discriminada","disp":["CPC, arts. 55 e 313"]},{"trib":"TJ-RJ","ano":2025,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/d/guest/espelho_de_correcao_prova_de_sentenca_civel","prova":"https://www.tjrj.jus.br/documents/d/guest/prova-sentenca-civel","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/cidadao/concursos/magistratura/magistratura/l","nota":"Prova
