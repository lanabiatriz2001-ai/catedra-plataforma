","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Consumidor","tema":"Conceito de consumidor e responsabilidade do site intermediador de vendas","rot":"Direito do Consumidor - 1a questao","exig":"Entender que ha relacao de consumo; o candidato devera discorrer sobre o conceito de consumidor e as teorias que tratam do tema, assim como a posicao do STJ, apontando as razoes pelas quais concluiu pela responsabilidade do site, citando os dispositivos legais pertinentes, demonstrando que conhece a legislacao a ser aplicada.","pont":"0,40","disp":["CDC"]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Consumidor","tema":"Superendividamento de consumidora idosa (Lei 14.181/2021)","rot":"Direito do Consumidor - 2a questao","exig":"Reconhecer situacao de superendividamento da consumidora, que e idosa; citar o novel diploma legal - Lei 14.181/2021 -; falar dos principios vetores do CDC e do novo diploma, dando destaque preferencialmente a dignidade da pessoa humana, com assento constitucional, ao principio da concessao do credito responsavel, da cooperacao e transparencia entre credor e consumidor e a preservacao do minimo existencial; destacar que, conforme a nova lei, sera possivel ao superendividado requerer ao juiz a convocacao dos credores para tentativa de recuperacao do devedor mediante plano de quitacao das dividas, a fim de evitar sua exclusao social.","pont":"0,40","disp":["Lei 14.181/2021","CDC","CF, art. 1o, III"]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"ECA/Infância","tema":"Sistema valorativo do Direito da Crianca e do Adolescente: norma supralegal, metaprincipios e principios derivados","rot":"Direito da Crianca e do Adolescente - 1a questao","exig":"1) Norma supralegal: INTERESSE SUPERIOR DA CRIANCA E DO ADOLESCENTE, maior valor da disciplina, hoje expresso no art. 100, IV, do ECA; postulado normativo na doutrina de Humberto Avila; tambem foi considerada a resposta que mencionou tratados de direitos humanos aprovados antes da EC 45/2004, dado o status supralegal reconhecido pelo STF. 2) Metaprincipios nucleares: PROTECAO INTEGRAL e PRIORIDADE ABSOLUTA (art. 227, caput, da CF e art. 100, II, do ECA). 3) Ao menos 7 principios derivados do art. 100 do ECA: crianca e adolescente como sujeitos de direitos (I); responsabilidade primaria e solidaria do poder publico (III); privacidade (V); intervencao precoce (VI); intervencao minima (VII); proporcionalidade e atualidade (VIII); responsabilidade parental (IX), aliado ao art. 229 da CF; prevalencia da familia (X); obrigatoriedade de informacao (XI); oitiva obrigatoria e participacao (XII).","pont":"0,40","disp":["ECA, art. 100, I a XII","CF, arts. 227 e 229","Lei 12.010/2009"]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"ECA/Infância","tema":"Vacinacao obrigatoria de criancas e adolescentes; recusa dos pais por conviccao filosofica","rot":"Direito da Crianca e do Adolescente - 2a questao","exig":"Aplicar o Tema 1103 do STF (ARE 1.267.879/SP, Rel. Min. Roberto Barroso, 17/12/2020): e constitucional a obrigatoriedade de imunizacao por vacina registrada e incluida no PNI ou determinada em lei ou por ente federativo com base em consenso medico-cientifico, nao havendo violacao a liberdade de consciencia e de conviccao filosofica dos pais nem ao poder familiar. Aplicar as sancoes pertinentes a genitora, sendo possivel o deferimento da suspensao da guarda e do poder familiar e a busca e apreensao dos filhos para regularizacao da vacinacao obrigatoria (ECA, art. 14, par. 1o; art. 11, par. 1o a 3o para criancas e adolescentes com deficiencia; art. 249; Titulo IV, art. 129 e ss.). Distinguir a situacao de cada filho na data de 29/02/2020: Carlos ja maior de 18 anos, nao sujeito as medidas; Carla, com sindrome de Down, ainda adolescente de 17 anos; Jose ainda crianca. Dialogar com o Estatuto da Pessoa com Deficiencia (Lei 13.146/2015) e com o Codigo Civil quanto a capacidade.","pont":"0,40","disp":["Tema 1103/STF","ECA, arts. 11, 14 par. 1o, 129 e ss., 249","Lei 13.146/2015","Codigo Civil"]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Processo Civil","tema":"Prescricao da repeticao de tarifas, coisa julgada coletiva e interrupcao da prescricao pela acao civil publica","rot":"Direitos Difusos e Coletivos - 1a questao","exig":"Criterio de correcao discriminado pela banca: A) 0,1 para quem explicasse que nao se aplica a especie o prazo quinquenal do art. 27 do CDC, visto que nao se cuida de responsabilidade civil, prevalecendo o prazo residual decenal do Codigo Civil (referencias genericas 'ao entendimento do STJ' foram pontuadas com parte do grau); B) 0,1 para quem distinguisse representacao processual de substituicao processual, deixando claro que na segunda a coisa julgada beneficiaria mesmo o nao associado; C) 0,15 para quem, na forma do Tema Repetitivo 1005 do STJ, explicasse que para se beneficiar da interrupcao na acao coletiva deveria o particular requerer a suspensao da acao individual; D) 0,05 consoante a correcao do Portugues e a coordenacao do raciocinio.","pont":"0,40 (0,10 + 0,10 + 0,15 + 0,05)","disp":["CDC, art. 27","Codigo Civil, art. 205","Tema Repetitivo 1005/STJ","Lei 7.347/85"]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Penal","tema":"Roubo em concurso formal, porte de arma e dosimetria","rot":"Direito Penal - 1a questao","exig":"Reconhecer, quanto a ROBERTO e TERCIO, dois crimes de roubo consumados circunstanciados pelo concurso de agentes, em concurso formal; quanto a CAETANO, alem desses, a infracao do art. 14 da Lei 10.826/03. Comentar rapidamente a consumacao e o posicionamento das Cortes Superiores; o porte de arma nao se estende aos demais agentes, pois o enunciado nao diz que tivessem conhecimento do artefato belico; e que a pistola 9 mm nao e mais considerada arma de uso restrito. Dosimetria: nao ha indicacao de que as penas extrapolem o minimo legal - pena-base no menor patamar, mais 1/3 e mais 1/6, resultado final 6 anos, 2 meses e 20 dias de reclusao, regime semiaberto e 26 dias-multa no menor valor unitario (CP, art. 72), para ROBERTO e TERCIO; para CAETANO, mais 2 anos de reclusao pelo art. 14 da Lei 10.826/03, regime fechado, resposta penal de 8 anos, 2 meses e 20 dias e 36 dias-multa.","pont":"0,40","disp":["CP, art. 157, par. 2o","CP, art. 70","CP, art. 72","Lei 10.826/03, art. 14"]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Penal","tema":"Desistencia voluntaria, tentativa, iter criminis e crimes remanescentes","rot":"Direito Penal - 2a questao","exig":"Decidir quanto a existencia de tentativa ou de desistencia voluntaria, esclarecendo a diferenca entre desistencia espontanea e voluntaria e lembrando que o Codigo Penal exige o inicio da execucao (qual o ato inicial de um furto?). Houve desistencia voluntaria, respondendo os agentes pelos fatos praticados: um dano e uma violacao de domicilio cometida durante a noite e por quatro agentes. Dizer se o dano remanesceria, examinando se ocorreu ou nao a decadencia, ou a sua consuncao por se tratar de crime-meio. Quanto a pena da violacao de domicilio, examinar e justificar se, havendo duas circunstancias que integram a qualificadora (crime durante a noite e mediante quatro agentes), a pena deveria permanecer no minimo legal ou se deveria incidir aumento, que nao poderia ser maior de 1/6.","pont":"0,40","disp":["CP, art. 15","CP, art. 150","CP, art. 163"]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Processo Penal","tema":"Alegacoes finais, ingresso domiciliar sem autorizacao e acesso a dados de celular","rot":"Direito Processual Penal - 1a questao","exig":"Demonstrar dominio da fase das alegacoes finais, em particular as defensivas, notadamente apos a reforma da Lei 11.719/2008; o arrazoado final como ato essencial a caracterizar o Due Process of Law; a integracao das alegacoes a instrucao criminal (instrucao postulatoria ao lado da probatoria). Fundamental afirmar a correta postulacao ja requerida na defesa previa e ainda nao atendida, nao havendo preclusao por ter sido reiterada no momento processual oportuno (DEMORO; RANGEL; PACELLI; STF RHC 104261, HC 88868, HC 104462; STJ HC 160.384/SP, RHC 30817/MG, HC 154945/RJ). A relevancia do conteudo do requerimento (pericia no celular) e de carater subjetivo, podendo ser superada se o candidato entender que ha ilicitude a indicar a absolvicao. Constatar a atualizacao quanto a jurisprudencia dos Tribunais Superiores que afirmam os vicios apontados, nao obstante o flagrante no interior da residencia ingressada sem autorizacao (STF RE 613.616/RO - repercussao geral; STJ HC 561329, 586474, 609072, 630369, 588445, 616584, 566818, RHC 126092, REsp 1871856), assim como o acesso desautorizado ao conteudo de mensagens e fotos do celular (STJ HC 609.221/RJ; AgRg no REsp 1.912.303/PR). Merece especial consideracao observar que a hipotese nao atrai o REsp 1.782.386/RJ, que excepciona o acesso a agenda de contatos telefonicos.","pont":"0,40","disp":["Lei 11.719/2008","STF RE 613.616/RO","STJ HC 609.221/RJ","STJ AgRg no REsp 1.912.303/PR","STJ REsp 1.782.386/RJ"]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Processo Penal","tema":"Terceira fase da dosimetria com duas majorantes do roubo e art. 68, paragrafo unico, do CP","rot":"Direito Processual Penal - 2a questao","exig":"Verificar o manejo das regras de dosimetria, em especial o art. 68 e paragrafo unico do CP. Nao esta em discussao o HC 463.434-MT do STJ sobre majorantes sobejantes. A pena esta, ate a terceira fase, em 4 anos de reclusao e 10 dias-multa. Optando pela aplicacao das duas circunstancias de aumento como pugna o MP, o candidato devera justificar a razao de utilizar ou nao o paragrafo unico do art. 68 e, se for o caso, justificar o aumento por cada circunstanciadora calculado independentemente sobre as penas fixadas na segunda fase - tese alternativamente favoravel aos acusados - ou cumulativamente. Optando pelo paragrafo unico do art. 68, devera justificar fundamentadamente a opcao diante do caso concreto, observando serem somente dois os agentes, o emprego de uma unica arma de fogo de pequeno calibre e a fixacao das penas-base nos respectivos minimos legais. A resposta ja incluira, natural e implicitamente, a tese sobre bis in idem sustentada pela defesa.","pont":"0,40","disp":["CP, art. 68 e paragrafo unico","CP, art. 157, par. 2o, II e par. 2o-A, I","Sumula 231/STJ"]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Constitucional","tema":"Controle de constitucionalidade estadual: normas de reproducao obrigatoria x normas de imitacao","rot":"Direito Constitucional - 1a questao","exig":"A resposta deve distinguir preceitos (a) criados originariamente pela Assembleia Constituinte estadual (normas genuinamente estaduais); (b) cujo conteudo repete, por absorcao federativamente obrigatoria, normas da CF (normas de reproducao obrigatoria); (c) cujo conteudo repete por processo puramente mimetico (normas de imitacao ou reproducao ociosa). As duas situacoes podiam ser submetidas ao controle na Corte estadual pela via de representacao de inconstitucionalidade (CF, art. 125, par. 2o). A jurisprudencia do STF autoriza a interposicao de recurso extraordinario na hipotese de declaracao de inconstitucionalidade por Tribunal estadual em se tratando de norma constitucional de reproducao obrigatoria; nao cabe tal recurso no caso de norma de reproducao facultativa (mera imitacao), uma vez que o controle nao confronta norma constitucional federal propriamente dita. Na atribuicao de grau sera considerada a correcao vernacular e a observancia da terminologia constitucional.","pont":"0,40","disp":["CF, art. 125, par. 2o"]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Constitucional","tema":"Controle de convencionalidade e efeitos das declaracoes de invalidade","rot":"Direito Constitucional - 2a questao","exig":"A primeira pergunta versa o denominado controle de convencionalidade, que pode ser realizado pela via da acao direta de inconvencionalidade (utilizando por simetria a ADI) nos casos de convencoes aprovadas na forma do art. 5o, par. 3o, da CF, pois passam a ostentar status de emenda constitucional. Identica modalidade de tratado, aprovada em procedimento simples, e considerada por decisao do STF como norma supralegal e, nessa qualidade, pode ser declarada invalida pela via incidental. A declaracao na via direta tem eficacia erga omnes, enquanto a realizada na via indireta tem eficacia entre as partes, podendo chegar ao conhecimento do STF mediante recurso extraordinario. Na atribuicao de grau sera considerada a correcao vernacular e a terminologia constitucional.","pont":"0,40","disp":["CF, art. 5o, par. 2o e par. 3o","CF, art. 47"]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Eleitoral","tema":"Inelegibilidade que se encerra antes do dia da eleicao","rot":"Direito Eleitoral - 1a questao","exig":"A base da questao esta na Sumula 70 do TSE: 'O encerramento do prazo de inelegibilidade antes do dia da eleicao constitui fato superveniente que afasta a inelegibilidade nos termos do artigo 11, par. 10, da Lei 9.504/97'. A sumula decorreu do julgamento do P.A. 32.345 do TSE em 10/05/2016. A resposta correta seria o deferimento da candidatura com base no art. 11, par. 10, da Lei 9.504/97, com a interpretacao consolidada pela Sumula 70 do TSE.","pont":"0,40","disp":["Sumula 70/TSE","Lei 9.504/97, art. 11, par. 10"]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Empresarial","tema":"Dissolucao parcial: data-base da apuracao de haveres e mutacao patrimonial","rot":"Direito Empresarial - 1a questao","exig":"Hipotese de dissolucao parcial de sociedade empresaria; sendo por prazo indeterminado, e possivel o desligamento imotivado, mas o socio retirante deveria ter notificado os demais com antecedencia minima de 60 dias (CC, art. 1.029, caput), o que tambem se faz necessario para preparacao do balanco de determinacao 'levantado a data da resolucao' (CC, art. 1.031, caput). Como o retirante preferiu ajuizar acao, a jurisprudencia supre a lacuna legal estabelecendo como parametro a data do ajuizamento da acao judicial (ha precedentes considerando razoavel a data da citacao valida). Ainda que a formalizacao da retirada so se opere com o transito em julgado, os efeitos do provimento alcancam situacao anterior (ex tunc), momento do rompimento fatico do vinculo. O retirante nao pode colher o que nao semeou, sob pena de enriquecimento sem causa. Ressalva: havendo contratos pendentes em favor da sociedade ao tempo do desligamento fatico, tem direito a inclusao dos respectivos resultados patrimoniais no balanco, considerando-se ainda a capacidade de lucros futuros (goodwill); assim, a mutacao patrimonial posterior podera sim ser considerada para fins de haveres.","pont":"0,40","disp":["CC, art. 1.029","CC, art. 1.031"]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Empresarial","tema":"Alienacao de ativo em falencia por leilao eletronico e preco vil","rot":"Direito Empresarial - 2a questao","exig":"A Lei 11.101/05, com as alteracoes da Lei 14.112/20, disciplina a materia. Em qualquer das modalidades de alienacao do art. 142 podem ser apresentadas impugnacoes por credores, devedor ou MP no prazo de 48 horas da arrematacao, decidindo o juiz em 5 dias. Conforme o paragrafo 1o, as impugnacoes baseadas no valor de venda somente serao recebidas se acompanhadas de oferta firme do impugnante ou de terceiro por valor presente superior e de deposito caucionario de 10% do valor oferecido. Nos termos do art. 142, par. 3o-A, III, a terceira chamada se da 'por qualquer preco'; o art. 142, par. 2o-A, V, dispoe que a questao nao se sujeita a aplicacao do conceito de preco vil; e o art. 142, par. 2o-A, I, estabelece que a alienacao se da independentemente de a conjuntura do mercado ser favoravel ou desfavoravel, dado o carater forcado da venda.","pont":"0,40","disp":["Lei 11.101/05, arts. 142 e 143, com redacao da Lei 14.112/20"]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Tributário","tema":"ISS sobre operacoes de seguros - inconstitucionalidade","rot":"Direito Tributario - 1a questao","exig":"A norma e inconstitucional: os seguros nao se sujeitam ao ISSQN, pois submetidos ao IOF, competencia exclusiva da Uniao (CF, art. 153, V), ficando prejudicada a ilegalidade da fixacao de aliquota de ISS inferior a 2% (art. 8o-A da LC 116/2003, com redacao da LC 157/2016) [0,20]. Alem disso, ao prever incidencia do imposto municipal sobre seguros de qualquer natureza, a norma diverge do entendimento firmado pelo Plenario do STF nos Embargos de Declaracao no RE 651.703, com repercussao geral, que estabeleceu que o regime juridico tributario das operadoras de planos de saude, tributadas pelo ISS, nao se aplica as seguradoras de saude, submetidas ao IOF [0,20].","pont":"0,40 (0,20 + 0,20)","disp":["CF, art. 153, V","LC 116/2003, art. 8o-A","LC 157/2016","STF RE 651.703 (ED)"]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Tributário","tema":"ICMS na transferencia entre estabelecimentos do mesmo titular","rot":"Direito Tributario - 2a questao","exig":"Nao haveria ICMS na operacao, por se tratar de transferencia entre estabelecimentos de um mesmo contribuinte, situacao que escapa a incidencia do imposto estadual, nos termos da Sumula 166 do STJ, visto que a hipotese de incidencia e a operacao juridica praticada por comerciante que acarrete circulacao de mercadoria e transmissao de sua titularidade; o elemento furto nao e relevante e nao traz impacto tributario [0,20]. Ao apreciar a materia na ADC 49, o Plenario do STF declarou a inconstitucionalidade dos arts. 11, par. 3o, II, 12, I (no trecho 'ainda que para outro estabelecimento do mesmo titular') e 13, par. 4o, da LC 87/1996, consagrando que o deslocamento de mercadorias entre estabelecimentos do mesmo titular nao configura fato gerador do ICMS [0,20].","pont":"0,40 (0,20 + 0,20)","disp":["Sumula 166/STJ","ADC 49/STF","LC 87/1996"]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Ambiental","tema":"Supressao de vegetacao, motosserra nao legalizada: ilicitos, consequencias, competencia, dano moral coletivo e legitimados","rot":"Direito Ambiental - 1a questao","exig":"a) Ilicitos administrativos: supressao de vegetacao sem licenca ambiental (arts. 1o e 26 da Lei 12.651/12); ilicitos civis: dano causado ao meio ambiente (CF, art. 225, e CC, arts. 186/187); ilicitos penais: violacao dos arts. 38 e 51 da Lei 9.605/98, em concurso material (CP, art. 69), nao se admitindo a consuncao, eis que ambos sao ilicitos autonomos. b) Consequencias administrativas: advertencia, multa simples e multa diaria (art. 72 da Lei 9.605/98), observado o art. 6o (gravidade do fato, antecedentes e situacao economica do infrator); civis: indenizacao individual e coletiva e reparacao do dano causado; penais: pena privativa de liberdade, restritiva de direito e multa. c) Competencia fiscalizatoria comum da Uniao, Estados, DF e Municipios: o ilicito pode ser fiscalizado pelo Municipio por prevalencia do interesse local (CF, art. 23, VI c/c art. 30, I), pelos orgaos estaduais responsaveis pelo licenciamento (art. 17 da LC 140/11) e pelos orgaos federais; a competencia para lavrar auto de infracao e de todas as autoridades do SISNAMA. d) Cabe indenizacao por dano moral coletivo, em acao civil publica proposta pelo Ministerio Publico e demais legitimados da Lei 7.347/85 (CC, arts. 186 e 927; CF, art. 5o, X). e) Legitimados: os previstos no art. 5o da Lei 7.347/85, alem daqueles que individualmente sofreram prejuizos (p.ex., diminuicao das especies da piscicultura local); no caso de dano moral coletivo, eventual condenacao seria destinada a um fundo de protecao ao meio ambiente.","pont":"0,40","disp":["Lei 12.651/12, arts. 1o e 26","Lei 9.605/98, arts. 6o, 38, 51, 70 e 72","CP, art. 69","CF, arts. 5o X, 23 VI, 30 I e 225","LC 140/11, art. 17","Lei 7.347/85, art. 5o","CC, arts. 186, 187 e 927"]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Administrativo","tema":"Alienacao de controle acionario de sociedade de economia mista e de subsidiarias","rot":"Direito Administrativo - 1a questao","exig":"A pergunta foi retirada da ADI 5624 do STF: (i) a alienacao do controle acionario de empresas publicas e sociedades de economia mista exige autorizacao legislativa e licitacao; (ii) a exigencia de autorizacao legislativa nao se aplica a alienacao do controle de suas subsidiarias e controladas, podendo a operacao ser realizada sem licitacao, desde que observados os principios do art. 37 da CF e a necessaria competitividade. Pontos obrigatorios: distinguir sociedade de economia mista e sua subsidiaria, indicando o modo de criacao de cada uma; falar sobre o paralelismo das formas ou principio da simetria; mencionar a necessidade de lei para a alienacao do controle da sociedade de economia mista e a desnecessidade para a subsidiaria; mencionar a necessidade de licitacao para a sociedade de economia mista e a desnecessidade para a subsidiaria; mencionar que para a subsidiaria e dispensada a licitacao; indicar o art. 29, caput, XVIII, da Lei 13.303/16; mencionar a decisao do STF no julgamento conjunto da ADI 5624 e MC nas ADI 5846, 5924 e 6029.","pont":"0,40","disp":["STF ADI 5624","Lei 13.303/16, art. 29, XVIII","CF, art. 37"]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Administrativo","tema":"Controle judicial de correcao de prova de concurso publico","rot":"Direito Administrativo - 2a questao","exig":"A pergunta foi retirada do RE 632.853 do STF (repercussao geral): nao compete ao Poder Judiciario, no controle de legalidade, substituir banca examinadora para avaliar respostas dadas pelos candidatos e notas a elas atribuidas; excepcionalmente e permitido ao Judiciario juizo de compatibilidade do conteudo das questoes com o previsto no edital. Pontos obrigatorios: a diferenca entre controle de merito e de legalidade; o Judiciario apenas pode exercer controle de legalidade nos atos discricionarios; a pergunta se coloca dentro do conteudo programatico, por isso dentro da legalidade; o gabarito segue a corrente doutrinaria que melhor se coaduna com as funcoes do cargo, mostrando-se proporcional; o Judiciario nao pode controlar o merito 'aceitando' outras respostas, sob pena de se substituir a Administracao; fazer mencao ao RE 632.853 do STF.","pont":"0,40","disp":["STF RE 632.853 (repercussao geral)"]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Filosofia do Direito","tema":"Papel contramajoritario do STF","rot":"Nocoes Gerais de Direito e Formacao Humanistica - 1a questao","exig":"Expor que o STF, como as demais Cortes Constitucionais, exerce o controle de constitucionalidade dos atos normativos, podendo invalidar atos do Congresso Nacional e do Presidente da Republica; 11 ministros que sequer receberam voto popular podem sobrepor sua interpretacao a de agentes politicos com mandato representativo, o que gera a aparente contradicao apelidada de dificuldade contramajoritaria. Esse papel e amplamente aceito com base em dois fundamentos: (i) protecao dos direitos fundamentais (minimo etico e reserva de justica), que nao podem ser atropelados por simples deliberacao majoritaria; (ii) protecao as regras do jogo democratico e aos canais de participacao politica. Na visao do Ministro Luis Roberto Barroso, seria um status de 'sentinela contra o risco da tirania das maiorias'. Referir a dimensao substantiva da democracia (igualdade, liberdade e justica), a Corte como forum de principios e a independencia de seus membros em relacao ao processo eleitoral. O candidato poderia complementar com exemplos praticos da atuacao contramajoritaria do STF.","pont":"0,40","disp":[]},{"trib":"TJ-RJ","ano":2021,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-discursiva.pdf/5f727216-75cb-7d2b-ef53-c251fe5d2d97?t=1631652657101","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-discursiva.pdf/64c36c59-71b9-e4f6-27e6-c272ff153808?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova discursiva do XLVIII Concurso, aplicada em 11/07/2021. A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Constitucional","tema":"Direito ao esquecimento x liberdade de informacao; responsabilidade do provedor de hospedagem","rot":"Nocoes Gerais de Direito e Formacao Humanistica - 2a questao","exig":"Reconhecer colisao aparente entre liberdade de imprensa e acesso a informacao, de um lado, e honra e imagem, de outro. Nao se vislumbra ilicitude apta a ensejar reparacao por dano moral: a materia limitou-se a narrar que o autor foi preso e investigado, sem intuito de deturpar a realidade nem animus de ofender; houve mera reproducao de informacoes fornecidas por orgaos estatais, com cunho informativo, nao caracterizado abuso (CF, art. 220). A liberdade de expressao nao e absoluta, encontrando limite em outros direitos fundamentais, cabendo ao julgador examinar as especificidades do caso concreto. O provedor de hospedagem nao produziu a reportagem, apenas a hospedou, respondendo apenas subjetivamente pelos abusos. Concluir que os argumentos tracejados pelo juiz nao estao corretos. Expor a origem do direito ao esquecimento no Brasil (casos da Chacina da Candelaria e de Vigario Geral, 4a Turma do STJ) e as tres principais posicoes sobre o tema, inclusive a que nega a existencia de um direito ao esquecimento (ADI 4815; New York Times Co. v. Sullivan).","pont":"0,40","disp":["CF, arts. 5o IV, IX, X e XIV, e 220","STF ADI 4815"]},{"trib":"TJ-RJ","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-sentenca-civel.pdf/f05014eb-059c-ee01-f05f-dec41dcb93d1?t=1643045358422","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-de-sentenca-civel-27-11-2021.pdf/cb540a94-c0fe-d15b-3189-9d790b914c4e?version=1.1","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova de sentenca civel do XLVIII Concurso, aplicada em 27/11/2021 (espelho publicado em 24/01/2022). A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Sentença (estrutura)","tema":"Ordem logica de enfrentamento das preliminares","rot":"I - Estrutura e apresentacao da sentenca","exig":"Enfrentamento ordenado e logico das questoes preliminares. Impropriedade do exame de questoes preliminares no juizo de merito da causa. Julgamento antecipado do merito pressupoe a presenca das condicoes para o regular exercicio do direito de acao e os requisitos de validade processual (juizo preliminar), ou seja, o previo enfrentamento de todas as questoes preliminares suscitadas.","pont":"nao discriminada","disp":[]},{"trib":"TJ-RJ","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-sentenca-civel.pdf/f05014eb-059c-ee01-f05f-dec41dcb93d1?t=1643045358422","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-de-sentenca-civel-27-11-2021.pdf/cb540a94-c0fe-d15b-3189-9d790b914c4e?version=1.1","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova de sentenca civel do XLVIII Concurso, aplicada em 27/11/2021 (espelho publicado em 24/01/2022). A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Processo Civil","tema":"Habilitacao de credito tributario e concurso de preferencias","rot":"I.a - Competencia do juizo da execucao","exig":"Enfrentamento da questao atinente a habilitacao de credito tributario no juizo da execucao. Incidente de concurso de preferencias (CPC, arts. 908 e 909). Credores habilitados que assumem a condicao de parte no incidente de natureza cognitiva. Competencia funcional do juizo em que ocorreu a alienacao judicial. Fundamentacao adequada para nao haver o declinio de competencia para a Justica Federal, nos termos do art. 109, I, da CF/88. Sumula 244 do TFR. Sumula 270 do STJ.","pont":"nao discriminada","disp":["CPC, arts. 908 e 909","CF, art. 109, I","Sumula 244/TFR","Sumula 270/STJ"]},{"trib":"TJ-RJ","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-sentenca-civel.pdf/f05014eb-059c-ee01-f05f-dec41dcb93d1?t=1643045358422","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-de-sentenca-civel-27-11-2021.pdf/cb540a94-c0fe-d15b-3189-9d790b914c4e?version=1.1","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova de sentenca civel do XLVIII Concurso, aplicada em 27/11/2021 (espelho publicado em 24/01/2022). A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Processo Civil","tema":"Prazo de resposta e revelia nos embargos de terceiro","rot":"I.b - Tempestividade da contestacao nos embargos de terceiro","exig":"Procedimento aplicavel (CPC, art. 231, par. 1o). Distincao com a defesa no processo de execucao por meio de embargos a execucao. Inaplicabilidade da regra do art. 915, par. 1o, do CPC. Revelia do executado/embargado. Inocorrencia do efeito previsto no art. 344 do CPC (presuncao de veracidade dos fatos narrados na inicial).","pont":"nao discriminada","disp":["CPC, arts. 231 par. 1o, 344 e 915 par. 1o"]},{"trib":"TJ-RJ","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-sentenca-civel.pdf/f05014eb-059c-ee01-f05f-dec41dcb93d1?t=1643045358422","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-de-sentenca-civel-27-11-2021.pdf/cb540a94-c0fe-d15b-3189-9d790b914c4e?version=1.1","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova de sentenca civel do XLVIII Concurso, aplicada em 27/11/2021 (espelho publicado em 24/01/2022). A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Processo Civil","tema":"Valor da causa nos embargos de terceiro","rot":"I.c - Regularidade formal da peticao inicial / valor da causa","exig":"Finalidade dos embargos de terceiro: livrar o bem do ato de constricao judicial praticado na execucao. Valor da causa: valor do bem atingido, mas sempre limitado ao valor da execucao. Precedentes do STJ. Se o valor da execucao for inferior ao valor do bem penhorado, aquele deve ser o valor da causa nos embargos de terceiro. Fundamentacao.","pont":"nao discriminada","disp":["Precedentes do STJ"]},{"trib":"TJ-RJ","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-sentenca-civel.pdf/f05014eb-059c-ee01-f05f-dec41dcb93d1?t=1643045358422","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-de-sentenca-civel-27-11-2021.pdf/cb540a94-c0fe-d15b-3189-9d790b914c4e?version=1.1","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova de sentenca civel do XLVIII Concurso, aplicada em 27/11/2021 (espelho publicado em 24/01/2022). A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Processo Civil","tema":"Participacao do executado nos embargos de terceiro","rot":"I.d - Litisconsorcio passivo necessario","exig":"Insuficiencia da regra do art. 677, par. 4o, do CPC para resolver a questao. Bem imovel indicado apenas pelo exequente. Discussao travada nos embargos de terceiro que envolve potencial prejuizo a esfera juridica do executado, com o reconhecimento do direito a meacao e ao levantamento da importancia depositada pela ex-companheira embargante. Necessidade da participacao do executado na relacao processual. Hipotese de litisconsorcio necessario pela natureza da relacao juridica envolvida no processo, na forma do art. 114 do CPC.","pont":"nao discriminada","disp":["CPC, arts. 114 e 677 par. 4o"]},{"trib":"TJ-RJ","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-sentenca-civel.pdf/f05014eb-059c-ee01-f05f-dec41dcb93d1?t=1643045358422","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-de-sentenca-civel-27-11-2021.pdf/cb540a94-c0fe-d15b-3189-9d790b914c4e?version=1.1","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova de sentenca civel do XLVIII Concurso, aplicada em 27/11/2021 (espelho publicado em 24/01/2022). A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Processo Civil","tema":"Adequacao e interesse nos embargos de terceiro","rot":"I.e - Cabimento dos embargos de terceiro quanto aos fundamentos","exig":"Necessidade de enfrentamento, com base na boa ordem processual, da preliminar atinente ao cabimento dos embargos de terceiro (adequacao / interesse) diante de seus fundamentos. Cabimento dos embargos de terceiro para desconstituir o gravame judicial, no tocante as alegacoes de impenhorabilidade do imovel ou de nulidade de sua alienacao judicial. Descabimento dos embargos de terceiro para discutir eventual excesso de execucao. Precedentes do STJ.","pont":"nao discriminada","disp":["Precedentes do STJ"]},{"trib":"TJ-RJ","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-sentenca-civel.pdf/f05014eb-059c-ee01-f05f-dec41dcb93d1?t=1643045358422","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-de-sentenca-civel-27-11-2021.pdf/cb540a94-c0fe-d15b-3189-9d790b914c4e?version=1.1","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova de sentenca civel do XLVIII Concurso, aplicada em 27/11/2021 (espelho publicado em 24/01/2022). A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Civil","tema":"Bem de familia do fiador em locacao","rot":"II.a - Merito: impenhorabilidade do imovel do fiador locaticio","exig":"Confronto da regra do art. 3o, VII, da Lei 8.009/90 com o art. 6o da CF/88. Discussao atual no ambito do STF (RE 1.307.334), em sede de repercussao geral. Recentes precedentes do STF dando primazia ao direito social a moradia. Distinguish. Locacao nao residencial. Subsistencia do entendimento consolidado no Tema 295 do STF e na Sumula 549 do STJ para as locacoes residenciais.","pont":"nao discriminada","disp":["Lei 8.009/90, art. 3o, VII","CF, art. 6o","STF RE 1.307.334","Tema 295/STF","Sumula 549/STJ"]},{"trib":"TJ-RJ","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-sentenca-civel.pdf/f05014eb-059c-ee01-f05f-dec41dcb93d1?t=1643045358422","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-de-sentenca-civel-27-11-2021.pdf/cb540a94-c0fe-d15b-3189-9d790b914c4e?version=1.1","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova de sentenca civel do XLVIII Concurso, aplicada em 27/11/2021 (espelho publicado em 24/01/2022). A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Civil","tema":"Outorga uxoria e uniao estavel","rot":"II.b - Fianca prestada sem autorizacao da companheira","exig":"Nulidade ou ineficacia parcial da fianca prestada sem autorizacao da companheira. Evolucao no tratamento da disciplina juridica da uniao estavel em relacao ao casamento. Posicao do STF. Preservacao de algumas diferencas por razoes formais. Necessidade de outorga uxoria (CC, art. 1.647, III). Sumula 332 do STJ. Inaplicabilidade as relacoes de uniao estavel para fins de preservacao da seguranca das relacoes juridicas. Boa-fe dos contratantes. Precedentes do STJ. Validade da fianca locaticia. Ineficacia parcial em relacao ao companheiro preterido. Preservacao do direito a meacao, que se projeta sobre o valor alcancado com a avaliacao do imovel (CPC, art. 843).","pont":"nao discriminada","disp":["CC, art. 1.647, III","Sumula 332/STJ","CPC, art. 843"]},{"trib":"TJ-RJ","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-sentenca-civel.pdf/f05014eb-059c-ee01-f05f-dec41dcb93d1?t=1643045358422","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-de-sentenca-civel-27-11-2021.pdf/cb540a94-c0fe-d15b-3189-9d790b914c4e?version=1.1","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova de sentenca civel do XLVIII Concurso, aplicada em 27/11/2021 (espelho publicado em 24/01/2022). A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Processo Civil","tema":"Arrematacao x adjudicacao e preco vil","rot":"II.c - Validade da arrematacao","exig":"Distincao entre arrematacao e adjudicacao. Disciplinas distintas. Inaplicabilidade do art. 876 do CPC no caso em exame. Possibilidade de o exequente participar da hasta publica como unico licitante. Limite: lanco cujo valor nao seja vil (CPC, art. 891). Valor alcancado no leilao que preserva a meacao do companheiro preterido (CPC, art. 843, par. 2o).","pont":"nao discriminada","disp":["CPC, arts. 843 par. 2o, 876 e 891"]},{"trib":"TJ-RJ","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-sentenca-civel.pdf/f05014eb-059c-ee01-f05f-dec41dcb93d1?t=1643045358422","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-de-sentenca-civel-27-11-2021.pdf/cb540a94-c0fe-d15b-3189-9d790b914c4e?version=1.1","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova de sentenca civel do XLVIII Concurso, aplicada em 27/11/2021 (espelho publicado em 24/01/2022). A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Sentença (estrutura)","tema":"Congruencia do dispositivo","rot":"II.d - Dispositivo da sentenca","exig":"Resposta a pretensao da embargante (juizo de merito). Julgamento de procedencia parcial para garantir a autora o seu direito a meacao, que se projeta sobre o valor alcancado com a alienacao judicial do imovel e depositado a disposicao do juizo da execucao.","pont":"nao discriminada","disp":[]},{"trib":"TJ-RJ","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca civel","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-sentenca-civel.pdf/f05014eb-059c-ee01-f05f-dec41dcb93d1?t=1643045358422","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-de-sentenca-civel-27-11-2021.pdf/cb540a94-c0fe-d15b-3189-9d790b914c4e?version=1.1","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova de sentenca civel do XLVIII Concurso, aplicada em 27/11/2021 (espelho publicado em 24/01/2022). A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Processo Civil","tema":"Sucumbencia parcial e honorarios","rot":"II.e - Distribuicao dos onus de sucumbencia","exig":"Resistencia do exequente/embargado a pretensao autoral, sustentando inclusive o descabimento da acao de embargos de terceiro. Sucumbencia parcial. Distribuicao das despesas processuais entre as partes (embargante x embargados). Honorarios advocaticios de sucumbencia em favor dos patronos da embargante e do exequente/embargado. Base de calculo: proveito economico.","pont":"nao discriminada","disp":["CPC, art. 85"]},{"trib":"TJ-RJ","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca penal","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-sentenca-penal-atualiz.pdf/b40336f2-c670-fbcd-56c3-460fa386f2e3?version=1.1","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-de-sentenca-penal-28-11-2021.pdf/4acd3b36-2a4a-f10e-bcb8-29730295b9b9?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova de sentenca penal do XLVIII Concurso, aplicada em 28/11/2021 (espelho publicado em 25/01/2022). A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Processo Penal","tema":"Incompetencia absoluta e continencia com o Juizo da Infancia","rot":"Prejudicial de incompetencia quanto ao agente inimputavel","exig":"Seria recomendavel o Juiz analisar inicialmente a prejudicial de incompetencia para julgar THIAGO, que provou com documento idoneo sua inimputabilidade, ficando estabelecida a incompetencia absoluta do juizo, com declinio para a Justica Menorista e desconstituicao dos atos em relacao a ele desde o recebimento da denuncia. Ha continencia processual que exigiria unidade de processo e julgamento, nao fosse a vedacao expressa do art. 79, II, do CPP (concurso entre jurisdicao comum e Juizo de Menores). Nao se trata de rejeicao da denuncia, e sim de incidencia do art. 109 do CPP, aplicavel em qualquer fase do processo, admitindo-se que, embora nao formalmente apresentada, a defesa excepcionou a incompetencia. Nulidades do art. 564, I e II, so poderiam ser utilizadas em caso de nao reconhecimento da incompetencia.","pont":"nao discriminada","disp":["CPP, arts. 79 II, 109 e 564 I e II"]},{"trib":"TJ-RJ","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca penal","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-sentenca-penal-atualiz.pdf/b40336f2-c670-fbcd-56c3-460fa386f2e3?version=1.1","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-de-sentenca-penal-28-11-2021.pdf/4acd3b36-2a4a-f10e-bcb8-29730295b9b9?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova de sentenca penal do XLVIII Concurso, aplicada em 28/11/2021 (espelho publicado em 25/01/2022). A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Penal","tema":"Roubo circunstanciado, emprego de arma de fogo e prova da majorante","rot":"Adequacao tipica - progressao criminosa de furto para roubo","exig":"Todos intentavam cometer furto, supondo nao haver ninguem na casa; WALLACE ficou na frente dando cobertura; iniciada a subtracao, surgiu PEDRO, rendido por MAYCON, armado com pistola .380 municiada, e em seguida OLGA, havendo progressao criminosa. Analisar a circunstanciadora especial do emprego de arma de fogo diante da orientacao dos Tribunais Superiores, que em principio exigem idoneidade de prova; a palavra da vitima, em regra, possui essa idoneidade, embora cada caso guarde contexto proprio, razao pela qual a resposta deveria ser bem fundamentada, nao se afastando a possibilidade de nao ter sido reconhecida a circunstanciadora. Nao restou configurada a majorante do inciso V, pois a restricao a liberdade das vitimas nao extrapolou o tempo necessario a subtracao dos bens.","pont":"nao discriminada","disp":["CP, art. 157, par. 2o e par. 2o-A"]},{"trib":"TJ-RJ","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca penal","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-sentenca-penal-atualiz.pdf/b40336f2-c670-fbcd-56c3-460fa386f2e3?version=1.1","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-de-sentenca-penal-28-11-2021.pdf/4acd3b36-2a4a-f10e-bcb8-29730295b9b9?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova de sentenca penal do XLVIII Concurso, aplicada em 28/11/2021 (espelho publicado em 25/01/2022). A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Penal","tema":"Desvio subjetivo de conduta (CP, art. 29, par. 2o)","rot":"Cooperacao dolosamente distinta quanto a WALLACE","exig":"WALLACE so tomou conhecimento de que ocorrera um roubo, e nao um furto, quando os demais ingressaram no veiculo por ele conduzido, apos a grave ameaca e apreensao dos bens, nao havendo indicacao de que aderiu a infracao mais grave. A adesao criminosa so pode ocorrer antes do cometimento ou durante a pratica, jamais apos os atos executorios. Hipotese de cooperacao dolosamente distinta ou desvio subjetivo de conduta: a punicao sera pelo crime idealizado ao qual aderiu, salvo prova de que aceitou ou foi indiferente ao crime mais grave (dolo eventual); afirmando-se que o resultado mais grave era previsivel, de modo fundamentado, a pena sofrera aumento ate metade. Para WALLACE subsiste furto qualificado pelo concurso de pessoas, afastada a qualificadora do repouso noturno (fato antes das 22 horas, cidade de veraneio, vizinhos acordados). Incide o art. 29, par. 2o, primeira parte; nao ha participacao de menor importancia.","pont":"nao discriminada","disp":["CP, art. 29 par. 2o","CP, art. 155 par. 4o IV"]},{"trib":"TJ-RJ","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca penal","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-sentenca-penal-atualiz.pdf/b40336f2-c670-fbcd-56c3-460fa386f2e3?version=1.1","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-de-sentenca-penal-28-11-2021.pdf/4acd3b36-2a4a-f10e-bcb8-29730295b9b9?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova de sentenca penal do XLVIII Concurso, aplicada em 28/11/2021 (espelho publicado em 25/01/2022). A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Penal","tema":"Corrupcao de menores e unidade patrimonial","rot":"Corrupcao de menores e crime unico de roubo","exig":"Subsiste a corrupcao de menor relacionada a JONAS, nao quanto a THIAGO, ja que o Ministerio Publico nao fez uso das disposicoes do art. 384 do CPP; nada impediria que o Juiz aplicasse o art. 384, par. 1o, do CPP. So ha um roubo, apesar de duas pessoas terem sido gravemente ameacadas, pois o enunciado deixa subentendido um patrimonio comum. Quanto a corrupcao de menor, nao importa se JONAS ja era corrompido, aplicando-se o entendimento sumular do STJ.","pont":"nao discriminada","disp":["CPP, art. 384 e par. 1o","Sumula 500/STJ","ECA, art. 244-B"]},{"trib":"TJ-RJ","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca penal","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-sentenca-penal-atualiz.pdf/b40336f2-c670-fbcd-56c3-460fa386f2e3?version=1.1","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-de-sentenca-penal-28-11-2021.pdf/4acd3b36-2a4a-f10e-bcb8-29730295b9b9?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova de sentenca penal do XLVIII Concurso, aplicada em 28/11/2021 (espelho publicado em 25/01/2022). A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Penal","tema":"Contexto temporal distinto","rot":"Porte ilegal de arma de fogo e concurso material","exig":"O porte de arma foi cometido dois dias apos a distribuicao do auto de prisao em flagrante referente ao roubo; o revolver estava municiado e o acusado nao negou a potencialidade lesiva, alegando portar a arma para se defender de ameacas de faccao criminosa. Ha que se reconhecer que o crime foi cometido em contexto temporal distinto, subsistindo o concurso material de delitos.","pont":"nao discriminada","disp":["CP, art. 69","Lei 10.826/03"]},{"trib":"TJ-RJ","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca penal","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-sentenca-penal-atualiz.pdf/b40336f2-c670-fbcd-56c3-460fa386f2e3?version=1.1","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-de-sentenca-penal-28-11-2021.pdf/4acd3b36-2a4a-f10e-bcb8-29730295b9b9?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova de sentenca penal do XLVIII Concurso, aplicada em 28/11/2021 (espelho publicado em 25/01/2022). A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Penal","tema":"Terceira fase, concurso formal x material, atenuantes e agravante","rot":"Dosimetria","exig":"Na dosimetria, a sancao basica, fixada nos menores patamares, deve ser acrescida de 2/3 se reconhecido o emprego de arma de fogo, nos termos do art. 68, paragrafo unico, do CP, considerando que o enunciado nao indica motivacao para aplicacao, na terceira fase, de regra diversa da indicada pelo legislador; por isso, embora tenha ocorrido concurso formal entre o roubo e a corrupcao de menor, o concurso material se afigura mais benefico. Reconhecidas duas circunstancias atenuantes e uma agravante, a reincidencia deve ser compensada com a confissao espontanea, e a menoridade relativa, embora reconhecida, nao incidira na dosimetria em decorrencia do verbete sumular 231 do STJ. Para WALLACE, pena-base no minimo legal com acrescimo de 1/6 em razao do concurso ideal perfeito. Remanesce o porte ilegal de arma de fogo, com pena final no menor patamar, aplicando-se o cumulo material com o roubo e a corrupcao de menor.","pont":"nao discriminada","disp":["CP, arts. 68 paragrafo unico, 69 e 70","Sumula 231/STJ"]},{"trib":"TJ-RJ","ano":2022,"banca":"Banca própria","tipo":"Sentença","tipoRaw":"sentenca penal","url":"https://www.tjrj.jus.br/documents/10136/0/espelho-da-prova-sentenca-penal-atualiz.pdf/b40336f2-c670-fbcd-56c3-460fa386f2e3?version=1.1","prova":"https://www.tjrj.jus.br/documents/10136/6660150/prova-de-sentenca-penal-28-11-2021.pdf/4acd3b36-2a4a-f10e-bcb8-29730295b9b9?version=1.0","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlviii","nota":"Prova de sentenca penal do XLVIII Concurso, aplicada em 28/11/2021 (espelho publicado em 25/01/2022). A propria pagina do concurso rotula o documento como 'Espelho/gabarito', ou seja, nao ha gabarito separado para esta prova.","cargo":"Juiz Substituto","disc":"Processo Penal","tema":"Manutencao da prisao, substituicao da pena, indenizacao e comunicacoes","rot":"Disposicoes finais","exig":"A pena privativa de liberdade imposta a WALLACE deve ser substituida por duas sancoes restritivas de direito, com expedicao de alvara de soltura. Em relacao a MAYCON, reincidente, deve ser mantida a custodia, sendo ele recomendado na prisao em que se encontra. Nao cabe a fixacao de indenizacao, por ausencia de pedido e contraditorio. Devem ser feitas as anotacoes e comunicacoes previstas na legislacao pertinente.","pont":"nao discriminada","disp":["CP, art. 44","CPP, art. 387, IV"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Civil","tema":"Cumulacao de dano moral e estetico, lucros cessantes e dano hipotetico","rot":"Direito Civil - 1a questao","exig":"A indenizacao por danos morais e cabivel, assim como a de dano estetico, que podem ser acumuladas a teor da Sumula 387 do STJ. Lucros cessantes: entende a banca que nao existem, porque no direito civil se indeniza o lucro certo ou razoavelmente esperado, nao obtido em razao do ilicito - no caso trata-se de mera expectativa, pois tornar-se modelo era hipotese, e nao se indeniza dano hipotetico. Mas se o candidato mencionar a teoria da perda de uma chance, que nao trata exatamente de lucros cessantes mas pode ser discutida, a banca dara os pontos, desde que faca a distincao devida. A restituicao das mensalidades e cabivel, assim como a indenizacao pelos danos materiais e o tratamento psicologico; se o candidato responder com logica, a banca admitira a resposta de negativa da indenizacao pelas mensalidades.","pont":"0,40","disp":["Sumula 387/STJ","CC, art. 402"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Civil","tema":"Alimentos gravidicos, compensatorios e avoengos","rot":"Direito Civil - 2a questao","exig":"Alimentos gravidicos: previstos na Lei 11.804/2008, devidos a mulher gravida durante a gestacao; a assistencia psicologica encontra-se prevista na lei; o candidato TERA de mencionar a Lei. Alimentos compensatorios: devidos a um dos conjuges no caso de ruptura do vinculo (uniao estavel tambem) a fim de restabelecer o equilibrio financeiro existente antes da separacao; ocorrem em casamentos com separacao total de bens, nos quais um dos conjuges fica gravemente prejudicado em sua qualidade de vida, e nos casos em que o marido impediu a mulher de trabalhar por longos anos; nao podem ser fixados por tempo determinado pela sua propria natureza. Alimentos avoengos: sao os devidos pelos avos; requisitos: obrigacao alimentar advinda do parentesco e impossibilidade de os pais prestarem alimentos.","pont":"0,40","disp":["Lei 11.804/2008","CC, arts. 1.694 e ss."]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Processo Civil","tema":"Coisa julgada progressiva e termo inicial da acao rescisoria","rot":"Direito Processual Civil - 1a questao","exig":"'Coisa julgada progressiva' ou 'coisa julgada parcial': possibilidade de haver capitulo decisorio autonomo que alcance seu resultado final de merito, sobre o qual incidirao os efeitos da coisa julgada material, ainda que a mesma relacao processual tenha prosseguimento quanto a outros pedidos. Hipoteses: julgamento antecipado parcial de merito (CPC, art. 356), sobrevindo-lhe o transito em julgado; recurso parcial, quando o autor interpoe apelacao deixando voluntariamente fora da impugnacao um ou mais capitulos decisorios autonomos da sentenca (CPC, art. 1.013). Quanto a rescindibilidade, na jurisprudencia, notadamente no STJ, prevaleceu o entendimento de que o prazo para a acao rescisoria deve sempre ser contado do transito em julgado da ultima decisao proferida no processo, mesmo no caso da coisa julgada parcial, aplicando-se o enunciado n. 401 da Sumula do STJ e o art. 975 do CPC (EREsp 404777/DF; REsp 1.353.473/PR).","pont":"0,40","disp":["CPC, arts. 356, 975 e 1.013","Sumula 401/STJ"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Processo Civil","tema":"Deposito para garantia do juizo: multa e honorarios do art. 523, par. 1o, e consectarios da mora (Tema 677/STJ)","rot":"Direito Processual Civil - 2a questao","exig":"O que afasta o cabimento dos honorarios advocaticios e da multa (CPC, art. 523, par. 1o) e o pagamento no prazo previsto no dispositivo; o deposito para fins de garantia e a hipoteca judiciaria nao se confundem com o pagamento da divida, de modo que a tese do executado nao lhe serve naquilo que foi objeto de impugnacao; em relacao a quantia incontroversa, que ja poderia ter sido levantada, nao deve ocorrer a incidencia de multa e honorarios. Quanto ao segundo ponto, se o executado opta por garantir o juizo para discutir a existencia ou extensao do credito, impede a imediata satisfacao, e se ao final ficar demonstrado que nao tinha razao, a demora nao pode pesar sobre o credor: os consectarios moratorios previstos no titulo sao devidos ate a extincao da obrigacao principal com o pagamento (Tema 677 do STJ). Contudo, como a controversia foi apenas parcial, a diferenca a ser perseguida pelo exequente ha de se ater a parcela tida por excessiva.","pont":"0,40","disp":["CPC, art. 523 par. 1o","Tema 677/STJ"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Consumidor","tema":"Consumidor by stander e vicio do produto - legitimidade ativa","rot":"Direito do Consumidor - 1a questao","exig":"Objetivo: verificar se o candidato sabe o verdadeiro alcance do conceito de consumidor by stander. A preliminar deve ser acolhida: parte legitima para o ajuizamento da acao indenizatoria e o consumidor que figura na nota fiscal de compra do produto, ainda que o tenha comprado para presentear familiar. O problema intrinseco do aparelho reflete um vicio do produto, e nesse caso nao ha que se falar em consumidor por equiparacao para legitimar a autora, pois nao se trata de fato do produto ou acidente de consumo. Nesse sentido, acordaos do TJRJ e, no STJ, o REsp 1.967.728/SP.","pont":"0,40","disp":["CDC, arts. 2o, 17, 18 e 29","STJ REsp 1.967.728/SP"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Consumidor","tema":"Erro grosseiro de sistema em preco de passagem aerea e vinculacao da oferta","rot":"Direito do Consumidor - 2a questao","exig":"Objetivo: avaliar se o candidato tem o bom senso de analisar o caso concreto com suas peculiaridades, sem ser influenciado pela primeira imagem que lhe aparece. O CDC nao e somente um conjunto de artigos que protegem o consumidor a qualquer custo: e instrumento legal que pretende harmonizar as relacoes entre fornecedores e consumidores, com base na boa-fe e no equilibrio contratual, sendo principiologico. Nao houve descaso ou inoperancia, pois logo que detectou o erro a prestadora contatou o casal em tempo suficiente para nao frustrar a comemoracao futura. Considerando o erro grosseiro do sistema informatizado, com valores muito aquem dos comumente praticados, nao ha que se falar em vinculacao da oferta (CDC, art. 30). Observado o principio da razoabilidade, nao ha como condenar a agencia de viagens por falha na prestacao do servico.","pont":"0,40","disp":["CDC, arts. 4o, 6o e 30"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"ECA/Infância","tema":"Deep nude produzido por IA entre alunos: responsabilidades, medidas e direitos a saude e a educacao","rot":"Direito da Crianca e do Adolescente - 1a questao","exig":"A questao visou aferir conhecimentos sobre o sistema constitucional e legal de protecao integral (ECA, art. 3o e paragrafo unico) e sobre os principios da cooperacao e da solidariedade do art. 227 da CF e arts. 4o e 5o do ECA, implicando responsabilidade da escola, do provedor, da familia e do Poder Publico. As vitimas - uma crianca autista e adolescentes - sofreram os efeitos da violencia e intimidacao pelo uso indevido de inteligencia artificial (deep nude). Os agentes sao adolescentes e um deles pode ser considerado maior de idade e passivel de ser criminalizado, pois a divulgacao ocorreu apos seu aniversario de 18 anos. Os atos podem ser configurados como bullying ou cyberbullying (art. 2o da Lei 13.185/2015 c/c Lei 13.718/2018), tudo de acordo com o ECA, arts. 241-B e 241-C, ou 241-A c/c art. 112, alem dos arts. 216-B e 218-C do Codigo Penal. Mesmo diante da ausencia de legislacao especifica sobre IA, o arcabouco do ECA permite que o juiz, por cautela e com base na protecao integral, use medida para impedir a continuidade da divulgacao, sem ofensa ao principio da liberdade e nao censura. Na esfera civel, a familia dos adolescentes autores e a escola podem ser responsabilizados e obrigados a indenizar as vitimas. Quanto a vitima crianca autista, invocar tambem os principios e normativas da LBI. Direito a saude: CF, arts. 6o e 196; ECA, art. 7o; LBI, arts. 4o e 5o e paragrafo unico. Educacao: LBI, art. 27, paragrafo unico.","pont":"0,40","disp":["ECA, arts. 3o, 4o, 5o, 7o, 112, 241-A, 241-B e 241-C","CF, arts. 6o, 196 e 227","Lei 13.185/2015","Lei 13.718/2018","CP, arts. 216-B e 218-C","Lei 13.146/2015 (LBI)"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"ECA/Infância","tema":"Titularidade de direitos fundamentais por pessoas em desenvolvimento e dimensoes do direito a vida","rot":"Direito da Crianca e do Adolescente - 2a questao","exig":"1) Sim: as pessoas em desenvolvimento podem ostentar, como titulares, as prerrogativas inerentes ao exercicio dos Direitos Fundamentais, inclusive exercendo livremente os chamados Direitos Humanos; por serem pessoas em desenvolvimento, merecem todas as oportunidades e faculdades para potencializar seu estado fisico, mental, moral, espiritual e social, em condicoes de liberdade e dignidade. 2) O direito a vida, reconhecido no caput do art. 5o da CF e no art. 7o do ECA, possui posicao de destaque por sua propria natureza, sendo o primeiro direito fundamental. Segundo Jose Afonso da Silva, tem tres dimensoes protetivas: (i) existencia - direito de estar e permanecer vivo; (ii) integridade fisica - absoluto respeito a integridade corporal e psiquica, sendo qualquer agressao ao corpo humano tambem agressao a vida; (iii) integridade moral - a vida e dotada de valores imateriais que merecem protecao juridica. Destacar que a Convencao sobre os Direitos da Crianca, no art. 6o, determina que os Estados-partes reconhecam que toda crianca tem direito inerente a vida, assegurando ao maximo sua sobrevivencia e desenvolvimento; o Brasil foi signatario.","pont":"0,40","disp":["CF, art. 5o caput","ECA, art. 7o","Convencao sobre os Direitos da Crianca, art. 6o"]},{"trib":"TJ-RJ","ano":2023,"banca":"Banca própria","tipo":"Discursiva","tipoRaw":"discursiva","url":"https://www.tjrj.jus.br/documents/10136/218965905/ESPELHO-DE-CORRECAO-DA-PROVA-DISCURSIVA.pdf","prova":"https://www.tjrj.jus.br/documents/10136/218965905/PROVA-DISCURSIVA.pdf","prova2":"","gab":"","conc":"https://www.tjrj.jus.br/concursos/magistratura/magistratura/xlix","nota":"Prova discursiva do XLIX Concurso, aplicada em 26/11/2023. Nao ha gabarito distinto do espelho para esta prova; o unico gabarito publicado no concurso e o da prova objetiva.","cargo":"Juiz Substituto","disc":"Penal","tema":"Teoria da tipicidade, condutas 'compartilhadas', reclassificacao art. 33/art. 28 e crimes de mao propria","rot":"Direito Penal - 1a questao","exig":"Subitens pontuados: (1) 0,20 - trabalhar a Teoria da Tipicidade, considerando os elementos do tipo, as classificacoes das infracoes e a questao da autoria, coautoria e/ou participacao; o verbo e o nucleo do tipo; embora receptacao (CP, art. 180), trafico (Lei 11.343/06, art. 33) e porte ilegal (Lei 10.826/03, arts. 14 e 16) possuam diversas condutas e sejam crimes comuns, em regra materiais e unissubjetivos, algumas condutas nao podem ser praticadas de forma dividida, sendo afronta a
