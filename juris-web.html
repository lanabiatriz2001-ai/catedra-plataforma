     de TJ trazem o MESMO acórdão do STF em sel_tjgo, sel_tjrj e sel_tjpr — mesmo tribunal, mesmo
     título, mesma data, e o assunto ora preenchido, ora "DIREITO ADMINISTRATIVO", ora vazio (por
     isso o assunto fica FORA desta chave); e os boletins de contas repetem a mesma tese em
     edições diferentes (ali o campo de assunto É o começo da tese, ver renderVerbete).
     Ela substitui a trava antiga, que descartava qualquer vizinho com o ASSUNTO igual ao do
     aberto. No acervo de jurisprudência o assunto é um cabeçalho, não a tese — "Contrato
     Bancário" é o assunto das Súmulas 30, 176, 294 e 296 do STJ, justamente as que a banca
     troca entre si; e todas as teses de uma edição de Jurisprudência em Teses dividem o assunto
     da edição. Medido numa amostra de 1.524 verbetes (um a cada dez): a trava do assunto tirava
     vizinhos de 704 deles, 3.876 no total (1.031 quando o aberto era uma tese de Jurisprudência
     em Teses). A Súmula 30 do STJ ficava sem vizinho NENHUM, e a tela dizia "o acervo não tem
     vizinho deste verbete" — uma frase falsa sobre o acervo; com esta chave ela volta a ter as
     Súmulas 16, 93, 176, 233, 283, 285, 286 e 287. Título genérico ("Info 662 · STJ") não
     identifica julgado nenhum: sem chave. */
  function qdChaveTexto(rec){
    var te=norm(rec[I.te]||'').replace(/\s+/g,' ').replace(/^ | $/g,''), ti;
    if(rec[I.src]==='c'&&rec[I.fo]!=='Súmula')return te?'tx:'+te:'';
    ti=norm(rec[I.ti]||'').replace(/\s+/g,' ').replace(/^ | $/g,'');
    if(!ti||/^(?:(?:stf|stj|tse) · )?info \d+(?: · (?:stf|stj|tse))?$/.test(ti))return '';
    return 'tx:'+(rec[I.tr]||'')+'|'+ti+'|'+(rec[I.da]||'');
  }
  /* true quando o registro repete uma identidade já vista; senão, marca as dele em vistas. */
  function qdDuplicata(rec,vistas){
    var k=qdChave(rec), kt=qdChaveTexto(rec);
    if((k&&vistas[k])||(kt&&vistas[kt]))return true;
    if(k)vistas[k]=1;
    if(kt)vistas[kt]=1;
    return false;
  }

  // Frequência de documento por termo (IDF): termo raro pesa mais que termo de rodapé.
  // Refeita quando o acervo muda de tamanho — o de contas funde depois do boot.
  var qdDF=null, qdDFn=-1;
  function qdPrepara(){
    if(qdDF && qdDFn===IDX.length)return;
    qdDF={}; qdDFn=IDX.length;
    for(var i=0;i<IDX.length;i++){
      var ts=qdTermos((IDX[i][I.ti]||'')+' '+(IDX[i][I.te]||'')), visto={}, j;
      for(j=0;j<ts.length;j++){ if(visto[ts[j]])continue; visto[ts[j]]=1; qdDF[ts[j]]=(qdDF[ts[j]]||0)+1; }
    }
  }

  /* Até 8 vizinhos REAIS do acervo, por ramo + termos raros em comum. Só o índice em
     memória: nada de rede, nada de abrir o acervo de textos inteiro. */
  /* Quantos termos a última chamada de qdCandidatos conseguiu montar. Lido logo depois da
     chamada (que é síncrona) só para a tela saber DIZER a verdade: "este verbete não tem
     assunto indexado" é outra coisa que "o acervo não tem vizinho para ele". */
  var qdUltBase=0;
  function qdCandidatos(r,t){
    qdPrepara();
    var base=qdTermos((r[I.ti]||'')+' '+(r[I.te]||'')), tem={}, i, j;
    for(i=0;i<base.length;i++)tem[base[i]]=1;
    /* Súmula antiga não tem assunto indexado: ti="Súmula Vinculante 10" e te vazio deixam a
       base em 0 termos. São 2.897 dos 15.236 verbetes (19%) — as 63 vinculantes, 736 súmulas
       do STF, 240 do STJ e 711 temas —, e é justamente o material de maior incidência em
       magistratura. O nativo não sofre disso porque soma o enunciado (LibraryStore, termos
       chave). Aqui o enunciado entra só como SOCORRO, quando título+assunto não dão 2 termos:
       para os outros 81% o pareamento por ti+te é mais preciso e fica como está. O texto já
       está em memória neste ponto — nada de rede, nada do caminho monolítico de 10 MB. */
    if(Object.keys(tem).length<2 && t && t.en){
      var ext=qdTermos(String(t.en).slice(0,600));
      for(i=0;i<ext.length;i++)tem[ext[i]]=1;
    }
    var nb=Object.keys(tem).length;
    qdUltBase=nb;
    if(nb<2)return [];            // sem base de termos não há como procurar vizinho
    var ram=qdRamo(r[I.ra]), meuId=r[I.id], meuTr=r[I.tr]||'', meuRa=norm(r[I.ra]||''),
        meuSrc=r[I.src]||'', n=Math.max(IDX.length,1), pont=[];
    for(i=0;i<IDX.length;i++){
      var c=IDX[i];
      if(c[I.id]===meuId)continue;
      if((c[I.src]||'')!==meuSrc)continue;                 // jurisprudência e contas não se comparam
      var cr=qdRamo(c[I.ra]);
      if(ram.length ? !qdRamoCasa(ram,cr) : (c[I.fo]!==r[I.fo]))continue;
      var ct=qdTermos((c[I.ti]||'')+' '+(c[I.te]||'')), vc={}, comum=0, s=0, w;
      for(j=0;j<ct.length;j++){ w=ct[j]; if(vc[w]||!tem[w])continue; vc[w]=1; comum++; s+=Math.log(n/(1+(qdDF[w]||0))); }
      if(comum<2)continue;
      if(norm(c[I.ra]||'')===meuRa)s+=1;
      if((c[I.tr]||'')!==meuTr)s+=0.8;                     // o que confunde na prova é o vizinho de OUTRO tribunal
      pont.push({r:c,s:s});
    }
    pont.sort(function(a,b){ return b.s-a.s; });
    // O acervo tem duplicata REAL: …-1282 e …-1282-2 são o mesmo tema em dois registros.
    // Semear a trava com o próprio verbete evita a pior das colunas — a que se compara consigo.
    // A trava é a chave CITÁVEL e a de TEXTO (qdDuplicata), nunca tribunal+número nem o assunto.
    var out=[], dup={};
    qdDuplicata(r,dup);
    for(i=0;i<pont.length && out.length<8;i++){
      if(qdDuplicata(pont[i].r,dup))continue;
      out.push(pont[i].r);
    }
    return out;
  }

  /* O mesmo julgado REPUBLICADO: as coletâneas de informativo de 2020 e de 2021 trazem os
     mesmos acórdãos com ids diferentes e título genérico ("Info 684 · STJ"), que nenhuma chave
     de índice separa sem risco — dois julgados da mesma edição dividem tribunal, data e assunto.
     O que denuncia a cópia é o ENUNCIADO. Mas texto quase igual, sozinho, não basta: é
     exatamente o par que o quadro existe para mostrar (duas súmulas que só trocam "estaduais"
     por "municipal"). Por isso só é eco quando tribunal E data também coincidem — aí é o mesmo
     julgado publicado duas vezes. Régua: 90% das palavras em comum, texto com 8 ou mais. */
  function qdPalavras(s){
    var p=norm(s).split(/[^a-z0-9]+/), w={}, n=0, i;
    for(i=0;i<p.length;i++)if(p[i].length>3&&!w[p[i]]){ w[p[i]]=1; n++; }
    return {w:w, n:n};
  }
  function qdEco(a,b){
    if(a.n<8||b.n<8||a.tr!==b.tr||!a.da||a.da!==b.da)return false;
    var comum=0, k;
    for(k in a.w)if(b.w[k])comum++;
    return comum/Math.min(a.n,b.n)>=0.9;
  }
  /* Roda depois de qdTrechos, quando os textos já chegaram; candidato sem texto em memória
     passa como está (a trava de índice, qdDuplicata, já rodou antes). */
  function qdSemEco(r,t,cands){
    var alvo=cands.length?fonteDe(cands[0]):null, vistos=[], out=[], i, j, pw, tm, eco;
    if(t&&t.en){ pw=qdPalavras(t.en); pw.tr=r[I.tr]||''; pw.da=r[I.da]||''; vistos.push(pw); }
    for(i=0;i<cands.length;i++){
      tm=alvo&&alvo.txt&&alvo.txt[cands[i][I.id]];
      if(!(tm&&tm.en)){ out.push(cands[i]); continue; }
      pw=qdPalavras(tm.en); pw.tr=cands[i][I.tr]||''; pw.da=cands[i][I.da]||''; eco=false;
      for(j=0;j<vistos.length&&!eco;j++)if(qdEco(pw,vistos[j]))eco=true;
      if(eco)continue;
      vistos.push(pw); out.push(cands[i]);
    }
    return out;
  }

  /* Só o texto barato: o que já está em memória e, quando o acervo está fatiado, os blocos
     dos poucos candidatos escolhidos (CTDados agrupa por bloco e guarda no IndexedDB).
     O caminho monolítico de 10 MB NUNCA é disparado por causa do quadro. */
  function qdTrechos(cands,cb){
    var alvo=cands.length?fonteDe(cands[0]):null;
    if(!alvo || !porFatia(alvo) || !window.CTDados || !window.CTDados.varios){ cb(); return; }
    var faltam=[], i, id;
    for(i=0;i<cands.length;i++){ id=cands[i][I.id]; if(!(alvo.txt&&alvo.txt[id]))faltam.push(id); }
    if(!faltam.length){ cb(); return; }
    var feito=false;
    var t=setTimeout(function(){ if(!feito){ feito=true; cb(); } },6000);
    function fim(){ if(feito)return; feito=true; clearTimeout(t); cb(); }
    window.CTDados.varios(alvo.fatia,faltam).then(function(m){
      alvo.txt=alvo.txt||{};
      if(m)Object.keys(m).forEach(function(k){ if(!alvo.txt[k])alvo.txt[k]=m[k]; });
      fim();
    }).catch(fim);
  }

  // Ordem canônica das linhas e os rótulos da tela. Não inventar outros, não reordenar.
  var QDLIN=[['quandoIncide','Quando incide'],['quemAlcanca','Quem alcança'],['teseFixada','Tese fixada'],
             ['efeitoPratico','Efeito prático'],['excecoes','Exceções'],['desdeQuando','Desde quando'],
             ['situacaoHoje','Situação hoje'],['fundamento','Fundamento'],['separa','O que separa']];
  var QDMAXCOL=3, QDMAXLIN=6;
  /* O ícone do botão fica numa constante porque o botão troca de rótulo três vezes (montando,
     erro, de volta ao normal). Trocar por textContent apagava o <svg> Lucide junto, e depois
     do primeiro erro o botão voltava pelado — o caso do teste só olha o estado inicial. */
  var QDICONE='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-.15em;flex:none"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/><path d="M3 12h18"/></svg>';

  function promptQuadro(r,t,cands){
    var alvo=cands.length?fonteDe(cands[0]):null, lista='', i;
    for(i=0;i<cands.length;i++){
      var c=cands[i], tm=alvo&&alvo.txt&&alvo.txt[c[I.id]], en=(tm&&tm.en)||'';
      lista+=(i+1)+') id: '+c[I.id]
        +' | tribunal: '+(c[I.tr]||'')
        +' | coleção: '+nomeColecao(c[I.fo])
        // em informativo e Teses o número é a EDIÇÃO: chamá-lo de número convida a IA a citá-lo
        // como se identificasse o julgado
        +(c[I.nu]!=null?(QDEDICAO[c[I.fo]]?' | edição: ':' | número: ')+c[I.nu]:'')
        +' | título: '+(c[I.ti]||'')
        +(c[I.ra]?' | ramo: '+c[I.ra]:'')
        +(c[I.te]?' | assunto: '+c[I.te]:'')
        +(c[I.da]?' | data: '+c[I.da]:'')
        +(en?'\n   enunciado: '+String(en).replace(/\s+/g,' ').slice(0,400):'')
        +'\n';
    }
    return 'Você prepara material de estudo para concursos jurídicos brasileiros de alto nível '
      +'(magistratura, MP, procuradorias). O objetivo desta tarefa é UM só: impedir que quem '
      +'estuda confunda o verbete aberto com os vizinhos que se parecem com ele.\n\n'
      +'VERBETE ABERTO\nid: '+r[I.id]+'\nTRIBUNAL: '+(r[I.tr]||'')+'\nCOLEÇÃO: '+nomeColecao(r[I.fo])
      +(r[I.nu]!=null?(QDEDICAO[r[I.fo]]?'\nEDIÇÃO: ':'\nNÚMERO: ')+r[I.nu]:'')+'\nTÍTULO: '+(r[I.ti]||'')
      +(r[I.ra]?'\nRAMO: '+r[I.ra]:'')+(r[I.da]?'\nDATA: '+r[I.da]:'')+(r[I.si]?'\nSITUAÇÃO: '+r[I.si]:'')
      +'\nENUNCIADO:\n'+((t&&t.en)||'(sem enunciado)')+'\n\n'
      +'CANDIDATOS DO ACERVO (escolha entre estes; não existe outro):\n'+lista+'\n'
      +'Escolha NO MÁXIMO 2 candidatos CONFUNDÍVEIS com o verbete aberto: mesmo objeto de '
      +'discussão, gatilho de incidência DIFERENTE. Candidato que só é do mesmo assunto, sem '
      +'risco real de troca, não entra. Se nenhum for confundível, devolva "colunas": [].\n\n'
      +'Devolva SOMENTE um objeto JSON, sem cercas de código e sem texto fora dele:\n'
      +'{"objeto": "o que se discute nos dois/três, em no máximo 12 palavras",\n'
      +' "eixo": "a ÚNICA variável que separa as colunas, de 2 a 6 palavras",\n'
      +' "colunas": [   // a PRIMEIRA é sempre o verbete aberto; no máximo 3 no total\n'
      +'   {"id": "o id EXATO, copiado do verbete aberto ou da lista de candidatos",\n'
      +'    "celulas": {\n'
      +'      "quandoIncide": "o gatilho de fato que aparece no enunciado de uma questão, nunca um conceito",\n'
      +'      "quemAlcanca": "a quem se aplica, terminando por quem NÃO alcança",\n'
      +'      "teseFixada": "o núcleo operativo em até 30 palavras, preservando a palavra que muda entre as colunas",\n'
      +'      "efeitoPratico": "o verbo que o juiz escreve (devolve / é inconstitucional / compete a…)",\n'
      +'      "excecoes": "a ressalva, começando por salvo",\n'
      +'      "desdeQuando": "marco temporal ou modulação",\n'
      +'      "situacaoHoje": "vigente, superado, tese complementada ou revisto",\n'
      +'      "fundamento": "os dispositivos citados"\n'
      +'    }}\n'
      +' ],\n'
      +' "naoConfunda": ["1 ou 2 frases de até 45 palavras, uma variável por frase, no molde: '
      +'Se <variável> = <valor A>, é o <tema A> → <efeito A>. Se = <valor B>, é o <tema B> → '
      +'<efeito B>. O que decide é <variável>, não <a semelhança que engana>."],\n'
      +' "semCerteza": ["cada item começa por \\"Confira: \\" e diz o que você não pôde conferir"]}\n\n'
      +'REGRAS, todas obrigatórias:\n'
      +'1. NÃO invente número de tema, súmula, recurso, informativo ou artigo. Só pode aparecer '
      +'número que esteja ESCRITO no material acima. Na dúvida, escreva sem numerar.\n'
      +'2. Devolva o "id" exato de cada coluna, copiado da lista. Coluna sem id que exista na '
      +'lista é descartada aqui do lado.\n'
      +'3. Chave que você não souber NÃO EXISTE: omita. Nada de "", "—", "não informado", "n/a".\n'
      +'4. Use só as chaves de célula acima, com esses nomes, nessa ordem.\n'
      +'5. Teste do cabeçalho tapado: se, escondendo o cabeçalho das colunas, as células de uma '
      +'linha dizem a mesma coisa, aquela linha não separa nada — omita-a.\n'
      +'6. Nunca comece uma frase de "naoConfunda" por "ambos" nem por "a diferença é sutil".\n'
      +'7. Escreva em português do Brasil, com acentuação completa.';
  }

  /* Texto de célula: string vazia, traço e "não informado" são ausência (defesa contra IA
     desobediente — o contrato diz que campo que não se sabe não existe). */
  function qdTxt(s,max){
    // true/false não são texto: "situacaoHoje": true pintaria a palavra "true" na célula
    if(s==null||typeof s==='object'||typeof s==='boolean')return '';
    s=String(s).replace(/\s+/g,' ').replace(/^[\s—–-]+/,'').replace(/[\s—–-]+$/,'');
    var n=norm(s);
    if(!n||n==='n/a'||n==='na'||n==='nao informado'||n==='nao informada'||n==='nao se aplica'
      ||n==='sem informacao'||n==='desconhecido'||n==='?')return '';
    if(max&&s.length>max)s=s.slice(0,max-1).replace(/\s+\S*$/,'')+'…';
    return s;
  }
  function qdComp(s){ return norm(s).replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').replace(/^ | $/g,''); }

  /* Campo de LISTA vindo da IA. "typeof v.length==='number'" não prova array: string também
     tem .length, e o desvio mais comum do modelo é devolver "naoConfunda": "Se o ente é o
     Município…" em vez de ["Se o ente…"]. Com o teste antigo o laço iterava os CARACTERES e
     a tela pintava <p>S</p><p>e</p> — o bloco que dá nome à funcionalidade virava duas letras
     soltas, e ficava gravado. Aqui a string não some: vira uma frase única, que é o que a IA
     quis dizer. Object.prototype.toString é o teste de array que roda em qualquer motor. */
  function qdArr(v){
    if(Object.prototype.toString.call(v)==='[object Array]')return v;
    if(typeof v==='string'&&v)return [v];
    return [];
  }

  /* A frase de travamento é uma FRASE (o molde tem duas orações e até 45 palavras). Item de
     uma a três palavras é sobra do modelo — um número solto, um "ambos", um pedaço de string
     que virou item — e pintar isso como parágrafo do bloco que dá nome à funcionalidade é
     pior do que não pintar nada. Roda na validação E no render: registro gravado antes desta
     régua (ou semeado à mão) passa pelo mesmo filtro antes de chegar à tela. */
  function qdTravas(v){
    var a=qdArr(v), out=[], i, f;
    for(i=0;i<a.length&&out.length<2;i++){
      f=qdTxt(a[i],320);
      if(f&&f.split(' ').length>=4)out.push(f);
    }
    return out;
  }
  /* O rodapé de honestidade: cada item diz o que NÃO foi conferido. "Confira: 42" não avisa
     nada (mesma régua, duas palavras no mínimo), e o prefixo não se repete quando a IA já o
     escreveu. Idempotente, para o render poder passar o registro gravado por aqui de novo. */
  function qdConfiras(v,lim){
    var a=qdArr(v), out=[], i, f;
    for(i=0;i<a.length&&out.length<lim;i++){
      f=qdTxt(a[i],160);
      if(f&&f.split(' ').length>=2)out.push(norm(f).indexOf('confira')===0?f:'Confira: '+f);
    }
    return out;
  }

  /* Linha constante NÃO entra: se as colunas dizem a mesma coisa, aquela linha não separa
     nada e só engorda o quadro. Filtro de CÓDIGO, rodado também no render — a IA não é
     confiável para obedecer, e um registro gravado antes desta regra também não é. */
  function qdLinhas(q){
    var cols=qdArr(q&&q.colunas), out=[], i, j, k;
    for(i=0;i<QDLIN.length&&out.length<QDMAXLIN;i++){
      var ch=QDLIN[i][0], vals=[], dif=false;
      for(j=0;j<cols.length;j++){
        var v=qdTxt(cols[j]&&cols[j].celulas&&cols[j].celulas[ch]);
        if(v)vals.push(qdComp(v));
      }
      if(vals.length<2)continue;
      for(j=0;j<vals.length&&!dif;j++)for(k=j+1;k<vals.length;k++)if(vals[j]!==vals[k]){dif=true;break;}
      if(dif)out.push(QDLIN[i]);
    }
    return out;
  }

  /* O rótulo da coluna, relido do índice. "nº N" só onde N IDENTIFICA o verbete (súmula, tema).
     Em informativo, Jurisprudência em Teses e boletim de contas o número é a EDIÇÃO: depois
     que a trava de duplicata parou de engolir essas famílias, dois julgados do mesmo Info 662
     podiam ser colunas — e os dois cabeçalhos diziam "STJ · Informativos do STJ · nº 662",
     idênticos na tela e no leitor de tela. E coleção sem número (seleções de TJ, controle de
     constitucionalidade) dava "STF · Seleção TJGO" para qualquer julgado dela. Nesses casos quem
     identifica é o título; e quando o título é só "Info 662 · STJ", é o assunto. */
  var QDNUMERO={sumula_vinculante:1,sumula_stf:1,sumula_stj:1,sumula_tse:1,tjro:1,
                repercussao_geral:1,repetitivo:1,'Súmula':1};
  var QDEDICAO={informativo_stf:1,informativo_stj:1,informativo_tse:1,juris_em_teses:1,
                'Boletim de Jurisprudência':1,'Boletim de Pessoal':1,'Informativo de Licitações e Contratos':1};
  function qdRef(rec){
    var fo=rec[I.fo]||'', tr=rec[I.tr]||'', esp=nomeColecao(fo), nu=rec[I.nu], p=[], ti;
    if(tr)p.push(tr);
    if(esp)p.push(esp);
    if(nu!=null&&QDNUMERO[fo]){ p.push('nº '+nu); return p.join(' · '); }
    // o título dos informativos do STF repete o tribunal ("STF · ADI 2259")
    ti=String(rec[I.ti]||'');
    if(tr&&ti.indexOf(tr+' · ')===0)ti=ti.slice(tr.length+3);
    if(/^info\s+\d/i.test(ti))ti='';
    if(nu!=null&&QDEDICAO[fo]&&norm(ti).indexOf(String(nu))<0)p.push('ed. '+nu);
    ti=qdTxt(ti,70)||qdTxt(rec[I.te],56);
    if(ti)p.push(ti);
    else if(nu!=null&&!QDEDICAO[fo])p.push('nº '+nu);
    return p.join(' · ')||'Verbete';
  }

  // Coluna montada a partir do ÍNDICE: é aqui que número inventado morre.
  function qdCol(rec,aberto,celulas){
    var tm=txtDe(rec), t=(tm&&tm[rec[I.id]])||{}, esp=nomeColecao(rec[I.fo]);
    var c={id:rec[I.id], ref:qdRef(rec), aberto:!!aberto, celulas:celulas||{}};
    if(rec[I.tr])c.tribunal=rec[I.tr];
    if(esp)c.especie=esp;
    if(rec[I.nu]!=null)c.numero=rec[I.nu];
    if(rec[I.da])c.data=rec[I.da];
    if(t.ur&&/^https?:\/\//i.test(t.ur))c.url=t.ur;
    return c;
  }
  function qdCelulas(o){
    var out={}, i;
    if(!o||typeof o!=='object')return out;
    for(i=0;i<QDLIN.length;i++){ var k=QDLIN[i][0], v=qdTxt(o[k],180); if(v)out[k]=v; }
    return out;
  }

  /* Validação depois do JSON.parse. Nada do que a IA escreveu sobre identificação sobrevive:
     tribunal, espécie, número, data e link são relidos do índice pelo id. */
  /* "Do mesmo assunto" sai do ACERVO, não da IA: são os candidatos que sobraram depois das
     colunas. Lista de acervo não tem número para inventar. Extraída porque ela também é o
     que a tela mostra quando a IA recusa o quadro — os vizinhos reais não podem ser jogados
     fora para dar lugar à lista de rótulos que a IA escreveu no roteiro. */
  function qdMais(cands,vistos){
    var ma=[], cd=qdArr(cands), vi=vistos||{}, i;
    for(i=0;i<cd.length&&ma.length<6;i++){
      var m=cd[i], mid=m&&m[I.id];
      if(!mid||vi[mid])continue;
      ma.push({id:mid, ref:qdRef(m)});
    }
    return ma;
  }

  /* Por que a última validação recusou — lido logo depois da chamada (síncrona), só para a tela
     dizer QUAL foi a falha da IA, em vez de um "formato inesperado" para tudo. */
  var qdMotivo='';
  function qdValida(j,r,cands){
    qdMotivo='formato';
    if(!j||typeof j!=='object')return null;
    var cru=qdArr(j.colunas);
    if(!cru.length)return null;
    var meu=r[I.id], rec0=byId[meu], cols=[], vistos={}, dup={}, ofertado={}, cd=qdArr(cands), i, c, id;
    if(!rec0)return null;
    /* Só vira coluna quem foi OFERTADO na lista de candidatos. Um id que existe no índice mas
       não estava na lista é um verbete que a IA adivinhou pelo formato do id ("STF-SUM-736"):
       as células dele foram escritas sem o texto dele na frente, e o índice só garante que o
       rótulo existe — não que a comparação é verdadeira. */
    for(i=0;i<cd.length;i++)if(cd[i])ofertado[cd[i][I.id]]=1;
    /* A 1ª coluna é SEMPRE o verbete aberto — é ele que está na tela, e comparar sem ele não
       é comparar. Só ele pode vir sem id que exista no índice, e só ele é imune às travas de
       duplicata abaixo (a duplicata do acervo tem a mesma chave citável que ele). */
    var cel0=null;
    for(i=0;i<cru.length;i++){
      c=cru[i]; if(!c||typeof c!=='object')continue;
      id=c.id==null?'':String(c.id);
      if(id===meu||(c.aberto===true&&!byId[id])){ cel0=qdCelulas(c.celulas); break; }
    }
    qdMotivo='semAberto';
    if(!cel0)return null;                       // sem o verbete aberto não há com o que comparar
    cols.push(qdCol(rec0,true,cel0));
    vistos[meu]=1;
    qdDuplicata(rec0,dup);
    for(i=0;i<cru.length&&cols.length<QDMAXCOL;i++){
      c=cru[i]; if(!c||typeof c!=='object')continue;
      id=c.id==null?'':String(c.id);
      var rec=byId[id];
      // id que não existe no índice, ou que não foi ofertado, some: é a defesa contra tema inventado
      if(!rec||vistos[id]||!ofertado[id])continue;
      if(qdDuplicata(rec,dup))continue;
      vistos[id]=1;
      cols.push(qdCol(rec,false,qdCelulas(c.celulas)));
    }
    qdMotivo='semVizinho';
    if(cols.length<2)return null;               // quadro de uma coluna é pior que a lista
    var q={colunas:cols, fonte:'ia'};
    var lin=qdLinhas(q);
    qdMotivo='raso';
    if(lin.length<2)return null;                // sem duas linhas que discriminem, não há quadro
    qdMotivo='';
    // Guarda só o que vai pintar: o registro fica enxuto e o localStorage demora mais a estourar.
    var manter={};
    for(i=0;i<lin.length;i++)manter[lin[i][0]]=1;
    for(i=0;i<cols.length;i++){
      var cel=cols[i].celulas, ks=Object.keys(cel), lim={}, z;
      for(z=0;z<ks.length;z++)if(manter[ks[z]])lim[ks[z]]=cel[ks[z]];
      cols[i].celulas=lim;
    }
    var obj=qdTxt(j.objeto,140); if(obj)q.objeto=obj;
    var eixo=qdTxt(j.eixo,80); if(eixo)q.eixo=eixo;
    q.naoConfunda=qdTravas(j.naoConfunda);
    /* Quando o texto do vizinho não chegou a tempo (qdTrechos desiste em 6 s), a IA escreveu
       as células dele a partir do título e do assunto — e para um tema o título é literalmente
       "Tema 457 (RG)". A pessoa precisa saber disso, senão o rodapé diz a mesma coisa nos dois
       casos. A conta é a mesma do prompt: enunciado presente no txt da fonte. */
    var semTx=0, sc=[];
    for(i=1;i<cols.length;i++){
      var rk=byId[cols[i].id], tmk=rk?txtDe(rk):null, tk=(tmk&&tmk[cols[i].id])||{};
      if(!tk.en)semTx++;
    }
    if(semTx)sc.push('Confira: o texto de '+semTx+(semTx>1?' vizinhos não carregou':' vizinho não carregou')
      +' a tempo — as células dele saíram do título e do assunto.');
    q.semCerteza=sc.concat(qdConfiras(j.semCerteza,3-sc.length));
    q.mesmoAssunto=qdMais(cd,vistos);
    return q;
  }

  /* Recusa DECLARADA: o prompt manda devolver "colunas": [] quando nada é confundível — e a
     IA às vezes devolve só a coluna do próprio verbete aberto, que diz a mesma coisa. Só isso é
     juízo da IA sobre os vizinhos. Objeto sem a chave, JSON truncado, id inventado e "menos de
     2 linhas que discriminam" são resposta RUIM, e repetir pode resolver. */
  function qdRecusou(j,r){
    if(!j||typeof j!=='object'||Object.prototype.toString.call(j.colunas)!=='[object Array]')return false;
    for(var i=0;i<j.colunas.length;i++){
      var c=j.colunas[i];
      if(!c||typeof c!=='object'||c.id==null||String(c.id)!==r[I.id])return false;
    }
    return true;
  }

  /* Chamadas do quadro em voo, por id. Sem isso a pessoa que sai do verbete e volta durante
     a espera (são dezenas de segundos) encontra o botão habilitado de novo e dispara uma
     SEGUNDA chamada para o mesmo verbete: duas cotas de IA gastas e a última a chegar vence,
     sem relação com qual foi a melhor. */
  var QDVOO={};
  function qdEmVoo(id){ return !!QDVOO[id]; }
  /* O último desfecho que NÃO grava registro (acervo sem vizinho, verbete sem assunto, falha da
     IA), por id. Estado só de tela, de propósito fora do localStorage: o do acervo se refaz em
     milissegundos e o da IA não deve sobreviver ao fechamento. Sem ele a tela esquecia o
     desfecho a cada repintura — voltava a oferecer "Montar o quadro" para um verbete que o app
     já sabia não ter vizinho, e engolia a falha da IA da chamada automática sem dizer nada. */
  var QDULT={};

  /* Uma chamada de IA só para o quadro. cb(codigo, porque) — e os três estados têm de ser
     distintos na tela, porque a pessoa decide coisas diferentes em cada um:
       1                 montou;
       0, 'semBase'      (a) o verbete não tem assunto indexado: nem dá para procurar vizinho;
       0, 'acervo'       (a) procurou e o acervo não tem vizinho deste verbete;
       0, 'ia'           (b) a IA leu os vizinhos reais e disse que nenhum é confundível;
      -1, motivo         (c) a IA falhou ou respondeu quebrado — e SÓ aqui "tente de novo" faz
                         sentido. O motivo diz qual foi a falha (ver qdFalha).
     Antes tudo isso caía num 0 só, que escrevia "não há vizinho confundível neste acervo":
     falha de formato do modelo virava afirmação sobre o acervo, com os vizinhos reais na mão.
     O roteiro continua inteiro em todos os casos. */
  function qdGerar(r,t,cb){
    var id=r[I.id];
    if(QDVOO[id])return;                       // já tem chamada deste verbete em voo
    var cands=qdCandidatos(r,t);
    if(!cands.length){
      var pq=qdUltBase<2?'semBase':'acervo';
      QDULT[id]={c:0, p:pq};
      cb(0,pq); return;
    }
    QDVOO[id]=1;
    // Uma vez só: se a repintura do desfecho lançar, o .catch() lá embaixo não pode rebaixar
    // um quadro que já foi gravado para "a IA falhou".
    var feito=false;
    function fim(codigo,porque,msg){
      if(feito)return; feito=true;
      delete QDVOO[id];
      if(codigo===-1)QDULT[id]={c:-1, p:porque, m:msg||''}; else delete QDULT[id];
      cb(codigo,porque);
    }
    qdTrechos(cands,function(){
      var pedido;
      cands=qdSemEco(r,t,cands);
      // Se só havia cópias do próprio verbete, o acervo não tem vizinho — e nenhuma IA é chamada.
      if(!cands.length){
        feito=true; delete QDVOO[id];
        QDULT[id]={c:0, p:'acervo'};
        cb(0,'acervo'); return;
      }
      /* Qualquer exceção daqui para a frente tem de passar por fim(): sem isso QDVOO[id]
         ficava ligado para sempre e o botão do verbete, desabilitado até recarregar a página. */
      try{ pedido=iaPede(promptQuadro(r,t,cands)); }
      catch(e){ fim(-1,'erro',String(e&&e.message||e)); return; }
      pedido.then(function(txt){
        var j=null, leu=true, q;
        try{ j=JSON.parse(String(txt).replace(/^[^{]*/,'').replace(/[^}]*$/,'')); }catch(e){ leu=false; }
        try{ q=qdValida(j,r,cands); }catch(e){ q=null; qdMotivo='formato'; }
        if(q){ if(ROT[id]){ ROT[id].q=q; ROT[id].v=2; rotSave(); } fim(1); return; }
        if(!leu||!qdRecusou(j,r)){ fim(-1,leu?qdMotivo:'formato'); return; }
        /* A recusa é gravada com os vizinhos REAIS do acervo. Sem isso a tela jogava fora os
           8 candidatos que o índice achou para mostrar a lista de rótulos que a IA escreveu
           no roteiro — a única lista do bloco onde número inventado ainda sobrevivia — e o
           botão voltava a queimar uma chamada de IA para o mesmo "não". */
        var so={fonte:'acervo', colunas:[], naoConfunda:[], semCerteza:[], mesmoAssunto:qdMais(cands,{})};
        if(ROT[id]){ ROT[id].q=so; ROT[id].v=2; rotSave(); }
        fim(0,'ia');
      }).catch(function(err){ fim(-1,'erro',String(err&&err.message||err||'')); });
    });
  }

  /* O texto do estado (c). Cada falha diz o que aconteceu com a IA — nunca algo sobre o acervo,
     que continua com os vizinhos que o índice achou. */
  function qdFalha(u){
    var m=u&&u.p, d=String((u&&u.m)||'').replace(/[.\s]+$/,'');
    return (m==='erro' ? 'A IA não respondeu'+(d?' ('+d+')':'')+' e o quadro não saiu.'
      : m==='semAberto' ? 'A resposta da IA deixou de fora o próprio verbete aberto, e o quadro não saiu.'
      : m==='semVizinho' ? 'A IA escolheu vizinhos que não estavam na lista do acervo, e o quadro não saiu.'
      : m==='raso' ? 'As colunas que a IA devolveu não se separavam em duas linhas ou mais, e o quadro não saiu.'
      : 'A IA respondeu fora do formato combinado, e o quadro não saiu.')+' Tente de novo.';
  }

  /* Pede o quadro e põe a tela em dia com o desfecho. A repintura é do BLOCO do quadro, não do
     roteiro inteiro: são até 81 s de espera, e quem passou esse tempo respondendo o quiz do
     verbete perdia as respostas quando o quadro chegava e o renderEstudo refazia tudo. */
  function qdPedir(r,t){ qdGerar(r,t,function(){ qdRepinta(r); }); }
  function qdRepinta(r){
    var id=r[I.id];
    if(curId!==id)return;                      // a pessoa foi para outro verbete: nada a pintar
    var slot=document.getElementById('estQdSlot');
    if(!slot||!ROT[id]){ renderEstudo(r); return; }
    var focoDentro=slot.contains(document.activeElement);
    slot.innerHTML=qdBloco(r,ROT[id]);
    qdLiga(r,slot);
    if(focoDentro){ try{ slot.focus({preventScroll:true}); }catch(e){ slot.focus(); } }
  }

  /* Abre o vizinho pelo índice do registro — o mesmo caminho do mapa lateral. Quando ele
     está fora do recorte atual dos filtros, limpa o recorte primeiro, como o "Julgado do
     dia" já faz: melhor ir para o verbete do que o clique não fazer nada. */
  function qdAbrir(id){
    var rec=byId[id]; if(!rec)return;
    var i=filtered.indexOf(rec);
    if(i<0){
      f.q=''; f.tribunal=''; f.ramo=''; f.base=''; f.edicao=null;
      var qi=document.getElementById('q'); if(qi)qi.value='';
      build(); i=filtered.indexOf(rec);
    }
    if(i>=0)openVerbete(i);
  }

  /* Só objeto vira coluna: um registro gravado com "colunas": "abc" (ou com null no meio)
     pintava uma coluna por LETRA, e c.id de null derrubava o roteiro inteiro. */
  function qdColunas(q){
    var a=qdArr(q&&q.colunas), out=[], i;
    for(i=0;i<a.length;i++)if(a[i]&&typeof a[i]==='object')out.push(a[i]);
    return out;
  }

  function renderQuadro(q,lin){
    /* Sem duas colunas e duas linhas que discriminem NÃO há quadro — mas o bloco não some:
       vira a lista "Do mesmo assunto", que é acervo puro. Guardar cols aqui é obrigatório:
       o registro gravado na recusa tem colunas:[] e a linha de baixo estouraria.
       Tudo o que vem do registro passa de novo pelas réguas da validação (qdTxt com teto,
       qdTravas, qdConfiras): registro gravado antes delas, ou mexido à mão, não pinta lixo. */
    var qq=(q&&typeof q==='object')?q:{}, cols=qdColunas(qq), mais=qdArr(qq.mesmoAssunto), li=lin||[];
    var grade=cols.length>=2&&li.length>=2, h, i, j;
    var recusa=!grade&&qq.fonte==='acervo';
    var nc=grade?qdTravas(qq.naoConfunda):[], sc=qdConfiras(qq.semCerteza,3);
    h='<div class="estBlk estQd" data-qd="'+(grade?'quadro':'so-lista')+'"'
      +(grade?'':' data-qd-estado="'+(recusa?'recusado':'sem-linhas')+'"')+'>'
      +'<h4>'+(grade?'Não confunda com':'Do mesmo assunto')+'</h4>';
    if(grade){
      var obj=qdTxt(qq.objeto,140), eixo=qdTxt(qq.eixo,80);
      h+='<div class="estCaixa qdCaixa">';
      if(obj)h+='<p class="qdCtx"><span class="qdRot">O que se discute</span><span class="qdVal">'+esc(obj)+'</span></p>';
      if(eixo)h+='<p class="qdCtx"><span class="qdRot">O que separa</span><span class="qdVal">'+esc(eixo)+'</span></p>';
      h+='<div class="qdGrade" data-qd-n="'+cols.length+'" style="--qdn:'+cols.length+';--qdl:'+li.length+'">';
      for(i=0;i<cols.length;i++){
        var c=cols[i], cid=c.id==null?'':String(c.id), rec=byId[cid], liga=!!rec, tag=liga?'button':'div';
        var ref=qdTxt(c.ref,120)||(rec?qdRef(rec):'Verbete'), dt=qdTxt(c.data,40);
        /* O aria-label SUBSTITUI o nome vindo do conteúdo, então "Abrir <ref>" apagava do
           anúncio a data e o "o verbete aberto" — e para quem usa leitor de tela a coluna de
           referência da comparação voltava a se distinguir só pela cor. Aqui o nome é
           COMPOSTO. A coluna 0 não promete "Abrir": ela já está aberta, e aria-current diz
           isso também na linguagem do leitor de tela, não só na frase. */
        var rot = (i===0 ? esc(ref)+(dt?', '+esc(dt):'')+', o verbete aberto'
                         : 'Abrir '+esc(ref)+(dt?', '+esc(dt):''));
        h+='<div class="qdCol'+(i===0?' aberta':'')+'" data-qd-col="'+i+'"'+(i===0?' data-qd-aberto="1"':'')+'>'
          +'<'+tag+' class="qdCab"'+(liga?' type="button" data-qd-id="'+esc(cid)+'" aria-label="'+rot+'"'
            +(i===0?' aria-current="true"':''):'')+'>'
          +'<b>'+esc(ref)+'</b>'
          +(dt?'<small>'+esc(dt)+'</small>':'')
          +(i===0?'<em>o verbete aberto</em>':'')
          +'</'+tag+'>';
        for(j=0;j<li.length;j++){
          var ch=li[j][0], cel=(c.celulas&&typeof c.celulas==='object')?c.celulas:{}, v=qdTxt(cel[ch],180);
          // Célula sem valor SOME (omitir vence preencher) — o lugar dela fica vazio para os
          // rótulos continuarem alinhados entre as colunas.
          h+=v ? '<div class="qdCel" data-qd-lin="'+ch+'"><span class="qdRot">'+esc(li[j][1])+'</span><span class="qdVal">'+esc(v)+'</span></div>'
               : '<div class="qdCel" data-qd-lin="'+ch+'" aria-hidden="true"></div>';
        }
        h+='</div>';
      }
      h+='</div>';
      if(nc.length){
        h+='<div class="qdTrava">';
        for(i=0;i<nc.length;i++)h+='<p>'+esc(nc[i])+'</p>';
        h+='</div>';
      }
      h+='</div>';
    }
    var itens='';
    for(i=0;i<mais.length&&i<6;i++){
      var m=(mais[i]&&typeof mais[i]==='object')?mais[i]:{}, mid=m.id==null?'':String(m.id);
      var rf=qdTxt(m.ref,120)||(byId[mid]?qdRef(byId[mid]):'');
      if(!rf)continue;                         // item sem rótulo nem verbete: não há o que mostrar
      itens+='<li>'+(byId[mid]?'<button type="button" class="qdLink ct-alvo" data-qd-id="'+esc(mid)+'">'+esc(rf)+'</button>':esc(rf))+'</li>';
    }
    if(itens)h+='<div class="qdMais">'+(grade?'<div class="mlW">Do mesmo assunto</div>':'')+'<ul>'+itens+'</ul></div>';
    /* Rodapé de honestidade: dizer o que o app GARANTE e nada além. O app garante a
       identificação, que é relida do acervo pelo id; ele não conferiu nada no tribunal, e
       prometer isso seria inventar uma conferência que ninguém fez. E o texto das linhas é
       da IA — dizer que o quadro "saiu do acervo" seria mentir sobre as células. */
    h+='<div class="estFonte">'
      +(grade
        ? 'Quadro escrito pela IA a partir destes verbetes do acervo; a leitura das linhas é dela, confira antes de decorar. '
        : recusa
          ? 'A IA comparou este verbete com estes vizinhos do acervo e não achou nenhum confundível o bastante para um quadro. '
          : 'Não saiu quadro deste verbete: as colunas não separavam nada. Estes são os vizinhos do mesmo assunto, direto do acervo. ')
      +'Tribunal, espécie, número e data vêm do acervo do app — não foram conferidos no tribunal.'
      +(sc.length?' '+esc(sc.join(' ')):'')
      +'</div></div>';
    return h;
  }

  /* O miolo do bloco do quadro, separado de renderEstudo para ser repintado SOZINHO quando a IA
     responder (qdRepinta). Quatro saídas:
       · registro com quadro válido     → o quadro;
       · registro com a recusa da IA    → (b) "Do mesmo assunto", direto do acervo;
       · roteiro sem quadro             → a lista antiga "Relacionados" + a oferta, que diz em
                                          qual estado está: montando, (a) sem vizinho, (c) falha
                                          da IA com "tente de novo", ou o convite inicial. */
  function qdBloco(r,reg){
    var id=r[I.id], qv=reg.q, qlin=qv?qdLinhas(qv):[], cols=qdColunas(qv);
    var temQd=cols.length>=2&&qlin.length>=2;
    // Quadro recusado pela IA: sobrou a lista do ACERVO, que continua valendo mais que a
    // lista de rótulos do roteiro (aquela nunca passou por validação contra o índice).
    var soLista=!temQd&&qdArr(qv&&qv.mesmoAssunto).length>0;
    if(temQd)return renderQuadro(qv,qlin);
    if(soLista)return renderQuadro(qv,[]);
    var h=qdLista('estJur','Relacionados',reg.jurisprudencia,1);
    if(reg.q)return h;
    var emVoo=qdEmVoo(id), u=QDULT[id], estado, aviso, botao='';
    if(emVoo){
      estado='montando';
      aviso='O roteiro já está pronto; o quadro comparativo entra aqui quando a IA responder.';
      botao='<button class="estBtn" id="estQuadro" disabled>'+QDICONE+' Montando o quadro…</button>';
    }else if(u&&u.c===0){
      /* (a) Aqui, e SÓ aqui, o app fala pelo acervo: ele mesmo procurou e não achou. Sem botão,
         porque repetir a busca daria o mesmo resultado — e sem culpar a IA, que nem foi chamada. */
      estado=u.p==='semBase'?'sem-assunto':'sem-vizinho';
      aviso=u.p==='semBase'
        ? 'Este verbete não tem assunto indexado no acervo, então não há como procurar vizinhos para comparar.'
        : 'O acervo do app não tem vizinho deste verbete para pôr lado a lado — e quadro de uma coluna só não compara nada.';
    }else if(u&&u.c===-1){
      // (c) quem falhou foi a IA. Nunca apresentar isso como fato do acervo.
      estado='falhou';
      aviso=qdFalha(u);
      botao='<button class="estBtn" id="estQuadro">'+QDICONE+' Tentar de novo</button>';
    }else{
      estado='oferta';
      aviso='Põe este verbete lado a lado com os vizinhos que a banca troca por ele, elemento por elemento.';
      botao='<button class="estBtn" id="estQuadro">'+QDICONE+' Montar o quadro comparativo</button>';
    }
    return h+'<div class="estBlk estQdOferta" data-qd-estado="'+estado+'">'+botao
      +'<div class="estFonte" id="estQdAviso" role="status">'+esc(aviso)+'</div></div>';
  }
  function qdLista(cls,rot,arr,cx){
    // Lista que vem da IA pode vir como string: vira um item só, em vez de derrubar o roteiro
    // inteiro com "arr.map is not a function" (ver qdArr).
    var a=qdArr(arr), out='', i, x;
    for(i=0;i<a.length;i++){ x=qdTxt(a[i]); if(x)out+='<li>'+esc(x)+'</li>'; }
    if(!out)return '';
    return '<div class="estBlk '+cls+'"><h4>'+rot+'</h4><ul'+(cx?' class="estCaixa"':'')+'>'+out+'</ul></div>';
  }
  // Liga os cliques do bloco do quadro. Serve às duas pinturas: a do roteiro inteiro e a do slot.
  function qdLiga(r,el){
    var alvos=el.querySelectorAll('[data-qd-id]'), i;
    for(i=0;i<alvos.length;i++)(function(a){
      a.onclick=function(){ qdAbrir(a.getAttribute('data-qd-id')); };
    })(alvos[i]);
    var bq=el.querySelector('#estQuadro');
    if(bq&&!bq.disabled)bq.onclick=function(){
      bq.disabled=true; bq.innerHTML=QDICONE+' Montando o quadro…';
      var _tq=txtDe(r), tq=(_tq&&_tq[r[I.id]])||{};
      qdPedir(r,tq);
      qdRepinta(r);                            // mostra "montando", ou já o desfecho (a) se foi síncrono
    };
  }

  /* O ícone do botão do roteiro, pela mesma razão do QDICONE: ele troca de rótulo (escrevendo,
     erro, de volta) e trocar por textContent levava o <svg> junto. */
  var ROTICONE='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-.15em;flex:none"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/></svg>';

  function renderEstudo(r){
    var host=document.getElementById('jrEstudo'); if(!host)return;
    var id=r[I.id], reg=ROT[id];
    if(!reg){
      host.innerHTML='<div class="estWrap"><div class="diaAcoes" style="margin-top:0">'
        +'<button class="prim" id="estGerar" style="border-color:var(--accent,#0f7a57)">'+ROTICONE+' Gerar roteiro de estudo</button>'
        +'<button id="estOral">Modo prova oral</button></div>'
        +'<div class="estFonte">Tese em uma frase, fundamento, pontos-chave e a pegadinha de prova — escritos pela IA a partir do enunciado oficial acima.</div>'
        +'<div id="estOralHost"></div></div>';
      document.getElementById('estOral').onclick=function(){ oralIniciar(r, document.getElementById('estOralHost')); };
      var b=document.getElementById('estGerar');
      b.onclick=function(){
        b.disabled=true; b.innerHTML=ROTICONE+' Escrevendo…';
        var _tm=txtDe(r), t=(_tm&&_tm[r[I.id]])||{};
        iaPede(promptRoteiro(r,t)).then(function(txt){
          var j=null;
          try{ j=JSON.parse(String(txt).replace(/^[^{]*/,'').replace(/[^}]*$/,'')); }catch(e){}
          if(!j||typeof j!=='object'){ b.disabled=false; b.innerHTML=ROTICONE+' Gerar roteiro de estudo';
            host.querySelector('.estFonte').textContent='A IA respondeu em formato inesperado. Tente de novo.'; return; }
          j.ts=Date.now(); j.v=2; ROT[id]=j; rotSave();
          /* O quadro vem numa chamada PRÓPRIA: junto no mesmo JSON ele estouraria os 4096
             tokens de saída e a resposta truncada derrubaria o roteiro inteiro.
             Pintar AGORA, não no callback: o roteiro já está pago e gravado, e esperar a
             segunda ida e volta da IA deixava a pessoa até 81 s (6 s de qdTrechos + 75 s de
             teto do iaPede) diante de um botão desabilitado, com o trabalho pronto escondido
             no localStorage. O quadro entra por cima quando chegar (qdRepinta troca só o bloco
             dele); se não chegar, a oferta diz por quê.
             A ordem importa: qdPedir ANTES de pintar, para a tela já nascer sabendo que há
             chamada em voo (QDVOO) e oferecer "Montando…" desabilitado — com o botão livre, um
             clique durante a espera gastaria uma terceira chamada de IA. */
          qdPedir(r,t);
          qdRepinta(r);
        }).catch(function(err){
          b.disabled=false; b.innerHTML=ROTICONE+' Gerar roteiro de estudo';
          host.querySelector('.estFonte').textContent=String(err&&err.message||err);
        });
      };
      return;
    }
    // O sinalizador cx pede a caixa (.estCaixa). Antes ela vinha de ".estFund p" e ".estJur ul", presa ao
    // elemento de dentro — e trocar a lista por uma grade deixava o seletor órfão.
    function blk(cls,rot,txt,cx){ return txt?'<div class="estBlk '+cls+'"><h4>'+rot+'</h4><p'+(cx?' class="estCaixa"':'')+'>'+esc(txt)+'</p></div>':''; }
    var etq='';
    if(reg.nivel)etq+='<span class="diaTag">Nível '+esc(reg.nivel)+'</span>';
    if(reg.segundaFase)etq+='<span class="diaTag">2ª fase</span>';
    host.innerHTML='<div class="estWrap">'
      +(etq?'<div class="diaTags" style="margin-bottom:10px">'+etq+'</div>':'')
      +blk('estFrase','Em uma frase',reg.frase)
      +blk('estFund','Fundamento',reg.fundamento,1)
      +blk('estAt','Como era',reg.comoEra)
      +blk('estHoje','O que decidiu',reg.decidiu)
      +qdLista('estChave','Pontos que a prova cobra',reg.chave)
      // O bloco do quadro mora num slot próprio: é o único pedaço que a resposta da IA repinta.
      +'<div id="estQdSlot" tabindex="-1">'+qdBloco(r,reg)+'</div>'
      +blk('estAt','Atenção',reg.atencao)
      +blk('estHoje','O que vale hoje',reg.hoje)
      +blk('estPeg','Pegadinha de prova',reg.pegadinha)
      +'<div id="estQuiz"></div>'
      +'<div class="diaAcoes"><button id="estOral">Modo prova oral</button></div>'
      +'<div id="estOralHost"></div>'
      +'<div class="estFonte">Roteiro escrito pela IA a partir do enunciado oficial — confira os números antes de decorar. '
      +'<a href="#" id="estRefazer">Refazer</a></div></div>';
    var bo=document.getElementById('estOral');
    if(bo)bo.onclick=function(){ oralIniciar(r, document.getElementById('estOralHost')); };
    qdLiga(r,host);
    montaQuiz(reg, id);
    var rf=document.getElementById('estRefazer');
    if(rf)rf.onclick=function(ev){ ev.preventDefault(); delete ROT[id]; delete QDULT[id]; rotSave(); renderEstudo(r); };
  }

  // ---- quiz do verbete: correção na hora e flashcard do que errou
  // O flashcard vai para a MESMA chave que o app usa (catedra:flashcards), então o que
  // você errar aqui entra no baralho do Cátedra, não num baralho paralelo.
  function montaQuiz(reg, id){
    var host=document.getElementById('estQuiz'); if(!host)return;
    // O quiz também é lista vinda da IA: string ou item que não é objeto não vira questão.
    var qs=[], _q=qdArr(reg&&reg.quiz), _i;
    for(_i=0;_i<_q.length;_i++)if(_q[_i]&&typeof _q[_i]==='object')qs.push(_q[_i]);
    if(!qs.length){ host.innerHTML=''; return; }
    var respondidas={}, errou=[];
    function pinta(){
      host.innerHTML='<div class="estBlk"><h4>Quiz — '+qs.length+' questões</h4>'
        +qs.map(function(q,i){
          var esc0=respondidas[i];
          return '<div style="margin-bottom:14px"><div style="font-size:13.5px;line-height:1.55;margin-bottom:7px">'
            +(i+1)+'. '+esc(q.en)+'</div>'
            +qdArr(q.alts).map(function(a,j){
              var cls='', extra='';
              if(esc0!=null){
                if(j===q.ok){cls='background:#16a34a1f;border-color:#16a34a;color:#15803d';}
                else if(j===esc0){cls='background:#dc26261f;border-color:#dc2626;color:#b91c1c';}
              }
              return '<button class="qalt" data-q="'+i+'" data-a="'+j+'" '+(esc0!=null?'disabled':'')
                +' style="display:block;width:100%;text-align:left;border:1.5px solid var(--border,#e6e1d4);background:var(--surface,#fffdf8);border-radius:9px;padding:9px 12px;margin-bottom:5px;font:13px inherit;cursor:'+(esc0!=null?'default':'pointer')+';'+cls+'">'
                +String.fromCharCode(65+j)+') '+esc(a)+'</button>';
            }).join('')
            +(esc0!=null?'<div class="estBlk '+(esc0===q.ok?'estHoje':'estPeg')+'" style="margin-top:6px"><p>'
              +(esc0===q.ok?'✓ ':'✗ ')+esc(q.fb||'')+'</p></div>':'')
            +'</div>';
        }).join('')
        +(errou.length?'<button class="estBtn" id="estFc">'+(errou.length===1
            ?'Gerar flashcard da que errei'
            :'Gerar flashcards das '+errou.length+' que errei')+'</button>':'')
        +'</div>';
      host.querySelectorAll('.qalt').forEach(function(b){
        b.onclick=function(){
          var qi=+b.dataset.q, ai=+b.dataset.a;
          if(respondidas[qi]!=null)return;
          respondidas[qi]=ai;
          if(ai!==qs[qi].ok && errou.indexOf(qi)<0)errou.push(qi);
          pinta();
        };
      });
      var fc=document.getElementById('estFc');
      if(fc)fc.onclick=function(){
        var novos=errou.map(function(i){ return {front:qs[i].fcF||qs[i].en, back:qs[i].fcV||qs[i].fb||''}; })
          .filter(function(c){ return c.front&&c.back; });
        if(!novos.length)return;
        try{
          window.ctEnviarAoHost({type:'ctFlashcards', cards:novos, origem:id});
          fc.disabled=true; fc.textContent=novos.length===1?'✓ flashcard no seu baralho':('✓ '+novos.length+' flashcards no seu baralho');
        }catch(e){ fc.textContent='Não consegui enviar os flashcards.'; }
      };
    }
    pinta();
  }

  function renderVerbete(r){
    var _tm=txtDe(r), t=(_tm&&_tm[r[I.id]])||{};
    var h='<div class="vhero"><div class="htop"><span class="tb">'+esc(r[I.tr]||'—')+'</span>'
      +(r[I.fo]&&norm(r[I.fo])!==norm(r[I.tr])?'<span class="meta">'+esc(nomeColecao(r[I.fo]))+'</span>':'')
      +(r[I.nu]?'<span class="meta">nº '+esc(r[I.nu])+'</span>':'')
      +(r[I.si]?'<span class="meta">· '+esc(r[I.si])+'</span>':'')
      +(r[I.im]?'<span class="star" title="Destaque">★</span>':'')
      +'</div><h2>'+esc(r[I.ti]||'Verbete')+'</h2><div class="tags">'
      +(r[I.ra]?'<span class="rtag">'+esc(r[I.ra])+'</span>':'')
      // no acervo de contas o "tema" do card é o início da própria tese: repetir
      // logo acima do enunciado inteiro seria eco
      +(r[I.te]&&!(t.en&&norm(t.en).indexOf(norm(String(r[I.te]).replace(/…$/,'')))===0)?'<span class="tema">'+esc(r[I.te])+'</span>':'')+'</div></div>';
    h+='<div class="venun"><div class="lbl">Enunciado</div><div class="bd">'+(t.en?jGr(t.en):'<span style="color:var(--rdim)">Sem enunciado.</span>')+'</div></div>';
    if(t.co)h+='<div class="vblk"><div class="lbl">Comentário</div><div class="bd">'+jGr(t.co)+'</div></div>';
    if(t.ob)h+='<div class="vblk"><div class="lbl">Observação</div><div class="bd">'+jGr(t.ob)+'</div></div>';
    var foot='';
    if(t.fp)foot+='<span class="fp">'+esc(t.fp)+'</span>'; else if(t.og)foot+='<span class="fp">'+esc(t.og)+'</span>';
    if(t.ur && /^https?:\/\//i.test(t.ur))foot+='<a href="'+esc(t.ur)+'" target="_blank" rel="noopener">Ver no tribunal ↗</a>';
    if(foot)h+='<div class="vfoot">'+foot+'</div>';
    h+='<div id="jrEstudo"></div>';
    _jsc.innerHTML='<div class="docwrap" id="jrDoc" style="--rfs:'+_jfs+'px">'+h+'</div>'; _jdoc=document.getElementById('jrDoc');
    jgrifos=jLoad(); var seen={}; jgrifos.forEach(function(g){ if(!seen[g.gi]){ jRenderGr(g.gi); seen[g.gi]=1; } });
    renderEstudo(r);
  }
  window.openVerbete=function(idx){
    if(idx<0||idx>=filtered.length)return; curIdx=idx; jdisp=[];
    var r=filtered[idx]; curId=r[I.id];
    var rc=corFaceta(r[I.ra]); _jr.style.setProperty('--rc',rc); _jr.style.setProperty('--rc2',toRc2(rc));
    document.getElementById('jrMat').textContent=r[I.ra]||'Jurisprudência';
    document.getElementById('jrTitle').textContent=r[I.ti]||'Verbete';
    document.getElementById('jrTrib').textContent=r[I.tr]||'—';
    jApplyTheme(); jApplyLeitura(); _jr.classList.add('on'); document.body.style.overflow='hidden'; _jsc.scrollTop=0;
    buildMap(idx);
    var _tmR=txtDe(r);
    if(!_tmR || !_tmR[r[I.id]]){ _jsc.innerHTML='<div class="rdr-spin">Carregando os textos…</div>'; garanteTexto(r,function(){ renderVerbete(r); }); }
    else renderVerbete(r);
  };
  // grifos
  function jKey(){ return 'catedra:grifosJuris:'+curId; }
  function jLoad(){ try{return JSON.parse(localStorage.getItem(jKey()))||[];}catch(e){return[];} }
  function jSave(){ try{localStorage.setItem(jKey(),JSON.stringify(jgrifos));}catch(e){} }
  function jRenderGr(gi){ var el=_jdoc.querySelector('.gr[data-gi="'+gi+'"]'); if(!el)return;
    var txt=jdisp[gi]||'', gs=jgrifos.filter(function(g){return g.gi===gi;});
    if(!gs.length){ el.textContent=txt; return; }
    var marks=[]; gs.forEach(function(g){ var idx=(g.s!=null&&txt.substr(g.s,g.t.length)===g.t)?g.s:txt.indexOf(g.t); if(idx>=0)marks.push([idx,idx+g.t.length,g.t,g.s]); });
    marks.sort(function(a,b){return a[0]-b[0];}); var clean=[],last=-1; marks.forEach(function(m){if(m[0]>=last){clean.push(m);last=m[1];}});
    var out='',pos=0; clean.forEach(function(m){ out+=esc(txt.slice(pos,m[0]))+'<mark data-t="'+esc(m[2]).replace(/"/g,'&quot;')+'" data-s="'+(m[3]==null?'':m[3])+'">'+esc(txt.slice(m[0],m[1]))+'</mark>'; pos=m[1]; });
    el.innerHTML=out+esc(txt.slice(pos)); }
  _jsc.addEventListener('mouseup',function(){ var sel=window.getSelection(); if(!sel||sel.isCollapsed||!sel.toString().trim()){ _jgrif.classList.remove('on'); return; }
    var a=sel.anchorNode, node=(a&&a.nodeType===3?a.parentElement:a); var gr=node&&node.closest?node.closest('.gr'):null; if(!gr){ _jgrif.classList.remove('on'); return; }
    var gi=+gr.dataset.gi, range=sel.getRangeAt(0); var pre=document.createRange(); pre.selectNodeContents(gr); pre.setEnd(range.startContainer,range.startOffset);
    var sO=pre.toString().length, tt=(jdisp[gi]||'').slice(sO,sO+sel.toString().length); var rc=range.getBoundingClientRect();
    _jgrif.style.left=(rc.left+rc.width/2)+'px'; _jgrif.style.top=rc.top+'px'; _jgrif.classList.add('on'); _jp={gi:gi,s:sO,t:tt}; });
  _jgrif.onclick=function(){ if(_jp&&_jp.t&&jdisp[_jp.gi]&&jdisp[_jp.gi].substr(_jp.s,_jp.t.length)===_jp.t){ jgrifos.push(_jp); jSave(); jRenderGr(_jp.gi); } _jgrif.classList.remove('on'); try{getSelection().removeAllRanges();}catch(e){} _jp=null; };
  _jsc.addEventListener('click',function(e){ var mk=e.target.closest&&e.target.closest('mark'); if(!mk)return; var gr=mk.closest('.gr'); if(!gr)return;
    var gi=+gr.dataset.gi, t=mk.getAttribute('data-t'), sv=mk.getAttribute('data-s');
    jgrifos=jgrifos.filter(function(g){return !(g.gi===gi&&g.t===t&&(g.s==null?'':String(g.s))===sv);}); jSave(); jRenderGr(gi); });
  // controles
  function jClose(){ _jr.classList.remove('on'); document.body.style.overflow=''; _jgrif.classList.remove('on'); }
  function jFS(v){ _jfs=Math.max(13,Math.min(22,v)); if(_jdoc)_jdoc.style.setProperty('--rfs',_jfs+'px'); }
  document.getElementById('jrClose').onclick=jClose;
  document.getElementById('jrPrev').onclick=function(){ if(curIdx>0)openVerbete(curIdx-1); };
  document.getElementById('jrNext').onclick=function(){ if(curIdx<filtered.length-1)openVerbete(curIdx+1); };
  document.getElementById('jrMinus').onclick=function(){ jFS(_jfs-1); };
  document.getElementById('jrPlus').onclick=function(){ jFS(_jfs+1); };
  document.getElementById('jrDark').onclick=function(){ _jr.classList.toggle('dark');
    var dk=_jr.classList.contains('dark');
    document.getElementById('jrDark').setAttribute('aria-pressed',dk?'true':'false');
    try{localStorage.setItem('catedra:leitorDark',dk?'1':'0');}catch(e){} };
  document.getElementById('jrLeitura').onclick=function(){
    try{ localStorage.setItem(LEITK, jLeitura()?'0':'1'); }catch(e){}
    jApplyLeitura();
  };
  // D8 — no celular a barra do leitor não cabia com título, tribunal e quatro botões:
  // as ferramentas viram um "⋯" que abre a coluna. No desktop o "⋯" nem existe.
  var _jtools=document.getElementById('jrTools'), _jmais=document.getElementById('jrMais');
  _jmais.onclick=function(e){ e.stopPropagation();
    var on=!_jtools.classList.contains('aberto');
    _jtools.classList.toggle('aberto',on); _jmais.setAttribute('aria-expanded',on?'true':'false'); };
  _jtools.addEventListener('click',function(){
    _jtools.classList.remove('aberto'); _jmais.setAttribute('aria-expanded','false'); });
  /* ←/→ trocam o verbete só SEM modificador: Alt+← é a volta da pílula (e Option/⌘/Ctrl+seta
     são atalhos do sistema) — antes o mesmo Alt+← voltava ao app E trocava o verbete. */
  document.addEventListener('keydown',function(e){ if(!_jr.classList.contains('on'))return; if(e.key==='Escape'){ jClose(); return; }
    if(e.altKey||e.metaKey||e.ctrlKey) return;
    if(e.key==='ArrowLeft'&&curIdx>0)openVerbete(curIdx-1); else if(e.key==='ArrowRight'&&curIdx<filtered.length-1)openVerbete(curIdx+1); });

})();
</script>
