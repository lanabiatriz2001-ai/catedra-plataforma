<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CátedraJURIS</title>
<link rel="stylesheet" href="catedra-ui.css"><link rel="stylesheet" href="satellite-base.css"><style>
/* Cor do módulo (JURIS). Dentro do app segue o tema escolhido nos Ajustes; aberta
   avulsa, a página mantém a cor com que nasceu. Ver satellite-base.css. */
:root{--module-accent:var(--accent,#0f7a57)}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg,#f4f1ea);color:var(--ink,#1f1c17);font-family:var(--body,'Inter',system-ui,sans-serif);font-size:13px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:20px 26px 90px}
.head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.head .ic{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--accentSolid,var(--accent,#0f7a57)),var(--accentSolidD,var(--accentD,#0b5e43)));display:flex;align-items:center;justify-content:center;color:var(--onAccent,#fff);font-size:20px;flex:none;box-shadow:0 6px 16px -4px rgba(20,15,10,.30)}
.head h1{font-family:var(--display,'Spectral',Georgia,serif);font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1}
.head p{font-size:12px;color:var(--text2,#5c564a);margin-top:3px}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;border:1.5px solid var(--border,#e6e1d4);background:var(--surface,#fffdf8);border-radius:12px;padding:12px 14px 12px 40px;font-size:var(--fs-sm,14px);min-height:var(--control-h,38px);color:var(--ink);outline:none;font-family:inherit}
.search input:focus{border-color:var(--accent,#0f7a57)}
.search .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3,#94a3b8)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1.5px solid var(--border,#e6e1d4);background:var(--surface,#fffdf8);color:var(--text2,#5c564a);border-radius:99px;padding:6px 13px;font:700 12px inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:99px}
.chip small{color:var(--text2,#5c564a);font-weight:600;font-variant-numeric:tabular-nums}
.chip.on{color:#fff;border-color:transparent}
.chip.on small{color:rgba(255,255,255,.8)}
.chip.on.destaque{color:var(--onAccent,#fff)}
.chip.on.destaque small{color:inherit}
.gedic{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px;margin:6px 0 4px}
.edic{aspect-ratio:1;border:1.5px solid var(--border,#e6e1d4);background:var(--surface,#fffdf8);border-radius:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:800 14px inherit;color:var(--text2,#5c564a);font-variant-numeric:tabular-nums}
.edic i{font-style:normal;font-size:9px;font-weight:700;color:var(--text2,#5c564a)}
.edic.parcial{border-color:#eab308;background:#eab3081f;color:#a16207}
.edic.parcial i{color:#a16207}
.edic.lido{border-color:#16a34a;background:#16a34a1f;color:#15803d}
.edic.lido i{color:#15803d}
.edic:hover{border-color:var(--accent,#0f7a57)}
.gtit{display:flex;align-items:baseline;gap:10px;margin:20px 0 2px;flex-wrap:wrap}
.gtit b{font-family:var(--display,'Spectral',Georgia,serif);font-size:17px;font-weight:800}
.gtit span{font-size:11.5px;color:var(--text2,#5c564a)}
.diaCap{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.diaCap b{font-family:var(--display,'Spectral',Georgia,serif);font-size:20px;font-weight:800}
.diaCap span{font-size:12px;color:var(--text2,#5c564a)}
.diaCard{background:var(--surface,#fffdf8);border:1px solid color-mix(in srgb,var(--accent,#0f7a57) 38%,var(--border,#e6e1d4));
  background-image:linear-gradient(90deg,color-mix(in srgb,var(--accent,#0f7a57) 18%,transparent),transparent 46%);border-radius:14px;padding:20px 22px}
.diaCard h3{font-family:var(--display,'Spectral',Georgia,serif);font-size:19px;font-weight:800;line-height:1.25;margin-bottom:8px}
.diaCard .diaEn{font-size:14.5px;line-height:1.65;margin-top:10px}
.diaTags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.diaTag{font:800 10px inherit;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:3px 8px;background:color-mix(in srgb,var(--accent,#0f7a57) 15%,transparent);color:var(--accentD,#0b5e43)}
.diaAcoes{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.diaAcoes button{border:1.5px solid var(--accent,#0f7a57);background:none;color:var(--accent,#0f7a57);border-radius:10px;padding:9px 15px;font:700 12.5px inherit;cursor:pointer}
.diaAcoes button.prim{background:var(--accentSolid,var(--accent,#0f7a57));color:var(--onAccent,#fff)}
.oral{margin-top:16px;border-top:1px dashed var(--border,#e6e1d4);padding-top:14px}
.oral h4{margin-bottom:8px}
.oral .perg{font-size:15px;line-height:1.6;font-weight:600;margin-bottom:10px}
.oral textarea{width:100%;border:1.5px solid var(--border,#e6e1d4);background:var(--surface,#fffdf8);border-radius:11px;padding:12px;font:14px inherit;color:var(--ink);line-height:1.6;resize:vertical;outline:none}
.oral textarea:focus{border-color:var(--accent,#0f7a57)}
.oralNota{display:inline-block;font:800 13px inherit;border-radius:8px;padding:4px 11px;margin-bottom:8px}
.oralNota.b{background:#16a34a1f;color:#15803d}
.oralNota.m{background:#eab3081f;color:#a16207}
.oralNota.r{background:#dc26261f;color:#b91c1c}
.estWrap{margin-top:18px;border-top:1px dashed var(--border,#e6e1d4);padding-top:14px}
.estBtn{border:1.5px solid var(--accent,#0f7a57);background:none;color:var(--accent,#0f7a57);border-radius:10px;padding:9px 15px;font:700 12.5px inherit;cursor:pointer}
.estBtn[disabled]{opacity:.55;cursor:default}
.estBlk{margin-top:13px}
.estBlk h4{margin-bottom:5px}
.estBlk p,.estBlk li,.estBlk .qdVal{font-size:14px;line-height:1.6}
.estBlk ul{padding-left:19px}
.estBlk li{margin-bottom:5px}
.estFrase p{background:color-mix(in srgb,var(--accent,#0f7a57) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent,#0f7a57) 34%,transparent);padding:11px 13px;border-radius:8px;font-weight:600}
/* A caixa é do CONTAINER, não do miolo. Enquanto ela era ".estFund p, .estJur ul", trocar a
   lista de "Relacionados" por uma grade deixava três seletores órfãos de uma vez: o bloco
   nascia sem fundo e, no modo imersão, claro dentro do escuro. Agora quem quer caixa ganha
   a classe, seja <p>, <ul> ou <div>. */
.estCaixa{background:color-mix(in srgb,var(--ink,#1f1c17) 4%,transparent);border:1px solid var(--border,#e6e1d4);padding:11px 13px;border-radius:8px}
.estJur ul.estCaixa{padding-left:30px}
.estAt p{background:#fff7ed;border:1px solid color-mix(in srgb,#ea580c 34%,transparent);background-image:linear-gradient(90deg,color-mix(in srgb,#ea580c 18%,transparent),transparent 46%);padding:11px 13px;border-radius:8px;color:#7c2d12}
.estHoje p{background:#f0fdf4;border:1px solid color-mix(in srgb,#16a34a 34%,transparent);background-image:linear-gradient(90deg,color-mix(in srgb,#16a34a 18%,transparent),transparent 46%);padding:11px 13px;border-radius:8px;color:#14532d}
.estPeg p{background:#fef2f2;border:1px solid color-mix(in srgb,#dc2626 34%,transparent);background-image:linear-gradient(90deg,color-mix(in srgb,#dc2626 18%,transparent),transparent 46%);padding:11px 13px;border-radius:8px;color:#7f1d1d;font-weight:500}
.rdr.dark .estCaixa{background:#ffffff0a;border-color:#ffffff1f}
.rdr.dark .estAt p{background:#7c2d1233;color:#fed7aa}
.rdr.dark .estHoje p{background:#14532d33;color:#bbf7d0}
.rdr.dark .estPeg p{background:#7f1d1d33;color:#fecaca}
.estFonte{font-size:11px;color:var(--text2,#5c564a);margin-top:10px;font-style:italic}

/* ===== "Não confunda com" — o quadro comparativo dos vizinhos =====
   Uma lista de rótulos opacos ("STF · Tema 1282") não ensina a diferença; o que engana na
   prova é justamente a semelhança. O quadro põe os vizinhos lado a lado pelos elementos
   que a banca cobra e só mostra as linhas em que eles DIFEREM.
   Empilhado por padrão: a matriz só vale quando cada coluna passa de ~190px, e dentro do
   leitor o mapa lateral leva 270px — a 700px sobrariam 115px por coluna. É a mesma conta
   que o Histórico do app fez para virar cartão no celular.
   minmax(0,1fr) e não 1fr também no empilhado: 1fr é minmax(auto,1fr), e o "auto" deixa
   o trilho crescer até a palavra mais comprida da coluna — a 390px ela passava da borda. */
.qdCtx+.qdCtx{margin-top:6px}
.qdGrade{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:12px}
.qdCol{border:1px solid var(--rline,var(--border,#e6e1d4));border-radius:10px;padding:11px 13px;background:var(--rcard,var(--surface,#fffdf8))}
/* A coluna do verbete aberto: borda INTEIRA tingida + lavagem (o padrão .ct-item da casa),
   nunca faixa lateral. E nunca só a cor — o cabeçalho também diz por escrito que é ela. */
.qdCol.aberta{border-color:color-mix(in srgb,var(--rc,var(--accent,#0f7a57)) 38%,transparent);
  background-image:linear-gradient(90deg,color-mix(in srgb,var(--rc,var(--accent,#0f7a57)) 18%,transparent),transparent 46%)}
/* Coluna em flex, e não em bloco: o cabeçalho que ABRE o vizinho é um <button>, e o navegador
   centraliza na vertical o conteúdo de botão esticado. Lado a lado, a linha de cabeçalho tem a
   altura do mais alto ("o verbete aberto" ocupa uma linha a mais), e o título do vizinho descia
   para o meio dela, desalinhado do título ao lado. */
.qdCab{display:flex;flex-direction:column;justify-content:flex-start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rline,var(--border,#e6e1d4));background:none;padding:0 0 8px;margin:0 0 9px;font:inherit;color:inherit}
.qdCab b{display:block;font-size:var(--fs-sm,12.5px);font-weight:800;line-height:1.3;color:var(--rink,var(--ink,#1f1c17))}
.qdCab small,.qdCab em{display:block;margin-top:2px;font-size:var(--fs-3xs,10.5px);font-style:normal;font-weight:700;letter-spacing:.03em;color:var(--rdim,var(--text2,#5c564a))}
/* Cabeçalho que ABRE o verbete precisa parecer que abre: sublinhado, a mesma linguagem do
   vizinho em "Do mesmo assunto". Sem ele, coluna clicável e coluna morta ficam idênticas. */
button.qdCab{cursor:pointer}
button.qdCab b{text-decoration:underline;text-underline-offset:2px}
button.qdCab:hover b{text-decoration-thickness:2px}
button.qdCab:hover{border-bottom-color:color-mix(in srgb,var(--rc,var(--accent,#0f7a57)) 55%,transparent)}
.qdCel{margin-bottom:9px}
.qdCel:last-child{margin-bottom:0}
.qdRot{display:block;margin-bottom:2px}
.qdVal{display:block;color:var(--rctext,var(--ink,#1f1c17))}
/* "inconstitucionalidade" tem 21 letras e aparece 628 vezes no acervo. Numa coluna estreita
   (leitor com o mapa aberto e o texto no A+) ela é mais larga que o cartão, e sem quebrar
   dentro da palavra o texto sai por fora — inclusive o "nº 1282" do cabeçalho, justamente o
   número que este bloco existe para não deixar confundir. */
/* O bloco inteiro, não só a célula: a frase "Não confunda", o rodapé com os "Confira:" e a
   lista do mesmo assunto também vêm de texto que ninguém revisou, e uma palavra de 170 letras
   na trava fazia o documento do leitor rolar de lado a 390px (medido: 786px de sobra). */
.estQd,.estQdOferta,.qdVal,.qdCab b,.qdCab small,.qdLink{overflow-wrap:anywhere}
.qdTrava{margin-top:13px;padding-top:11px;border-top:1px dashed var(--rline,var(--border,#e6e1d4))}
.qdTrava p{font-weight:500}
.qdTrava p+p{margin-top:7px}
.qdMais{margin-top:11px}
.qdMais ul{margin-top:4px}
/* A cor do ramo reprova como texto em vários ramos (medido: 3,19:1 no trabalhista claro,
   2,29:1 no eleitoral escuro). O link do vizinho é tinta de corpo com sublinhado — cor
   nunca sozinha, e contraste garantido nos dois modos. */
.qdLink{border:0;background:none;padding:0;font:inherit;color:var(--rctext,var(--ink,#1f1c17));text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.qdLink:hover{text-decoration-thickness:2px}
.estQdOferta{margin-top:13px}
/* O ponto de virada é a largura DA GRADE, não a da janela. A conta que a media query fazia
   (janela − 270 do mapa − 64 do .doc − 28 da caixa) só vale com o mapa aberto e com o texto
   solto — e MEDIDO no navegador ela erra dos dois lados:
     · de 641 a 700px (o número do contrato) a grade tem 279–338px: duas colunas dariam 134–164px,
       ficha empilhada fingindo ser quadro — aqui o contrato não vale, e a media query já sabia;
     · abaixo de 641 o mapa some e a grade SOBE para 542px, mas a media query continuava
       empilhando um quadro de duas colunas que cabia com folga (266px cada);
     · no modo leitura o .docwrap trava em 65ch: a 980px a grade tem 587px, e a media query
       abria três colunas de 189px com corpo de 17px serifado — umas 20 letras por linha.
   O piso em que a matriz ainda se lê é ~190px por coluna com o corpo de 14px, ou seja 13,5em
   do corpo da célula. A caixa do quadro é o container e leva o MESMO corpo da célula (logo
   abaixo), então o "em" da condição acompanha o modo leitura sozinho:
     duas colunas:  2 × 13,5em + 1 vão de 10px ≈ 27,7em  (388px no corpo de 14 · 471px no de 17)
     três colunas:  3 × 13,5em + 2 vãos        ≈ 42em    (588px no corpo de 14 · 714px no de 17)
   Motor sem container query (Safari < 16, que também não tem color-mix) fica no empilhado,
   que é legível em qualquer largura. --qdn é o total de colunas e vira data-qd-n porque a
   condição do container não lê variável CSS. */
.qdCaixa{container:qd/inline-size;font-size:14px}
/* mesmo valor do corpo da célula no modo leitura (.rdr.leitura .estBlk .qdVal, mais abaixo) */
.rdr.leitura .qdCaixa{font-size:max(17px,calc(var(--rfs,15px) + 2px))}
@container qd (min-width:27.7em){
  .qdGrade[data-qd-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
  @supports (grid-template-rows:subgrid){
    .qdGrade[data-qd-n="2"]{grid-template-rows:auto repeat(var(--qdl,1),auto)}
    .qdGrade[data-qd-n="2"] .qdCol{display:grid;grid-row:1/-1;grid-template-rows:subgrid;grid-template-columns:minmax(0,1fr)}
    .qdGrade[data-qd-n="2"] .qdCel{margin-bottom:0;padding-bottom:9px}
  }
}
@container qd (min-width:42em){
  .qdGrade{grid-template-columns:repeat(var(--qdn,3),minmax(0,1fr))}
  /* Subgrid alinha o rótulo da mesma linha nas três colunas; sem ele os cartões apenas
     ficam lado a lado, que continua legível.
     grid-template-columns é OBRIGATÓRIO aqui: sem ele a coluna implícita do subgrid é
     "auto", cujo mínimo automático é o min-content — a palavra mais comprida da coluna
     inteira. Bastava um "inconstitucionalidade" numa célula para o trilho crescer, e TODOS
     os itens da coluna (o cabeçalho junto) serem dispostos nessa largura e saírem por cima
     do cartão vizinho, que é opaco e come o número do tema. */
  @supports (grid-template-rows:subgrid){
    .qdGrade{grid-template-rows:auto repeat(var(--qdl,1),auto)}
    .qdCol{display:grid;grid-row:1/-1;grid-template-rows:subgrid;grid-template-columns:minmax(0,1fr)}
    .qdCel{margin-bottom:0;padding-bottom:9px}
  }
}
/* O foco volta para o bloco quando o quadro chega e troca o botão que tinha o foco: sem isso
   quem navega por teclado cai no topo da página. O bloco não é alvo de Tab (tabindex=-1),
   então o anel dele seria só ruído. */
#estQdSlot:focus{outline:none}
.avEd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--accent,#0f7a57) 9%,transparent);border:1.5px solid var(--accent,#0f7a57);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:12.5px;font-weight:600;color:var(--text2,#5c564a)}
.avEd button{border:0;background:var(--accentSolid,var(--accent,#0f7a57));color:var(--onAccent,#fff);border-radius:8px;padding:6px 12px;font:700 12px inherit;cursor:pointer}
.gmais{border:1.5px solid var(--border,#e6e1d4);background:var(--surface,#fffdf8);border-radius:10px;padding:7px 14px;font:700 12px inherit;color:var(--text2,#5c564a);cursor:pointer;margin-top:8px}
.statbar{display:flex;gap:20px;flex-wrap:wrap;background:var(--surface,#fffdf8);border:1px solid var(--border,#e6e1d4);border-radius:12px;padding:12px 18px;margin:6px 0 16px}
.statbar .s1{display:flex;flex-direction:column}
.statbar .s1 b{font-family:var(--display,'Spectral',Georgia,serif);font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.statbar .s1 span{margin-top:3px}
.vcard{background:var(--surface,#fffdf8);border:1px solid var(--border,#e6e1d4);border-radius:14px;margin-bottom:10px;overflow:hidden;position:relative}
.vcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rc,#0f7a57)}
.vhead{display:flex;align-items:flex-start;gap:12px;padding:14px 16px 14px 20px;cursor:pointer}
.vhead:hover{background:color-mix(in srgb,var(--rc) 5%,transparent)}
.vmeta{flex:1;min-width:0}
.vtop{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.badge{font:800 10px inherit;letter-spacing:.03em;padding:3px 8px;border-radius:6px;background:var(--rc,#0f7a57);color:#fff}
.badge.tb{background:var(--tc,#334155)}
.num{font-size:11px;color:var(--text2,#5c564a);font-weight:600}
.star{color:#e0a400;font-size:12px}
.vtit{font-family:var(--display,'Spectral',Georgia,serif);font-size:15px;font-weight:700;line-height:1.25;color:var(--ink)}
.vsub{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.rtag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--rc) 14%,transparent);color:var(--rc)}
.tema{font-size:11.5px;color:var(--text2,#5c564a);font-style:italic}
.vact{display:flex;flex-direction:column;gap:6px;align-items:center;flex:none}
.st{width:22px;height:22px;border-radius:99px;border:2px solid var(--border,#e6e1d4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;background:none;color:var(--text3,#94a3b8)}
.st.rev{border-color:#eab308;background:#eab30822;color:#a16207}
.st.dom{border-color:#16a34a;background:#16a34a;color:#fff}
.fav{cursor:pointer;font-size:16px;color:var(--text3,#c9c2b2);background:none;border:none;line-height:1}
.fav.on{color:#eab308}
.chev{color:var(--text2,#5c564a);font-size:12px;transition:transform .15s;margin-top:2px}
.vcard.open .chev{transform:rotate(90deg)}
.vbody{display:none;padding:2px 20px 18px 20px;border-top:1px solid var(--border,#e6e1d4)}
.vcard.open .vbody{display:block}
.enun{font-size:13.5px;line-height:1.6;color:var(--text,#2b2620);white-space:pre-wrap;margin-top:12px}
.enun mark{background:var(--accentSoft,#ffe9a8);color:inherit;border-radius:3px;padding:0 2px}
.block{margin-top:12px}
.block .lbl{margin-bottom:4px}
.block .txt{font-size:12.5px;line-height:1.55;color:var(--text2,#5c564a);white-space:pre-wrap}
.foot{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.foot .fp{font-size:11px;color:var(--text2,#5c564a)}
.foot a{font-size:11.5px;font-weight:700;color:var(--accent,#0f7a57);text-decoration:none;border:1px solid var(--accentRing,#c2e0d1);border-radius:9px;padding:6px 11px}
.foot a:hover{background:var(--accentSoft,#e6f0ea)}
.loading{font-size:12px;color:var(--text2,#5c564a);padding:8px 0}
.empty{text-align:center;padding:60px 20px;color:var(--text2,#5c564a)}
.empty .ei{font-size:40px;opacity:.5;margin-bottom:10px}
.more{text-align:center;padding:14px;color:var(--text2,#5c564a);font-size:12px}
.skel{height:80px;border-radius:14px;background:linear-gradient(90deg,var(--surface2,#efeadd) 25%,var(--surface,#fffdf8) 50%,var(--surface2,#efeadd) 75%);background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:10px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ===== Central de Contas (TCU + TCEs) ===== */
[hidden]{display:none!important}
.modes{display:flex;gap:9px;margin-bottom:13px;flex-wrap:wrap}
.mode{flex:1 1 210px;border:1.5px solid var(--border,#e6e1d4);background:var(--surface,#fffdf8);border-radius:14px;padding:11px 15px;cursor:pointer;font-family:inherit;text-align:left;display:flex;flex-direction:column;gap:3px}
.mode b{font-family:var(--display,'Spectral',Georgia,serif);font-size:15px;font-weight:800;color:var(--ink);line-height:1.1}
.mode small{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3,#7a7368)}
.mode:hover{border-color:var(--accent,#0f7a57)}
.mode.on{border-color:transparent;background:linear-gradient(135deg,var(--accentSolid,var(--accent,#0f7a57)),var(--accentSolidD,var(--accentD,#0b5e43)));box-shadow:0 12px 26px -14px rgba(20,15,10,.34)}
.mode.on b{color:var(--onAccent,#fff)}
.mode.on small{color:var(--onAccent,#fff)}
.tabs{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:1.5px solid var(--border,#e6e1d4);background:var(--surface,#fffdf8);color:var(--text2,#5c564a);border-radius:10px;padding:7px 14px;font:800 12px inherit;cursor:pointer}
.tab.on{background:var(--ink,#1f1c17);color:var(--bg,#f4f1ea);border-color:transparent}
.tab small{font-weight:700;opacity:.6;margin-left:5px;font-variant-numeric:tabular-nums}
.fonte{font-size:11px;color:var(--text2,#5c564a);line-height:1.55;margin:-2px 0 14px}
.fonte a{color:var(--accent,#0f7a57);text-decoration:none;font-weight:700}
.reg{margin:16px 0 8px;display:flex;align-items:center;gap:9px}
.reg::after{content:"";flex:1;height:1px;background:var(--border,#e6e1d4)}
.tcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:10px}
.tccard{background:var(--surface,#fffdf8);border:1px solid var(--border,#e6e1d4);border-radius:14px;padding:13px 15px 12px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:7px}
.tccard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rc,#0f7a57)}
.tccard .tct{display:flex;align-items:center;gap:8px}
.tccard .sg{font-family:var(--display,'Spectral',Georgia,serif);font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.tccard .uf{font:800 10px inherit;letter-spacing:.05em;background:color-mix(in srgb,var(--rc) 15%,transparent);color:var(--rc);border-radius:6px;padding:3px 7px}
.tccard .nm{font-size:11.5px;line-height:1.45;color:var(--text2,#5c564a)}
.tccard .lks{display:flex;gap:6px;flex-wrap:wrap;margin-top:1px}
.tccard .lks a{font:700 11px inherit;text-decoration:none;color:var(--rc,#0f7a57);border:1px solid color-mix(in srgb,var(--rc) 30%,transparent);border-radius:8px;padding:5px 9px}
.tccard .lks a:hover{background:color-mix(in srgb,var(--rc) 10%,transparent)}
.tccard .acv{margin-top:2px;border:none;background:color-mix(in srgb,var(--rc) 12%,transparent);color:var(--rc);border-radius:9px;padding:7px 10px;font:800 11.5px inherit;cursor:pointer;text-align:left}
.tccard .acv:hover{background:color-mix(in srgb,var(--rc) 20%,transparent)}
.tccard .semacv{font-size:10.5px;color:var(--text2,#5c564a);font-style:italic;margin-top:2px}

/* ===== leitor de verbete — esquema (mesma linguagem do LEGIS) ===== */
.rdr{--rc:#0f7a57;--rc2:#12a06f;
  --rink:#181b24;--rdim:#59606f;--rdim2:#98a0b2;--rline:rgba(18,22,42,.09);--rcard:#ffffff;--rctext:#222732;
  --rcanA:#fbfcfe;--rcanB:#eef1f7;--rglow:13%;--rdot:rgba(18,22,42,.05);--rpar:#39404e;
  --rdisplay:var(--display,'Spectral',Georgia,serif);--rbody:var(--body,'Inter',system-ui,sans-serif);
  position:fixed;inset:0;z-index:300;display:none;flex-direction:column;color:var(--rink);
  background:radial-gradient(90% 60% at 82% -8%,color-mix(in srgb,var(--rc) var(--rglow),transparent),transparent 60%),radial-gradient(70% 50% at -5% 108%,color-mix(in srgb,var(--rc2) calc(var(--rglow) - 4%),transparent),transparent 55%),linear-gradient(180deg,var(--rcanA),var(--rcanB));overflow:hidden}
.rdr.on{display:flex}
.rdr.dark{--rink:#eef1f7;--rdim:#9aa3b2;--rdim2:#6b7482;--rline:rgba(255,255,255,.09);--rcard:rgba(255,255,255,.04);--rctext:#e7ebf3;--rcanA:#0e1220;--rcanB:#0a0c12;--rglow:26%;--rdot:rgba(255,255,255,.05);--rpar:#d7dce6}
.rdr::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.6;background-image:radial-gradient(var(--rdot) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(180deg,transparent,#000 12%,#000 88%,transparent)}
.rdr .top{position:relative;z-index:3;display:flex;align-items:center;gap:11px;padding:12px 20px;border-bottom:1px solid var(--rline);backdrop-filter:blur(12px);background:color-mix(in srgb,var(--rcanB) 55%,transparent)}
.rdr .back{border:1px solid var(--rline);background:var(--rcard);color:var(--rink);border-radius:11px;padding:9px 13px;font:800 15px var(--rbody);cursor:pointer;line-height:1}
.rdr .back:hover{border-color:color-mix(in srgb,var(--rc) 55%,transparent);color:var(--rc)}
.rdr .nav{border:1px solid var(--rline);background:var(--rcard);color:var(--rdim);border-radius:10px;width:34px;height:36px;font:800 15px var(--rbody);cursor:pointer;line-height:1}
.rdr .nav:hover{color:var(--rc);border-color:color-mix(in srgb,var(--rc) 45%,transparent)}
.rdr .idwrap{flex:1;min-width:0}
.rdr .kicker{font:800 10px var(--rbody);letter-spacing:.18em;text-transform:uppercase;color:var(--rc);display:flex;align-items:center;gap:8px}
.rdr .kicker::before{content:"";width:15px;height:2px;border-radius:2px;background:var(--rc)}
.rdr .top h1{font-family:var(--rdisplay);font-weight:800;font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;color:var(--rink)}
.rdr .chip{font:800 11px var(--rbody);color:#fff;background:var(--rc);border-radius:99px;padding:6px 11px;flex:none;white-space:nowrap}
.rdr .tools{display:flex;gap:6px;flex:none}
.rdr .tool{width:34px;height:34px;border-radius:10px;border:1px solid var(--rline);background:var(--rcard);color:var(--rdim);font:800 12px var(--rbody);cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
.rdr .tool:hover{color:var(--rc);border-color:color-mix(in srgb,var(--rc) 45%,transparent)}
.rdr .stage{position:relative;z-index:2;flex:1;display:flex;overflow:hidden}
.rdr .map{width:270px;flex:none;overflow-y:auto;padding:18px 10px 60px 18px;border-right:1px solid var(--rline)}
.rdr .maptitle{margin:0 0 12px 4px}
.rdr .mnode{position:relative;padding:9px 11px;border-radius:10px;cursor:pointer;color:var(--rdim);margin-bottom:3px;border:1px solid transparent}
.rdr .mnode b{display:block;font-size:12.5px;font-weight:700;color:var(--rink);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rdr .mnode small{font-size:10px;font-weight:700;color:var(--rdim2);letter-spacing:.03em}
.rdr .mnode:hover{background:color-mix(in srgb,var(--rc) 7%,transparent)}
.rdr .mnode.on{background:color-mix(in srgb,var(--rc) 13%,transparent);border-color:color-mix(in srgb,var(--rc) 30%,transparent)}
.rdr .mnode.on small{color:var(--rc)}
.rdr .doc{flex:1;overflow-y:auto;padding:26px 32px 120px;scroll-behavior:smooth}
.rdr .docwrap{max-width:760px;margin:0 auto;font-size:var(--rfs,15px)}
.rdr .vhero{position:relative;overflow:hidden;padding:20px 22px;border-radius:18px;margin-bottom:16px;background:linear-gradient(120deg,color-mix(in srgb,var(--rc) 24%,var(--rcard)),color-mix(in srgb,var(--rc2) 11%,var(--rcard)));border:1px solid color-mix(in srgb,var(--rc) 32%,transparent);box-shadow:0 18px 44px -24px color-mix(in srgb,var(--rc) 45%,rgba(20,15,10,.4))}
.rdr .vhero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 32%,transparent),transparent 70%)}
.rdr .vhero .htop{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.rdr .vhero .tb{font:800 11px var(--rbody);letter-spacing:.04em;color:#fff;background:var(--rc);border-radius:7px;padding:4px 10px}
.rdr .vhero .meta{font:700 11px var(--rbody);color:var(--rdim)}
.rdr .vhero .star{color:#e0a400}
.rdr .vhero h2{font-family:var(--rdisplay);font-weight:800;font-size:23px;line-height:1.16;letter-spacing:-.01em;color:var(--rink)}
.rdr .vhero .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.rdr .vhero .rtag{font:700 11px var(--rbody);color:var(--rc);background:color-mix(in srgb,var(--rc) 14%,transparent);border:1px solid color-mix(in srgb,var(--rc) 28%,transparent);border-radius:99px;padding:3px 11px}
.rdr .vhero .tema{font:italic 500 12.5px var(--rbody);color:var(--rdim)}
.rdr .venun{background:var(--rcard);border:1px solid var(--rline);border-radius:16px;padding:20px 22px;box-shadow:0 8px 26px -20px color-mix(in srgb,var(--rc) 60%,transparent)}
.rdr .venun .lbl{margin-bottom:9px;display:flex;align-items:center;gap:8px}
.rdr .venun .lbl::before{content:"";width:14px;height:2px;background:var(--rc);border-radius:2px}
.rdr .venun .bd{font-family:var(--rbody);font-size:calc(var(--rfs,15px) + 1px);line-height:1.68;color:var(--rctext)}
.rdr .vblk{margin-top:13px;background:color-mix(in srgb,var(--rc) 5%,var(--rcard));border:1px solid var(--rline);border-radius:14px;padding:15px 18px}
.rdr .vblk .lbl{margin-bottom:6px}
.rdr .vblk .bd{font-family:var(--rbody);font-size:13.5px;line-height:1.6;color:var(--rpar)}
.rdr .vfoot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.rdr .vfoot .fp{font:600 11.5px var(--rbody);color:var(--rdim2)}
.rdr .vfoot a{font:700 12px var(--rbody);color:var(--rc);text-decoration:none;border:1px solid color-mix(in srgb,var(--rc) 32%,transparent);border-radius:9px;padding:7px 12px}
.rdr .vfoot a:hover{background:color-mix(in srgb,var(--rc) 10%,transparent)}
.rdr .rdr-spin{text-align:center;color:var(--rdim);padding:56px 16px;font-size:13px;line-height:1.7}
.rdr .gr{cursor:text}
.rdr .gr mark{background:color-mix(in srgb,var(--rc) 26%,transparent);color:inherit;border-radius:4px;padding:0 2px;cursor:pointer;box-shadow:0 0 0 1px color-mix(in srgb,var(--rc) 34%,transparent)}
.grifbtn{position:fixed;z-index:310;transform:translate(-50%,-120%);background:linear-gradient(140deg,var(--rc,#0f7a57),var(--rc2,#12a06f));color:#fff;border:none;border-radius:9px;padding:7px 13px;font:800 12px var(--body,sans-serif);cursor:pointer;box-shadow:0 8px 20px -4px rgba(0,0,0,.4);display:none}
.grifbtn.on{display:block}

/* ===== D7 — microlabels em DOIS níveis =====
   Antes todo rótulo era mono-caps-espaçado com o mesmo peso: "ENUNCIADO" (que estrutura
   a leitura) e "VERBETES" (que é contagem) gritavam igual — quando tudo destaca, nada
   destaca. Nível forte só para o que organiza a leitura; nível fraco para metadado.
   Os dois níveis moram SÓ aqui: mudar de nível é trocar a classe, não reescrever fonte. */
.mlF,.block .lbl,.oral h4,.estBlk h4,.rdr .venun .lbl{font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--rc,var(--accent,#0f7a57))}
.mlW,.reg,.qdRot,.rdr .vblk .lbl{font-weight:700;font-size:9.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--text2,#5c564a)}
/* Dentro do leitor a paleta é própria e vira do claro para o escuro no modo imersão:
   puxar --text2 do host apagaria o rótulo justamente no escuro. */
.rdr .mlF,.rdr .venun .lbl{font-family:var(--rbody);color:var(--rc)}
.rdr .mlW,.rdr .qdRot,.rdr .vblk .lbl{font-family:var(--rbody);color:var(--rdim)}
/* Mesma razão para o rodapé de honestidade: --text2 é tinta do host e, sobre o palco escuro
   do modo imersão, media 2,56:1 — justamente a linha que manda conferir os números antes de
   decorar. Com --rdim dá 6,03:1 no escuro e ~6,5:1 no claro. */
.rdr .estFonte{color:var(--rdim)}

/* ===== D4 — zero absoluto vira convite =====
   "0 DOMINADOS · 0 FAVORITOS" é contabilidade do nada: quem nunca marcou nada não
   aprende com o zero, aprende com o gesto que falta fazer. Com 1 ou mais volta a ser
   número. */
.statbar .s1.convite{justify-content:center;max-width:200px}
.statbar .s1 .cv{font-size:11.5px;line-height:1.35;font-weight:600;color:var(--text2,#5c564a)}

/* ===== D3 — filtros rotulados e recolhidos =====
   Três fileiras de chips empurravam o acervo para fora da primeira dobra. Tribunal é o
   corte que a pessoa usa toda hora e continua à vista; coleção e ramo entram no botão. */
.fbar{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.fbtn{border:1.5px solid var(--border,#e6e1d4);background:var(--surface,#fffdf8);color:var(--text2,#5c564a);border-radius:99px;padding:7px 14px;font:800 12px inherit;cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-height:38px;white-space:nowrap}
/* seta de "abre e fecha": triângulo geométrico, que existe em qualquer fonte — glifo
   de engrenagem vira quadradinho vazio em parte dos sistemas. */
.fbtn::after{content:"▾";font-size:11px;line-height:1;opacity:.75}
.fbtn[aria-expanded="true"]::after{content:"▴"}
.fbtn.on{border-color:var(--accent,#0f7a57);color:var(--accent,#0f7a57)}
.chip.ativo{gap:8px}
.chip.ativo .x{font-size:11px;opacity:.85}
.pop{position:absolute;left:0;top:calc(100% + 6px);z-index:60;width:min(560px,calc(100vw - 40px));max-height:52vh;overflow:auto;background:var(--surface,#fffdf8);border:1.5px solid var(--border,#e6e1d4);border-radius:14px;padding:13px 15px;box-shadow:0 22px 46px -26px rgba(20,15,10,.55)}
.popsec + .popsec{margin-top:13px;border-top:1px dashed var(--border,#e6e1d4);padding-top:12px}
.popt{margin-bottom:7px}
.pop .chips,.fbar .chips{margin-bottom:0}

/* ===== U7(b) — modo leitura no leitor de verbete =====
   Medida de linha curta (~68ch), corpo serifado e entrelinha larga: o mesmo texto,
   lido sem a vista escorregar de linha. Só CSS; a escolha fica no aparelho. */
.rdr.leitura .docwrap{max-width:65ch}
.rdr.leitura .venun .bd,.rdr.leitura .vblk .bd,.rdr.leitura .estBlk p,.rdr.leitura .estBlk li,
.rdr.leitura .estBlk .qdVal{
  font-family:var(--rdisplay);font-size:max(17px,calc(var(--rfs,15px) + 2px));line-height:1.7}
.rdr .toolset{display:flex;gap:6px}
.rdr .tool.mais{display:none}
.rdr .tool[aria-pressed="true"]{color:var(--rc);border-color:color-mix(in srgb,var(--rc) 55%,transparent);background:color-mix(in srgb,var(--rc) 12%,var(--rcard))}

/* ===== D10 — foco visível =====
   Chips e pílulas eram operáveis pelo teclado e não mostravam onde o foco estava. */
.chip:focus-visible,.tab:focus-visible,.fbtn:focus-visible,.edic:focus-visible,.st:focus-visible,
.fav:focus-visible,.acv:focus-visible,.gmais:focus-visible,.diaAcoes button:focus-visible,
.estBtn:focus-visible,.tccard .lks a:focus-visible,.foot a:focus-visible,
.qdCab:focus-visible,.qdLink:focus-visible{
  outline:2px solid var(--accent,#0f7a57);outline-offset:2px}
.rdr .tool:focus-visible,.rdr .nav:focus-visible,.rdr .back:focus-visible,.rdr .mnode:focus-visible{
  outline:2px solid var(--rc);outline-offset:2px}
/* Os alvos do quadro são os maiores da tela e os únicos que TROCAM de verbete: quem navega
   só por teclado precisa enxergar onde o foco está. A cor crua do ramo reprova (medido: pior
   caso 1,95:1, o eleitoral #4338CA do modo imersão sobre a lavagem da coluna aberta). Puxada
   28% para a tinta do leitor, a identidade do ramo continua lá e o pior caso — as 21 cores
   de ramoColor × claro/imersão × cartão, lavagem da coluna aberta e palco (onde mora o link
   de "Do mesmo assunto") — sobe para 3,56:1, o mesmo eleitoral na lavagem: acima dos 3:1 de
   elemento não textual. A conta antiga (3,95:1) deixava a lavagem de fora. */
.rdr .qdCab:focus-visible,.rdr .qdLink:focus-visible{
  outline:2px solid color-mix(in srgb,var(--rc) 72%,var(--rink));outline-offset:2px}

/* ===== D8 — celular =====
   Alvo de toque de 44px, fileiras que rolam com encaixe em vez de quebrar a pílula no
   meio da palavra, e as ferramentas do leitor recolhidas num "⋯" — no telefone a barra
   do leitor não cabia com título, tribunal e quatro botões. */
@media (max-width:640px){
  .wrap{padding:16px 14px 90px}
  .tabs,#trib{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-left:-14px;margin-right:-14px;padding:2px 14px}
  .tabs::-webkit-scrollbar,#trib::-webkit-scrollbar{display:none}
  .tab,#trib .chip{flex:none;scroll-snap-align:start}
  .tab,.chip,.fbtn,.gmais,.estBtn,.diaAcoes button,.tccard .acv,button.qdCab{min-height:44px}
  .tab,.chip{display:inline-flex;align-items:center}
  .pop{width:calc(100vw - 28px);max-height:58vh}
  .pop .chips{flex-wrap:wrap;overflow:visible;margin-left:0;margin-right:0;padding:0}
  .edic{min-height:56px}
  .vact{gap:4px}
  .st{width:44px;height:44px;font-size:16px}
  .fav{min-width:44px;min-height:44px;font-size:20px;display:flex;align-items:center;justify-content:center}
  .vhead{padding:14px 12px 14px 18px}
  .rdr .map{display:none}
  .rdr .doc{padding:18px 15px 120px}
  .rdr .top{position:relative;flex-wrap:nowrap;padding:10px 12px}
  .rdr .top h1{font-size:15px}
  .rdr .chip{display:none}
  .rdr .back,.rdr .nav,.rdr .tool{min-width:44px;min-height:44px}
  .rdr .tool.mais{display:flex}
  .rdr .toolset{position:absolute;right:10px;top:100%;margin-top:6px;flex-direction:column;z-index:6;background:var(--rcard);border:1px solid var(--rline);border-radius:12px;padding:6px;box-shadow:0 18px 34px -20px rgba(0,0,0,.65)}
  .rdr .toolset:not(.aberto){display:none}
}
/* ===== D8(b) — o mesmo alvo de 44px CHEGA AO IPAD =====================================
   As regras de alvo acima moram num @media por LARGURA, e o iPad tem 768 a 1024+: medido
   com ponteiro grosso, o bloco de cima resolvia 176 alvos a 390px e ZERO a 1024 — as abas
   ficavam 71×31 e os chips de tribunal 100×29, no aparelho em que o dedo é o único ponteiro.
   É a lição que o host já tinha aprendido (catedra-ui.css: "sob [data-toque] vale em
   QUALQUER largura — inclusive no iPad em paisagem, onde a tela passa de 900 e a regra por
   largura não alcança"), e que os satélites não tinham recebido.
   Aqui vão SÓ as linhas de alvo, repetidas: o layout de celular (fileiras que rolam, mapa
   virando gaveta, ferramentas no "⋯") continua preso à largura, senão o iPad ganharia
   desenho de telefone. */
@media (pointer:coarse){
  .tab,.chip,.fbtn,.gmais,.estBtn,.diaAcoes button,.tccard .acv{min-height:44px}
  .tab,.chip{display:inline-flex;align-items:center}
  .edic{min-height:56px}
  .st{width:44px;height:44px;font-size:16px}
  .fav{min-width:44px;min-height:44px;font-size:20px;display:flex;align-items:center;justify-content:center}
  .rdr .back,.rdr .nav,.rdr .tool{min-width:44px;min-height:44px}
}
</style>

  <!-- Um verbete por dia, sorteado com semente na DATA: o mesmo dia devolve sempre o
       mesmo julgado (senão trocaria a cada re-render e não daria para voltar nele). -->
  <div id="diaHost"></div>
</div>

  <!-- Uma edição por quadradinho. A cor sai do MESMO status de estudo dos cards
       (est.stat: '' / 'rev' / 'dom'), então marcar um verbete como dominado no acervo
       acende a edição aqui — não há segundo estado para manter em sincronia. -->
  <div class="statbar" id="infosResumo"></div>
  <div id="infosLista"></div>
</div>

  <!-- Mapas mentais das Súmulas Vinculantes (1 a 63). Documento próprio, carregado em

       218 KB em toda abertura do JURIS, inclusive de quem nunca clica aqui. -->
  <iframe id="mapasFrame" data-src="juris-mapas-sv.html" title="Mapas mentais das Súmulas Vinculantes do STF"
          style="width:100%;height:78vh;border:1px solid var(--bd,#2a3947);border-radius:12px;background:var(--surface,#fff);"></iframe>

<!-- D3: tribunal é o corte usado toda hora e fica à vista; coleção e ramo empurravam o
     acervo para fora da primeira dobra e agora vivem dentro do botão. O que estiver

<div class="fbar">
  <button class="fbtn" id="btFiltros" aria-expanded="false" aria-controls="popFiltros">Filtros</button>

    <div class="popsec" id="secRamos"><div class="mlW popt">Ramos do direito</div><div class="chips ct-chips" id="ramos"></div></div>
  </div>
</div>
<div class="statbar">
  <div class="s1" id="s1Tot"><b id="sTot">0</b><span class="mlW">Verbetes</span></div>
  <div class="s1" id="s1Filt"><b id="sFilt">0</b><span class="mlW">No filtro</span></div>

  <div class="fonte" id="tcFonte"></div>
  <div class="search"><span class="mag">🔎</span><input id="qtc" aria-label="Buscar tribunal de contas por sigla, estado ou nome" placeholder="Buscar tribunal por sigla, estado ou nome…" autocomplete="off"></div>
  <div class="chips ct-chips" id="regs"></div>
  <div id="tcList"></div>
</div>
</div>
<div class="rdr" id="jrdr"><div class="top"><button class="back" id="jrClose" title="Voltar" aria-label="Fechar o leitor">←</button><button class="nav" id="jrPrev" title="Anterior" aria-label="Verbete anterior">‹</button><button class="nav" id="jrNext" title="Próximo" aria-label="Próximo verbete">›</button><div class="idwrap"><div class="kicker" id="jrMat"></div><h1 id="jrTitle"></h1></div><span class="chip" id="jrTrib"></span><div class="tools"><button class="tool mais" id="jrMais" title="Mais opções" aria-label="Mais opções de leitura" aria-expanded="false">⋯</button><div class="toolset" id="jrTools"><button class="tool" id="jrMinus" title="Diminuir" aria-label="Diminuir o texto">A−</button><button class="tool" id="jrPlus" title="Aumentar" aria-label="Aumentar o texto">A+</button><button class="tool" id="jrDark" title="Modo imersão" aria-label="Modo imersão" aria-pressed="false">◐</button><button class="tool" id="jrLeitura" title="Modo leitura" aria-label="Modo leitura" aria-pressed="false">¶</button></div></div></div><div class="stage"><aside class="map"><div class="maptitle mlW">Verbetes do filtro</div><div id="jrTree"></div></aside><main class="doc" id="jrScroll"><div class="docwrap" id="jrDoc"></div></main></div></div>
<button class="grifbtn" id="jrGrif"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-.15em;flex:none"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg> Grifar</button>
<script>
(function(){
  var I={id:0,tr:1,fo:2,nu:3,ti:4,ra:5,te:6,da:7,si:8,im:9,src:10};

  // Dois acervos moram nesta mesma tela e compartilham cards, leitor, grifos e
  // status de estudo. O que muda entre eles é só a origem dos dados e a paleta
  // de cores da faceta "ramo" — daí o descritor abaixo em vez de duplicar a view.
  var MODOS={
    juris:{ idx:window.__JURIS_IDX__||[], txt:null,
            idxSrc:null,               idxGlobal:'__JURIS_IDX__',
            txtSrc:'juris-text.js',    txtGlobal:'__JURIS_TXT__', fatia:'juris-text',
            cor:function(n){return ramoColor(n)}, comBase:false,
            ic:'⚖️', tit:'CátedraJURIS',
            sub:'Vade mecum de jurisprudência · súmulas e julgados do STF, STJ e TSE',
            vazio:'Base de jurisprudência não carregou.' },
    contas:{ idx:null, txt:null,
            idxSrc:'contas-index.js',  idxGlobal:'__CONTAS_IDX__',
            txtSrc:'contas-text.js',   txtGlobal:'__CONTAS_TXT__', fatia:'contas-text',
            cor:function(n){return areaColor(n)}, comBase:true,
            ic:'🏛️', tit:'Central de Contas',
            sub:'Controle externo · súmulas, boletins e informativos do TCU e dos tribunais de contas',
            vazio:'Acervo da Central de Contas não carregou.' }
  };
  var modo='juris', M=MODOS.juris;
  // ACERVO ÚNICO: jurisprudência e contas na MESMA lista, e os tribunais de contas
  // viram mais chips ao lado de STF, STJ, TSE e TJRO. Cada registro guarda no campo
  // 10 de qual acervo veio, porque os textos moram em arquivos diferentes.
  var IDX=(MODOS.juris.idx||[]).slice();   // [id,tr,fo,nu,ti,ra,te,da,si,im,src]
  function fonteDe(r){ return (r&&r[I.src]==='c') ? MODOS.contas : MODOS.juris; }
  function txtDe(r){ return fonteDe(r).txt; }
  // faceta "ramo": os dois acervos usam vocabulários distintos (ramo do direito x
  // área de controle externo). Tenta o do JURIS e, se cair no genérico, o de contas.
  function corFaceta(nome){ var c=ramoColor(nome); return c==='#0f7a57'?areaColor(nome):c; }
  var PAGE=40, page=0, filtered=IDX;
  var f={q:'',tribunal:'',ramo:'',base:'',edicao:null};

  // ---- estudo (localStorage)
  var LK='catedra:jurisEstudo';
  var est={fav:{},stat:{}}; try{est=Object.assign({fav:{},stat:{}},JSON.parse(localStorage.getItem(LK))||{})}catch(e){}
  /* Registros editoriais foram retirados ou receberam identificador canônico na
     auditoria sem retirar o conteúdo jurídico correspondente. Leva o estado pessoal
     ao verbete sobrevivente, mas conserva a chave antiga como cópia de segurança:
     nunca se perde anotação por causa de uma limpeza do acervo. */
  var JURIS_ID_MIGRACOES={
    'repgeral-repetitivo-STJ-x640':'repgeral-repetitivo-STJ-518',
    'SELTJGO-0438':'SELTJGO-0433',
    'repgeral-repercussao_geral-STF-x1198':'repgeral-repetitivo-STJ-931',
    'repgeral-repetitivo-STF-x1319':'repgeral-repetitivo-STJ-1196',
    'repgeral-repercussao_geral-STJ-x257':'repgeral-repercussao_geral-STF-476',
    'repgeral-repercussao_geral-STF-x1586':'repgeral-repercussao_geral-STF-825',
    'repgeral-repercussao_geral-STF-x1590':'repgeral-repercussao_geral-STF-21',
    'INF2022-0470':'INF2021-0815'
  };
  function migraEstadoJuris(){
    var mudou=false, peso={'':0,rev:1,dom:2};
    Object.keys(JURIS_ID_MIGRACOES).forEach(function(antigo){
      var novo=JURIS_ID_MIGRACOES[antigo];
      if(est.fav[antigo]&&!est.fav[novo]){est.fav[novo]=est.fav[antigo];mudou=true;}
      var sa=est.stat[antigo]||'', sn=est.stat[novo]||'';
      if((peso[sa]||0)>(peso[sn]||0)){est.stat[novo]=sa;mudou=true;}
      try{
        var ka='catedra:grifosJuris:'+antigo, kn='catedra:grifosJuris:'+novo;
        var aa=JSON.parse(localStorage.getItem(ka)||'[]');
        var an=JSON.parse(localStorage.getItem(kn)||'[]');
        if(Array.isArray(aa)&&aa.length){
          var vistos={}; an.forEach(function(v){vistos[JSON.stringify(v)]=1;});
          aa.forEach(function(v){var k=JSON.stringify(v);if(!vistos[k]){an.push(v);vistos[k]=1;}});
          localStorage.setItem(kn,JSON.stringify(an));
        }
      }catch(e){}
    });
    if(mudou){try{localStorage.setItem(LK,JSON.stringify(est))}catch(e){}}
    try{
      var kr='catedraJurisRoteiros', rots=JSON.parse(localStorage.getItem(kr)||'{}'), mr=false;
      Object.keys(JURIS_ID_MIGRACOES).forEach(function(antigo){
        var novo=JURIS_ID_MIGRACOES[antigo];
        if(rots[antigo]&&!rots[novo]){rots[novo]=rots[antigo];mr=true;}
      });
      if(mr)localStorage.setItem(kr,JSON.stringify(rots));
    }catch(e){}
  }
  migraEstadoJuris();
  function saveEst(){try{localStorage.setItem(LK,JSON.stringify(est))}catch(e){}}
  var STAT=['','rev','dom'], STICON={'':'','rev':'◐','dom':'✓'};
  // D10 — o botão de status é só um glifo (e às vezes glifo nenhum): sem isto quem usa
  // leitor de tela ouve "botão" e não sabe nem o que ele faz nem em que ponto está.
  function rotStat(v){ return v==='dom'?'dominado':(v==='rev'?'em revisão':'ainda não estudado'); }

  // ---- cores vitrine por ramo (espelha JurisTheme.stops)
  function ramoColor(n){
    n=(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    function h(){for(var i=0;i<arguments.length;i++)if(n.indexOf(arguments[i])>=0)return true;return false;}
    if(h('constituc'))return'#2563EB';
    if(h('penal','criminal'))return'#E11D48';
    if(h('trabalh'))return'#D97706';
    if(h('previden'))return'#DB2777';
    if(h('tribut'))return'#7C3AED';
    if(h('empresar','econom'))return'#65A30D';
    if(h('administr'))return'#4F46E5';
    if(h('eleitor'))return'#4338CA';
    if(h('consum'))return'#EA580C';
    if(h('ambient'))return'#16A34A';
    if(h('digital','intelectual'))return'#C026D3';
    if(h('internacional','humanos'))return'#0EA5E9';
    if(h('civil'))return'#0D9488';
    return'#0f7a57';
  }
  var TRIBC={STF:'#1d4ed8',STJ:'#0d9488',TSE:'#7c3aed',TJRO:'#64748b',
             TCU:'#0f7a57','TCE-SP':'#b45309','TCE-MG':'#be123c','TCE-BA':'#0369a1','TCE-RO':'#7c3aed'};

  // ---- cores por área de controle externo (facetas do TCU: AREA da súmula)
  // Separada de ramoColor porque as palavras colidem: "Direito Processual" no
  // JURIS cai em civil/penal, e aqui precisa de cor própria.
  function areaColor(n){
    n=(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(n.indexOf('pessoal')>=0)return'#DB2777';
    if(n.indexOf('licitac')>=0)return'#7C3AED';
    if(n.indexOf('contrato')>=0)return'#D97706';
    if(n.indexOf('financ')>=0)return'#16A34A';
    if(n.indexOf('responsabil')>=0)return'#E11D48';
    if(n.indexOf('competencia')>=0)return'#4F46E5';
    if(n.indexOf('processual')>=0)return'#0EA5E9';
    if(n.indexOf('gestao')>=0)return'#65A30D';
    return'#0f7a57';
  }

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}

  // ---- contagens (refeitas a cada troca de acervo)
  var tribCount={}, ramoCount={}, baseCount={}, tribOrder=[], ramoOrder=[], baseOrder=[], byId={};
  function recount(){
    tribCount={}; ramoCount={}; baseCount={}; byId={};
    IDX.forEach(function(r){
      var t=r[I.tr]||'—'; tribCount[t]=(tribCount[t]||0)+1;
      var ra=r[I.ra]||'Sem ramo'; ramoCount[ra]=(ramoCount[ra]||0)+1;
      var bs=r[I.fo]||''; if(bs)baseCount[bs]=(baseCount[bs]||0)+1;
      byId[r[I.id]]=r;
    });
    function ordena(o){return Object.keys(o).sort(function(a,b){return o[b]-o[a]})}
    tribOrder=ordena(tribCount); ramoOrder=ordena(ramoCount); baseOrder=ordena(baseCount);
  }
  function chipBtn(active,label,cnt,col,onclick){
    var b=document.createElement('button'); b.className='chip'+(active?' on':'');
    // sem cor própria, o chip ativo pinta o par do destaque (fundo e texto medidos no host)
    if(active){ b.style.background=col||'var(--accentSolid,var(--accent,#0f7a57))'; if(!col) b.classList.add('destaque'); }
    b.setAttribute('aria-pressed',active?'true':'false');
    b.innerHTML=(col?'<span class="dot" aria-hidden="true" style="background:'+col+'"></span>':'')+esc(label)+' <small>'+cnt+'</small>';
    b.onclick=onclick; return b;
  }
  var showAllRamos=false;
  /* D8 — no celular a fileira deixou de quebrar linha e virou rolagem com encaixe.
     Quem chega pelo diretório de tribunais de contas cai num chip lá do fim da fila:
     sem isto ele ficaria fora da tela e a pessoa não veria por que o acervo encolheu. */
  function trazAFoco(el){ try{ if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest',inline:'nearest'}); }catch(e){} }
  function renderTribChips(){
    var el=document.getElementById('trib'); el.innerHTML='';
    el.appendChild(chipBtn(f.tribunal==='','Todos',IDX.length,null,function(){f.tribunal='';build();}));
    tribOrder.forEach(function(t){ var col=TRIBC[t]||'#64748b';
      el.appendChild(chipBtn(f.tribunal===t,t,tribCount[t],col,function(){f.tribunal=f.tribunal===t?'':t;build();})); });
    if(f.tribunal)trazAFoco(el.querySelector('.chip.on'));
  }
  function renderRamoChips(){
    var el=document.getElementById('ramos'); el.innerHTML='';
    el.appendChild(chipBtn(f.ramo==='','Todos os ramos',IDX.length,null,function(){f.ramo='';build();popFiltros(false);}));
    var TOP=11, list=showAllRamos?ramoOrder:ramoOrder.slice(0,TOP);
    if(f.ramo && list.indexOf(f.ramo)<0) list=list.concat([f.ramo]);   // garante o ramo ativo visível
    list.forEach(function(r){ var col=corFaceta(r);
      el.appendChild(chipBtn(f.ramo===r,r,ramoCount[r],col,function(){f.ramo=f.ramo===r?'':r;build();popFiltros(false);})); });
    if(!showAllRamos && ramoOrder.length>TOP){
      var m=document.createElement('button'); m.className='chip'; m.style.borderStyle='dashed';
      m.innerHTML='＋ '+(ramoOrder.length-TOP)+' ramos';
      m.onclick=function(){showAllRamos=true;renderRamoChips();};
      el.appendChild(m);
    } else if(showAllRamos && ramoOrder.length>TOP){
      var l=document.createElement('button'); l.className='chip'; l.style.borderStyle='dashed';
      l.innerHTML='▲ menos';
      l.onclick=function(){showAllRamos=false;renderRamoChips();};
      el.appendChild(l);
    }
  }
  // No acervo de contas o que separa os verbetes não é só o tribunal: súmula,
  // Boletim de Jurisprudência, Boletim de Pessoal e Informativo de Licitações e
  // Contratos têm pesos bem diferentes para quem estuda. Daí a faceta própria.
  function renderBaseChips(){
    var el=document.getElementById('bases'), sec=document.getElementById('secBases'); el.innerHTML='';
    if(baseOrder.length<2){ if(sec)sec.hidden=true; return; }
    if(sec)sec.hidden=false;
    el.appendChild(chipBtn(f.base==='','Todas as coleções',IDX.length,null,function(){f.base='';build();popFiltros(false);}));
    // D3(a): o índice guarda a fonte como veio da origem ('informativo_stj'); quem
    // aparece na tela é sempre o rótulo do nomeColecao — o valor interno não muda.
    baseOrder.forEach(function(b){
      el.appendChild(chipBtn(f.base===b,nomeColecao(b),baseCount[b],'#475569',function(){f.base=f.base===b?'':b;build();popFiltros(false);})); });
  }

  /* D3(b) — o painel de filtros. Coleção e ramo somavam duas fileiras de chips antes do
     conteúdo; agora ficam aqui dentro e o acervo volta para a primeira dobra. Filtro
     ligado reaparece como chip removível ao lado do botão: filtro invisível é filtro
     que a pessoa esquece que ligou e depois acha que o acervo sumiu. */
  var _pop=document.getElementById('popFiltros'), _btF=document.getElementById('btFiltros');
  function popFiltros(on){ if(!_pop)return; _pop.hidden=!on; _btF.setAttribute('aria-expanded',on?'true':'false'); }
  function filtrosLigados(){
    var a=[];
    if(f.base)a.push({k:'base',rot:nomeColecao(f.base)});
    if(f.ramo)a.push({k:'ramo',rot:f.ramo});
    return a;
  }
  function renderFiltroBar(){
    var host=document.getElementById('fAtivos'); if(!host||!_btF)return;
    var at=filtrosLigados();
    _btF.textContent=at.length?('Filtros ('+at.length+')'):'Filtros';
    _btF.classList.toggle('on',at.length>0);
    host.innerHTML='';
    at.forEach(function(x){
      var c=document.createElement('button');
      c.className='chip on ativo destaque'; c.style.background='var(--accentSolid,var(--accent,#0f7a57))';
      c.setAttribute('aria-label','Remover filtro '+x.rot);
      c.innerHTML=esc(x.rot)+' <span class="x" aria-hidden="true">✕</span>';
      c.onclick=function(){ if(x.k==='base')f.base=''; else f.ramo=''; build(); };
      host.appendChild(c);
    });
  }
  if(_btF){
    _btF.onclick=function(){ popFiltros(_pop.hidden); };
    /* Clique dentro da barra não conta como "clique fora". Precisa ser aqui, e não na
       comparação lá embaixo: botões daqui ("＋ N ramos") re-renderizam a lista, e o alvo
       do clique já não existe quando o documento vai perguntar se ele estava dentro. */
    var _fbar=document.querySelector('.fbar');
    if(_fbar)_fbar.addEventListener('click',function(e){ e.stopPropagation(); });
    document.addEventListener('click',function(e){
      if(!_pop||_pop.hidden)return;
      popFiltros(false);
    });
    document.addEventListener('keydown',function(e){
      if(e.key==='Escape'&&_pop&&!_pop.hidden){ popFiltros(false); try{_btF.focus();}catch(err){} }
    });
  }

  // ---- filtro
  function applyFilter(){
    var terms=norm(f.q).split(' ').filter(Boolean);
    filtered=IDX.filter(function(r){
      if(f.tribunal&&r[I.tr]!==f.tribunal)return false;
      if(f.ramo&&(r[I.ra]||'Sem ramo')!==f.ramo)return false;
      if(f.base&&r[I.fo]!==f.base)return false;
      if(f.edicao!=null&&r[I.nu]!==f.edicao)return false;
      if(terms.length){
        var hay=norm((r[I.ti]||'')+' '+(r[I.te]||'')+' '+(r[I.nu]||'')+' '+(r[I.fo]||'')+' '+(r[I.ra]||''));
        var _tm=txtDe(r); if(_tm){var t=_tm[r[I.id]]; if(t&&t.en)hay+=' '+norm(t.en);}
        if(!terms.every(function(x){return hay.indexOf(x)>=0}))return false;
      }
      return true;
    });
  }

  function stats(){
    var av=document.getElementById('avisoEdicao');
    if(av){
      if(f.edicao!=null){
        av.hidden=false;
        av.innerHTML='<div class="avEd"><span>Lendo <b>'+esc(nomeColecao(f.base))+' nº '+f.edicao+'</b> — '
          +filtered.length+' verbete(s)</span><button id="sairEdicao">Ver o acervo inteiro</button></div>';
        av.querySelector('#sairEdicao').onclick=function(){ f.base=''; build(); };
      } else { av.hidden=true; av.innerHTML=''; }
    }
    document.getElementById('sTot').textContent=IDX.length.toLocaleString('pt-BR');
    document.getElementById('sFilt').textContent=filtered.length.toLocaleString('pt-BR');
    metrica('s1Dom',Object.values(est.stat).filter(function(v){return v==='dom'}).length,
            'Dominados','marque ✓ quando dominar um verbete');
    metrica('s1Fav',Object.keys(est.fav).length,
            'Favoritos','marque ★ no que cai no seu edital');
  }

  /* D4 — métrica zerada não vira número. "0 dominados · 0 favoritos" é contabilidade do
     nada: quem nunca marcou não aprende com o zero, aprende com o gesto que falta. Com
     1 ou mais o slot volta a ser número normal. */
  function metrica(id,n,rotulo,convite){
    var host=document.getElementById(id); if(!host)return;
    if(n>0){ host.className='s1'; host.innerHTML='<b>'+n.toLocaleString('pt-BR')+'</b><span class="mlW">'+esc(rotulo)+'</span>'; }
    else { host.className='s1 convite'; host.innerHTML='<span class="cv">'+esc(convite)+'</span>'; }
  }
  function metricaHtml(n,rotulo,convite){

  function fillBody(d,r){
    var body=d.querySelector('.vbody');
    var _tm=txtDe(r);
    if(!_tm || !_tm[r[I.id]]){
      body.innerHTML='<div class="loading">Carregando textos…</div>';
      garanteTexto(r, function(){ fillBody(d,r); });
      return;
    }
    var t=_tm[r[I.id]]||{};
    var q=norm(f.q).split(' ').filter(Boolean);
    function hl(s){
      if(!q.length)return esc(s);
      var ns=norm(s);
      if(ns.length!==s.length)return esc(s);          // fallback seguro se normalizar mudou o tamanho
      var hits=[];
      q.forEach(function(w){ if(w.length<2)return; var from=0,idx; while((idx=ns.indexOf(w,from))>=0){ hits.push([idx,idx+w.length]); from=idx+w.length; } });
      if(!hits.length)return esc(s);
      hits.sort(function(a,b){return a[0]-b[0]});
      var merged=[]; hits.forEach(function(h){ var last=merged[merged.length-1]; if(last&&h[0]<=last[1]){ if(h[1]>last[1])last[1]=h[1]; } else merged.push([h[0],h[1]]); });
      var out='',pos=0;
      merged.forEach(function(m){ out+=esc(s.slice(pos,m[0]))+'<mark>'+esc(s.slice(m[0],m[1]))+'</mark>'; pos=m[1]; });
      return out+esc(s.slice(pos));
    }
    var html='';
    html+='<div class="enun">'+(t.en?hl(t.en):'<span class="loading">Sem enunciado.</span>')+'</div>';
    if(t.co)html+='<div class="block"><div class="lbl">Comentário</div><div class="txt">'+esc(t.co)+'</div></div>';
    if(t.ob)html+='<div class="block"><div class="lbl">Observação</div><div class="txt">'+esc(t.ob)+'</div></div>';

    if(t.fp)foot+='<span class="fp">'+esc(t.fp)+'</span>';

    if(t.ur && /^https?:\/\//i.test(t.ur))foot+='<a href="'+esc(t.ur)+'" target="_blank" rel="noopener">Ver no tribunal ↗</a>';
    if(foot)html+='<div class="foot">'+foot+'</div>';
    body.innerHTML=html;
  }

  // ---- textos do acervo: por BLOCO quando dados/ existe, senão o arquivo inteiro
  //
  // O corpo dos verbetes some de 9,6 MB (juris) e 8,6 MB (contas) para ~160 KB por
  // bloco: abrir um verbete baixa o bloco dele, e só. Quem faz isso é o CTDados
  // (ct-dados.js), que ainda guarda o bloco no IndexedDB — logo o segundo acesso
  // não toca a rede nem repete o JSON.parse.
  //
  // O caminho antigo continua inteiro, porque ele é necessário: no app nativo a
  // página roda em file:// e o WKWebView bloqueia fetch() de JSON local, então lá
  // o <script> monolítico é o único que funciona. CTDados.pronto() decide qual dos
  // dois vale nesta execução.
  var fatiaOk={};
  ['juris','contas'].forEach(function(k){
    var alvo=MODOS[k];
    if(!alvo.fatia || !window.CTDados) return;
    window.CTDados.pronto(alvo.fatia).then(function(tem){
      fatiaOk[alvo.fatia]=!!tem;
      if(tem){
        alvo.txt=alvo.txt||{};                 // mapa que se preenche verbete a verbete
      }
    }).catch(function(){ fatiaOk[alvo.fatia]=false; });
  });
  function porFatia(alvo){ return !!(alvo && alvo.fatia && fatiaOk[alvo.fatia]); }

  /* Garante APENAS o texto deste verbete. Guarda {} quando o acervo não tem texto
     para a chave — sem isso, quem checa "não veio ainda" repetiria o pedido em laço. */
  function garanteTexto(r, cb){
    var alvo=fonteDe(r), id=r[I.id];
    if(alvo.txt && alvo.txt[id]){ cb&&cb(); return; }
    if(porFatia(alvo)){
      alvo.txt=alvo.txt||{};
      window.CTDados.get(alvo.fatia, id).then(function(v){ alvo.txt[id]=v||{}; cb&&cb(); })
        .catch(function(){ alvo.txt[id]={}; cb&&cb(); });
      return;
    }
    loadTxt(alvo, cb);
  }

  /* Não há pré-busca por página. A fatia de cada verbete sai do HASH da chave, então
     os 40 cards de uma tela caem em ~34 blocos diferentes: "aquecer a página" baixaria
     quase o acervo inteiro e desfaria o ganho. Busca-se um bloco quando um verbete é
     realmente aberto — 160 KB em vez de 9,6 MB. */

  var txtLoading={}, txtWait={};
  function loadTxt(alvo,cb){
    if(typeof alvo==='function'){ cb=alvo; alvo=MODOS.juris; }
    alvo=alvo||MODOS.juris;
    // acervo INTEIRO — só a busca por enunciado precisa disso
    if(porFatia(alvo)){
      if(alvo.txtCompleto){ cb&&cb(); return; }
      (txtWait[alvo.fatia]=txtWait[alvo.fatia]||[]);
      if(cb)txtWait[alvo.fatia].push(cb);
      if(txtLoading[alvo.fatia])return;
      txtLoading[alvo.fatia]=true;
      window.CTDados.tudo(alvo.fatia).then(function(m){
        alvo.txt=alvo.txt||{};
        if(m)Object.keys(m).forEach(function(k){ alvo.txt[k]=m[k]; });
        alvo.txtCompleto=true; txtLoading[alvo.fatia]=false;
        document.querySelectorAll('.vcard.open').forEach(function(d){ var id=d.dataset.id; var rr=byId[id]; if(rr&&fonteDe(rr)===alvo)fillBody(d,rr); });
        (txtWait[alvo.fatia]||[]).forEach(function(fn){fn()}); txtWait[alvo.fatia]=[];
        var pd=document.getElementById('paneDia'); if(pd&&!pd.hidden)renderDia();
      }).catch(function(){ txtLoading[alvo.fatia]=false;
        (txtWait[alvo.fatia]||[]).forEach(function(fn){fn()}); txtWait[alvo.fatia]=[]; });
      return;
    }
    if(alvo.txtCompleto){cb&&cb();return;}
    (txtWait[alvo.txtSrc]=txtWait[alvo.txtSrc]||[]);
    if(cb)txtWait[alvo.txtSrc].push(cb);            // enfileira ANTES de começar (senão o 1º cb some)
    if(txtLoading[alvo.txtSrc])return;
    txtLoading[alvo.txtSrc]=true;
    var s=document.createElement('script'); s.src=alvo.txtSrc;
    s.onload=function(){ alvo.txt=window[alvo.txtGlobal]||{}; alvo.txtCompleto=true; txtLoading[alvo.txtSrc]=false;
      // preenche os corpos abertos que esperavam justamente este acervo
      document.querySelectorAll('.vcard.open').forEach(function(d){ var id=d.dataset.id; var r=byId[id]; if(r&&fonteDe(r)===alvo)fillBody(d,r); });
      (txtWait[alvo.txtSrc]||[]).forEach(function(fn){fn()}); txtWait[alvo.txtSrc]=[];
      // o julgado do dia é montado antes de o texto existir: repinta quando ele chega
      var pd=document.getElementById('paneDia'); if(pd&&!pd.hidden)renderDia();
    };
    s.onerror=function(){ txtLoading[alvo.txtSrc]=false; document.querySelectorAll('.vcard.open .vbody .loading').forEach(function(e){e.textContent='Não foi possível carregar os textos.'}); };
    document.body.appendChild(s);
  }

  var COLECOES=[
    {fo:'informativo_stf', tb:'STF', nome:'Informativos do STF'},
    {fo:'informativo_stj', tb:'STJ', nome:'Informativos do STJ'},

  // ('repercussao_geral') e rótulo por extenso nos de contas ('Boletim de Pessoal').
  // Esta tabela dá nome de gente aos slugs; o que não estiver aqui vira Título Com
  // Espaços em vez de aparecer como REPERCUSSAO_GERAL na tela.
  var ROTULO={sumula_vinculante:'Súmula Vinculante', sumula_stf:'Súmula do STF', sumula_stj:'Súmula do STJ',
    sumula_tse:'Súmula do TSE', tjro:'Súmula do TJRO', tjro_prec:'Precedente do TJRO',
    repercussao_geral:'Repercussão Geral', repetitivo:'Recurso Repetitivo', juris_em_teses:'Jurisprudência em Teses',
    informativo_stf:'Informativo do STF', informativo_stj:'Informativo do STJ', informativo_tse:'Informativo do TSE',
    precedentes_obrig:'Precedente Obrigatório', controle_const:'Controle de Constitucionalidade',
    sel_tjgo:'Seleção TJGO', sel_tjrj:'Seleção TJRJ', sel_tjpr:'Seleção TJPR', vademecum_dod:'Vade Mecum DOD',
    stf_adi:'ADI', stf_adc:'ADC', stf_ado:'ADO', stf_adpf:'ADPF'};
  function nomeColecao(fo){
    for(var i=0;i<COLECOES.length;i++)if(COLECOES[i].fo===fo)return COLECOES[i].nome;
    if(ROTULO[fo])return ROTULO[fo];
    if(!fo)return '';
    if(fo.indexOf('_')<0)return fo;                  // já vem por extenso
    return fo.split('_').map(function(w){ return w.charAt(0).toUpperCase()+w.slice(1); }).join(' ');
  }

  function edicoesDe(fonte){
    var m={};
    for(var i=0;i<IDX.length;i++){ var r=IDX[i];
      if(r[I.fo]!==fonte||!Number.isInteger(r[I.nu]))continue;
      var e=m[r[I.nu]]||(m[r[I.nu]]={n:r[I.nu],total:0,lidos:0,ano:null});
      e.total++;
      if((est.stat[r[I.id]]||'')==='dom')e.lidos++;
      var d=r[I.da]||''; var a=/(\d{4})/.exec(d); if(a&&!e.ano)e.ano=a[1];
    }
    return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.n-a.n});
  }

  // ================= JULGADO DO DIA =================
  // Sorteio com semente na data: o mesmo dia devolve sempre o mesmo verbete. Sem semente
  // o julgado trocaria a cada re-render e não daria para voltar nele à noite.
  function semente(str){ var h=2166136261; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
  function hojeISO(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }

  // Prioriza o que a prova cobra: destaque (★) primeiro, e dentro disso o que você ainda
  // não marcou como dominado. Se tudo estiver dominado, volta a sortear no acervo todo.
  function verbeteDoDia(iso){
    var pool=IDX.filter(function(r){ return r[I.im]===1 && (est.stat[r[I.id]]||'')!=='dom'; });
    if(!pool.length)pool=IDX.filter(function(r){ return r[I.im]===1; });
    if(!pool.length)pool=IDX;
    if(!pool.length)return null;
    return pool[semente(iso)%pool.length];
  }
