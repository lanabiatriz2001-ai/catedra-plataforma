<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cátedra · Módulo da área</title><link rel="stylesheet" href="catedra-ui.css"><link rel="stylesheet" href="satellite-base.css"><style>
/* Cor do módulo (módulo da área). Dentro do app segue o tema escolhido nos Ajustes; aberta
   avulsa, a página mantém a cor com que nasceu. Ver satellite-base.css. */
:root{--module-accent:var(--accent,#0f7a57)}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg,#f4f1ea);color:var(--ink,#1f1c17);font-family:var(--body,'Inter',system-ui,sans-serif);font-size:13px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:20px 26px 70px}

/* D10 — foco visível: a bolinha de status e a ★ eram alcançáveis pelo teclado mas
   não mostravam onde o foco estava. */
:where(a,button,select,input,textarea,summary,[tabindex]):focus-visible{
  outline:2px solid var(--accent,#0f7a57);outline-offset:2px}

/* D7 — nível FRACO de rótulo (metadado: contagens e legendas de número). O nível forte
   não entra aqui: quem estrutura a leitura desta tela são os títulos de grupo, que já
   são títulos de verdade — transformá-los em mono-caps seria redesenho, não hierarquia. */
.rot-fraco{font:700 10px/1.3 var(--body,'Inter',system-ui,sans-serif);letter-spacing:0;
  text-transform:uppercase;color:var(--text2,#5c564a)}
.head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.head .ic{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--accentSolid,var(--accent,#0f7a57)),var(--accentSolidD,var(--accentD,#0b5e43)));display:flex;align-items:center;justify-content:center;color:var(--onAccent,#fff);font-size:23px;flex:none}
.head h1{font-family:var(--display,'Spectral',Georgia,serif);font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1}
.head p{font-size:12px;color:var(--text2,#5c564a);margin-top:3px}
.search{position:relative;margin-bottom:16px}
.search input{width:100%;border:1.5px solid var(--border,#e6e1d4);background:var(--surface,#fffdf8);border-radius:12px;padding:12px 14px 12px 40px;font-size:var(--fs-sm,14px);min-height:var(--control-h,38px);color:var(--ink);outline:none;font-family:inherit}
.search input:focus{border-color:var(--accent,#0f7a57)}
.search .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3,#94a3b8)}
.statbar{display:flex;gap:20px;flex-wrap:wrap;background:var(--surface,#fffdf8);border:1px solid var(--border,#e6e1d4);border-radius:12px;padding:13px 18px;margin-bottom:16px}
.statbar .st1{display:flex;flex-direction:column}
.statbar .st1 b{font-family:var(--display,'Spectral',Georgia,serif);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.statbar .st1 span{margin-top:3px}
.grp{margin-bottom:18px}
.grph{display:flex;align-items:center;gap:9px;margin:0 2px 9px}
.grph .dot{width:10px;height:10px;border-radius:3px;flex:none}
.grph b{font-family:var(--display,'Spectral',Georgia,serif);font-size:16px;font-weight:700}
.grph .bar{flex:1;height:6px;border-radius:99px;background:var(--surface2,#efeadd);overflow:hidden;min-width:60px;margin-left:6px}
.grph .bar i{display:block;height:100%;width:100%;border-radius:99px;
  transform:translateX(-100%);transform-origin:left center;transition:transform .3s;will-change:transform}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface,#fffdf8);border:1px solid var(--border,#e6e1d4);border-radius:11px;margin-bottom:7px;border-color:color-mix(in srgb,var(--lc,#0f7a57) 38%,var(--border,#e6e1d4));background-image:linear-gradient(90deg,color-mix(in srgb,var(--lc,#0f7a57) 18%,transparent),transparent 46%)}
.row.hide{display:none}
.row .lt{flex:1;min-width:0}
.row .lt b{font-size:13.5px;font-weight:700;color:var(--ink);display:block;line-height:1.25}
.row .lt small{font-size:11px;color:var(--text2,#5c564a);display:block;margin-top:2px;line-height:1.4}
.row .st{flex:none;width:22px;height:22px;border-radius:99px;border:2px solid var(--border,#e6e1d4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;background:transparent;color:inherit}
.row .st.estudando{border-color:#eab308;background:#eab30822;color:#a16207}
.row .st.dominado{border-color:#16a34a;background:#16a34a;color:#fff}
.row .fav{flex:none;cursor:pointer;font-size:16px;color:var(--text3,#c9c2b2);background:none;border:none}
.row .fav.on{color:#eab308}
.row .rg{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--onAccent,#fff);background:var(--accentSolid,var(--accent,#0f7a57));border:none;border-radius:9px;padding:7px 12px;cursor:pointer;font-family:inherit}
.row .rg:hover{background:var(--accentSolidD,var(--accentD,#0b5e43))}
.vazio{padding:40px 20px;text-align:center;color:var(--text2,#5c564a);font-size:13px;line-height:1.6}
.legenda{font-size:11.5px;color:var(--text2,#5c564a);margin:0 2px 14px;line-height:1.55}

/* D8 — no celular, alvo de toque de 44px. A bolinha de status tinha 22px e a ★ nem
   isso: marcar um tópico dominado no telefone era loteria. A área cresce por baixo
   (::after) para o desenho continuar do mesmo tamanho. */
@media (max-width:640px){
  .wrap{padding:16px 12px 60px}
  .row{gap:8px;padding:10px 11px}
  .row .st{position:relative}
  .row .st::after{content:'';position:absolute;left:50%;top:50%;width:44px;height:44px;
    transform:translate(-50%,-50%)}
  .row .fav{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
  .row .rg{position:relative;z-index:1;min-height:44px;padding:8px 13px}
  .search input{min-height:44px}
}
/* ===== D8(b) — o mesmo alvo de 44px CHEGA AO IPAD (ver juris-web.html) ================
   A bolinha de status NÃO cresce: quem dá os 44 é o ::after, como já fazia por largura. */
@media (pointer:coarse){
  .row .st{position:relative}
  .row .st::after{content:'';position:absolute;left:50%;top:50%;width:44px;height:44px;
    transform:translate(-50%,-50%)}
  .row .fav{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
  .row .rg{position:relative;z-index:1;min-height:44px;padding:8px 13px}
  .search input{min-height:44px}
}
</style><script src="./tema-satelite.js"></script>
</head>
<body><div class="wrap">
<div class="head"><div class="ic" id="ic"><svg class="ct-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-ico="library"><path d="m16 6 4 14"></path><path d="M12 6v14"></path><path d="M8 8v12"></path><path d="M4 4v16"></path></svg></div><div><h1 id="tt">Módulo da área</h1><p id="sb"></p></div></div>
<div class="legenda" id="lg"></div>
<div class="search"><span class="mag"><svg class="ct-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-ico="search"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></span><input id="q" aria-label="Buscar no módulo da área" placeholder="Buscar…" autocomplete="off"></div>
<div class="statbar"><div class="st1"><b id="sd">0</b><span class="rot-fraco">Dominados</span></div><div class="st1"><b id="se">0</b><span class="rot-fraco">Estudando</span></div><div class="st1"><b id="sf">0</b><span class="rot-fraco">Favoritos</span></div><div class="st1" style="margin-left:auto"><b id="stt">0</b><span class="rot-fraco">Itens no módulo</span></div></div>
<div id="lista"></div>
</div>
<script src="area-modulos.js"></script>
<script>
/* Ícone Lucide por NOME (cópia pequena do padrão do host — não há módulo compartilhado entre
   os satélites): SVG 16 px, traço currentColor, aria-hidden e data-ico com o nome. Emoji não é
   ícone (DESIGN.md). Só os desenhos que esta página usa; nome desconhecido sai vazio, sem glifo. */
var CT_ICO={'stethoscope':'<path d="M11 2v2"></path><path d="M5 2v2"></path><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"></path><path d="M8 15a6 6 0 0 0 12 0v-3"></path><circle cx="20" cy="10" r="2"></circle>',
  'handshake':'<path d="m11 17 2 2a1 1 0 1 0 3-3"></path><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"></path><path d="m21 3 1 11h-2"></path><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"></path><path d="M3 4h8"></path>',
  'landmark':'<path d="M10 18v-7"></path><path d="M11.12 2.198a2 2 0 0 1 1.76.006l7.866 3.847c.476.233.31.949-.22.949H3.474c-.53 0-.695-.716-.22-.949z"></path><path d="M14 18v-7"></path><path d="M18 18v-7"></path><path d="M3 22h18"></path><path d="M6 18v-7"></path>',
  'scale':'<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="M7 21h10"></path><path d="M12 3v18"></path><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"></path>',
  'siren':'<path d="M7 18v-6a5 5 0 1 1 10 0v6"></path><path d="M5 21a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z"></path><path d="M21 12h1"></path><path d="M18.5 4.5 18 5"></path><path d="M2 12h1"></path><path d="M12 2v1"></path><path d="m4.929 4.929.707.707"></path><path d="M12 12v6"></path>',
  'chart-column':'<path d="M3 3v16a2 2 0 0 0 2 2h16"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path>',
  'building-2':'<path d="M10 12h4"></path><path d="M10 8h4"></path><path d="M14 21v-3a2 2 0 0 0-4 0v3"></path><path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"></path><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"></path>',
  'graduation-cap':'<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path>',
  'laptop':'<path d="M18 5a2 2 0 0 1 2 2v8.526a2 2 0 0 0 .212.897l1.068 2.127a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45l1.068-2.127A2 2 0 0 0 4 15.526V7a2 2 0 0 1 2-2z"></path><path d="M20.054 15.987H3.946"></path>',
  'medal':'<path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15"></path><path d="M11 12 5.12 2.2"></path><path d="m13 12 5.88-9.8"></path><path d="M8 7h8"></path><circle cx="12" cy="17" r="5"></circle><path d="M12 18v-2h-.5"></path>',
  'library':'<path d="m16 6 4 14"></path><path d="M12 6v14"></path><path d="M8 8v12"></path><path d="M4 4v16"></path>'};
function ctIco(nome){ return '<svg class="ct-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-ico="'+nome+'">'+(CT_ICO[nome]||'')+'</svg>'; }
// ============ Módulo de estudo da ÁREA ============
// Mesmo padrão do CátedraLEGIS (status em 3 estados, favorito, busca, barra de
// progresso), aplicado ao conteúdo próprio de cada carreira: o corpo humano em
// saúde, o SUAS em assistência social, os tributos em fiscal, e assim por diante.
// O app manda ?area=<id>; sem área conhecida a tela explica em vez de ficar vazia.
(function(){
  var AREA=''; try{ AREA=new URLSearchParams(location.search).get('area')||''; }catch(e){}
  var M=(window.CT_MODULOS||{})[AREA];
  var KEY='catedra:areaModulo:v1';
  var est={fav:{},stat:{}}; try{ est=Object.assign({fav:{},stat:{}},JSON.parse(localStorage.getItem(KEY))||{}); }catch(e){}
  var save=function(){ try{ localStorage.setItem(KEY,JSON.stringify(est)); }catch(e){} };
  var STAT=['','estudando','dominado'], ICON={'':'','estudando':'◐','dominado':'✓'};
  // Estrela do favorito: SVG Lucide inline (abre sem rede); cheia quando marcada. Usada no render e no clique.
  var STAR=function(on){ return '<svg viewBox="0 0 24 24" width="16" height="16" fill="'+(on?'currentColor':'none')+'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-.15em;flex:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'; };
  var el=function(t,c,h){ var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
  var esc=function(s){ return (s||'').replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];}); };
  var att=function(s){ return esc(s).replace(/"/g,'&quot;'); };
  // D10 — o botão de status é só ícone (e no estado "não estudado" não tem NEM ícone):
  // sem nome acessível o leitor de tela anunciava "botão" e a pessoa não sabia o que era.
  var NOME={'':'não estudado','estudando':'estudando','dominado':'dominado'};
  var rotStat=function(t,st){ return 'Progresso de '+t+': '+NOME[st]+'. Ativar para avançar o estado.'; };
  // id ESTÁVEL por texto (não por índice): acrescentar item ao módulo não pode
  // renumerar o que a pessoa já marcou como dominado.
  var slug=function(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); };

  if(!M){
    document.getElementById('lista').appendChild(el('div','vazio',
      'Esta área ainda não tem um módulo próprio.<br>Escolha sua área de estudo em <b>Ajustes</b> — cada uma abre aqui com o conteúdo específico da carreira.'));
    document.getElementById('sb').textContent='nenhuma área selecionada';
    return;
  }

  document.getElementById('ic').innerHTML=ctIco(CT_ICO[M.icone]?M.icone:'library');
  document.getElementById('tt').textContent=M.nome;
  document.getElementById('sb').textContent=M.sub||'';
  document.getElementById('lg').innerHTML=M.legenda||'';
  document.getElementById('q').placeholder='Buscar em '+M.nome+'…';

  var total=0;
  M.grupos.forEach(function(g){ total+=g.itens.length; });
  document.getElementById('stt').textContent=total;

  var raiz=document.getElementById('lista');
  M.grupos.forEach(function(g){
    var gs=slug(g.n);
    var box=el('div','grp');
    var head=el('div','grph','<span class="dot" style="background:'+g.c+'"></span><b>'+esc(g.n)+'</b><span class="rot-fraco">'+g.itens.length+' itens</span><span class="bar"><i data-bar="'+gs+'" style="background:'+g.c+';width:0%"></i></span>');
    box.appendChild(head);
    g.itens.forEach(function(it){
      var id=AREA+'|'+gs+'|'+slug(it.t);
      var r=el('div','row'); r.style.setProperty('--lc',g.c);
      r.dataset.s=(it.t+' '+(it.d||'')).toLowerCase(); r.dataset.g=gs;
      var st=est.stat[id]||'', fav=est.fav[id];
      r.innerHTML='<button class="st '+st+'" aria-label="'+att(rotStat(it.t,st))+'"'
        +' title="não estudado → estudando → dominado">'+ICON[st]+'</button>'
        +'<div class="lt"><b>'+esc(it.t)+'</b>'+(it.d?('<small>'+esc(it.d)+'</small>'):'')+'</div>'
        +'<button class="fav'+(fav?' on':'')+'" aria-pressed="'+(fav?'true':'false')
        +'" aria-label="Favoritar '+att(it.t)+'" title="Favoritar">'+STAR(!!fav)+'</button>'
        +'<button class="rg" title="Abrir o registro de sessão com este tópico"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-.15em;flex:none"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>Registrar</button>';
      r.querySelector('.st').onclick=function(){
        var cur=STAT.indexOf(est.stat[id]||''), nx=STAT[(cur+1)%3];
        if(nx) est.stat[id]=nx; else delete est.stat[id];
        save(); var b=r.querySelector('.st'); b.className='st '+nx; b.textContent=ICON[nx];
        b.setAttribute('aria-label', rotStat(it.t,nx)); stats();
      };
      r.querySelector('.fav').onclick=function(){
        if(est.fav[id]) delete est.fav[id]; else est.fav[id]=1;
        save(); var b=r.querySelector('.fav'); b.classList.toggle('on',!!est.fav[id]); b.innerHTML=STAR(!!est.fav[id]);
        b.setAttribute('aria-pressed', est.fav[id]?'true':'false'); stats();
      };
      // ABRE o registro de sessão preenchido — nunca grava sozinho (regra da casa).
      r.querySelector('.rg').onclick=function(){
        try{ window.ctEnviarAoHost({type:'ctRegistrarArea', disc:M.disc||M.nome, topico:g.n, sub:it.t}); }catch(e){}
      };
      box.appendChild(r);
    });
    raiz.appendChild(box);
  });

  function stats(){
    var d=0,e=0,f=0, porG={};
    M.grupos.forEach(function(g){ porG[slug(g.n)]={d:0,t:g.itens.length}; });
    Object.keys(est.stat).forEach(function(k){
      if(k.indexOf(AREA+'|')!==0) return;
      var g=k.split('|')[1];
      if(est.stat[k]==='dominado'){ d++; if(porG[g]) porG[g].d++; }
      else if(est.stat[k]==='estudando') e++;
    });
    Object.keys(est.fav).forEach(function(k){ if(k.indexOf(AREA+'|')===0) f++; });
    document.getElementById('sd').textContent=d;
    document.getElementById('se').textContent=e;
    document.getElementById('sf').textContent=f;
    Object.keys(porG).forEach(function(g){
      var bar=document.querySelector('[data-bar="'+g+'"]');
      if(bar) bar.style.transform='translateX('+((porG[g].t?Math.round(porG[g].d/porG[g].t*100):0)-100)+'%)';
    });
  }
  stats();

  var q=document.getElementById('q');
  q.addEventListener('input',function(){
    var t=q.value.trim().toLowerCase();
    document.querySelectorAll('.row').forEach(function(r){ r.classList.toggle('hide', t && r.dataset.s.indexOf(t)<0); });
    document.querySelectorAll('.grp').forEach(function(g){
      var vis=g.querySelectorAll('.row:not(.hide)').length;
      g.style.display = vis? '' : 'none';
    });
  });
})();
</script></body></html>
