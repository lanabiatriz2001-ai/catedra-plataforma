<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cátedra · Módulo da área</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg,#f4f1ea);color:var(--ink,#1f1c17);font-family:var(--body,-apple-system,'Segoe UI',Roboto,sans-serif);font-size:13px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:20px 26px 70px}
.head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.head .ic{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--accent,#0f7a57),var(--accentD,#0b5e43));display:flex;align-items:center;justify-content:center;color:#fff;font-size:23px;flex:none}
.head h1{font-family:var(--display,'Spectral',Georgia,serif);font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1}
.head p{font-size:12px;color:var(--text3,#7a7368);margin-top:3px}
.search{position:relative;margin-bottom:16px}
.search input{width:100%;border:1.5px solid var(--border,#e6e1d4);background:var(--surface,#fffdf8);border-radius:12px;padding:12px 14px 12px 40px;font-size:14px;color:var(--ink);outline:none;font-family:inherit}
.search input:focus{border-color:var(--accent,#0f7a57)}
.search .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3,#94a3b8)}
.statbar{display:flex;gap:20px;flex-wrap:wrap;background:var(--surface,#fffdf8);border:1px solid var(--border,#e6e1d4);border-radius:12px;padding:13px 18px;margin-bottom:16px}
.statbar .st1{display:flex;flex-direction:column}
.statbar .st1 b{font-family:var(--display,'Spectral',Georgia,serif);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.statbar .st1 span{font-size:10.5px;color:var(--text3,#7a7368);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.grp{margin-bottom:18px}
.grph{display:flex;align-items:center;gap:9px;margin:0 2px 9px}
.grph .dot{width:10px;height:10px;border-radius:3px;flex:none}
.grph b{font-family:var(--display,'Spectral',Georgia,serif);font-size:16px;font-weight:700}
.grph span{font-size:11px;color:var(--text3,#7a7368);font-weight:600}
.grph .bar{flex:1;height:6px;border-radius:99px;background:var(--surface2,#efeadd);overflow:hidden;min-width:60px;margin-left:6px}
.grph .bar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface,#fffdf8);border:1px solid var(--border,#e6e1d4);border-radius:11px;margin-bottom:7px;border-left:4px solid var(--lc,#0f7a57)}
.row.hide{display:none}
.row .lt{flex:1;min-width:0}
.row .lt b{font-size:13.5px;font-weight:700;color:var(--ink);display:block;line-height:1.25}
.row .lt small{font-size:11px;color:var(--text3,#7a7368);display:block;margin-top:2px;line-height:1.4}
.row .st{flex:none;width:22px;height:22px;border-radius:99px;border:2px solid var(--border,#e6e1d4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;background:transparent;color:inherit}
.row .st.estudando{border-color:#eab308;background:#eab30822;color:#a16207}
.row .st.dominado{border-color:#16a34a;background:#16a34a;color:#fff}
.row .fav{flex:none;cursor:pointer;font-size:16px;color:var(--text3,#c9c2b2);background:none;border:none}
.row .fav.on{color:#eab308}
.row .rg{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:#fff;background:var(--accent,#0f7a57);border:none;border-radius:9px;padding:7px 12px;cursor:pointer;font-family:inherit}
.row .rg:hover{filter:brightness(.94)}
.vazio{padding:40px 20px;text-align:center;color:var(--text3,#7a7368);font-size:13px;line-height:1.6}
.legenda{font-size:11.5px;color:var(--text3,#7a7368);margin:0 2px 14px;line-height:1.55}
</style><script>(function(){var V=['--bg','--surface','--surface2','--border','--ink','--text2','--text3','--accent','--accentD','--accentSoft','--accentRing','--onAccent','--radius','--display','--body','--mono'];function apply(t){var r=document.documentElement;V.forEach(function(v){if(t[v]&&t[v].trim())r.style.setProperty(v,t[v].trim());});}try{var pw=window.parent;if(pw&&pw!==window){var host=pw.document.querySelector('[style*="--accent"]');if(host){var cs=pw.getComputedStyle(host);var t={};V.forEach(function(v){t[v]=cs.getPropertyValue(v);});apply(t);}}}catch(e){}window.addEventListener('message',function(e){if(e.data&&e.data.type==='ctTheme'&&e.data.tokens)apply(e.data.tokens);});})();</script><script src="./tema-satelite.js"></script>
</head>
<body><div class="wrap">
<div class="head"><div class="ic" id="ic">📚</div><div><h1 id="tt">Módulo da área</h1><p id="sb"></p></div></div>
<div class="legenda" id="lg"></div>
<div class="search"><span class="mag">🔎</span><input id="q" placeholder="Buscar…" autocomplete="off"></div>
<div class="statbar"><div class="st1"><b id="sd">0</b><span>Dominados</span></div><div class="st1"><b id="se">0</b><span>Estudando</span></div><div class="st1"><b id="sf">0</b><span>Favoritos</span></div><div class="st1" style="margin-left:auto"><b id="stt">0</b><span>Itens no módulo</span></div></div>
<div id="lista"></div>
</div>
<script src="area-modulos.js"></script>
<script>
// ============ Módulo de estudo da ÁREA ============
// Mesmo padrão do CátedraLEGIS (status em 3 estados, favorito, busca, barra de
// progresso), aplicado ao conteúdo próprio de cada carreira: o corpo humano em
// saúde, o SUAS em assistência social, os tributos em fiscal, e assim por diante.
// O app manda ?area=<id>; sem área conhecida a tela explica em vez de ficar vazia.
(function(){
  var AREA=''; try{ AREA=new URLSearchParams(location.search).get('area')||''; }catch(e){}
  var M=(window.CT_MODULOS||{})[AREA];
  var KEY='catedra:areaModulo:v1';
  var est={fav:{},stat:{}}; try{ est=Object.assign({fav:{},stat:{}},JSON.parse(localStorage.getItem(KEY))||{}); }catch(e){}
  var save=function(){ try{ localStorage.setItem(KEY,JSON.stringify(est)); }catch(e){} };
  var STAT=['','estudando','dominado'], ICON={'':'','estudando':'◐','dominado':'✓'};
  var el=function(t,c,h){ var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
  var esc=function(s){ return (s||'').replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];}); };
  // id ESTÁVEL por texto (não por índice): acrescentar item ao módulo não pode
  // renumerar o que a pessoa já marcou como dominado.
  var slug=function(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); };

  if(!M){
    document.getElementById('lista').appendChild(el('div','vazio',
      'Esta área ainda não tem um módulo próprio.<br>Escolha sua área de estudo em <b>Ajustes</b> — cada uma abre aqui com o conteúdo específico da carreira.'));
    document.getElementById('sb').textContent='nenhuma área selecionada';
    return;
  }

  document.getElementById('ic').textContent=M.icone||'📚';
  document.getElementById('tt').textContent=M.nome;
  document.getElementById('sb').textContent=M.sub||'';
  document.getElementById('lg').innerHTML=M.legenda||'';
  document.getElementById('q').placeholder='Buscar em '+M.nome+'…';

  var total=0;
  M.grupos.forEach(function(g){ total+=g.itens.length; });
  document.getElementById('stt').textContent=total;

  var raiz=document.getElementById('lista');
  M.grupos.forEach(function(g){
    var gs=slug(g.n);
    var box=el('div','grp');
    var head=el('div','grph','<span class="dot" style="background:'+g.c+'"></span><b>'+esc(g.n)+'</b><span>'+g.itens.length+' itens</span><span class="bar"><i data-bar="'+gs+'" style="background:'+g.c+';width:0%"></i></span>');
    box.appendChild(head);
    g.itens.forEach(function(it){
      var id=AREA+'|'+gs+'|'+slug(it.t);
      var r=el('div','row'); r.style.setProperty('--lc',g.c);
      r.dataset.s=(it.t+' '+(it.d||'')).toLowerCase(); r.dataset.g=gs;
      var st=est.stat[id]||'', fav=est.fav[id];
      r.innerHTML='<button class="st '+st+'" title="não estudado → estudando → dominado">'+ICON[st]+'</button>'
        +'<div class="lt"><b>'+esc(it.t)+'</b>'+(it.d?('<small>'+esc(it.d)+'</small>'):'')+'</div>'
        +'<button class="fav'+(fav?' on':'')+'" title="Favoritar">'+(fav?'★':'☆')+'</button>'
        +'<button class="rg" title="Abrir o registro de sessão com este tópico">✎ Registrar</button>';
      r.querySelector('.st').onclick=function(){
        var cur=STAT.indexOf(est.stat[id]||''), nx=STAT[(cur+1)%3];
        if(nx) est.stat[id]=nx; else delete est.stat[id];
        save(); var b=r.querySelector('.st'); b.className='st '+nx; b.textContent=ICON[nx]; stats();
      };
      r.querySelector('.fav').onclick=function(){
        if(est.fav[id]) delete est.fav[id]; else est.fav[id]=1;
        save(); var b=r.querySelector('.fav'); b.classList.toggle('on',!!est.fav[id]); b.textContent=est.fav[id]?'★':'☆'; stats();
      };
      // ABRE o registro de sessão preenchido — nunca grava sozinho (regra da casa).
      r.querySelector('.rg').onclick=function(){
        try{ window.parent.postMessage({type:'ctRegistrarArea', disc:M.disc||M.nome, topico:g.n, sub:it.t}, '*'); }catch(e){}
      };
      box.appendChild(r);
    });
    raiz.appendChild(box);
  });

  function stats(){
    var d=0,e=0,f=0, porG={};
    M.grupos.forEach(function(g){ porG[slug(g.n)]={d:0,t:g.itens.length}; });
    Object.keys(est.stat).forEach(function(k){
      if(k.indexOf(AREA+'|')!==0) return;
      var g=k.split('|')[1];
      if(est.stat[k]==='dominado'){ d++; if(porG[g]) porG[g].d++; }
      else if(est.stat[k]==='estudando') e++;
    });
    Object.keys(est.fav).forEach(function(k){ if(k.indexOf(AREA+'|')===0) f++; });
    document.getElementById('sd').textContent=d;
    document.getElementById('se').textContent=e;
    document.getElementById('sf').textContent=f;
    Object.keys(porG).forEach(function(g){
      var bar=document.querySelector('[data-bar="'+g+'"]');
      if(bar) bar.style.width=(porG[g].t?Math.round(porG[g].d/porG[g].t*100):0)+'%';
    });
  }
  stats();

  var q=document.getElementById('q');
  q.addEventListener('input',function(){
    var t=q.value.trim().toLowerCase();
    document.querySelectorAll('.row').forEach(function(r){ r.classList.toggle('hide', t && r.dataset.s.indexOf(t)<0); });
    document.querySelectorAll('.grp').forEach(function(g){
      var vis=g.querySelectorAll('.row:not(.hide)').length;
      g.style.display = vis? '' : 'none';
    });
  });
})();
</script></body></html>
