# Testes a cada push: o build precisa compilar e a suíte de navegador precisa passar.
name: Testes
on:
  push:
    branches: [main]
  pull_request:
    # Os três primeiros tipos são o padrão do GitHub para `pull_request:` sem `types` — todo
    # PR normal continua rodando a suíte como antes (ao abrir, a cada push, ao reabrir).
    # ready_for_review entra por causa do PR do sentinela: ele é aberto e atualizado pelo
    # GITHUB_TOKEN, e evento do GITHUB_TOKEN não dispara workflow. Quem marca o rascunho como
    # pronto é a dona — esse evento é dela, então a suíte roda no commit que vai entrar.
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dependências
        run: npm ci --no-audit --no-fund
      - name: Nenhuma chave de API no repositório
        run: node scripts/verificar-segredos.mjs
      - name: Dívida visual do LEGIS/JURIS nativos só desce
        run: node scripts/verificar-design-nativo.mjs
      - name: Build da plataforma
        run: node scripts/build.mjs
      - name: Ciclo integrado com início e registro
        run: |
          node tests/ciclo-plataforma.mjs
          node tests/ciclo-registro-layout.mjs
          node tests/inicio-visual.mjs
          node tests/design-plataforma.mjs
          node tests/ciclo-sessao-intencional.mjs
          node tests/inicio-enxuto.mjs
          node tests/fluxo-telas.mjs
          node tests/menu-fases.mjs
          node tests/modo-oab.mjs
          node tests/oab-interface.mjs
          node tests/remover-edital.mjs
          node tests/oral-conversa.mjs
          node tests/oral-sala.mjs
        env:
          CT_CHROME: /usr/bin/google-chrome
      - name: Estúdio de Materiais (PDF.js, estudo ativo e conferência)
        run: node tests/estudio-materiais.mjs
        env:
          CT_CHROME: /usr/bin/google-chrome
      - name: Testes de navegador (sync + acervo ida-e-volta)
        run: npm test
        env:
          CT_CHROME: /usr/bin/google-chrome
  # WebKit é o motor do Safari e do WKWebView do iPad: lá a aba Lei seca da Prova oral abria
  # sem lista de leis, e a suíte em Chromium não via. Job separado para o `testes` seguir
  # como está — e para a falha dizer, já no nome, de que motor veio. O runner é enxuto
  # (tests/run-webkit.mjs): só o que precisa do motor da Apple, em http:// e em file://.
  webkit:
    name: Testes WebKit (Safari)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dependências
        run: npm ci --no-audit --no-fund
      - name: Build da plataforma
        run: node scripts/build.mjs
      - name: WebKit do Playwright (com as bibliotecas de sistema)
        run: npx playwright-core install --with-deps webkit
      - name: Ciclo integrado e retomada no WebKit
        run: |
          node tests/ciclo-plataforma.mjs
          node tests/ciclo-registro-layout.mjs
          node tests/inicio-visual.mjs
          node tests/design-plataforma.mjs
          node tests/ciclo-retomada.mjs
          node tests/ciclo-sessao-intencional.mjs
          node tests/inicio-enxuto.mjs
          node tests/fluxo-telas.mjs
          node tests/menu-fases.mjs
          node tests/modo-oab.mjs
          node tests/oab-interface.mjs
          node tests/remover-edital.mjs
          node tests/oral-conversa.mjs
          node tests/oral-sala.mjs
        env:
          CT_BROWSER: webkit
      - name: Prova oral → Lei seca em WebKit (http e file://)
        run: npm run test:webkit
