<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cátedra — sem conexão</title>
<style>
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
       background:#f4f1ea;color:#1f1c17;font-family:'Segoe UI',system-ui,sans-serif;}
  .box{text-align:center;max-width:420px;padding:32px;}
  .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 18px;
        background:linear-gradient(135deg,#0f7a57,#0b5e43);display:flex;align-items:center;
        justify-content:center;color:#fff;font-size:34px;font-weight:700;font-family:Georgia,serif;}
  h1{font-size:22px;margin:0 0 8px;}
  p{font-size:14px;color:#5c564a;line-height:1.6;margin:0 0 22px;}
  button{background:#0f7a57;color:#fff;border:none;border-radius:10px;padding:12px 26px;
         font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
  button:hover{background:#0b5e43;}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">C</div>
    <h1>Sem conexão com a internet</h1>
    <p>O Cátedra precisa de internet para carregar seus estudos e sincronizar seu progresso. Verifique a rede e tente de novo.</p>
    <button onclick="location.href='https://catedra-plataforma.vercel.app'">Tentar de novo</button>
  </div>
</body>
</html>
