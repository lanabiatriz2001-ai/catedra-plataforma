<!doctype html>
<meta charset="utf-8">
<title>Fixture — portão sem o modo local</title>
<!--
  Carrega o auth.js DE VERDADE com um Supabase falso, e põe um app atrás do gate.

  Por que um fixture em vez de testar na página real: o gate só aparece na build de
  produção (o Catedra.dc.html não injeta o auth.js), e ele depende de uma sessão do
  Supabase. Aqui a dependência é substituída por um cliente falso que devolve "sem
  sessão", que é o estado em que o gate precisa isolar o app.
-->
<body style="margin:0">
  <!-- o app que o gate tem de proteger: precisa ficar inerte e fora do leitor de tela -->
  <div id="app" style="height:4000px;padding:24px;font:16px system-ui;">
    <h1>Aplicação protegida</h1>
    <button id="botao-do-app">botão do app</button>
    <a href="#x" id="link-do-app">link do app</a>
    <input id="campo-do-app">
    <div style="height:3600px"></div>
    <p id="fim-do-app">fim do app</p>
  </div>

<script>
  // ---- Supabase falso: sem sessão, e com os métodos que o auth.js toca ----
  window.__ctAuthEventos = [];
  window.CATEDRA_SUPABASE = { url: 'https://exemplo.invalido', key: 'chave-de-teste' };
  window.supabase = {
    createClient: function () {
      return {
        auth: {
          getSession: function () { return Promise.resolve({ data: { session: null }, error: null }); },
          onAuthStateChange: function (cb) { window.__ctAuthCb = cb; return { data: { subscription: { unsubscribe: function () {} } } }; },
          signInWithPassword: function (a) {
            window.__ctAuthEventos.push(['signInWithPassword', a]);
            var modo = sessionStorage.getItem('__fixLogin') || 'rede';
            // 'rede': o servidor de contas fora do ar (projeto pausado) — o WebKit diz "Load failed"
            if (modo === 'rede') return Promise.resolve({ data: {}, error: { name: 'AuthRetryableFetchError', message: 'Load failed' } });
            return Promise.resolve({ data: { session: { user: { id: 'u-real', email: 'eu@exemplo.com' } } }, error: null });
          },
          signUp: function (a) { window.__ctAuthEventos.push(['signUp', a]); return Promise.resolve({ data: {}, error: { message: 'fixture' } }); },
          signInWithOtp: function (a) { window.__ctAuthEventos.push(['signInWithOtp', a]); return Promise.resolve({ data: {}, error: null }); },
          signInWithOAuth: function (a) { window.__ctAuthEventos.push(['signInWithOAuth', a]); return Promise.resolve({ data: {}, error: null }); },
          signOut: function () { return Promise.resolve({ error: null }); },
          getUser: function () { return Promise.resolve({ data: { user: null }, error: null }); }
        },
        // preguiçoso como o postgrest-js: nada "sai" antes do then() (ver auth-ipad-fixture.html)
        // '__fixNuvem' (sessionStorage): a linha de user_data que a leitura devolve — a conta
        // já tem dados na nuvem. Sem ela, a conta não tem linha. Escritas só se registram.
        from: function () {
          var op = 'select';
          var q = { select: enc0, eq: enc0, maybeSingle: enc0, single: enc0,
            upsert: escreve('upsert'), insert: escreve('insert'), update: escreve('update'), delete: escreve('delete'),
            then: function (ok, er) {
              var nuvem = sessionStorage.getItem('__fixNuvem');
              var res = (op === 'select' && nuvem) ? { data: JSON.parse(nuvem), error: null } : { data: null, error: null };
              return Promise.resolve(res).then(ok, er);
            },
            catch: function (er) { return q.then(null, er); } };
          function enc0() { return q; }
          function escreve(nome) { return function (a) { op = nome; window.__ctAuthEventos.push([nome, a]); return q; }; }
          return q;
        },
        rpc: function () { return Promise.resolve({ data: null, error: null }); },
        channel: function () { return { on: function () { return this; }, subscribe: function () { return this; } }; },
        removeChannel: function () {}
      };
    }
  };
</script>
<script src="../auth.js"></script>
</body>
