<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PNMA — Lei 6.938/1981">
<meta name="theme-color" content="#f4efe4">
<title>PNMA — Lei 6.938/1981</title>
<style>
:root{
--paper:#fffdf8;--desk:#f4efe4;--sunk:#f2ece0;--line:#e7e0d1;--line2:#d5cbb6;--line3:#b8ab90;
--ink:#221f19;--ink2:#5a5346;--ink3:#8d8573;
--serif:ui-serif,"New York","Iowan Old Style",Palatino,Georgia,serif;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
--sh:0 1px 2px rgba(60,50,30,.05),0 10px 30px rgba(60,50,30,.08);
--ex-bg:#fbf1dc;--ex-tx:#63410d;--ex-ln:#c9992f;
--up-bg:#fbeae6;--up-tx:#832d1c;--up-ln:#c25a42;
--cr-bg:#efeaf8;--cr-tx:#493780;--cr-ln:#8874c4;
--g0:#7f7052;--g0b:#f1ebdb;--g1:#20618f;--g1b:#e5eff8;--g2:#5d4192;--g2b:#ece7f7;--g3:#2f6b3c;--g3b:#e6f1e8;
--mk:#fbe7a0;--mkt:#4a3406;
--ac:var(--g0);--acb:var(--g0b);
--acc-bg:var(--g1b);--acc-tx:var(--g1);--pro-bg:var(--g2b);--pro-tx:var(--g2);
--suc-bg:var(--g3b);--suc-tx:var(--g3);--dan-bg:var(--up-bg);--dan-tx:var(--up-tx);
--sf1:var(--sunk);--tx2:var(--ink2);--tx3:var(--ink3);
--sc:1;--lh:1.72;--ls:0em;--dur:.3s;
--ha:#fdeb96;--hr:#fbcbd6;--hv:#cfe8c6;--hink:#231f16;
}
@media (prefers-color-scheme:dark){:root{
--paper:#1c1b1e;--desk:#131215;--sunk:#252428;--line:#34333a;--line2:#454450;--line3:#5e5c6b;
--ink:#efece5;--ink2:#b6b1a6;--ink3:#8a8578;
--sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
--ex-bg:#3a2d16;--ex-tx:#f2d59c;--ex-ln:#a97f22;
--up-bg:#3d211c;--up-tx:#f5c1b2;--up-ln:#b1523c;
--cr-bg:#2b2447;--cr-tx:#d3c8f5;--cr-ln:#7a68b8;
--g0:#cbb98f;--g0b:#33301f;--g1:#9cc6ec;--g1b:#1b2c3d;--g2:#c2afee;--g2b:#2a2340;--g3:#9bcfa7;--g3b:#1e3226;
--mk:#5d4708;--mkt:#ffe9a8;
--ha:#d9bd48;--hr:#dd9fae;--hv:#9dc98f;--hink:#1a1813;
}}
html[data-calmo="1"]{--g0:#6a6558;--g0b:#efece4;--g1:#4e5a66;--g1b:#eaedf0;--g2:#5f5a68;--g2b:#eeecf0;--g3:#4d5f52;--g3b:#eaefeb;
--mk:transparent;--mkt:inherit;--ex-bg:#f4f1ea;--ex-tx:#4a463c;--ex-ln:#b9b2a2;--up-bg:#f2eeed;--up-tx:#4a4340;--up-ln:#b3a29e;--cr-bg:#efeef1;--cr-tx:#454150;--cr-ln:#a8a3b3;--sh:none}
@media (prefers-color-scheme:dark){html[data-calmo="1"]{--g0:#b6b0a1;--g0b:#2b2a27;--g1:#a9b8c6;--g1b:#242a30;--g2:#b6afc2;--g2b:#2a2830;--g3:#a5b8aa;--g3b:#252c27;
--ex-bg:#292723;--ex-tx:#d8d3c7;--ex-ln:#6d675a;--up-bg:#2b2626;--up-tx:#dccdc9;--up-ln:#6f5f5b;--cr-bg:#28272d;--cr-tx:#cfcad9;--cr-ln:#665f74}}
html[data-calmo="1"] mark{background:transparent;color:inherit;padding:0;border-bottom:2px solid var(--line3);font-weight:600;border-radius:0}
html[data-calmo="1"] .wm{display:none}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:var(--lh);letter-spacing:var(--ls)}
@media (prefers-reduced-motion:reduce){:root{--dur:0s}}
.bk{max-width:820px;margin:0 auto;padding:12px 16px 0}
button{font:inherit;cursor:pointer;touch-action:manipulation;border:none;background:none;color:inherit}
.btn{font-size:14px;padding:11px 17px;border-radius:12px;border:1.5px solid var(--line2);background:var(--paper);color:var(--ink);min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:disabled{opacity:.3}
.btn.on{background:var(--acb);border-color:var(--ac);color:var(--ac);font-weight:600}
.btn.solid{background:var(--ac);border-color:var(--ac);color:var(--paper);font-weight:600}

/* barra de leitura */
.tools{display:flex;flex-wrap:wrap;gap:7px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:9px;margin-bottom:12px}
.tb{font-size:13.5px;padding:9px 13px;border-radius:10px;border:1.5px solid transparent;background:var(--sunk);color:var(--ink2);min-height:42px;display:inline-flex;align-items:center;gap:6px}
.tb.on{background:var(--acb);border-color:var(--ac);color:var(--ac);font-weight:600}
.tsep{width:1px;align-self:stretch;background:var(--line);margin:2px 3px}

.hd{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.badge{font-size:13px;letter-spacing:.02em;padding:8px 15px;border-radius:999px;background:var(--acb);color:var(--ac);font-weight:600}

.toc{display:none;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px;box-shadow:var(--sh)}
.toc.on{display:block}
.tocg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:4px}
.ti{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font-size:14.5px;padding:12px 13px;border-radius:12px;color:var(--ink2);min-height:48px}
.ti[aria-current=true]{background:var(--sunk);color:var(--ink);font-weight:600}
.ti.grp{background:var(--sunk);font-weight:700;color:var(--ink);margin-top:6px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.tn{font-variant-numeric:tabular-nums;color:var(--ink3);font-size:12.5px;min-width:19px}
.tk{margin-left:auto;color:var(--g3);font-weight:700;font-size:15px}

.stage{perspective:2200px;position:relative;touch-action:pan-y}
.pg{position:relative;background:var(--paper);border:1.5px solid var(--line);border-left:6px solid var(--ac);border-radius:3px 18px 18px 3px;padding:26px 30px 20px;min-height:360px;transform-origin:left center;transition:transform var(--dur) cubic-bezier(.4,0,.2,1);backface-visibility:hidden;box-shadow:var(--sh);font-size:calc(16px * var(--sc))}

.rh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);padding-bottom:10px;border-bottom:1.5px solid var(--line);margin-bottom:16px}
.rh b{color:var(--ac);font-weight:700}
.wm{position:absolute;top:40px;right:26px;font-family:var(--serif);font-size:70px;line-height:1;color:var(--ac);opacity:.1;pointer-events:none;font-weight:600}

h1{font-family:var(--serif);font-size:2.3em;font-weight:600;letter-spacing:-.015em;line-height:1.14;margin:0 0 10px}
h2{font-family:var(--serif);font-size:1.62em;font-weight:600;letter-spacing:-.01em;line-height:1.26;margin:0 0 16px;max-width:26ch}
.lat{display:inline-block;font-family:var(--serif);font-style:italic;font-size:.88em;padding:6px 14px;border-radius:999px;background:var(--acb);color:var(--ac);margin-bottom:14px}

/* seções numeradas */
.blk{margin:0 0 6px;border-top:1.5px solid var(--line);padding-top:4px}
.blk:first-of-type{border-top:none}
.sh{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:14px 2px;min-height:52px}
.sn{flex:none;width:27px;height:27px;border-radius:9px;background:var(--acb);color:var(--ac);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.st{font-size:14.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink2);font-weight:700;flex:1}
.sx{color:var(--ink3);font-size:19px;line-height:1;transition:transform var(--dur)}
.blk.closed .sx{transform:rotate(-90deg)}
.blk.closed .sc{display:none}
.sc{padding:2px 0 16px}

.law{margin-bottom:12px;padding:2px 0 2px 17px;border-left:3px solid var(--line2)}
.law>b{display:block;font-family:var(--sans);font-size:.72em;letter-spacing:.07em;text-transform:uppercase;color:var(--ac);font-weight:700;margin-bottom:6px}
.law i b,.law i mark{display:inline;font-family:inherit;font-size:inherit;letter-spacing:normal;text-transform:none;font-weight:600;margin:0}
.law i b{color:inherit}
.law i{font-family:var(--serif);font-style:normal;font-size:1em;line-height:1.6;color:var(--ink2);display:block;max-width:64ch}

.bl{font-size:1em;line-height:var(--lh);margin:0 0 13px;padding-left:21px;position:relative;max-width:64ch}
.bl:before{content:"";position:absolute;left:0;top:.72em;width:11px;height:3px;background:var(--ac);border-radius:2px}

mark{background:var(--mk);color:var(--mkt);padding:1px 5px;border-radius:5px;font-weight:600;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.linha{background:var(--acb);border-radius:18px;padding:19px 22px}
.linha p{font-family:var(--serif);font-size:1.2em;line-height:1.44;margin:0;color:var(--ac);font-weight:600;max-width:36ch}

.esq{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:15px 0;border-bottom:2px dotted var(--line2)}
.esq:last-child{border-bottom:none;padding-bottom:2px}
.el{font-size:.76em;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--ac);padding-top:4px;line-height:1.4}
.ev{font-size:.96em;line-height:var(--lh);max-width:58ch}

.box{border-radius:16px;padding:17px 20px;font-size:.96em;line-height:1.66;max-width:66ch}
.ex{background:var(--ex-bg);color:var(--ex-tx);border-left:5px solid var(--ex-ln)}
.up{background:var(--up-bg);color:var(--up-tx);border-left:5px solid var(--up-ln)}
.cr{background:var(--cr-bg);color:var(--cr-tx);border-left:5px solid var(--cr-ln)}
.box .kk,.bkq .kk{display:inline-block;font-size:.7em;letter-spacing:.09em;font-weight:700;opacity:.68;margin-right:7px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.gc{border-radius:14px;padding:14px 16px}
.gc b{display:block;font-size:.92em;font-weight:700;line-height:1.35}
.gc span{display:block;font-size:.85em;opacity:.85;margin-top:4px;line-height:1.4}

.bkq{border:1.5px solid var(--line);border-left:5px solid var(--ac);border-radius:0 16px 16px 0;padding:17px 20px;margin-bottom:12px;background:var(--paper)}
.bkq h4{font-family:var(--serif);font-size:1.05em;font-weight:600;margin:0 0 10px;color:var(--ac);line-height:1.3}
.bkq p{font-size:.94em;line-height:1.65;margin:0 0 8px;color:var(--ink2);max-width:60ch}
.bkq p:last-child{margin:0}

.hlbar{display:none;gap:6px;align-items:center;width:100%;padding-top:8px;margin-top:2px;border-top:1.5px solid var(--line)}
.hlbar.on{display:flex;flex-wrap:wrap}
.hc{width:40px;height:40px;border-radius:12px;border:2.5px solid transparent;padding:0}
.hc[data-c=a]{background:var(--ha)}.hc[data-c=r]{background:var(--hr)}.hc[data-c=v]{background:var(--hv)}
.hc[aria-pressed=true]{border-color:var(--ink);transform:scale(1.06)}
.hl{border-radius:5px;box-shadow:0 0 0 3px var(--hcor);background:var(--hcor);color:var(--hink)}
.hl b,.hl i,.hl mark{color:inherit;background:transparent}
.hl.a{--hcor:var(--ha)}.hl.r{--hcor:var(--hr)}.hl.v{--hcor:var(--hv)}
body[data-hl="1"] .pg{outline:3px dashed var(--ac);outline-offset:5px}
body[data-hl="1"] [data-h]{cursor:cell}
body[data-hl="1"] [data-h]:hover{box-shadow:0 0 0 3px var(--line2);border-radius:5px}
.dvn{font-family:var(--serif);font-size:4em;line-height:.95;color:var(--ac);font-weight:600;letter-spacing:-.03em}
.dvt{font-size:.78em;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin:9px 0 3px}
.jump{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:16px;padding:16px 19px;margin-bottom:10px;background:var(--paper);min-height:56px}
.jump b{display:block;font-family:var(--serif);font-size:1.06em;font-weight:600;color:var(--ac);margin-bottom:5px;line-height:1.3}
.jump span{display:block;font-size:.9em;line-height:1.55;color:var(--ink2)}
.jump em{float:right;font-style:normal;font-size:.72em;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.subh{font-size:.76em;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin:20px 0 10px}

.q{border:1.5px solid var(--line);border-radius:18px;padding:19px 21px;margin-bottom:14px;background:var(--paper)}
.qn{font-size:.76em;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:9px}
.qe{font-size:1.02em;line-height:1.6;margin:0 0 15px;font-weight:600;max-width:58ch}
.alt{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;font-size:.96em;line-height:1.55;padding:13px 16px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:14px;color:var(--ink);min-height:52px}
.lt{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sunk);color:var(--ink2);font-size:.85em;font-weight:700;display:flex;align-items:center;justify-content:center}
.alt.ok{background:var(--g3b);border-color:var(--g3);color:var(--g3);font-weight:600}
.alt.ok .lt{background:var(--g3);color:var(--paper)}
.alt.no{background:var(--up-bg);border-color:var(--up-ln);color:var(--up-tx)}
.alt.no .lt{background:var(--up-ln);color:var(--paper)}
.cm{font-size:.9em;line-height:1.6;margin:-3px 0 12px 39px;color:var(--ink2);display:none;padding-left:14px;border-left:3px solid var(--line)}
.cm.on{display:block}
.nota{font-size:.94em;line-height:1.62;padding:15px 19px;border-radius:16px;background:var(--sunk);color:var(--ink2);margin-bottom:16px;max-width:64ch}

.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.card3{perspective:1100px;height:200px;cursor:pointer}
.c3i{position:relative;width:100%;height:100%;transition:transform calc(var(--dur) * 1.6) cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.card3.flip .c3i{transform:rotateY(180deg)}
.c3f,.c3b{position:absolute;top:0;left:0;right:0;bottom:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.c3f{background:var(--paper);border:1.5px solid var(--line2);font-size:1em;line-height:1.5;font-weight:600}
.c3b{background:var(--ac);color:var(--paper);transform:rotateY(180deg);font-size:.9em;line-height:1.55}
.c3t{font-size:.68em;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-bottom:9px;font-weight:700}

/* modo foco */
.foco{margin-top:6px}
.fmeta{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink2);margin-bottom:14px;flex-wrap:wrap}
.fdots{display:flex;gap:6px}
.fd{width:11px;height:11px;border-radius:50%;background:var(--line2);border:none;padding:0}
.fd.on{background:var(--ac);transform:scale(1.25)}
.fnav{display:flex;gap:10px;margin-top:18px}
.fnav .btn{flex:1}

.done{display:flex;align-items:center;gap:11px;width:100%;margin-top:20px;padding:14px 17px;border-radius:14px;border:2px dashed var(--line2);color:var(--ink2);font-size:14.5px;min-height:54px}
.done.on{border-style:solid;border-color:var(--g3);background:var(--g3b);color:var(--g3);font-weight:600}
.dbox{width:24px;height:24px;border-radius:7px;border:2px solid var(--line3);flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.done.on .dbox{background:var(--g3);border-color:var(--g3);color:var(--paper)}

.pf{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:13px;border-top:1.5px solid var(--line);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.pnum{font-family:var(--serif);font-size:1.1em;letter-spacing:0;color:var(--ac);font-weight:700}

.nav{position:sticky;bottom:0;display:flex;align-items:center;gap:11px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));margin-top:14px;background:linear-gradient(to top,var(--desk) 72%,transparent)}
.bar{flex:1;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.fl{height:100%;background:var(--ac);width:0;transition:width var(--dur) ease}
.cnt{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}

.cov-rule{height:4px;width:70px;background:var(--ac);border-radius:2px;margin:0 0 22px}
.cov-n{font-family:var(--serif);font-size:.85em;letter-spacing:.26em;text-transform:uppercase;color:var(--ink3);margin-bottom:16px}
.legs{display:flex;flex-wrap:wrap;gap:9px;margin:24px 0}
.leg{font-size:.82em;padding:8px 15px;border-radius:999px;font-weight:600}

@media (max-width:600px){
.bk{padding:10px 12px 0}
.pg{padding:20px 18px 16px;border-radius:3px 14px 14px 3px;border-left-width:5px}
.wm{font-size:52px;top:34px;right:14px}
.esq{grid-template-columns:1fr;gap:6px;padding:14px 0}
.el{padding-top:0}
.card3{height:215px}
.tools{gap:6px;padding:8px}
}
@media print{.tools,.hd,.toc,.nav,.done,.fnav,.fmeta{display:none!important}
body{background:#fff}.pg{transform:none!important;min-height:0;box-shadow:none;border:none;border-left:4px solid #999;page-break-after:always;padding:0 0 20px}
.blk.closed .sc{display:block!important}.bk{max-width:none;padding:0}}
</style>
</head>

  </div>
</div>

var M={"marca": "Lei 6.938/81 · PNMA", "fonte": "Texto vigente do Planalto + acervo CátedraJURIS · 21/08/2026", "eyebrow": "Direito Ambiental"};
var S=[
 {

  "c": [

var GC={0:["--g0","--g0b","contexto"],1:["--g1","--g1b","grupo 1 · clareza normativa"],2:["--g2","--g2b","grupo 2 · responsabilização hermenêutica"],3:["--g3","--g3b","grupo 3 · invalidade do ato"]};
var TONE={n:"var(--ink3)",a:"var(--g1)",s:"var(--g3)",w:"var(--ex-ln)",d:"var(--up-ln)",p:"var(--g2)"};
var i=0,busy=false,done={},hits=0,fi=0,secs=[];
var pg=E('pg'),toc=E('toc'),tocg=E('tocg'),grp=E('grp'),fl=E('fl'),cnt=E('cnt'),root=document.documentElement;
function E(x){return document.getElementById(x)}
function LS(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

var cfg={hl:false,hcor:LS('c-hcor')||'a',foco:LS('c-foco')==='1',sc:parseFloat(LS('c-sc')||'1'),esp:LS('c-esp')==='1',calmo:LS('c-calmo')==='1',
 anim:LS('c-anim')===null?!matchMedia('(prefers-reduced-motion:reduce)').matches:LS('c-anim')==='1'};
var lidas={};try{lidas=JSON.parse(LS('c-lidas')||'{}')}catch(e){}
var marcas={};try{marcas=JSON.parse(LS('c-marcas')||'{}')}catch(e){}
var SELH='.bl,.ev,.law i,.qe,.bkq p,.jump span,.alt>span:last-child';

function aplicar(){
  root.style.setProperty('--sc',cfg.sc);
  root.style.setProperty('--lh',cfg.esp?'2.02':'1.72');
  root.style.setProperty('--ls',cfg.esp?'.012em':'0em');
  root.style.setProperty('--dur',cfg.anim?'.3s':'0s');
  root.setAttribute('data-calmo',cfg.calmo?'1':'0');
  E('t-foco').className='tb'+(cfg.foco?' on':'');
  E('t-esp').className='tb'+(cfg.esp?' on':'');
  E('t-calmo').className='tb'+(cfg.calmo?' on':'');
  E('t-anim').className='tb'+(cfg.anim?' on':'');
  E('t-hl').className='tb'+(cfg.hl?' on':'');
  E('hlbar').className='hlbar'+(cfg.hl?' on':'');
  document.body.setAttribute('data-hl',cfg.hl?'1':'0');
  var cs=document.querySelectorAll('.hc');for(var q=0;q<cs.length;q++)cs[q].setAttribute('aria-pressed',cs[q].dataset.c===cfg.hcor?'true':'false');
  LS('c-hcor',cfg.hcor);
  E('t-menor').disabled=cfg.sc<=1;E('t-maior').disabled=cfg.sc>=1.34;
  LS('c-foco',cfg.foco?1:0);LS('c-sc',cfg.sc);LS('c-esp',cfg.esp?1:0);LS('c-calmo',cfg.calmo?1:0);LS('c-anim',cfg.anim?1:0);
}
E('t-foco').onclick=function(){cfg.foco=!cfg.foco;fi=0;aplicar();paint()};
E('t-menor').onclick=function(){cfg.sc=Math.max(1,+(cfg.sc-.17).toFixed(2));aplicar()};
E('t-maior').onclick=function(){cfg.sc=Math.min(1.34,+(cfg.sc+.17).toFixed(2));aplicar()};
E('t-esp').onclick=function(){cfg.esp=!cfg.esp;aplicar()};
E('t-calmo').onclick=function(){cfg.calmo=!cfg.calmo;aplicar()};
E('t-anim').onclick=function(){cfg.anim=!cfg.anim;aplicar()};
E('t-hl').onclick=function(){cfg.hl=!cfg.hl;aplicar()};
E('hlbar').addEventListener('click',function(e){
  var c=e.target.closest('.hc');
  if(c){cfg.hcor=c.dataset.c;aplicar();return}
  if(e.target.id==='t-hlclear'){delete marcas[i];LS('c-marcas',JSON.stringify(marcas));paint()}
});
function indexar(){
  var conts=pg.querySelectorAll('[data-s]'),sal=marcas[i]||{};
  for(var a=0;a<conts.length;a++){
    var alvos=conts[a].querySelectorAll(SELH);
    for(var j=0;j<alvos.length;j++){
      var id=conts[a].dataset.s+':'+j;
      alvos[j].dataset.h=id;
      if(sal[id])alvos[j].className+=' hl '+sal[id];
    }
  }
}
pg.addEventListener('click',function(e){
  if(!cfg.hl)return;
  e.preventDefault();e.stopPropagation();
  var el=e.target.closest('[data-h]');if(!el)return;
  var id=el.dataset.h;
  if(!marcas[i])marcas[i]={};
  if(el.classList.contains('hl')&&marcas[i][id]===cfg.hcor){el.classList.remove('hl','a','r','v');delete marcas[i][id]}
  else{el.classList.remove('a','r','v');el.classList.add('hl',cfg.hcor);marcas[i][id]=cfg.hcor}
  if(!Object.keys(marcas[i]).length)delete marcas[i];
  LS('c-marcas',JSON.stringify(marcas));
},true);

function wm(t){var m=t.match(/Art\. (\d+)/);return m?m[1]:''}
function cardsHtml(c){
  return c.map(function(x,k){
    return '<div class="card3" onclick="this.classList.toggle(\'flip\')"><div class="c3i">'+
      '<div class="c3f"><div class="c3t">cartão '+(k+1)+' — pergunta</div><div>'+x[0]+'</div></div>'+
      '<div class="c3b"><div class="c3t">resposta</div><div>'+x[1]+'</div></div></div></div>';
  }).join('');
}
function pick(qi,ai){
  var d=S[i];if(done[qi])return;done[qi]=1;
  var q=d.q[qi];
  for(var k=0;k<q.alts.length;k++){
    E('c'+qi+'_'+k).classList.add('on');
    var b=E('a'+qi+'_'+k);
    if(k===q.ok)b.classList.add('ok');else if(k===ai)b.classList.add('no');
  }
  if(ai===q.ok)hits++;
  var tot=0;for(var z in done)tot++;
  var s=E('sc-q');if(s)s.innerHTML='Acertos: <b>'+hits+'</b> de '+tot+' respondidas · '+d.q.length+' no total.';
}
function shuffle(){var c=S[i].c.slice();for(var k=c.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=c[k];c[k]=c[j];c[j]=t}S[i].c=c;E('cg').innerHTML=cardsHtml(c)}
function resetCards(){var n=document.querySelectorAll('.card3');for(var k=0;k<n.length;k++)n[k].classList.remove('flip')}
function goTo(name){for(var k=0;k<S.length;k++)if(S[k].toc===name){flip(k);return}}
function qHtml(q,qi,tot){
  return '<div class="q"><div class="qn">questão '+(qi+1)+' de '+tot+'</div><p class="qe">'+q.e+'</p>'+
    q.alts.map(function(a,ai){
      return '<button class="alt" id="a'+qi+'_'+ai+'" onclick="pick('+qi+','+ai+')"><span class="lt">'+String.fromCharCode(97+ai)+'</span><span>'+a[0]+'</span></button>'+
        '<div class="cm" id="c'+qi+'_'+ai+'">'+a[1]+'</div>';
    }).join('')+'</div>';
}

/* monta as seções da página */
function montar(d){
  var s=[];
  if(d.linha)s.push(['Em uma linha','<div class="linha"><p>'+d.linha+'</p></div>']);
  if(d.law)s.push([d.lawlab||'A lei, literal',d.law.map(function(l){return '<div class="law"><b>'+l[0]+'</b><i>'+l[1]+'</i></div>'}).join('')]);
  if(d.por)s.push(['Por que estão juntos',d.por.map(function(x){return '<p class="bl">'+x+'</p>'}).join('')]);
  if(d.itens){var sub='';s.push(['O que vem nesta seção',d.itens.map(function(x){var h='';if(x[0]&&x[0]!==sub){sub=x[0];h='<div class="subh">'+sub+'</div>'}
    return h+'<button class="jump" onclick="goTo(\''+x[1]+'\')"><b>'+x[1]+' — '+x[2]+' <em>ver ›</em></b><span>'+x[3]+'</span></button>'}).join('')]);}
  if(d.grid)s.push([d.gridlab||'Quadro','<div class="grid">'+d.grid.map(function(g){return '<div class="gc" style="background:'+g[2]+';color:'+g[3]+'"><b>'+g[0]+'</b><span>'+g[1]+'</span></div>'}).join('')+'</div>']);
  if(d.blocks)s.push([d.blab||'Blocos',d.blocks.map(function(x){return '<div class="bkq" style="border-left-color:'+TONE[x[1]]+'"><h4 style="color:'+TONE[x[1]]+'">'+x[0]+'</h4>'+x[2]+'</div>'}).join('')]);
  if(d.esq)s.push([d.esqlab||'Esquema','<div>'+d.esq.map(function(x){return '<div class="esq"><div class="el">'+x[0]+'</div><div class="ev">'+x[1]+'</div></div>'}).join('')+'</div>']);
  if(d.b&&!d.cover)s.push([d.blabel||'O que a banca cobra',d.b.map(function(x){return '<p class="bl">'+x+'</p>'}).join('')]);
  if(d.ex)s.push(['Exemplo','<div class="box ex">'+d.ex+'</div>']);
  if(d.up)s.push(['Atualização e alerta','<div class="box up">'+d.up+'</div>']);
  if(d.cr)s.push(['Crítica da doutrina','<div class="box cr">'+d.cr+'</div>']);
  if(d.q){s.push(['Como responder','<div class="nota" id="sc-q">'+d.nota+'</div>']);
    d.q.forEach(function(q,qi){s.push(['Questão '+(qi+1),qHtml(q,qi,d.q.length)])});}
  if(d.c)s.push(['Cartões','<div class="nota">'+d.nota+'</div><div style="display:flex;gap:10px;margin-bottom:16px"><button class="btn" onclick="shuffle()">Embaralhar</button><button class="btn" onclick="resetCards()">Desvirar</button></div><div class="cgrid" id="cg">'+cardsHtml(d.c)+'</div>']);
  return s;
}
function secHtml(k,fechado){
  return '<section class="blk'+(fechado?' closed':'')+'" id="b'+k+'" data-s="'+k+'">'+
    '<button class="sh" onclick="document.getElementById(\'b'+k+'\').classList.toggle(\'closed\')">'+
    '<span class="sn">'+(k+1)+'</span><span class="st">'+secs[k][0]+'</span><span class="sx">⌄</span></button>'+
    '<div class="sc">'+secs[k][1]+'</div></section>';
}
var META=(typeof M==='object'&&M)||{};
var MARCA=META.marca||'',FONTE=META.fonte||'';
function foot(){return '<div class="pf"><span>'+FONTE+'</span><span class="pnum">'+(i+1)+' / '+S.length+'</span></div>'}
function topo(d){
  if(d.cover)return '<div class="rh"><b>'+(META.capaEsq||'resumo de estudo')+'</b><span>'+(META.capaDir||MARCA)+'</span></div>';
  if(d.custom==='div')return '<div class="rh"><b>abertura de grupo</b><span>'+MARCA+'</span></div>'+
    '<div class="dvn">'+d.num+'</div><div class="dvt">'+d.arts+'</div><h2>'+d.tit+'</h2>';
  var n=wm(d.tit);
  return '<div class="rh"><b>'+(d.tag||GC[d.g][2])+'</b><span>'+MARCA+'</span></div>'+
    (n?'<div class="wm">'+n+'</div>':'')+'<h2>'+d.tit+'</h2>'+(d.latin?'<div class="lat">'+d.latin+'</div>':'');
}

function paint(){
  var d=S[i];
  root.style.setProperty('--ac','var('+GC[d.g][0]+')');
  root.style.setProperty('--acb','var('+GC[d.g][1]+')');

  if(d.cover){
    pg.innerHTML=topo(d)+'<div style="padding:22px 0 4px"><div class="cov-n">'+(META.eyebrow||MARCA)+'</div><h1>'+d.tit+'</h1><div class="cov-rule"></div>'+
      '<p style="font-family:var(--serif);font-size:1.15em;line-height:1.5;color:var(--ink2);margin:0 0 6px;max-width:34ch">'+d.sub+'</p>'+
      '<p style="font-size:.86em;color:var(--ink3);margin:0">'+d.fonte+'</p>'+
      '<div class="legs">'+[1,2,3].map(function(k){return '<span class="leg" style="background:var('+GC[k][1]+');color:var('+GC[k][0]+')">'+GC[k][2]+'</span>'}).join('')+'</div>'+
      d.b.map(function(x){return '<p class="bl">'+x+'</p>'}).join('')+'</div>'+foot();
  }else{
    secs=montar(d);
    if(fi>=secs.length)fi=0;
    var body;
    if(cfg.foco){
      body='<div class="foco"><div class="fmeta"><span><b>Bloco '+(fi+1)+' de '+secs.length+'</b> · '+secs[fi][0]+'</span>'+
        '<span class="fdots">'+secs.map(function(_,k){return '<button class="fd'+(k===fi?' on':'')+'" onclick="setFoco('+k+')" aria-label="bloco '+(k+1)+'"></button>'}).join('')+'</span></div>'+
        '<div class="sc" data-s="'+fi+'">'+secs[fi][1]+'</div>'+
        '<div class="fnav">'+
        (fi>0?'<button class="btn" onclick="setFoco('+(fi-1)+')">‹ Bloco anterior</button>':'')+
        (fi<secs.length-1?'<button class="btn solid" onclick="setFoco('+(fi+1)+')">Próximo bloco ›</button>':'<button class="btn solid" onclick="flip(i+1)">Terminei esta página ›</button>')+
        '</div></div>';
    }else{
      body=secs.map(function(_,k){return secHtml(k,false)}).join('');
    }
    pg.innerHTML=topo(d)+body+
      '<button class="done'+(lidas[i]?' on':'')+'" onclick="marcar()"><span class="dbox">'+(lidas[i]?'✓':'')+'</span><span>'+(lidas[i]?'Página revisada':'Marcar como revisada')+'</span></button>'+foot();
    if(d.q){done={};hits=0}
  }
  var ch=tocg.children;for(var k=0;k<ch.length;k++){ch[k].setAttribute('aria-current',k===i?'true':'false');
    var mk=ch[k].querySelector('.tk');if(mk)mk.textContent=lidas[k]?'✓':''}
  grp.textContent=d.toc;
  fl.style.width=Math.round((i+1)/S.length*100)+'%';
  cnt.textContent=(i+1)+' / '+S.length;
  E('prev').disabled=i===0;E('next').disabled=i===S.length-1;
  LS('lindb-pg',i);
  indexar();
}
function setFoco(k){fi=k;paint();pg.scrollIntoView({block:'start',behavior:cfg.anim?'smooth':'auto'})}
function marcar(){lidas[i]=!lidas[i];LS('c-lidas',JSON.stringify(lidas));paint()}

tocg.innerHTML=S.map(function(s,k){
  return '<button class="ti'+(s.custom==='div'?' grp':'')+'" data-k="'+k+'"><span class="tn">'+(k+1)+'</span><span class="dot" style="background:var('+GC[s.g][0]+')"></span><span>'+(s.custom==='div'?s.tit.replace(/^Grupo (\d) — /,'Grupo $1 · '):s.toc)+'</span><span class="tk"></span></button>';
}).join('');

function flip(k){
  if(busy||k<0||k>=S.length)return;
  fi=0;
  if(!cfg.anim){i=k;paint();window.scrollTo(0,0);try{LS('lindb-pg',i)}catch(e){}return}
  busy=true;var fw=k>i;
  pg.style.transform='rotateY('+(fw?-94:94)+'deg)';
  setTimeout(function(){
    i=k;paint();window.scrollTo(0,0);try{LS('lindb-pg',i)}catch(e){}
    pg.style.transition='none';pg.style.transform='rotateY('+(fw?90:-90)+'deg)';
    requestAnimationFrame(function(){pg.style.transition='transform var(--dur) cubic-bezier(.4,0,.2,1)';pg.style.transform='rotateY(0deg)';
      setTimeout(function(){busy=false},310)});
  },300);
}
tocg.addEventListener('click',function(e){var b=e.target.closest('.ti');if(b){flip(+b.dataset.k);toc.classList.remove('on')}});
E('tocb').onclick=function(){toc.classList.toggle('on')};
E('prev').onclick=function(){flip(i-1)};
E('next').onclick=function(){flip(i+1)};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')flip(i+1);if(e.key==='ArrowLeft')flip(i-1)});
var x0=null,y0=null,st=E('stage');
st.addEventListener('touchstart',function(e){x0=e.changedTouches[0].clientX;y0=e.changedTouches[0].clientY},{passive:true});
st.addEventListener('touchend',function(e){
  if(x0===null)return;var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.7)flip(dx<0?i+1:i-1);
  x0=null;y0=null;
},{passive:true});
var sv=parseInt(LS('lindb-pg'),10);if(!isNaN(sv)&&sv>=0&&sv<S.length)i=sv;
aplicar();paint();
</script>
